name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: check (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11"]
    env:
      PYTHONIOENCODING: "utf-8"
      PYTHONWARNDEFAULTENCODING: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        shell: bash
        run: pip install -e '.[dev]'
      - name: Quality gate
        shell: bash
        run: PY_BIN_DIR="$(dirname "$(which python)")" bash scripts/check.sh
      # The G-3 report (per-step latency, peak RSS, size). Not blocking yet: two budgets are
      # known to be missed (generation + gate, RSS; see tests/session/test_step_performance.py).
      - name: G-3 benchmark (report)
        continue-on-error: true
        shell: bash
        run: python scripts/bench_loop.py --turns 525

  dist:
    # What a tester gets: build the wheel, install it into a clean environment (a plain
    # venv and pipx), then run the installed command with its data in a temp directory.
    name: dist (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11"]
    env:
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheel
        shell: bash
        run: |
          python -m pip install build pipx
          python -m build --wheel --outdir dist
      - name: Install into a fresh venv and smoke-test
        shell: bash
        run: python scripts/smoke_install.py dist --installer venv
      - name: Install with pipx and smoke-test
        shell: bash
        run: python scripts/smoke_install.py dist --installer pipx
