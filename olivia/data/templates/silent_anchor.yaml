# 草稿：待 G-0 两名注册心理师审核（docs/superpowers/plans/2026-10-23-next-phase.md D-1）
#
# SILENT_ANCHOR（静默树洞型）各状态回复模板，R1 离线规则模式使用（PRD 特性六、ONB-03、
# WILLOW-03；SDD §5.3 第 3 条、§6.1：极简回声、零判断、纯倾听、无任何建议要求）。
# 话很少，只是在场；除非为了安全（危机、危机后问候、D3 直接询问），不提问。
#
# 与 gentle_holding.yaml 的不同（槽位与其余组装规则相同）：
#   - S_explore、S_clarify 只有一个 reflect 段（一段话），不要求任何槽位：20 字的镜像加
#     16 字的意象放不进 [10, 30] 字。不用隐喻，不邀请、不追问。
#   - 字数窗口（WILLOW-03）：S_explore、S_clarify、S_closing 为 [10, 30] 字；S_haven 取
#     避风港 [15, 40] 与本人格 [10, 30] 的交集 [15, 30]；S_ready 单段 ≤ 30 字（按本文件写，
#     引擎以 paragraph_max 为上限）。
#   - S_empower 只在用户直接要方法时出现（状态机不会自动推进，COLBO-03）。after_card 必须写出
#     三个反馈命令（/done、/not-now、/unhelpful 共 23 个字符），连同卡名放不进 30 字，所以
#     bridge + card_intro + after_card（不含卡片正文）用单独的 window.empower = [10, 70]，
#     单段 ≤ 50 字。这一点待 G-0 与产品负责人确认。
#   - followups.clarify_feedback 不用问句：说明“回一句好，就先收进锦囊”（回答“好/可以”仍记为
#     NOT_NOW，见 session.py）。
#
# 危机相关文案（S_crisis、S_ready.returning_after_crisis、followups.safety_check）不受字数窗口
# 限制、不加人格修饰：与 GENTLE_HOLDING 同样询问是否安全、指向下面的求助电话（号码只来自
# ResourceCard，由引擎附在后面，各人格完全相同）；safety_check 与 gentle_holding.yaml 逐字一致
# （决定 D3，与人格无关，加载时校验）。

#
# F2b 新增（草稿：待 G-0）：
#   S_closing.variants        /done（HELPFUL）之后的收尾：不说“收进锦囊”，也不说“还不想试”。
#   S_closing.after_not_now   /not-now（NOT_NOW）之后的收尾：卡片确实收进了锦囊，可以提锦囊。
#   S_ready.after_close       收尾仪式之后的一句：用户回“好”或说声谢谢时，简短、温暖、不提问。
#                             F6b（草稿：待 G-0）：带时间指向的句子（今晚、傍晚、休息、睡、辛苦了等，
#                             见 language/data.py 的 EVENING_WORDS）只在当地 18:00 起到深夜时段结束
#                             （taxonomy late_night.end）之间使用；其他时段只用不带时间指向的句子，
#                             至少两句，其中至少一句没有槽位（加载时校验）。
#   followups.no_pending_feedback  没有卡片在等反馈时收到 /done、/not-now、/unhelpful：只说一句。
#   followups.unhelpful_ack   卡片收到 /unhelpful（或明确反感）后，回复开头的一句确认。
#   followups.safety_confirmed  危机中用户明确说自己安全的那一轮，危机卡之前的一句回应。
#   followups.forget_hint     聊天里说“清空所有记忆”时：告诉用户用 olivia forget --all、olivia memory，
#                             不复述原话。
#   followups.haven_return    在静默陪伴中直接要方法、离开 S_haven 时，卡片之后告诉用户怎么回到安静陪伴。
#   followups.haven_exit_hint F9（FSM-15，草稿：待 G-0）：每次会话第一次在 S_haven 平稳地陪伴时，整条替换
#                             那句陪伴语：仍是陪伴，再用一句告诉用户怎么离开（说「我好多了」或「换个话题吧」，
#                             这两句在 perception.yaml 的 haven_exit 里）。按 S_haven 窗口写，不提问，
#                             必须用「」引出要说的话（加载时校验）。
#   followups.therapy_referred F9（草稿：待 G-0）：有转介红线的用户问某个疗法或练习是什么（“CBT是什么”）
#                             时的整条回复：红线的封闭上限不放行任何科普卡，所以不讲它、不推荐练习，
#                             只简短、中性地回应，指向医生或心理咨询师；转介卡由会话附在后面。不提问。
#   followups.grief_request   F10（草稿：待 G-0）：延长哀伤（SIT-06-04）让这一轮走 m0、而用户直接要方法时，
#                             放在陪伴回复之前的一句：承认对方想要方法，说明这样的哀伤（急性或延长，同一情境编号，所以措辞不提时长）更适合先有人陪着
#                             慢慢谈，所以先不给练习，提一句哀伤咨询或心理咨询师。不是危机：不给热线、
#                             不含数字，不提问，必须提到“咨询”（加载时校验）。
persona: SILENT_ANCHOR
window: {normal: [10, 30], paragraph_max: 50, haven: [15, 30], empower: [10, 70]}

stages:
  S_explore:
    parts:
      - name: reflect
        variants:
          - "{mirror}。我在。"
          - "我听见了，{mirror}。"
          - "那份{emotion}，我听见了。我在这里。"
          - "嗯。{mirror}。慢慢说。"
          - "{user_name}，我在听。{emotion}也可以待在这里。"
          - "这份{emotion}，不用藏。我陪着你。"
          - "{mirror}。我都听着。"
          - "说到哪里都好。我在这里，陪着你。"

  S_clarify:
    parts:
      - name: reflect
        variants:
          - "你想要{need}。我听见了。"
          - "这份{emotion}底下，是对{need}的渴望。"
          - "{mirror}。这对你很重要。"
          - "嗯，{need}。想要这个，一点也不过分。"
          - "我听见了，那份{emotion}。你一直很在乎。"
          - "{need}，是你此刻很需要的。我在。"
          - "我在这里听着。你的{emotion}，我都接住了。"

  S_empower:
    parts:
      - name: bridge
        variants:
          - "好，给你一个小方法。"
          - "你想要一个方法，在这里。"
          - "{user_name}，这个给你。"
          - "好。一个很小的练习。"
          - "在这里，用不用都由你。"
          - "听见了。放一个在这里。"
      - name: card_intro
        variants:
          - "「{card_title}」，在下面。"
          - "「{card_title}」，按你的节奏。"
          - "「{card_title}」，随时可以停。"
          - "「{card_title}」，做多少都算数。"
          - "下面是「{card_title}」。"
          - "「{card_title}」，慢慢来。"
    light_bridge:
      - "今天累了，先从轻一点的开始。"
      - "好。先从轻一点的开始。"
      - "{user_name}，先从轻一点的开始。"
      - "力气不多，就先从轻一点的开始。"
      - "不费力的，先从轻一点的开始。"
      - "听见了。我们先从轻一点的开始。"
    after_card:
      - "做完输入 /done，先收着 /not-now，不合适 /unhelpful。"
      - "完成就 /done，先放锦囊就 /not-now，不合适就 /unhelpful。"
      - "/done 做完了，/not-now 先收进锦囊，/unhelpful 不合适。"
      - "做完了 /done；今天不想做 /not-now；不合适 /unhelpful。"
      - "试过就输入 /done，想改天就 /not-now，不适合就 /unhelpful。"
      - "做完了 /done，收进锦囊 /not-now，没帮助 /unhelpful。"

  S_haven:
    variants:
      - "今天辛苦了。不用说话，我就在这里陪你。"
      - "{user_name}，累了就歇着，这里不用回应，我在。"
      - "什么都不用做。我在旁边，静静陪着你。"
      - "烦恼先放在门外。今晚只管休息，我在。"
      - "不用复盘，也不用回应。我陪你待一会儿。"
      - "这里很安静，想歇多久都可以。我守着。"
      - "{user_name}，今天就到这里吧。我一直都在这里。"
      - "累了就靠一靠，不用说什么，我都在这里。"
      - "辛苦了。此刻什么都不需要做，好好喘口气。"

  S_crisis:
    variants:
      - "{user_name}，我在这里，没有走开。你现在安全吗？下面的电话可以联系到专业的人。"
      - "我听见了，我很在意你。此刻你身边安全吗，有没有人能陪着你？下面是可以拨打的求助电话。"
      - "我在这里陪着你。你现在是安全的吗？如果危险就在眼前，请先拨打下面的电话，或者叫身边的人过来。"
      - "谢谢你说出来。你现在安全吗？也可以请身边信得过的人过来陪你，下面这些电话都可以拨打。"
      - "{user_name}，你不是一个人。你此刻是安全的吗？下面有可以联系到真人的电话，也可以叫身边的人陪着你。"
    # 草稿：待 G-0（F5b）。用户已明确说自己安全、等待退出危机的轮次：不再问“安全吗”，
    # 只陪着并指向下面的电话（号码照常由引擎附上）。
    after_confirmed:
      - "我在这里。下面的电话一直都在，需要时随时拨打。"
      - "{user_name}，我陪着你。需要的时候，下面的电话随时可以打。"
      - "慢慢来，我在。下面这些电话随时都可以拨打。"

  S_closing:
    variants:
      - "今天就到这里。试过了，就很好。我在。"
      - "{user_name}，谢谢你今天来。好好休息，我一直都在。"
      - "试过就好，不用做得完美。我在这里。"
      - "今天先停在这里。你说的，我都听见了。"
      - "好好歇一歇。什么时候回来，我都在这里。"
      - "我是{agent_name}。今天辛苦了，下次见。"
    after_not_now:
      - "今天就到这里。先收进锦囊，也很好。我在。"
      - "那个小方法收在锦囊里，不会催你。我在这里。"
      - "先收进锦囊了，想用的时候再说。我在。"

  S_ready:
    greeting:
      - "{user_name}，我在。想说什么都可以。"
      - "我是{agent_name}，在这里。慢慢说。"
      - "{user_name}，你来了。我听着。"
      - "又见面了。想说就说，不说也可以。"
      - "我在这里。很累的话，开头写上 [5%] 就好。"
      - "{user_name}，欢迎回来。我在听。"
    returning_after_crisis:
      - "{user_name}，欢迎回来。现在身边安全吗？"
      - "我一直记挂着你。这几天还好吗，现在安全吗？"
      - "又见面了。想先问一句：你现在是安全的吗？"
      - "{user_name}，我在。此刻你身边安全吗？"
      - "欢迎回来。上次之后，你还好吗，现在安全吗？"
      - "我是{agent_name}。想先问问你，现在安全吗？"
    returning_after_check:
      - "{user_name}，欢迎回来。我在这里。"
      - "又见面了。想说什么都可以，我听着。"
      - "欢迎回来，我一直记挂着你。慢慢说。"
    after_close:
      - "好，那就先这样。我在。"
      - "{user_name}，好好休息。我一直在。"
      - "嗯，今天先到这里。我在这里。"

followups:
  clarify_feedback:
    - "想先收进锦囊的话，回一句“好”就行。"
    - "{user_name}，不急。要收进锦囊，说“好”就行。"
    - "先收进锦囊也可以，说一声“好”就好。"
  kit_empty:
    - "这次聊天里，锦囊还是空的。"
    - "{user_name}，锦囊里暂时还没有东西。"
    - "锦囊现在是空的。想留的小方法，以后可以放进来。"
  closing_declined:
    - "好，不用定。我一直都在。"
    - "{user_name}，以后再说也可以。好好休息。"
    - "嗯，先不定。想说话的时候，我在。"
  safety_check:
    - "我想认真地问你一句：你是在想结束自己的生命吗？不管答案是什么，你都可以如实告诉我，我会一直在这里。"
    - "听你这样说，我有些担心你，所以想直接问一句：你是不是有了结束自己生命的念头？怎么回答都可以，我不会评判你。"
    - "{user_name}，因为很在乎你，我想问得直接一点：你现在是在考虑结束自己的生命吗？如实告诉我就好，我在听。"
    - "有件事我想直接问清楚：你说的这些，是和结束自己的生命有关吗？是或不是都可以告诉我，我会认真听。"
    - "我想轻轻地、直接地问你：你现在有结束自己生命的想法吗？无论答案是什么，你都可以放心地说出来。"
  # health_hint（A1）：附在回复末尾的一段说明，没有字数窗口（同其他 followups，≤ 80 字）；
  # 本人格写得尽量短（≤ 45 字），陈述句，不提问。
  health_hint:
    - "记下了，这次会避开不合适的练习。想保存可用 olivia health 加密，不存也没关系。"
    - "{user_name}，我会留意。如果愿意，可以用 olivia health 加密记下。"
    - "这次我会替你避开不合适的练习。olivia health 可以加密保存，不用也没关系。"
  no_pending_feedback:
    - "现在没有在等你反馈的练习。我在。"
    - "现在没有在等你反馈的练习，我听着。"
  unhelpful_ack:
    - "好，这个先放下。我记下了。"
    - "知道了，不合适就放下。我在。"
  safety_confirmed:
    - "谢谢你告诉我你现在安全。"
    - "{user_name}，知道你安全，我放心了一些。"
  forget_hint:
    - "清空记忆：运行 olivia forget --all；先看看记了什么：olivia memory。"
    - "想清空，退出后运行 olivia forget --all。查看用 olivia memory。"
  haven_return:
    - "想安静待着，开头写 [5%] 就好。"
    - "想回到安静里，开头写上 [5%]。"
  haven_exit_hint:
    - "我在这里陪着。想聊别的了，说「我好多了」就好。"
    - "想聊别的时，说「换个话题吧」，我都在。"
  therapy_referred:
    - "你问的这个，医生或心理咨询师能讲得更清楚。"
    - "{user_name}，这个问题，交给医生或心理咨询师来讲吧。"
  grief_request:
    - "听到你想要方法。这样的哀伤，先有人陪着慢慢说更好，也可以找哀伤咨询师。"
    - "{user_name}，听到你想要方法。这份哀伤，先慢慢说；也可以找哀伤咨询师。"

# 防依赖提示（B7）：都是陈述句，不提问；单独一段 ≤ 30 字，*_haven 按 [15, 30] 写。
# real_support 只在三段式回复里替换 invite 段（chang/wellbeing.py），本人格的回复只有一段，
# 所以它不会出现：SILENT_ANCHOR 不做现实支持引导，深夜提示（提到身边的人）照常计入。
wellbeing:
  break_reminder:
    - "聊了很久了。起来喝口水，歇一歇，我在。"
    - "{user_name}，坐了好一会儿了，起来走走吧。"
    - "离开屏幕歇一会儿也好，我一直都在。"
  break_reminder_haven:
    - "陪你待了好一会儿了，起来喝口水，去歇着吧。"
    - "{user_name}，已经很久了，放下屏幕歇一歇吧，我在。"
    - "聊了挺久了，让眼睛和身体都休息一下，我在。"
  late_night:
    - "夜深了，先去睡吧。明天也可以找信得过的人说说。"
    - "{user_name}，夜很深了。好好休息，醒来可以和朋友聊聊。"
    - "已经是深夜了。去歇着吧，身边信任的人也在。"
  late_night_haven:
    - "夜很深了，什么都不用想，安心去睡吧，我在。"
    - "{user_name}，已经是深夜了，先去好好休息吧，我在。"
    - "深夜了，今天就放下吧，好好睡一觉，我守着。"
  real_support:
    - "身边有信得过的人，也可以说给他们听。"
    - "{user_name}，朋友或家人那里，也可以放一些心事。"
    - "愿意的话，也可以找一位心理咨询师聊聊。"
