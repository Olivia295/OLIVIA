# 草稿：待 G-0 两名注册心理师审核（docs/superpowers/plans/2026-10-22-remaining-roadmap.md R1-4）
#
# `olivia stats` 的文案（步骤 F12；PRD §11.1 指标、RSK-07）。
#
# 只输出次数、比例与分数，全部由加密账本里的会话摘要算出，不含任何聊天内容、
# 不含用户的名字，也不含困扰谱系与练习名。
# lines：每项一行；槽位只填数字（{start} {end} 是深夜时段的钟点，来自 taxonomy 的 late_night）。
#   sessions      会话次数（账本里的会话摘要条数）：一共、最近 7 天、最近 30 天。
#   late_night    有一轮落在深夜时段的会话占比（分母是记录了这一项的会话）。
#   support       回复里带了现实支持引导（B7）的轮数占比。
#   rating        有开始与结束两次 0–10 自评的会话里，结束减开始的平均值。
#   *_none        还没有可统计的记录时的写法。
#   unknown       追加在行末：F12 之前写的旧记录没有这一项（不迁移，不计入分母）。
# replies：整句，不带槽位。
version: 1
lines:
  heading: "这台电脑上的使用数字（只有次数、比例和分数，不含任何聊天内容）："
  sessions: "- 聊天次数：一共 {total} 次；最近 7 天 {week} 次，最近 30 天 {month} 次"
  late_night: "- 在深夜（{start}–{end}）聊天的次数：{count} / {known}（{percent}%）"
  late_night_none: "- 在深夜（{start}–{end}）聊天的次数：还没有可统计的记录"
  support: "- 聊到身边可以联系的人的回复：{count} / {turns} 轮（{percent}%）"
  support_none: "- 聊到身边可以联系的人的回复：还没有可统计的记录"
  rating: "- 心情自评（0–10）结束时比开始时：平均 {change} 分（{count} 次有前后两次自评）"
  rating_none: "- 心情自评（0–10）结束时比开始时：还没有前后两次都填的自评"
  unknown: "（另有 {count} 次较早的记录没有这一项）"
replies:
  empty: "还没有聊天记录，所以还没有数字。想聊的时候，输入 olivia chat 就好。"
  unavailable: "这台电脑上暂时没办法把记忆加密保存，所以没有可以统计的记录。"
  not_onboarded: "还没有完成第一次设置。先运行 olivia chat 吧。"
  adults_only: "这里的陪伴只为成年人设计，所以没有可以统计的记录。"
