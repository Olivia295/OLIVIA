skip_words: ["跳过", "无", "没有", "不用", "没", "不想说"]

hints:
  unrecognized: "我没太看懂这个回答，可以选一个序号再告诉我一次吗？"
  name_length: "这个称呼有点长了，换一个 1 到 {max_len} 个字的好吗？"
  name_unprintable: "这个称呼里有我没法显示的字符，换一个好吗？"
  persona_choice: "我没太认出这个选择。可以选一个序号（1 到 4），或者直接按回车，用第一种。"
  taboo_limits: "每个话题请控制在 {max_len} 个字以内，最多 {max_count} 个，可以再调整一下吗？"
  timezone_invalid: "我没有认出这个时区。可以选一个序号，或者按「大洲/城市」的格式再输入一次吗？例如 Asia/Singapore。"
  # 选“其他地区”时屏幕上没有序号，所以不提序号（试用问题 P2）。
  timezone_free_invalid: "我没有认出这个时区。可以按「大洲/城市」的格式再输入一次，例如 Asia/Singapore；输入「跳过」或直接按回车，就用这台电脑的时区（{system_timezone}）。"
  consent_unrecognized: "如果愿意记录，请完整输入那句话；不想记录的话，输入「跳过」就好。"
  # 认不出的输入不念回原句：那里可能写着危机的话（2026-10-26 测试第 4 条）。草稿：待 G-0。
  clinical_unknown: "没有在列表里找到你写的那一项。可以从上面选序号吗？"

outcomes:
  completed: |-
    好了，{user_name}，我们的约定已经保存在这台电脑上了。之后无论什么时候想聊聊，{agent_name}都在。

    今天想从哪里说起都可以，哪怕只是一句「有点累」。

    （想让我偶尔在电脑上发个提醒的话，可以运行 olivia settings 打开系统提醒，默认是关着的。）
  health_not_saved: |-
    这台电脑上暂时没有可用的系统钥匙串，没办法把健康信息加密保存，所以这次就先不记录健康信息了。其他的一切都照常，可以放心和我聊。
  disclaimer_declined: |-
    没关系，谢谢你认真读完。没有你的同意，我不会保存任何内容。

    哪天你改变了想法，随时可以再打开我。如果你此刻有危险，请联系当地的紧急电话：
  # 草稿：待 G-0（QA r3，2026-10-27）：disclaimer_declined 与 under_18 说到“当地的紧急电话”时，
  # 程序在后面列出各地的紧急号码（olivia/core/resources/fallback.py，与 hotlines.yaml 一致），
  # 所以这两段以冒号结尾，这里不写号码。
  under_18: |-
    谢谢你愿意诚实地告诉我。这里的陪伴只为成年人设计，所以这一次我没办法陪你继续聊下去了，这并不是你做错了什么。

    你的感受很重要，值得被认真对待。可以找一位信任的大人聊一聊，比如家人、老师或学校的心理老师。

    如果你在中国大陆，可以拨打 12355 青少年服务台（这个号码只在中国大陆可用）。如果你在其他地方，可以在这两个目录里找到当地的青少年或情绪支持热线：
    Find A Helpline：https://findahelpline.com/
    Befrienders Worldwide：https://befrienders.org/find-support-now/

    如果你此刻有危险，或者有伤害自己的念头，请马上拨打当地的紧急电话，或者告诉身边的大人。各地的紧急电话：

# olivia health：查看与修改这台电脑上加密记录的健康信息（决定 D2，步骤 A1）。
# 列表的选项文字同首访：clinical_red_flags 的编号与名称，加上 disclosure_labels。
health_command:
  current: "现在记录的："
  none_recorded: "现在还没有记录任何健康信息。"
  select: |-
    想重新选择的话，输入序号，多个用逗号隔开；输入 0 删除全部记录；直接按回车就不做改动。
  consent: |-
    {sensitive_notice}

    如果愿意记录，请完整输入下面这句话：
    {consent_sentence}

    不想记录的话，输入「跳过」或直接按回车。
  saved: "好的，已经更新，并加密保存在这台电脑上。"
  cleared: "好的，记录的健康信息已经全部删除了。"
  unchanged: "好的，没有做任何改动。"
  no_keychain: "这台电脑上暂时没有可用的系统钥匙串，没办法把健康信息加密保存，所以这里先不记录。其他的一切都照常。"
  not_onboarded: "还没有完成第一次设置。先运行 olivia chat，之后就可以在这里查看和修改了。"
  adults_only: "这里的陪伴只为成年人设计，所以不会保存健康信息。"

# olivia profile：首访之后查看与修改双方称呼和不想谈的话题（JTBD 4，F11）。
# 校验同首访：称呼 1 到 {max_len} 个字、可显示的字符；话题用逗号、顿号或空格隔开，
# 每个最多 {max_len} 个字、最多 {max_count} 个（超出时用 hints 里的同一句提示）。
# 话题一栏：输入新的话题会整体替换现在的；输入 0、「清空」或 skip_words 里的词（没有、无……）清空；
# 直接回车不改。{topics} 是用顿号连起来的话题，没有时是 no_topics。
profile_command:
  heading: "称呼和不想谈的话题：输入序号修改；直接回车，就先不改。"
  user_name_item: "你的称呼：{user_name}"
  agent_name_item: "我的称呼：{agent_name}"
  taboo_item: "不想谈的话题：{topics}"
  no_topics: "还没有"
  elsewhere: "（陪伴方式可以用 olivia persona 更换，地区可以用 olivia region 修改。）"
  user_name: |-
    你希望我怎么称呼你？昵称就很好，1 到 {max_len} 个字。

    现在是「{user_name}」；直接按回车，就先不改。
  agent_name: |-
    你想怎么称呼我呢？同样是 1 到 {max_len} 个字。

    现在是「{agent_name}」；直接按回车，就先不改。
  taboo: |-
    有没有哪些话题，是你不希望我主动提起的？比如考试、前任、体重。

    可以写几个，用逗号或顿号隔开，会替换现在记着的这些；输入 0 就全部清空；直接按回车，就先不改。
  user_name_saved: "好的，{user_name}，之后我就这样称呼你，下次打开 olivia chat 时生效。"
  agent_name_saved: "好的，之后我就叫「{agent_name}」了，下次打开 olivia chat 时生效。"
  taboo_saved: "好的，这些话题我会记在心里，不会主动去碰：{topics}。下次打开 olivia chat 时生效。"
  taboo_cleared: "好的，已经清空了，现在没有需要避开的话题。下次打开 olivia chat 时生效。"
  unchanged: "好的，没有做任何改动。"
  unknown_choice: "没有认出这个序号，这次什么都没有改。"
  not_onboarded: "还没有完成第一次设置。先运行 olivia chat，之后就可以在这里修改称呼和话题了。"
  adults_only: "这里的陪伴只为成年人设计，所以没有可以修改的称呼和话题。"
