# 草稿：待 G-0 两名注册心理师审核（docs/superpowers/plans/2026-10-22-remaining-roadmap.md R1-4）
#
# 首访「心灵契约共创仪式」文案（PRD ONB-01~08，SOP 1；规格裁定 22–24、28）。
# 由 olivia/core/chang/onboarding.py 读取；步骤顺序与校验逻辑在代码里，这里只放文字。
#
# 顺序：免责声明 → 18+ 门禁（选“未满”时再确认一次，选错了可以返回）→ 保存方式（ONB-06，默认只加密健康信息）→ 双向称呼 →
#       陪伴方式（四选一，默认温和包裹，ONB-03）→ 话题雷区 → 常住地区 → 时区 → 健康信息授权
#       （最后一步，可跳过；授权后依次是健康信息清单和三项需要避开练习的情况清单，决定 D2，
#       步骤 A1）→ 原子保存。
#       这台电脑没有可用的系统钥匙串时，不问保存方式、也不问健康信息，完成语前加一句说明
#       （outcomes.health_not_saved），健康信息一律不保存（裁定 28）。
#
# 槽位（只允许下列几个，加载时校验）：
#   {user_name} {agent_name}      双方称呼（agent_name 提示语与完成语可用）
#   {max_len} {max_count}         长度与数量上限（只用于 hints）
#   {consent_sentence}            授权句，原样展示，用户需完整输入
#   {sensitive_notice}            敏感个人信息告知（见下方 sensitive_notice），只用于两处授权提示
#   {system_timezone}             这台电脑的时区（只用于 timezone_free 的提示语和 hints.timezone_free_invalid）
#
# 写作约束：不出现诊断词（见 olivia/data/language/willow.yaml 的 diagnosis_terms）、
# 不说教（不用“应该/必须/一定要”）、不用感叹号。健康信息选项的文字在 clinical_labels
# （只显示中文名称，编号只在程序内部使用）；三项情况清单的文字在 disclosure_labels。
# health_command 是 olivia health 命令（查看与修改已记录的健康信息）的文字。
version: 1

# 敏感个人信息的单独同意（PIPL 第 28–30 条；下一阶段计划 B8）。
# 草稿：待 G-4 法务审核（另待 G-0 心理师审核措辞）。
# 告知只覆盖这一步收集的两类信息：临床史编号与三项情况清单（决定 D2），它们只在授权之后、
# 同一流程里收集。安全计划另有自己的告知（safety_plan.yaml 的 command.intro），在用户自己运行
# olivia safety-plan 时出现；用户要求记住的话由用户主动发起，聊天小结只有编号和等级，
# 二者都写在 olivia privacy 的说明里，不在这里重复。
# 告知是独立的一段文字（sensitive_notice），首访（prompts.clinical_consent）和
# olivia health（health_command.consent）都在授权句之前原样展示它；不增加步骤。
# 用途写实：记录的情况既用来避开练习，也会让聊天里附上找专业人士帮忙的建议（转介卡）。
consent_sentence: "我同意在这台电脑上记录我选择的健康信息"

sensitive_notice: |-
  【关于健康信息的单独说明】
  健康方面的信息属于敏感的个人信息，所以在你决定之前，想先单独说清楚：
  · 记录什么：只记录你从两张列表里选的编号。一张是你以往被专业人士评估过的身心方面的情况；另一张是三种需要避开某些练习的情况：心脏或呼吸方面需要格外小心，身边有人可能伤害你，曾有过幻觉、妄想这类体验。你打的字不会被记录。
  · 用来做什么：只用来挑选适合你的练习，避开可能让你不舒服或不安全的那些；有些情况下，聊天时我也会附上一句找专业人士帮忙的建议。不会用来给你下任何结论。
  · 存在哪里：只加密保存在这台电脑上，钥匙放在系统钥匙串里。不会上传，也不会发送给任何人或任何机构。
  · 不记录会怎样：没有任何影响，其他的一切都照常。
  · 怎么撤回：随时运行 olivia health，输入 0 就能删除全部记录；也可以运行 olivia forget，忘掉这台电脑上的全部数据。

prompts:
  disclaimer: |-
    你好，欢迎来到这里。开始之前，有几句很重要的话想先和你说清楚。

    我是一个在你电脑上离线运行的陪伴程序，不是医生，也不是心理咨询师。我能做的，是安静地听你说话，陪你整理感受，偶尔分享一些简单的自我照顾小练习。我不会给出医学判断，也不能代替专业的心理或医疗帮助。

    如果你正处在危险之中，或者有伤害自己的念头，请马上联系当地的紧急电话，或者告诉身边信任的人。

    你在这里说的话只保存在这台电脑上。读完之后，如果愿意继续，请选择「我已阅读并同意」。
  age_gate: |-
    谢谢你。还有一件事想先确认：这里的陪伴只为年满 18 周岁的成年人设计。

    请问你已经年满 18 周岁了吗？
  # 选“未满”之后的一次确认（裁定 22：确认后会一直保留，所以给一次改正的机会）。
  age_confirm: |-
    你确认自己未满 18 岁吗？

    确认之后，这台电脑上会一直记着这个回答。如果刚才是选错了，选 2 就能回去重新回答。
  encryption: |-
    在继续之前，想请你选一下这里的内容怎么保存。

    如果之后你愿意告诉我健康方面的信息，无论怎么选，它都会加密保存。你也可以选择把称呼、地区这些设置，连同以后的记录全部加密：这样更私密，只是万一系统钥匙串被清空，或者换了一台电脑，这些内容就打不开了。

    拿不准的话，直接按回车，先只加密健康信息就好。
  user_name: |-
    接下来，我们互相认识一下。你希望我怎么称呼你？昵称就很好，1 到 12 个字。

    直接按回车的话，我会叫你「朋友」。
  agent_name: |-
    好的，{user_name}。那你想怎么称呼我呢？同样是 1 到 12 个字。

    直接按回车的话，我就还叫「Olivia」。
  # ONB-03：四种陪伴方式（D-1 草稿：待 G-0）。只改变说话的语气和长短，安全相关的内容
  # （危机卡、求助电话）对每一种都一样。
  persona: |-
    接下来，选一种你喜欢的陪伴方式。它只改变我说话的语气和长短，不会改变任何安全方面的安排。

    选一个序号就可以；直接按回车，就用第一种。之后也可以随时用 olivia persona 更换。
  taboo: |-
    有没有哪些话题，是你不希望我主动提起的？比如考试、前任、体重。

    可以写几个，用逗号或顿号隔开；没有的话，直接按回车就好。这些话题我会记在心里，不会主动去碰。
  region: |-
    在你需要的时候，我希望给出的是你所在的地方真正打得通的求助电话。所以想问问，你平时主要在哪里生活？

    选一个序号就可以。不想说也完全没关系。
  timezone_choice: |-
    这个地方有好几个时区。你那里用的是哪一个？

    选一个序号，或者直接输入时区名称，例如 America/New_York。
  timezone_free: |-
    再确认一下时区，这样我能知道你那边大概是白天还是深夜。

    可以输入时区名称，例如 Europe/Paris 或 Asia/Singapore；输入「跳过」或直接按回车，就用这台电脑的时区（{system_timezone}）。
  clinical_consent: |-
    还有最后一个问题，完全可以跳过。

    如果你曾经被专业人士评估过某些身心方面的情况，告诉我的话，我可以避开一些可能不适合你的练习。

    {sensitive_notice}

    如果愿意记录，请完整输入下面这句话：
    {consent_sentence}

    不想记录的话，输入「跳过」或直接按回车。
  clinical_history: |-
    谢谢你的信任。下面这些里，有和你情况相符的吗？

    输入序号，多个用逗号隔开；都不相符的话，直接按回车。
  contraindications: |-
    还有三种情况，同样可以跳过。

    如果下面有和你相符的，告诉我的话，我会避开可能让你不舒服或不安全的练习，比如需要屏住呼吸、用冷水刺激身体，或者需要反复审视自己想法的练习。它们和刚才的信息一样加密保存，之后也可以随时用 olivia health 修改。

    输入序号，多个用逗号隔开；都不相符的话，直接按回车。

# 回答没认出来时，在 hints 那一句之后只重复问题本身（试用问题 P1：输错一次就整段重印十几行说明）；
# 选项照样列出。键与 prompts 一一对应，槽位同 prompts。
reprompts:
  disclaimer: 读完上面的说明，如果愿意继续，请选择「我已阅读并同意」。
  age_gate: 请问你已经年满 18 周岁了吗？
  age_confirm: 是确认未满 18 岁吗？刚才选错了的话，选 2 就能回去重新回答。
  encryption: 这里的内容想怎么保存？拿不准的话，直接按回车，先只加密健康信息就好。
  user_name: 你希望我怎么称呼你？直接按回车的话，我会叫你「朋友」。
  agent_name: 你想怎么称呼我呢？直接按回车的话，我就还叫「Olivia」。
  persona: 选一种陪伴方式：输入序号就可以；直接按回车，就用第一种。
  taboo: 有没有不希望我主动提起的话题？可以写几个，用逗号或顿号隔开；没有的话，直接按回车就好。
  region: 你平时主要在哪里生活？选一个序号就可以，不想说也完全没关系。
  timezone_choice: 你那里用的是哪一个时区？选一个序号，或者直接输入时区名称。
  timezone_free: 你那边用的是哪个时区？
  clinical_consent: |-
    那句话是：
    {consent_sentence}
  clinical_history: 下面这些里，有和你情况相符的吗？输入序号，多个用逗号隔开；都不相符的话，直接按回车。
  contraindications: 下面这三种情况，有和你相符的吗？输入序号，多个用逗号隔开；都不相符的话，直接按回车。

choices:
  disclaimer:
    accept: {label: "我已阅读并同意", aliases: ["同意", "我同意", "接受", "已阅读并同意"]}
    decline: {label: "我不同意", aliases: ["不同意", "拒绝", "不接受"]}
  age_gate:
    accept: {label: "是，我已年满 18 周岁", aliases: ["是", "是的", "已满", "满了", "已成年", "成年"]}
    decline: {label: "不，我还未满 18 周岁", aliases: ["否", "不是", "未满", "没满", "没有", "未成年"]}
  age_confirm:
    confirm: {label: "是", aliases: ["是的", "确认", "对", "未满"]}
    mistaken: {label: "我选错了", aliases: ["选错了", "错了", "选错", "返回", "不是"]}
  # 保存方式（ONB-06）：第一项是默认，直接按回车也选它。键名不用 on/off（YAML 会读成布尔值）。
  encryption:
    keep_off: {label: "只加密健康信息", aliases: ["默认", "不用", "保持关闭", "关闭", "只加密健康"]}
    encrypt_all: {label: "全部加密", aliases: ["全部", "加密", "开启", "打开", "都加密"]}

# 情况清单（决定 D2）：键名是 taxonomy 的 contraindication_enums 编号，顺序固定，新项只加在末尾。
# RED_FLAG_PSYCHOSIS（2026-10-23 决定）只在这里自述，聊天中不识别；选了它只避开 taxonomy
# 为它标注的练习，不改变转介。
disclosure_labels:
  CARDIORESPIRATORY_INSTABILITY: "心脏或呼吸方面需要格外小心（比如严重哮喘、心律不齐、装有心脏起搏器）"
  INTERPERSONAL_SAFETY_HAZARD: "身边有人可能会伤害我，或者在家里常常感到不安全"
  RED_FLAG_PSYCHOSIS: "曾有过幻觉、妄想这类体验（比如听到别人听不到的声音），或者医生提过这方面的情况"

# 健康信息清单的选项文字（决定 D2）：键名是 taxonomy clinical_red_flags 的编号，必须一一对应；
# 只显示这里的中文名称，不显示编号和英文。草稿：待 G-0 审核措辞。
clinical_labels:
  SIT-02-04: "双相情感障碍或环性心境（情绪在高涨和低落之间大幅起伏）"
  SIT-02-06: "怀孕期间或生产以后的抑郁、焦虑"
  SIT-06-01: "急性应激障碍或创伤后应激障碍"
  SIT-06-05: "解离，或人格解体、现实解体的体验"
  SIT-08-04: "神经性厌食，或长期过度限制进食"
  SIT-09-01: "边缘型人格的情绪失调，并伴有自伤"
  SIT-10-04: "酒精或其他成瘾物质的依赖"

# ONB-03：四种陪伴方式，按此顺序编号（第一种是默认）。冒号前是简称，回答简称也可以。
persona_labels:
  GENTLE_HOLDING: "温和包裹：温暖柔和，多一些接纳与抚慰"
  ZEN_PHILOSOPHER: "沉静哲思：说话慢一些，常用自然里的画面，多留一点空白"
  RATIONAL_PEER: "平视战友：直接、有条理，像朋友一样和你一起把事情理清楚"
  SILENT_ANCHOR: "静默树洞：话很少，只是安静地听着、陪着，不追问"

# olivia persona 和首访时也接受的更短的叫法（之外还接受序号与冒号前的简称）。
persona_aliases:
  GENTLE_HOLDING: ["温和", "温柔", "包裹"]
  ZEN_PHILOSOPHER: ["沉静", "哲思", "禅", "禅意"]
  RATIONAL_PEER: ["平视", "战友", "理性"]
  SILENT_ANCHOR: ["静默", "树洞", "安静"]

