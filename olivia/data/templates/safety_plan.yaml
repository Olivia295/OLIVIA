# 草稿：待 G-0 两名注册心理师审核（docs/superpowers/plans/2026-10-23-next-phase.md B10，决定 D8）
# command.intro 里的隐私告知（PIPL 第 28–30 条，计划 B8）另待 G-4 法务审核。
#
# 个人安全计划（Stanley-Brown 安全计划）的文字。由 olivia/core/chang/safety_plan.py 读取；
# 步骤顺序、条数与长度上限、校验都在代码里，这里只放文字。
#
# 填写只在 olivia safety-plan 命令里进行；聊天里从不记录用户的话。计划始终加密保存，
# 没有系统钥匙串时什么都不保存。
# 危机回复里只展示第 2、3、4 部分（以 crisis.intro 开头）；第 5 部分（让环境更安全）
# 只在 olivia safety-plan 里显示，从不出现在危机回复里。
#
# 槽位（只允许下列几个，加载时校验）：
#   {n} {total}                   当前部分或当前联系人的序号、部分总数
#   {title}                       部分标题
#   {name}                        用户刚写下的联系人称呼
#   {max_chars} {max_entries}     长度与条数上限（只用于提示）
#
# 写作约束：不出现诊断词（见 olivia/data/language/willow.yaml 的 diagnosis_terms）、
# 不说教（不用“应该/必须/一定要”）、不用感叹号、不写任何电话号码。
version: 1

# 五个部分的顺序固定：warning_signs, coping, distraction, people, environment。
sections:
  warning_signs:
    title: 我的预警信号
    prompt: 当事情开始变得难熬时，你通常会先注意到什么？可以是一些念头、心情、身体的感觉，或者自己会做的事。
  coping:
    title: 我自己能做的安抚方法
    prompt: 一个人的时候，有哪些小事能让你稍微好受一点？比如听一首喜欢的歌、洗个热水澡、出门走一走。
  distraction:
    title: 能让我分心的人或地方
    prompt: 有哪些人或地方，能让你暂时从难受里抽离出来一会儿？比如一位聊得来的朋友、一家常去的小店、楼下的公园。
  people:
    title: 我可以求助的人
    prompt: 难熬的时候，你愿意联系谁？写下名字或称呼，再写电话，可以写好几位。
  environment:
    title: 让环境更安全
    prompt: 在难熬的时候，有哪些东西你愿意先让它离自己远一点，或者交给信任的人保管？

command:
  # 第一次填写时的告知（只在还没有计划时出现）：写什么、用在哪里、存在哪里、不写会怎样、怎么删。
  # 第 4 部分会写下别人的名字和电话，所以单独提一句。
  intro: |-
    安全计划是你在平静的时候，写给难熬时的自己的一份小清单。
    一共五个部分，每一部分都可以跳过。

    写之前，先说清楚它会怎么保存：
    · 只加密保存在这台电脑上，钥匙放在系统钥匙串里。不会上传，也不会发送给任何人，包括你写下的联系人。
    · 只用在两个地方：这里，和聊天时你特别难熬的时候，那时我会把第 2、3、4 部分拿出来给你看；第 5 部分只在这里显示。
    · 第 4 部分会写下别人的名字和电话，写你觉得对方不会介意的就好。
    · 不写也完全没关系，其他的一切都照常。
    · 想删掉的话，随时运行 olivia forget --safety-plan，或者在这里选择清空。
  section_heading: "（{n}/{total}）{title}"
  entry_help: 一行写一条，最多 {max_entries} 条。写完了直接回车，想跳过这一部分也直接回车。
  rewrite_help: 重新写这一部分：一行写一条，最多 {max_entries} 条。第一行就直接回车，会保留原来的内容；输入 0 清空这一部分。
  current_heading: 现在写的是：
  # 修改一个还空着的部分时，代替 current_heading（试用问题 P7）。
  current_empty: 这一部分还没有写。
  # 超长时这一条先不存，但从不悄悄丢掉：说清楚怎么办；此时直接回车只放弃这一条（entry_not_saved），
  # 这一部分接着写（试用问题 I10）。
  entry_too_long: 这一条有点长，最多 {max_chars} 个字，所以还没有存下。可以缩短一点再写一次；直接回车，就先不存这一条。
  entry_not_saved: 好，刚才那一条没有存。还想写的话接着写；写完了直接回车。
  section_full: 这一部分已经写满 {max_entries} 条了。
  person_name: 第 {n} 位：名字或称呼（写完了直接回车）
  # 名字和电话写在同一行（“表姐 13800000000”）时两样都记下，不再问电话；只写了号码时先记着号码、
  # 再问称呼；称呼超长时号码照样记着，只请对方写个短一点的称呼（试用问题 I10）。
  name_too_long: 这个名字或称呼有点长，最多 {max_chars} 个字，所以这一位还没有存下。可以写一个短一点的称呼，比如「表姐」；直接回车，就先不存这一位。
  # 第六轮（2026-10-29，复测 q4 F19；草稿：待 G-0）：同一行里确实写了电话时，接在 name_too_long 后面。
  phone_kept: 写在同一行的电话我先记着。
  name_for_phone: 这一行像是电话号码，我先记着。这一位怎么称呼？写下名字或称呼，比如「表姐」；直接回车，就先不存这一位。
  person_with_phone: 好，{name}和电话都记下了。
  person_phone: "{name}的电话（可以不填，直接回车）"
  phone_invalid: 这个号码没有认出来。可以只写数字、空格、短横线或加号，再写一次；不想填就直接回车。
  show_heading: 你的安全计划：
  empty_section: （还没有写）
  menu: 想做什么？直接回车就保持不变。
  menu_edit: 修改其中一部分
  menu_clear: 清空整份计划
  menu_unknown: 没有认出这个选择，可以输入 1 或 2，直接回车就保持不变。
  pick_section: 想修改哪一部分？输入序号 1 到 5，直接回车结束。
  pick_unknown: 没有认出这个序号，可以输入 1 到 5 之间的数字，直接回车结束。
  # QA q4 SP-9（草稿：待 G-0）：「确认」「确定」和 1 都算确认，和 olivia forget 一致。
  clear_confirm: 确定要清空整份安全计划吗？清空后就找不回来了。输入「确认」或「确定」（输入 1 也可以）就清空，直接回车取消。
  saved: 好，已经加密保存在这台电脑上了。之后想看或者修改，再运行 olivia safety-plan 就好。
  unchanged: 好，计划保持不变。
  cleared: 好，安全计划已经清空了。
  nothing_saved: 这次什么都没有写，所以没有保存。想写的时候，随时回来。
  left: 这次先不保存了。想写的时候，随时回来。
  # 草稿：待 G-0（QA q4 SP-12）。新写计划时输入结束或按 Ctrl-C：前面写好的部分已经保存（不用聊天的结束语）。
  left_saved: 好，先停在这里。前面写好的部分已经加密保存了；想接着写的时候，再运行 olivia safety-plan，选「修改其中一部分」就好。
  # 草稿：待 G-0（QA q4 SP-7）。修改某一部分时，已经写了几行却在写完之前结束：这几行没有保存，这一部分保持原样。
  edit_not_saved: 「{title}」里刚写的内容还没写完，所以没有保存，这一部分还是原来的样子。
  no_keychain: 这台电脑上没有可用的系统钥匙串，安全计划没办法加密保存，所以这里不会保存它。也可以把这几个问题写在纸上，放在容易找到的地方。
  locked: 加密保存的安全计划现在打不开：系统钥匙串没有响应，或者钥匙已经不在这台电脑上了。你的文件我没有改动。
  damaged: 之前保存的安全计划读不出来了。可以重新写一份，新的会替换掉它。
  # 草稿：待 G-0（健壮性 C2：文件被换成文件夹或没有读取权限）
  unreadable: 安全计划的文件现在打不开（可能是权限不对，或者被换成了文件夹）。我没有改动它。可以运行 olivia doctor 看看是哪里不对。
  not_onboarded: 还没有完成第一次设置。先运行 olivia chat，之后就可以写安全计划了。
  adults_only: 这里的陪伴只为成年人设计，所以不会保存安全计划。需要的时候，可以运行 olivia resources 查看求助电话。
  # 草稿：待 G-0（QA r3，2026-10-27）。写下的话达到危机等级时，命令行先显示求助电话，再问继续还是先退出
  # （每一句都这样）。选「继续」之后：第 1、5 部分本来就会写到这些念头和要收起来的东西，照样记下
  # （crisis_kept）；第 2、3、4 部分会在聊天里特别难熬的时候原样拿给用户看，所以不记下，请对方换一种写法
  # 或者回车跳过（crisis_not_kept）；菜单处的这种话只是不当作选择（crisis_retry）。选「先退出」时，
  # 前面写好的部分照样保存（crisis_left_saved），什么都还没写时用 crisis_left。
  crisis_kept: 好，这句记在「{title}」里了，我们接着写。需要的话，上面的电话随时可以联系。
  crisis_not_kept: 「{title}」是你特别难熬的时候，我会拿出来给你看的内容，所以刚才那句我没有记进去。可以换一种写法再写一次；不想写的话，直接回车跳过。上面的电话随时可以联系。
  crisis_retry: 好，我们继续。刚才那句我没有记下，可以重新回答下面的问题。
  crisis_left: 好，先停在这里，刚才那句没有记下，这次也没有保存别的。上面的电话随时可以联系；想回来写的时候，再运行 olivia safety-plan 就好。
  crisis_left_saved: 好，先停在这里。刚才那句没有记下，前面写好的部分已经加密保存了。上面的电话随时可以联系；想接着写的时候，再运行 olivia safety-plan 就好。

crisis:
  # 危机回复里用户自己的计划之前的固定一句（第 2、3、4 部分，不经过 WILLOW 和隐喻）。
  intro: 这是你之前给自己写下的计划：
  # 草稿：待 G-0（S5，2026-10-26）。一次危机流程里完整计划只展示一次，之后的危机回复只用一句话提醒。
  # reminder_people 列出第 4 部分的称呼（{name}，多位用顿号连接，不含号码）；没有第 4 部分时用 reminder。
  reminder_people: 你的安全计划里有{name}，难熬的时候可以联系。
  reminder: 你之前写下的安全计划还在，里面有能让你好受一点的办法。
  # 草稿：待 G-0（S5）。危机流程中结束聊天时，告别里附上第 4 部分的人（称呼与电话）之前的一句。
  farewell_people: 你的安全计划里可以求助的人：
  # 草稿：待 G-0（QA q4 FLT-3）。保存过安全计划、但现在打不开（文件坏了、钥匙不在了、钥匙串没有响应）时，
  # 危机回复里在原本放计划的位置说一句，不悄悄不展示。不提“上面/下面”，不写号码。
  unreadable: 你之前写下的安全计划，这台电脑现在读不出来，这次没办法拿给你看。之后可以运行 olivia doctor 看看是哪里不对。

# 一次会话里第一次 S_closing 回复的末尾，提示一次（这台电脑上只提示一次，没有计划时）。
suggestion: 如果愿意，可以在平静的时候运行 olivia safety-plan，给难熬时的自己写一份小小的安全计划。
