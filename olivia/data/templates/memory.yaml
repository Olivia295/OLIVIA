# 草稿：待 G-0 两名注册心理师审核（docs/superpowers/plans/2026-10-22-remaining-roadmap.md R1-4）
#
# 记忆账本的文案（决定 D1，步骤 B2）。
#
# replies：会话里说的话，单段，不带槽位，不出现诊断词、号码与方法名（测试用 WILLOW 与输出网关检查）。
#   note_saved          用户说“记住：……”后，在回复末尾简短确认（不复述内容）。
#   note_too_long       要记的内容超过 500 字，没有保存。
#   note_unavailable    这台电脑不能加密保存，所以这句没有记。
#   memory_unavailable  同上原因，整个记忆功能不可用；每台电脑只在开场说一次。
#   summary_not_saved   会话结束时小结没能写入（例如钥匙串中途被锁）。
#   note_continue       （草稿：待 G-0，质量修复 F3）“记住：……”这一轮只回确认句，再接这一句
#                       温和地接着聊，不把要记的话当成感受来复述。
#   recall_*            （草稿：待 G-0，F15）用户问“我上次让你记住什么了”“周四要见的那个人是谁来着”时，
#                       从“记住：……”存下的笔记里找（从不找会话小结，不提危机）。只有 recall_found 与
#                       recall_latest 带槽位 {note}，原样放进用户当时让记的那句话；其余同上，单段、无槽位。
#     recall_found        找到和问题有关的那一条。
#     recall_latest       笼统地问“记住了什么”：最近一条，并提一句全部记下的话在 olivia memory 里。
#     recall_no_match     明确问记住的话，但没有和问题有关的那一条（不念别的条目）。
#     recall_none         还没有记过任何话。
#     recall_unavailable  这台电脑上暂时打不开加密的记忆（没有钥匙串，或钥匙串被锁）。
#
# summary：账本条目正文（人可读的模板化小结），只由条目头部的字段生成，不含对话原文。
#   槽位：{date} {start} {end} {path} {spectra} {methods} {before} {after} {turns} {count} {percent}
#   turns / support / late_night（F12，`olivia stats` 的来源）：这次聊了几轮、其中几轮聊到身边可以
#     联系的人（为 0 时不显示）、是否在深夜（00:00–05:00）聊的；旧条目没有这些字段，不显示。
#   battery（草稿：待 G-0，CHANG-04 周记的电量走势）：这次用 [NN%] 说过电量时，最低的那次（按 5% 取整）；
#     槽位 {percent}；没说过电量或旧条目不显示。是否进过避风港看“经过”一行的“安静陪着”。
#   spectra 只在这次聊天有主要话题时出现，没有时整行省略（不写“主要聊到：没有”，F11）；
#   none 只用于自评里没打的那一次。
#   journal_*：周记记录（B6）的正文：哪天提出过周记、看没看、觉得有没有帮助。
# stages / spectra / feedback：阶段、困扰谱系与反馈的日常说法，不用病名。
version: 1
replies:
  note_saved: "这句我记下了。"
  note_too_long: "这段有点长，我先没有记下。可以挑最想留住的一两句，再用「记住：」开头告诉我。"
  note_unavailable: "这台电脑上暂时没办法把记忆加密保存，所以这句我先不记了。"
  memory_unavailable: "先告诉你一件事：这台电脑上暂时没办法把记忆加密保存，所以我不会记下我们聊过什么。其他的一切都照常。"
  summary_not_saved: "这次聊天的小结没能保存下来，下次再试试。"
  note_continue: "还有什么想说的，随时告诉我，我在这里听着。"
  recall_found: "你之前让我记住的是：「{note}」。"
  recall_latest: "你最近一次让我记住的是：「{note}」。想看全部记下的话，可以在命令行输入 olivia memory。"
  recall_no_match: "我翻了翻你让我记住的话，没有找到和这个有关的。想看全部记下的话，可以在命令行输入 olivia memory。"
  recall_none: "你还没有让我记住过什么。想让我记下的话，用「记住：」开头告诉我就好。"
  recall_unavailable: "这台电脑上暂时打不开加密保存的记忆，所以现在没办法帮你找之前让我记住的话。"
summary:
  heading: "## {date} 的一次聊天"
  time: "- 时间：{start} – {end}"
  path: "- 经过：{path}"
  spectra: "- 主要聊到：{spectra}"
  methods: "- 试过的小练习：{methods}"
  no_methods: "- 这次没有试小练习。"
  crisis: "- 这次聊天里有过很难熬的时刻，我们一起看了可以求助的电话。"
  self_rating: "- 自评：开始时 {before}，结束时 {after}"
  turns: "- 一共聊了 {turns} 轮。"
  support: "- 其中有 {count} 轮聊到了身边可以联系的人。"
  late_night: "- 这次是在深夜聊的。"
  battery: "- 这次说过的电量里，最低是 {percent}%。"
  significant: "- 这次聊天很重要，会一直留着。"
  none: "没有"
  joiner: "、"
  arrow: " → "
  journal_heading: "## {date} 的一周小结"
  journal_shown: "- 看了这一周的小结。"
  journal_skipped: "- 这次先没有看这一周的小结。"
  journal_helpful: "- 觉得有帮助。"
  journal_not_helpful: "- 觉得帮助不大。"
stages:
  S_ready: 开始
  S_explore: 倾听
  S_clarify: 梳理
  S_empower: 小练习
  S_haven: 安静陪着
  S_closing: 收尾
  S_crisis: 先顾安全
spectra:
  "01": 紧张和不安
  "02": 低落和没劲
  "03": 反复想同一件事
  "04": 对自己很苛刻
  "05": 累和耗尽
  "06": 经历过的难事和失去
  "07": 关系里的牵挂
  "08": 睡眠和身体的不舒服
  "09": 情绪起伏很大
  "10": 停不下来的冲动
  "11": 关于意义的困惑
feedback:
  HELPFUL: 有帮助
  NOT_NOW: 先收进锦囊
  UNHELPFUL: 不太合适
  none: 还没有反馈
