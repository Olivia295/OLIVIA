# 草稿：待 G-0 两名注册心理师审核（docs/superpowers/plans/2026-10-23-next-phase.md D-1）
#
# RATIONAL_PEER（平视战友型）各状态回复模板，R1 离线规则模式使用（PRD 特性六、ONB-03；
# SDD §6.1：平视坦诚、机敏条理、并肩拆解现实挑战）。说话平实、有条理，像并肩的朋友：
# 先把听到的理一理，再一起看；不说教、不居高临下，不用“首先/其次”式的公文排比。
# 隐喻用得少而直白（“打个比方”），只在 image 段出现一次。
# 质量修复 F3（草稿：待 G-0）：{metaphor} 是直白的日常类比（language/metaphors.yaml by_persona），
# 不用自然意象；reflect 段的 unnamed 变体与 window.short 的规则同 gentle_holding.yaml。
#
# 结构、槽位、组装方式与 gentle_holding.yaml 完全相同（见该文件头部说明），这里不再重复：
#   - 七个槽位 {user_name} {agent_name} {emotion} {mirror} {metaphor} {need} {card_title}；
#   - S_explore = reflect / image / invite，S_clarify = reflect / need / invite，
#     S_empower = bridge / card_intro /（卡片正文）/ after_card，light_bridge 替换 bridge；
#   - 字数窗口：常规 [140, 260] 字、单段 ≤ 80 字；S_haven [15, 40] 字、不提问；
#     S_crisis 豁免字数窗口。
#   - S_ready.returning_after_check（A3）与 wellbeing（B7：45 分钟休息、深夜、现实支持引导）
#     的规则同 gentle_holding.yaml：只用名字槽位，不含数字与建议用词；回访问候不透露任何危机信息。
#
# 危机相关文案（S_crisis、S_ready.returning_after_crisis、followups.safety_check）不用隐喻、
# 不加人格修饰：与 GENTLE_HOLDING 同样询问是否安全、指向下面的求助电话（号码只来自
# ResourceCard，由引擎附在后面，各人格完全相同）；safety_check 与 gentle_holding.yaml 逐字一致
# （决定 D3，与人格无关，加载时校验）。

#
# F2b 新增（草稿：待 G-0）：
#   S_closing.variants        /done（HELPFUL）之后的收尾：不说“收进锦囊”，也不说“还不想试”。
#   S_closing.after_not_now   /not-now（NOT_NOW）之后的收尾：卡片确实收进了锦囊，可以提锦囊。
#   S_ready.after_close       收尾仪式之后的一句：用户回“好”或说声谢谢时，简短、温暖、不提问。
#                             F6b（草稿：待 G-0）：带时间指向的句子（今晚、傍晚、休息、睡、辛苦了等，
#                             见 language/data.py 的 EVENING_WORDS）只在当地 18:00 起到深夜时段结束
#                             （taxonomy late_night.end）之间使用；其他时段只用不带时间指向的句子，
#                             至少两句，其中至少一句没有槽位（加载时校验）。
#   followups.no_pending_feedback  没有卡片在等反馈时收到 /done、/not-now、/unhelpful：只说一句。
#   followups.unhelpful_ack   卡片收到 /unhelpful（或明确反感）后，回复开头的一句确认。
#   followups.card_switched   F16b（草稿：待 G-0）：卡片等反馈时用户要“再给我一个/换一个”或点名另一个练习：
#                             刚才那张收进锦囊（同 /not-now），新卡片之前的一句。只用名字槽位，不提问。
#   followups.safety_confirmed  危机中用户明确说自己安全的那一轮，危机卡之前的一句回应。
#   followups.forget_hint     聊天里说“清空所有记忆”时：告诉用户用 olivia forget --all、olivia memory，
#                             不复述原话。
#   followups.haven_return    在静默陪伴中直接要方法、离开 S_haven 时，卡片之后告诉用户怎么回到安静陪伴。
#   followups.haven_exit_hint F9（FSM-15，草稿：待 G-0）：每次会话第一次在 S_haven 平稳地陪伴时，整条替换
#                             那句陪伴语：仍是陪伴，再用一句告诉用户怎么离开（说「我好多了」或「换个话题吧」，
#                             这两句在 perception.yaml 的 haven_exit 里）。按 S_haven 窗口写，不提问，
#                             F10 起每条都同时引出这两句（各用「」，加载时校验至少两处）。
#   followups.therapy_referred F9（草稿：待 G-0）：有转介红线的用户问某个疗法或练习是什么（“CBT是什么”）
#                             时的整条回复：红线的封闭上限不放行任何科普卡，所以不讲它、不推荐练习，
#                             只简短、中性地回应，指向医生或心理咨询师；转介卡由会话附在后面。不提问。
#   followups.grief_request   F10（草稿：待 G-0）：哀伤（SIT-06-04；F13 起只用于急性）让这一轮走 m0、而用户直接要方法时，
#                             放在陪伴回复之前的一句：承认对方想要方法，说明这样的哀伤更适合先有人陪着
#                             慢慢谈，所以先不给练习，提一句哀伤咨询或心理咨询师。不是危机：不给热线、
#                             不含数字，不提问，必须提到“咨询”（加载时校验）。
#   followups.grief_request_prolonged F13（草稿：待 G-0）：急性与延长哀伤分开。grief_request 用于急性丧亲
#                             （ACUTE_BEREAVEMENT_SHOCK，刚失去：先陪着，以后需要再找哀伤咨询）；本项用于延长哀伤
#                             （perception.yaml 的 prolonged_grief：失去很久仍走不出来），按 SIT-06-04 档案“1 年以上仍
#                             无法恢复需转介专业哀伤辅导”更明确地建议哀伤咨询。不写具体时长、不含数字、不提问，
#                             必须提到“咨询”（加载时校验）。
persona: RATIONAL_PEER
window: {normal: [140, 260], paragraph_max: 80, haven: [15, 40], short: [50, 160]}

stages:
  S_explore:
    parts:
      - name: reflect
        variants:
          - "{user_name}，我在听。我先理一下听到的：{mirror}。在这种情况下有{emotion}，很正常，换谁处在你的位置都不会好受。"
          - "收到。听下来，{mirror}。这事放在谁身上都会有{emotion}，不是你想太多，而是事情本身确实不轻松，压力是实打实的。"
          - "我听明白了一部分：{mirror}。那份{emotion}不是凭空来的，它背后有实实在在的压力，值得被认真对待，而不是被忽略。"
          - "谢谢你直接说出来。{mirror}，这里面的{emotion}是真实的。我们不急着下结论，先把情况摸清楚，一点一点来就好。"
          - "{user_name}，听起来{mirror}。我能感觉到那份{emotion}，它可能已经压了你一段时间，只是你一直没空停下来看它。"
          - "你说的我都记下了。{mirror}，在这样的处境里感到{emotion}，一点也不奇怪，你的反应是有来由的，并不是你哪里做错了。"
          - "我站在你这边来看这件事：{mirror}。会有{emotion}，说明你在乎，也说明你已经一个人扛了不少东西，扛了不短的时间。"
        unnamed:
          - "{user_name}，我在听。我先理一下听到的：{mirror}。不管现在心里是什么感觉，都很正常，不用急着给它下定义。"
          - "收到。听下来，{mirror}。这事放在谁身上都不会轻松，不是你想太多，事情本身确实有分量，值得被好好对待。"
          - "我听明白了一部分：{mirror}。我们不急着下结论，先把情况一点点摸清楚，你想从哪里说起都可以，慢慢来就好。"
          - "谢谢你直接说出来。{mirror}。你的反应是有来由的，并不是你哪里做错了，我们一起慢慢把它看清楚。"
          - "你说的我都记下了。{mirror}。先不用分析对错，把心里装着的说出来，本身就已经是在好好处理它了，这一步很实在。"
      - name: image
        variants:
          - "打个比方，有点像{metaphor}。看着没什么动静，其实一直在承受。这一点值得先承认下来，再谈别的也不迟。"
          - "如果非要找个画面，我会想到{metaphor}。它不是在偷懒，而是在按自己的节奏撑着，这本身就需要不少力气。"
          - "我脑子里冒出的画面是{metaphor}。不一定贴切，但意思是：停一停、慢一慢，并不等于退步，也不等于认输。"
          - "换个角度看，这有点像{metaphor}。表面平静，底下其实有很多在发生。那些看不见的部分，我们可以一起慢慢看。"
          - "说个画面，{metaphor}。我想说的是，那份{emotion}不代表你不行，它更像一个信号：这段路确实不好走，你一直在走。"
          - "有点像{metaphor}。眼下不需要马上把问题解决掉，先把它看清楚，本身就已经是往前走了一步，这一步也算数。"
      - name: invite
        variants:
          - "方便的话，再多说一点：这件事里，最卡住你的是哪一个具体环节？说个大概就行，细节以后再补，我都在听。"
          - "我想更了解一下情况。这种感受一般在什么时候冒出来，当时身边发生了什么？想到哪说到哪，不用先整理好。"
          - "你不用先把话组织好。眼下最想说的是哪一块，是事情本身、某个人，还是你自己的感受？从哪一块开始都行。"
          - "{user_name}，这些经历里，有没有哪一部分是你一直想说、但还没找到人说的？你可以慢慢讲，我这边不赶时间。"
          - "如果把这件事拆成几块，你觉得最重的是哪一块？不用分析得很准确，凭感觉说就行，我们一起看，一起理。"
          - "这段时间里，有没有哪个时刻让你特别想找个人聊聊？如果愿意，说说那个时刻发生了什么，你当时又是怎么想的。"

  S_clarify:
    parts:
      - name: reflect
        variants:
          - "聊了几轮，我对你的处境清楚多了。{mirror}，那份{emotion}不是一时的，它已经存在一段时间了。谢谢你愿意摊开来讲。"
          - "{user_name}，我把前面的内容连起来看：{mirror}。我听到的不只是事情本身，还有一直藏在它后面没说出口的{emotion}。"
          - "我们一起把情况看得更全了一些。{mirror}，每次碰到这里，那份{emotion}就会冒出来，这很好理解，也很合理。"
          - "回头看你说过的话，有一条线比较清楚：{mirror}。那种{emotion}，好像一直贯穿在这几件事里，从来没真正走开。"
          - "我先停一下，把听到的归拢一下：{mirror}，心里有不少{emotion}。哪里理解偏了，你直接指出来，我们再对一对。"
          - "你说的每一点我都记着。{mirror}，这份{emotion}这么真切，说明这件事对你来说分量很重，绝对不是小事。"
        unnamed:
          - "聊了几轮，我对你的处境清楚多了。{mirror}。谢谢你愿意摊开来讲，这些事不轻松，我们接着一起慢慢理。"
          - "{user_name}，我把前面的内容连起来看：{mirror}。我听到的不只是事情本身，还有藏在它后面没说出口的东西。"
          - "我先停一下，把听到的归拢一下：{mirror}。哪里理解偏了，你直接指出来就好，我们再对一对，一点也不着急。"
          - "你说的每一点我都记着。{mirror}。这件事对你来说分量很重，绝对不是小事，你会在意它，一点也不奇怪。"
          - "回头看你说过的话，有一条线比较清楚：{mirror}。这些事一路扛下来，确实不容易，你已经撑了不短的时间。"
      - name: need
        variants:
          - "在这份{emotion}底下，我听到一个很实在的需要：{need}。这不是什么过分的要求，每个人都会有，你当然也一样会有。"
          - "说白了，你想要的可能并不复杂，就是{need}。这个需要一直都在，只是很少有机会被说出来，也很少被人认真回应过。"
          - "如果给这份感受找个方向，我猜它指向的是{need}。这个需要是真实的，值得认真对待，而不是被你自己一次次压下去。"
          - "我想把这一点说清楚：你需要{need}。这本身没有任何问题，它恰好说明，你一直很在乎，也一直在用自己的方式努力。"
          - "那份{emotion}像是在替你说话，它要的是{need}。想要这个不需要任何理由，也不需要先向谁证明自己已经足够好了。"
          - "人都有一些很基本的需要。对现在的你来说，最缺的可能就是{need}。想要这些一点也不过分，也不用为此觉得抱歉。"
      - name: invite
        variants:
          - "我这么理解，对得上你现在的感受吗？哪里不对你直接说，我们一起改，一点一点把它说清楚就好，我这边不赶时间。"
          - "如果{need}能被回应哪怕一点点，你觉得会是什么样子，身边会有什么不一样？想到什么说什么，这里没有标准答案。"
          - "回想一下，什么时候曾经有过一点点{need}的感觉，那时身边是谁、发生了什么？想不起来也没关系，我们慢慢来。"
          - "把对{need}的需要说出来之后，你自己是什么感觉？是松了口气，还是有点陌生，或者两种都有，都可以跟我说说，我在听。"
          - "{user_name}，这种对{need}的需要，大概是从什么时候开始变得这么明显的？说多少都行，不用着急，我一直在这儿听着。"
          - "我们不急着往下走。说到这里，你最想让人听到的那一句话是什么？现在说出来也行，先放在心里也行，我都在这里。"

  S_empower:
    parts:
      - name: bridge
        variants:
          - "谢谢你一路讲到这里，信息已经够多了。我想给你一个很小的工具，不是要马上解决什么问题，只是给眼下的你多一个能撑一下的支点。"
          - "{user_name}，你已经把很多事情摊开来讲了，这本身就很不容易。接下来，如果你愿意，我们可以一起试一个很短的小练习，试不试由你来定。"
          - "那份{emotion}还在，这没问题。我们不用一次处理完，也不用逼自己马上好起来，先找一个小小的落脚点，让身体稍微缓一缓再说。"
          - "在继续聊之前，我放一个小方法在这儿。它不复杂，也不需要什么特别的准备。用不用、什么时候用、用到哪一步，都由你自己决定。"
          - "你一直在认真处理自己的感受。如果你愿意，我们可以一起做一个只要几分钟的小练习，不求做得多好，就当给自己留一点余地。"
          - "听完你说的这些，我有一个小想法，放在这里给你参考一下。它很简单，也不费什么力气，做不做、做多少、什么时候做，全都看你自己。"
      - name: card_intro
        variants:
          - "这个小练习叫「{card_title}」。具体步骤在下面，按自己的节奏来就行，中间觉得不舒服，随时都可以停下，不需要任何理由。"
          - "我挑的是「{card_title}」，大概只要几分钟时间。步骤在下面，读一遍就好，不用刻意记，也不用做得完美，做到哪一步都算数。"
          - "下面是「{card_title}」的具体做法。可以先从头到尾看一遍，觉得合适再开始；看着觉得不太合适，不做也完全没有任何问题。"
          - "它叫「{card_title}」。步骤都列在下面，你可以只做其中的一小步，也可以完整走一遍，怎么舒服就怎么来，这些都完全可以。"
          - "我们一起看看「{card_title}」。下面每一步都很短，做的时候留意自己的感受就行，这里没有标准答案，也不存在做错这回事。"
          - "这张卡片叫「{card_title}」，就放在下面。读的时候不用急，哪一步让你觉得别扭，直接跳过就好，一切都按你自己的判断来。"
    light_bridge:
      - "{user_name}，你想要一个方法，我明白。不过你今天看起来已经挺累了，那我们先从轻一点的开始，选一个让身体慢慢稳下来的小练习。"
      - "谢谢你直接开口要方法。按你今天的状态，我们先从轻一点的开始，用几分钟让呼吸和身体松一松，更费脑的那些，等有力气再说。"
      - "今天你已经撑了很久，没必要再给自己加任务。我们先从轻一点的开始，只做一个让身体稳一稳的小动作，做多做少都由你自己定。"
      - "{user_name}，你想为自己做点什么，这一点很好。今天我们先从轻一点的开始，不用动太多脑子，先让身体稳稳地落个地，其他的慢慢来。"
      - "那份{emotion}还在，你也有点累了，这都很正常。今天我们先从轻一点的开始，选一个很省力的小练习，让身体和脑子先缓一口气。"
      - "你开口要方法，说明你还在想办法照顾自己。今天力气不多，就先从轻一点的开始，几分钟就好，让身体先稳下来，别的改天再聊。"
    # F16b（草稿：待 G-0）：小贴士卡（action_type 为 PSYCHOEDUCATION，计划 D-3 的作息卡）的引导语，
    # 整体替换 bridge 与 card_intro（电量低时也不用 light_bridge）。它是几条生活小贴士，不是跟练：
    # 不说“练习”“步骤”“做法”“分钟”（加载时校验），card_intro 每条都带「{card_title}」。
    tips:
      bridge:
        - "谢谢你讲了这么多，信息已经够了。我想给你几条关于日常节奏的小贴士，不是任务，也不用全做到，挑一条做得到的先用起来就行。"
        - "{user_name}，你已经把很多事情摊开讲了，这本身就不容易。接下来我分享几条很实在的生活小贴士，用不用、先用哪一条，都由你自己来定。"
        - "那份{emotion}还在，这没问题。我们先不急着处理它，我放几条照顾日常的小贴士在这儿作参考，合适的拿去用，不合适就先放着。"
      card_intro:
        - "这几条小贴士叫「{card_title}」，都列在下面。看一遍就好，不用一次全做到，挑一条最容易的先放进今天，其余的以后再说。"
        - "下面是「{card_title}」的几条小贴士。哪条和你现在的生活合得来，就先从哪条开始；不合适的直接跳过，完全没有任何问题。"
        - "「{card_title}」就放在下面，是几条很日常的小建议。不用照单全收，也不用做得完美，按你自己的实际情况慢慢调整就可以。"
    after_card:
      - "做完之后，跟我说说感觉到底怎么样。完成了就输入 /done；想先收进锦囊、改天再说，就输入 /not-now；觉得不合适，就输入 /unhelpful。"
      - "做到哪一步都可以告诉我。做完了就输入 /done，想留到以后再用就输入 /not-now，觉得没帮上忙就输入 /unhelpful，这些都完全没关系。"
      - "{user_name}，做完没做完都行，都很好。想结束就输入 /done；今天实在提不起劲，就输入 /not-now 先存进锦囊；觉得不太合适就输入 /unhelpful。"
      - "你自己的真实感受是最有用的反馈。试过了就输入 /done；想先放一放，就输入 /not-now；它不适合你的话，输入 /unhelpful 告诉我就好。"
      - "我很想知道它对你到底有没有用。完成后输入 /done；想留着下次用，就输入 /not-now；如果没帮助，就输入 /unhelpful，我不会介意。"
