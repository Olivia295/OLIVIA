# 草稿：待 G-0 两名注册心理师审核（docs/superpowers/plans/2026-10-22-remaining-roadmap.md R1-4）
#
# 周记与会话前后自评的文案（步骤 B6；PRD SOP 5、CHANG-04，裁定 30）。
#
# prompts：聊天开场与结束时的问题，单段，可直接回车跳过。
#   rating   会话开始与结束各问一次的 0–10 自评（两次同一句；0 是很糟，10 是很好）。
#   offer    滚动 7 天内聊过 2 次以上、且 7 天内没有提过周记时，开场问一次。
#   helpful  看完周记后的满意度（有 / 没有）。
# replies：短句，不带槽位，不出现诊断词与号码。
# card：周记正文，只由账本里的摘要生成（会话次数、自评、困扰谱系的日常说法、试过的小练习与反馈、
#   用户要求记住的话的条数），不含任何对话原文；除自评分与次数外不出现数字。
#   当周进入过危机流程时，用 intro_solemn / closing_solemn（庄重守护口吻，CHANG-04）。
#   槽位：{count} {pairs} {spectra} {methods}
# answers：对“想看吗”“有帮助吗”的回答，去掉空格和句末标点后整句比对。
version: 1
prompts:
  rating: "此刻的心情，0 到 10 你会打几分？（0 是很糟，10 是很好；直接回车跳过）"
  offer: "这周的小结写好了，想看看吗？（想看就回「好」，直接回车跳过）"
  helpful: "这份小结对你有帮助吗？（回「有」或「没有」，直接回车跳过）"
replies:
  rating_saved: "好，记下了。"
  # 回答“有帮助吗”之后的一句（有 / 没有 / 跳过或没认出）。
  helpful_yes: "谢谢你告诉我，能帮上一点就好。"
  helpful_no: "谢谢你说实话，没帮上也没关系。"
  helpful_skipped: "好。想再看的时候，输入 olivia journal 就好。"
  offer_declined: "好。想看的时候，输入 olivia journal 就能看到。"
  empty: "这一周还没有聊天的记录，所以还没有小结。想聊的时候，输入 olivia chat 就好。"
  unavailable: "这台电脑上暂时没办法把记忆加密保存，所以没有可以整理的小结。"
  not_onboarded: "还没有完成第一次设置。先运行 olivia chat 吧。"
  adults_only: "这里的陪伴只为成年人设计，所以没有小结。"
card:
  heading: "## 这一周的小结"
  intro: "这一周聊过的点滴，都整理在这里了。"
  intro_solemn: "这一周里有过很难熬的时刻。下面是这几天的记录，慢慢看就好。"
  sessions: "- 聊天：{count} 次"
  ratings: "- 心情分（开始 → 结束）：{pairs}"
  no_ratings: "- 这一周没有打心情分，也没关系。"
  rating_missing: "没打"
  rose: "- 有 {count} 次聊完以后，心情分比开始时高。"
  spectra: "- 常聊到的：{spectra}"
  methods: "- 试过的小练习：{methods}"
  no_methods: "- 这一周没有试小练习。"
  notes: "- 你让我记住的话：{count} 条，原话都留在记忆账本里。"
  closing: "下一周也慢慢来，累了就停下来歇一歇。"
  closing_solemn: "如果那种很难熬的感觉又回来，求助电话一直都在，输入 olivia resources 就能看到。你不用一个人扛着。"
  joiner: "、"
  arrow: " → "
answers:
  agree: [好, 好的, 好呀, 好啊, 嗯, 嗯嗯, 想, 想看, 要, 可以, 看, 看看, 行, 有, 有帮助, 有的, 是, 是的, y, "yes", ok]
  decline: [不, 不用, 不要, 不想, 不看, 不了, 先不了, 算了, 下次, 没有, 没, 没什么, 帮助不大, n, "no"]
