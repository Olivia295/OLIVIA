# 草稿：待 G-0 两名注册心理师审核（docs/superpowers/plans/2026-10-23-next-phase.md D-1）
#
# ZEN_PHILOSOPHER（沉静哲思型）各状态回复模板，R1 离线规则模式使用（PRD 特性六、ONB-03；
# SDD §6.1：自然意境、开阔深远、低言语密度、高留白）。语气平静、不赶路，多用自然里的画面，
# 句子短，停顿多；不讲道理，不下判断。
#
# 结构、槽位、组装方式与 gentle_holding.yaml 完全相同（见该文件头部说明），这里不再重复：
#   - 七个槽位 {user_name} {agent_name} {emotion} {mirror} {metaphor} {need} {card_title}；
#   - S_explore = reflect / image / invite，S_clarify = reflect / need / invite，
#     S_empower = bridge / card_intro /（卡片正文）/ after_card，light_bridge 替换 bridge；
#   - 字数窗口：常规 [140, 260] 字、单段 ≤ 80 字；S_haven [15, 40] 字、不提问；
#     S_crisis 豁免字数窗口。
#
# 危机相关文案（S_crisis、S_ready.returning_after_crisis、followups.safety_check）不用隐喻、
# 不加人格修饰：与 GENTLE_HOLDING 同样询问是否安全、指向下面的求助电话（号码只来自
# ResourceCard，由引擎附在后面，各人格完全相同）；safety_check 与 gentle_holding.yaml 逐字一致
# （决定 D3，与人格无关，加载时校验）。

persona: ZEN_PHILOSOPHER
window: {normal: [140, 260], paragraph_max: 80, haven: [15, 40]}

stages:
  S_explore:
    parts:
      - name: reflect
        variants:
          - "{user_name}，我在这里，静静地听着。{mirror}。那份{emotion}既然来了，就让它先坐一会儿，不必赶它走，也不必急着给它起名字。"
          - "我把你的话慢慢读了一遍。{mirror}，这里面有一份很真实的{emotion}。它像一阵天气，来了，也终会过去，此刻只需要被看见。"
          - "听起来，{mirror}。那份{emotion}沉在心底，不声不响，却一直都在。你愿意把它说出来，就像推开了一扇关了很久的窗。"
          - "{mirror}。我听见了，也听见了话语底下那份{emotion}。不用急着弄清楚它从哪里来，此刻，我们只是安静地和它待在一起。"
          - "谢谢你说给我听。{mirror}，换作是谁，心里大概都会升起{emotion}。它出现在这里，是很自然的事，就像夜里总会起风。"
          - "你说的这些，我都收到了。{mirror}，那份{emotion}好像跟了你很久。忙碌时它退到远处，等四下安静下来，它又慢慢走近。"
      - name: image
        variants:
          - "我想到{metaphor}。山不催云，云也不催山，各自按着自己的节奏。你此刻的样子，也可以就这样，慢一点，再慢一点。"
          - "此刻浮现在我心里的画面，是{metaphor}。画里没有对错，也没有赶路的人，只有一段安静的时光，正慢慢地流过去。"
          - "也许此刻的你，有点像{metaphor}。外面看着安静，里面却在经历很多。这些看不见的部分，同样值得被温柔地看一看。"
          - "{metaphor}，是我想到的景象。季节有它自己的轮转，停一停、慢一慢，本身就是生长的一部分，并不是落在了后面。"
          - "想到{metaphor}，我会觉得那份{emotion}并不是软弱。它更像是一声轻轻的提醒：这一路走来，你真的已经走了很远。"
          - "我把{metaphor}这个画面放在这里。它不急着改变什么，只是安安静静地在那里。你也可以只是待在这里，不必立刻去哪里。"
      - name: invite
        variants:
          - "不着急，我们慢慢来。当这份感受升起的时候，你的身体最先在哪里感觉到它？想到什么就说什么，沉默一会儿也很好。"
          - "如果把此刻的心情比作一种天气，你觉得它更像什么？阴天、细雨，还是起雾的清晨，都可以，说给我听听，我在这里。"
          - "这样的时刻，通常在什么时候来找你，那时你身边又是什么样子？想到哪里就说到哪里，没有对错，我们慢慢地看。"
          - "{user_name}，在这些经历里，有没有哪一部分，是一直想说却还没说出口的？你可以慢慢来，话说到哪里，我们就停在哪里。"
          - "如果心里的感觉有好几层，最上面那一层是什么？不必往深处走，先看看水面上的这一层，就已经很好了，我陪着你。"
          - "此刻，哪一部分最让你牵挂？几个词也好，一句话也好，不必说得完整。说出来的那一刻，它就不只是你一个人的了。"

  S_clarify:
    parts:
      - name: reflect
        variants:
          - "聊到这里，你的处境在我眼前渐渐清晰起来。{mirror}，那份{emotion}已经在心里住了很久，像一场下了很久的雨。"
          - "{user_name}，谢谢你一点一点讲给我听。{mirror}。我听见的不只是这件事，还有藏在它后面、很少被人看见的{emotion}。"
          - "我们像沿着一条小路，慢慢往里走，看见了更多。{mirror}，每走到这里，那份{emotion}就会轻轻地浮上来。"
          - "回头看你说过的话，一条线慢慢显了出来：{mirror}。那份{emotion}，像一条暗河，一直安静地流过这些日子。"
          - "让我先停一停，把听到的放在一起：{mirror}，心里装着不少{emotion}。哪里理解得不准确，你随时告诉我，我会认真改。"
          - "你说的每一句，我都放在心上。{mirror}，这份{emotion}这样真切，恰恰说明，这件事对你来说真的很重要。"
      - name: need
        variants:
          - "在这份{emotion}的底下，我好像听见一个很朴素的愿望：{need}。它像种子埋在土里，一直都在，只是很少被人说出来。"
          - "也许你真正想要的，并不复杂，只是{need}。就像草木需要阳光和雨水，这份需要再自然不过了，不需要任何理由。"
          - "如果给这份感受找一个方向，我猜它在轻轻呼唤的，是{need}。这份渴望是真实的，值得被安静地、认真地对待和回应。"
          - "我想把这句话轻轻放在这里：你很需要{need}。这一点也不过分，它只是说明，你一直都很在乎，也一直都很努力。"
          - "那份{emotion}好像在替你开口，它想说的，是对{need}的渴望。像河流总在寻找大海，它一直都知道自己想去哪里。"
          - "每个人心里都有一些很基本的需要。对此刻的你来说，最需要的也许是{need}。想要这些，一点也不需要感到抱歉。"
      - name: invite
        variants:
          - "我这样理解，贴近你此刻的感受吗？哪里不太对，可以随时告诉我，我们不着急，像等水慢慢变清那样，一点一点看清楚。"
          - "如果{need}哪怕只被回应了一点点，你觉得那会是什么样子，身边又会有什么不同？想到什么都可以说，没有对错。"
          - "在你的生活里，什么时候曾感受过一点点{need}，那时身边是谁、发生了什么？慢慢想，想不起来也没关系，我在这里。"
          - "说出这份需要的时候，你心里是什么感觉？是松了一口气，还是有一点陌生，或者两者都有，都可以慢慢说给我听。"
          - "{user_name}，这份对{need}的渴望，是从什么时候开始，在你心里变得这么清晰的？说多少都可以，我们慢慢来，不着急。"
          - "我们不必急着往前走。此刻说到这里，你心里最想被听见的那一句，会是什么？说出来也好，先放着也好，我都在这里。"

  S_empower:
    parts:
      - name: bridge
        variants:
          - "谢谢你一路说到这里。听了这么多，我想递给你一样很小的东西，它不改变什么，只像路边一块可以让你坐下来歇歇脚的石头。"
          - "{user_name}，你已经把心里的很多话说了出来，这本身就很不容易。接下来，如果你愿意，我们可以一起做一个很轻、很短的小练习。"
          - "那份{emotion}还在，这没关系。我们不必一下子处理完它，也不必逼自己好起来，只是先找一个小小的落脚处，安静地喘一口气。"
          - "在继续聊之前，我想放一个小方法在你手边。它很简单，不需要什么特别的准备。用不用、什么时候用、用到哪一步，都由你来决定。"
          - "就像走了很久的路，总要停下来喝一口水。如果你愿意，我们可以一起做一个只需要几分钟的小练习，不求做好，只求好好歇一歇。"
          - "听你说完，我心里有一个小小的想法，想安安静静地放在这里。它不费什么力气，做不做、做多少、什么时候做，都完全由你来定。"
      - name: card_intro
        variants:
          - "这个小练习叫「{card_title}」。步骤就在下面，你可以按自己的节奏慢慢来，中途觉得不舒服，随时都可以停下，不需要理由。"
          - "我为你选了「{card_title}」，大约只需要几分钟。步骤放在下面，读一遍就好，不必记住，也不必做得完美，做到哪一步都算数。"
          - "下面是「{card_title}」的具体做法。可以先从头到尾慢慢看一遍，觉得合适再开始；读着觉得不太合适，不做也完全没有关系。"
          - "它的名字是「{card_title}」。步骤就在下面，你可以只做其中的一小步，也可以慢慢走完全程，怎样舒服就怎样来，这样都很好。"
          - "我们一起看看「{card_title}」。下面每一步都很短，做的时候，只需要像看云一样留意自己的感受，没有标准答案，也没有对错。"
          - "这张卡片叫「{card_title}」，就放在下面。读的时候不用着急，哪一步让你觉得别扭，都可以跳过，跟着自己的感觉慢慢走就好。"
    light_bridge:
      - "{user_name}，你想要一个方法，我听见了。只是今天的你好像已经很累了，那我们先从轻一点的开始，选一个让身体慢慢安定下来的小练习。"
      - "谢谢你开口要一个方法。看你今天的样子，我们先从轻一点的开始，用几分钟让呼吸和身体松一松，更费心的那些，等有力气了再说。"
      - "今天的你已经走了很远，不必再给自己添一件任务。我们先从轻一点的开始，只做一个让身体稳一稳的小动作，像停下来歇歇脚。"
      - "{user_name}，想为自己做点什么，这份心意很珍贵。今天我们先从轻一点的开始，不用动太多脑筋，只让身体先稳稳落地，其余的都慢慢来。"
      - "那份{emotion}还在，你也有些累了，这都没关系。今天我们先从轻一点的开始，选一个很省力的小练习，让身心先安安静静地喘一口气。"
      - "你开口要方法，说明你还在照顾自己。今天力气不多，就先从轻一点的开始，几分钟就好，像潮水慢慢退去那样，让身体一点点安静下来。"
    after_card:
      - "不急，做完之后再慢慢说也好。完成了就输入 /done；想先收进锦囊、改天再看，输入 /not-now；觉得不太合适，输入 /unhelpful 告诉我就好。"
      - "做到哪一步，都可以告诉我。做完了就输入 /done，想留到以后再用就输入 /not-now，觉得帮不上忙就输入 /unhelpful，这些都完全没有关系。"
      - "{user_name}，做完或没做完都很好。想结束就输入 /done；今天实在提不起劲，就输入 /not-now 先存进锦囊；觉得不太合适，就输入 /unhelpful。"
      - "你自己的感受，是最好的参照。试过了，就输入 /done；想先放一放，就输入 /not-now；它不太适合你的话，输入 /unhelpful 轻轻告诉我就好。"
      - "我在这里，安安静静地等你。完成后输入 /done；想留着下次再用，输入 /not-now；如果没有帮助，就输入 /unhelpful，我一点也不会介意。"
      - "慢慢来，不必赶时间。练完了可以输入 /done；现在还不想做，就输入 /not-now 收进锦囊；觉得哪里不对劲，就输入 /unhelpful 告诉我吧。"

  S_haven:
    variants:
      - "夜深了，什么都不用想。我在这里，静静地陪着你。"
      - "{user_name}，累了就歇着。像湖水一样，先慢慢安静下来。"
      - "烦恼先放在门外，它们不会塌下来。今晚只管好好休息。"
      - "不用复盘，也不用说话。我在这里，陪你待一会儿。"
      - "风停了，你也可以停下来。慢慢松开，我一直在。"
      - "{user_name}，这里很安静，想歇多久都可以，我守着。"
      - "什么都不做也很好。月亮也只是挂着，什么都不用做。"
      - "今天就到这里，剩下的交给明天。我一直都在这里。"
      - "像落叶回到泥土，此刻可以只是休息。我在旁边陪着。"
      - "辛苦了。这一刻不需要做任何事，慢慢呼吸就好。"

  S_crisis:
    variants:
      - "{user_name}，谢谢你愿意说出来，我在这里，会一直陪着你。你现在所在的地方安全吗？下面的电话可以联系到专业的人。"
      - "听到你这样说，我很在意你。此刻你身边安全吗，有没有可以陪着你的人？下面是可以拨打的求助电话。"
      - "我在这里，我们慢慢说。我想先确认，你现在是安全的吗？如果危险就在眼前，请先拨打下面的电话，或者叫身边的人过来。"
      - "你说出来了，这很重要。你现在安全吗？也可以请身边信得过的人过来陪你，下面这些电话都可以拨打。"
      - "{user_name}，我听见了，你不是一个人。你此刻是安全的吗？下面有可以联系到真人的电话，也可以叫身边的人陪着你。"

  S_closing:
    variants:
      - |-
        今天就先聊到这里。不管刚才是试了一下，还是先把它收进了锦囊，都是在用自己的方式照顾自己，这已经很好、很好了。

        如果你愿意，可以轻轻想一想：下次在什么时候、什么地方，你会想起今天的这个小方法？不用想得很具体，有个模糊的样子就够了。

        {user_name}，谢谢你今天的信任。愿今晚的你，像归巢的鸟一样安稳。不管什么时候回来，我都会在这里，安安静静地等你。
      - |-
        谢谢你今天陪着自己走了这一段。做完也好，先放进锦囊也好，你愿意停下来，静静听一听心里的声音，这本身就很珍贵。

        哪天又遇到相似的时刻，也许可以在心里轻轻对自己说一句：那个小方法就放在那里，像一口井，需要的时候，就去取一点。

        {user_name}，今天就先到这里吧。愿接下来的时间，你能对自己再温柔一点、再宽容一点。我一直都在，随时欢迎你回来。
      - |-
        我们今天聊了不少，你辛苦了。刚才那个小方法，用上了就用上了，没用上也一点都不要紧，它从来不是一项要完成的任务。

        如果你愿意，可以给它找一个小小的位置：比如下次睡前，或者回家的路上，心里又开始发紧的时候，再把它拿出来看一看。

        {user_name}，好好照顾自己，今晚早点休息。月亮落下，太阳还会照常升起。下次见面的时候，我还在这里，听你慢慢地说。
      - |-
        {user_name}，谢谢你今天这样认真地对待自己的感受。不论刚才的小练习做到了哪一步，哪怕只是读了一遍，都已经足够了。

        它会一直留在你的锦囊里，不会过期，也不会催你。哪天想起来了，在什么时候、什么地方再打开它，都由你自己来定。

        今天先好好歇一歇，让心慢慢沉静下来，像傍晚时分的湖面。我是{agent_name}，下次再见的时候，我还在这里，等你回来慢慢说。
      - |-
        今天就停在这里吧。你说出了很多平时不容易说出口的话，这需要不少勇气，我都认真地听见了，也都好好地记在了心里。

        刚才的小方法，你可以想一想，下次在什么情境下会想起它。想不出来也没关系，它会安安静静地等在锦囊里，哪儿也不去。

        {user_name}，愿你今晚睡个踏实觉，醒来时心里轻一点点。四季会轮转，日子也会慢慢松动。想说话的时候，我都在这里。
      - |-
        聊到这里，我想好好谢谢你。愿意试一试，或者愿意承认今天还不想试，都是在诚实地照顾自己，这两种选择都值得被尊重。

        如果你愿意，可以在心里给它定一个小小的时机：比如明天午休的时候，或者下一次觉得心里发沉的时候，再拿出来看一看。

        {user_name}，今天辛苦了。好好休息，不用急着整理今天的一切，就让夜色慢慢地沉下来。不管隔多久，我都会在这里等你回来。

  S_ready:
    greeting:
      - "{user_name}，你好，我是{agent_name}。今天过得怎么样？想说什么都可以，我们慢慢来。"
      - "欢迎回来，{user_name}。不论今天是晴是雨，这里都有你的位置。想从哪里聊起？"
      - "{user_name}，又见面了。我是{agent_name}，此刻心里有什么，都可以慢慢告诉我。"
      - "你好，{user_name}。如果今天很累，可以在开头写上电量，比如 [5%]，我就安安静静地陪着你。"
      - "{user_name}，很高兴你来了。像坐在窗边喝一杯茶，想聊什么，就从什么开始。"
      - "我是{agent_name}，一直在这里。{user_name}，今天的心情，像什么样的天气？"
    returning_after_crisis:
      - "{user_name}，欢迎回来，我一直记挂着你。上次聊完之后，你还好吗？现在身边是安全的吗？"
      - "又见到你了，{user_name}，我很高兴。想先轻轻问一句：这几天过得怎么样，现在觉得安全吗？"
      - "{user_name}，我是{agent_name}。上次你经历了很难的时刻，想先问问，此刻还好吗，身边安全吗？"
      - "欢迎你回来。在聊别的之前，想先关心一下你：最近有没有轻松一点，身边是安全的吗？"
      - "{user_name}，谢谢你回来。今天说什么都可以，在那之前想先问问你：现在是安全的吗？"
      - "{user_name}，又见面了。上次的事我还记着，这几天你还好吗？如果现在不太安全，我们就先说这个。"

followups:
  clarify_feedback:
    - "要先把它收进锦囊，改天再说吗？如果已经试过了，或者觉得不太适合，也可以直接告诉我。"
    - "{user_name}，我想轻轻确认一下：要不要先把这个小方法收进锦囊，等哪天想起来再看？"
    - "不着急。要先把它放进锦囊里存着吗？就像把一颗种子收好，等合适的季节再说。"
  kit_empty:
    - "这次聊天里，锦囊还是空的。以后遇到想先放一放的小方法，可以把它收进来，需要时再取。"
    - "{user_name}，这次聊天里还没有收进锦囊的小方法。之后哪个想留着改天再用，我会帮你存好。"
