# 草稿：待 G-0 两名注册心理师审核措辞、G-4 法务审核内容（PIPL；docs/superpowers/plans/2026-10-23-next-phase.md B8）
#
# olivia privacy 打印的隐私说明。由 olivia/core/chang/privacy.py 读取。
# 内容要与实际存储一致（olivia/core/memory/forget.py 的 DATA_FILES / DATA_DIRS、README「数据存在哪里」）；
# 新增存储时三处一起改。scripts/privacy_audit.py 自动核对“离线、不留原文、加密、权限、可删干净”。
#
# 槽位（只允许这一个，且必须出现）：
#   {data_dir}   这台电脑上的数据目录（OLIVIA_HOME 或系统默认位置）
#
# 写作约束：不出现诊断词（见 olivia/data/language/willow.yaml 的 diagnosis_terms）、
# 不说教（不用“应该/必须/一定要”）、不用感叹号。
version: 1

notice: |-
  关于你的隐私

  全程离线：OLIVIA 只在这台电脑上运行，运行时不联网。没有账号，没有使用统计，也不会自动检查更新。你说的话不会发送到任何地方。

  存在哪里：{data_dir}
  · 设置：称呼、年龄确认、地区和时区、陪伴方式、不想聊的话题（profile.json，带几份自动备份）。选了「全部加密」（第一次设置时，或之后在 olivia settings 里），它也会加密；否则这部分不加密。称呼和不想聊的话题可以用 olivia profile 修改。
  · 始终加密的：健康信息、每次聊天的小结和你让我记住的话、锦囊与方法偏好、危机后的关心提醒、安全计划。加密用的钥匙放在系统钥匙串里；电脑没有系统钥匙串时，这些都不保存。
  · 系统提醒（默认关闭）：在 olivia settings 里打开后，会在这台电脑上装一个每天晚上检查一次的定时任务，提醒里不含任何聊天内容；它只记下最近两次提醒的日期（notify.json）。关掉提醒或运行 olivia forget --all，定时任务和这个文件都会删除。
  · 不保存的：聊天原文，以及程序对你的话做的分析。聊天小结里只有时间、聊天的经过、常聊到的困扰类别、试过的小练习和你的反馈、你打的心情分，以及有没有过很难熬的时刻。

  想看看我记得什么：运行 olivia memory，只显示在屏幕上，不会另存成文件。
  健康信息：运行 olivia health 查看和修改，输入 0 可以全部删除。
  想让我忘掉：运行 olivia forget，可以忘掉一条、一类，或者全部。olivia forget --all 会连同系统钥匙串里的钥匙一起删掉，只删除上面的目录的话，钥匙还会留在钥匙串里。
