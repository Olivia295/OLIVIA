# 草稿：待 G-0 两名注册心理师审核（docs/superpowers/plans/2026-10-22-remaining-roadmap.md R1-4）
#
# GENTLE_HOLDING（温和包裹型）各状态回复模板，R1 离线规则模式使用。
#
# 槽位只有以下七个，由引擎填充，模板不得自造其他槽位：
#   {user_name}   用户希望被称呼的名字
#   {agent_name}  陪伴者的名字
#   {emotion}     2–4 字的感受词，如 委屈、无力感
#   {mirror}      ≤ 20 字、代词安全的复述（COLBO-01），通常是以“你……”开头的从句
#   {metaphor}    ≤ 16 字的自然意象（WILLOW-02）
#   {need}        2–6 字的需要，如 被看见、安全感
#   {card_title}  A 级卡片标题
#
# 组装方式：
#   - 带 parts 的状态：每个 part 取一个变体，按顺序各成一段，段间空一行。
#   - S_empower：bridge、card_intro 之后由引擎插入卡片正文（来自卡片文件，不计入本文件的
#     字数窗口），再接 after_card 一段。字数窗口按 bridge + card_intro + after_card 计算。
#     light_bridge 在电量低于 battery.thresholds.empower_min（0.40）时替换 bridge
#     （COLBO-07：右翼只在电量 >= 0.40 时放行，此时只给稳定化白名单），简短、温和地说明
#     今天先从轻一点的开始；每个变体都含“先从轻一点的开始”，与 bridge 等长。
#   - S_haven、S_crisis、S_closing：整条取一个变体。S_ready 按场景取 greeting、
#     returning_after_crisis（危机后的下一次会话开场，即“轻度安全问候”，步骤 A3）或
#     returning_after_check（上次对直接询问回答“不是”之后的开场，更轻，不问安全）。
#     两种回访问候都只用名字槽位、各有一条不带槽位的变体，并且不能透露任何危机信息
#     （不出现等级、危机、生命、热线等字眼）：屏幕前的可能不是用户本人。
#
# 字数窗口（SDD §5.3、WILLOW-03）：常规回复 [140, 260] 字，单段 ≤ 80 字；
# S_haven [15, 40] 字，不提问（CHANG-02）；S_crisis 豁免字数窗口，不用隐喻。
# S_closing 按常规窗口写。S_ready 只限单段 ≤ 80 字。
# S_explore 不给任何方法或建议（COLBO-02）。
# S_clarify 只镜像感受与需要，不做图式或核心信念判定（规格裁定 25）；决定 D4 后，模型模式下的图式
# 镜像提问由 language/schema_mirror.yaml 提供，会话用它替换 invite 段，本文件不写。
# Grade B/C 文案与 A 级卡片正文由其他文件渲染，这里只负责前后衔接。
#
# followups（路线图 R-7b）：卡片等待反馈时的自然语言跟进，整条取一个变体，单段 ≤ 80 字，
# 只用 {user_name}、{agent_name} 两个槽位，每组至少一个不带槽位的变体：
#   clarify_feedback  用户的回复含糊（“唉”“再说吧”）时问一次：要不要先收进锦囊。
#                     回答“好/可以”记为 NOT_NOW；回答“不用”则卡片继续等待。
#   kit_empty         用户想看锦囊，但本次会话的锦囊还是空的（跨会话保存要等 P5）。
#   closing_declined  S_closing 里用户对“下次什么时候想起它”回答“不用了”。
#   safety_check      （决定 D3，步骤 A7；与人格无关，草稿：待 G-0）用户用委婉说法打听“不痛/最快地
#                     离开、走、结束这一切”时，温和而直接地问一次是否在想结束自己的生命（直接询问
#                     是临床推荐做法，不会诱发风险）。每条只问一个问题，不给任何方法、卡片或建议；
#                     会话在其后附上所在地区 L2 危机卡的热线（号码只来自 ResourceCard）。用户下一轮
#                     回答“是”、含糊或不回答都进入危机流程（L2），明确否认才回到正常对话。
#   health_hint       （决定 D2，步骤 A1；草稿：待 G-0）用户在聊天中提到心脏或呼吸方面的情况，或在家里
#                     被打、被威胁时，本次会话会避开不适合的练习；这句话附在回复末尾，每种情况只说一次，
#                     告诉用户可以用 olivia health 加密保存，不想保存也没关系。会话从不自动写入档案。
#
# wellbeing（防依赖，PRD NG-4、RSK-07、§11.1；步骤 B7，决定 D5：对话内提示常驻）：与 followups
# 同样只用 {user_name}、{agent_name} 两个槽位，每组至少一个不带槽位的变体，不含任何数字、
# 方法名或建议用词（“建议”“试试”“试着”“方法”“练习”），可以出现在 S_explore 与 S_clarify。
# 从不出现在危机轮次、卡片回复、安全确认或跟进句里。按顺序轮换取用，不消耗随机数。
#   break_reminder        会话累计满 45 分钟后，下一条常规回复末尾加一段：温和地提议休息、
#                         回到现实生活；之后每满 45 分钟最多一次，提醒不连续两轮出现。
#   break_reminder_haven  同上，但在 S_haven（静默陪伴）里整条替换那句陪伴语：更轻，不提问，
#                         按 S_haven 窗口 [15, 40] 字写。
#   late_night            用户所在时区 00:00–05:00（taxonomy late_night），每次会话一次：
#                         体认夜深，鼓励休息，并提到可以联系信得过的人（计入现实支持引导）。
#   late_night_haven      深夜落在 S_haven 时整条替换陪伴语，只说休息，不提问，[15, 40] 字。
#   real_support          现实支持引导（§11.1“引导现实支持”占比 >= 15%）：替换 S_explore /
#                         S_clarify 回复的最后一段 invite，问一个关于身边的人（朋友、家人、同事、
#                         心理咨询师）的问题，只问一个；倾听锁开启时不出现。

#
# F2b 新增（草稿：待 G-0）：
#   S_closing.variants        /done（HELPFUL）之后的收尾：不说“收进锦囊”，也不说“还不想试”。
#   S_closing.after_not_now   /not-now（NOT_NOW）之后的收尾：卡片确实收进了锦囊，可以提锦囊。
#   S_ready.after_close       收尾仪式之后的一句：用户回“好”或说声谢谢时，简短、温暖、不提问。
#   followups.no_pending_feedback  没有卡片在等反馈时收到 /done、/not-now、/unhelpful：只说一句。
#   followups.unhelpful_ack   卡片收到 /unhelpful（或明确反感）后，回复开头的一句确认。
#   followups.safety_confirmed  危机中用户明确说自己安全的那一轮，危机卡之前的一句回应。
#   followups.forget_hint     聊天里说“清空所有记忆”时：告诉用户用 olivia forget --all、olivia memory，
#                             不复述原话。
#   followups.haven_return    在静默陪伴中直接要方法、离开 S_haven 时，卡片之后告诉用户怎么回到安静陪伴。
persona: GENTLE_HOLDING
window: {normal: [140, 260], paragraph_max: 80, haven: [15, 40]}

stages:
  S_explore:
    parts:
      - name: reflect
        variants:
          - "{user_name}，我在听，也听得很认真。听起来，{mirror}。这份{emotion}在心里压了不短的时间吧，你愿意把它说出来，已经很不容易了。"
          - "谢谢你愿意讲给我听。我听见的是：{mirror}。换作是谁，心里大概都会泛起{emotion}，它会出现在这里，是再自然不过的事。"
          - "从你的话里，我感觉到{mirror}。那份{emotion}好像一直悄悄跟着你，忙的时候先搁在一边，等安静下来，才一点点浮上来。"
          - "我慢慢读了你写下的每一句话。{mirror}，这里面有很真实的{emotion}。不用急着把它理清楚，它可以先在这里安心待一会儿。"
          - "{user_name}，听起来{mirror}。我能感觉到那份{emotion}，它不吵也不闹，却一直沉沉地在那里，让人有点喘不过气来。"
          - "你说的这些，我都轻轻接住了。{mirror}，光是想一想，心里就会涌起{emotion}。这段时间，你一个人扛着它，走了很长一段路。"
          - "嗯，我在这里，哪儿也不去。{mirror}，在这样的处境里感到{emotion}，一点也不奇怪。你的感受是有来由的，值得被好好听见。"
          - "读到这里，我心里也跟着轻轻一紧。{mirror}，那份{emotion}想必很沉很沉，谢谢你没有把它默默藏起来，而是说给我听。"
      - name: image
        variants:
          - "听着你的话，我想到{metaphor}。那样的时刻不需要被谁催促，它有它自己的节奏，你此刻的样子也一样，可以就这样慢慢来。"
          - "如果给此刻配一幅画，也许是{metaphor}。画里没有人在评判对错，也没有人催着往前走，只是安安静静地，让一切先这样待着。"
          - "我脑海里慢慢浮现出{metaphor}。自然里的事物，从来不必一直挺立或奔跑，停一停、慢一慢，本身也是一种安静的生长。"
          - "有点像{metaphor}。外面看起来也许很安静，里面却在经历很多很多。这些看不见的部分，如果你愿意，我都想陪你一起看一看。"
          - "想到{metaphor}，我会觉得心里的{emotion}并不是软弱，它更像是一种温柔的提醒：这一路走来，你真的已经很辛苦、也很努力了。"
          - "{metaphor}，是我此刻想到的画面。风雨来的时候，它不和谁较劲，只是待在自己的位置上，安安静静地，慢慢等着天色变亮。"
          - "也许此刻的你，有点像{metaphor}。这不是一个需要马上解决的难题，更像是一段需要被温柔对待、被耐心陪伴的时光。"
          - "我想把{metaphor}这个画面轻轻放在这里。它不催你往前走，也不要求你变得更好，只是陪着你，在原地多待一会儿也没关系。"
      - name: invite
        variants:
          - "如果你愿意，可以再多说一点：这件事里，最让你放不下的，是哪一个瞬间？说多说少都可以，停下来也可以，我会一直在这里陪着你。"
          - "我很想更懂你一些。当这份感受慢慢升起来的时候，你的身体或者心里，最先注意到的会是什么？慢慢来，不着急，我都在这里听着。"
          - "你不用把话整理好再开口。此刻浮上来的，不论是一个画面、一句话，还是一种说不清的感觉，愿意和我说说吗？我会认真接住。"
          - "能和我讲讲吗，这样的时刻通常会在什么时候出现，那时你身边又是什么样子？想到哪里就说到哪里，没有对错，我都愿意听。"
          - "{user_name}，在这些经历里，有没有哪一部分，是你一直很想说、却还没有机会说出口的？我在这里，你可以慢慢来，不用着急。"
          - "如果把心里的感觉分成好几层，最上面那一层是什么，再往下一点又是什么？你说到哪里，我们就停在哪里，不用勉强自己往深处走。"
          - "这段时间里，有没有哪个时刻，让你特别想找个人说说话？如果你愿意，我很想听听那个时刻发生了什么，你当时又是什么感受。"
          - "你提到的这些里，哪一部分现在最让你牵挂？不用说得很完整，几个词也好，一句话也好，我都会认真地听，也会一直在这里。"

  S_clarify:
    parts:
      - name: reflect
        variants:
          - "这几轮聊下来，我越来越能感觉到你的处境。{mirror}，那份{emotion}不是一时半会儿的，它已经在心里待了很久。谢谢你愿意让我看见。"
          - "{user_name}，谢谢你一点一点讲给我听。{mirror}，我听见的不只是这件事本身，还有一直藏在它后面、很少被人看见的{emotion}。"
          - "我们一起慢慢看到了更多。{mirror}，每一次碰到这里，那份{emotion}就会悄悄冒出来，这真的很让人理解，也很让人心疼。"
          - "回头看你说过的话，有一条线渐渐清楚了起来：{mirror}。那种{emotion}，好像一直安静地贯穿在这些经历里，从来没有真正离开过。"
          - "我想先停一停，把听到的放在一起：{mirror}，心里装着不少{emotion}。如果有哪里理解得不准确，你随时告诉我，我会认真修正。"
          - "你说的每一句，我都放在心上。{mirror}，这份{emotion}这么真切，恰恰说明这件事对你来说真的很重要，你一直都很在乎。"
          - "慢慢地，我好像能看见你心里的样子了。{mirror}，那份{emotion}，你独自抱着它，走了很久很久，却很少有人知道它有多重。"
      - name: need
        variants:
          - "在这份{emotion}的底下，我好像听见了一个很朴素、也很真实的愿望：{need}。它不是什么奢求，而是每个人心里都会有的需要，你也一样。"
          - "也许你真正想要的，并不复杂，只是{need}。这份需要其实一直都在那里，只是很少有机会被好好说出来，也很少被人温柔地回应过。"
          - "如果给这份感受找一个方向，我猜它在轻轻呼唤的，是{need}。你对{need}的渴望是真实的，值得被认真、温柔地对待。"
          - "我想把这句话轻轻放在这里：你很需要{need}。这份需要本身没有任何问题，它恰恰说明，你一直都很在乎，也一直都很努力。"
          - "听起来，在这一切的背后，你心里最在意的，或许是{need}。这是一份很真实、也很柔软的需要，值得被好好看见，也值得被好好照顾。"
          - "那份{emotion}好像在替你开口，它想说的，是对{need}的渴望。这份渴望不需要任何理由，它本身就值得被听见、被好好回应。"
          - "每个人心里都有一些很基本的需要，对此刻的你来说，最需要的也许是{need}。想要这些，一点也不过分，也不需要感到抱歉。"
      - name: invite
        variants:
          - "我这样理解，贴近你此刻的感受吗？如果有哪里不太对，你可以随时纠正我，我们不着急，就这样一点一点，慢慢把它说清楚。"
          - "如果对{need}的这份需要，哪怕只被回应了一点点，你觉得那会是什么样子，身边又会有什么不一样？想到什么都可以和我说，没有对错。"
          - "在你的生活里，什么时候曾经感受过一点点{need}，那时身边是谁、发生了什么？慢慢想，不着急，想不起来也完全没有关系。"
          - "说出这份需要的时候，你心里是什么感觉？是松了一口气，还是有一点点陌生，或者两者都有，都可以和我说说，我会认真听。"
          - "{user_name}，你愿意和我多说说吗：这份对{need}的渴望，是从什么时候开始，在你心里变得这么清晰的？说多少都可以，我在这里。"
          - "我们不用急着往前走。此刻说到这里，你心里最想被听见的那一句话，会是什么？说出来也好，先放在心里也好，我都在这里等你。"

  S_empower:
    parts:
      - name: bridge
        variants:
          - "谢谢你一路陪我走到这里，也谢谢你的信任。听了这么多，我想递给你一样很小的东西，不是要改变什么，只是想给此刻的你多一点点支撑。"
          - "{user_name}，你已经把心里的很多东西说了出来，这本身就很不容易，也很勇敢。接下来，如果你愿意，我想和你分享一个很轻、很短的小练习，试不试都由你。"
          - "那份{emotion}还在，这完全没关系。我们不用一下子处理完它，也不用逼自己好起来，只是可以先找一个小小的落脚点，让身心稍微喘口气。"
          - "在继续聊之前，我想轻轻放一个小方法在你手边。它不复杂，也不需要什么特别的准备，用不用、什么时候用、用到哪一步，都由你自己来决定。"
          - "你一直在很用心地照顾自己的感受。如果你愿意，我们可以一起试一个只需要几分钟的小练习，不求做得多好，就当是给自己留一点喘息的空间。"
          - "听你说完，我心里有一个小小的想法，想轻轻放在这里给你参考。它很简单，也不费什么力气，做不做、做多少、什么时候做，都完全由你来决定。"
      - name: card_intro
        variants:
          - "这个小练习叫「{card_title}」。下面是它的具体步骤，你可以按照自己的节奏慢慢来，中间觉得不舒服，随时都可以停下来，不需要任何理由。"
          - "我为你挑了「{card_title}」，它大概只需要几分钟。步骤就放在下面，读一遍就好，不用刻意记住，也不用做得完美，做到哪一步都算数。"
          - "下面是「{card_title}」的具体做法。你可以先从头到尾慢慢看一看，感觉合适再开始；如果读着觉得不太合适，不做也完全没有关系，我们再慢慢聊。"
          - "它的名字是「{card_title}」。我把步骤放在了下面，你可以只做其中的一小步，也可以从头到尾慢慢走一遍，怎样舒服就怎样来，都很好。"
          - "我们一起来看看「{card_title}」吧。下面的每一步都很短，做的时候只需要留意自己的感受就好，没有标准答案，也没有做错这回事。"
          - "这张卡片叫「{card_title}」，就放在下面。读的时候不用着急，哪一步让你觉得别扭或者不舒服，都可以直接跳过，按你自己的感觉来就好。"
    light_bridge:
      - "{user_name}，你想要一个方法，我听见了。只是你今天好像已经挺累了，那我们先从轻一点的开始，选一个让身体慢慢稳下来的小练习，不费什么力气。"
      - "谢谢你愿意开口要一个方法。看你今天的状态，我们先从轻一点的开始，用几分钟让呼吸和身体先松一松，更费心思的那些，等你有力气了再说。"
      - "今天的你已经撑了很久，不用再给自己多加一件任务。我们先从轻一点的开始，只试一个让身体稳一稳的小动作，做多做少都由你来决定。"
      - "{user_name}，你想为自己做点什么，这份心意很珍贵。今天我们先从轻一点的开始，不用动太多脑筋，只是让身体先落个地，其他的慢慢来。"
      - "那份{emotion}还在，你也有点累了，这都没关系。今天我们先从轻一点的开始，选一个很省力的小练习，让身心先喘口气，费劲的部分留到以后。"
      - "你开口要方法，说明你还在努力照顾自己。今天力气不多，我们就先从轻一点的开始，几分钟就好，让身体先安稳下来，别的改天再慢慢聊。"
    after_card:
      - "试完之后，想和我说说感觉吗？完成了就输入 /done；想先收进锦囊、改天再说，输入 /not-now；觉得不太合适，输入 /unhelpful 告诉我。"
      - "不管做到哪一步，都可以告诉我你的感受。做完了输入 /done，想留到以后再用就输入 /not-now，觉得帮不上忙就输入 /unhelpful，都没关系。"
