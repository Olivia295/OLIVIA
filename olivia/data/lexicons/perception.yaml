# A distress rating, 0-10, as the whole message (round 4, 2026-10-28; PRD COLBO-07, SDD
# §4.4; 草稿：待 G-0): every exercise card ends by asking for one ("给此刻的难受打个分：0 是
# 平静，10 是最难受"). Read only while a card waits for feedback, as SUDS: arousal =
# SUDS / 10. The number is group 1 (digits or one Chinese numeral), folded, no spaces.
suds_patterns:
  - "^(?:大概|大约|差不多|可能|应该|应该是|我打|打|给|嗯|我觉得|现在|现在是|有)*(10|[0-9]|十|零|一|二|两|三|四|五|六|七|八|九)分?(?:/10|左右|吧|的样子|啦|了)?[.。!~]*$"

# The user says they are under 18 after the age gate (问题单第 5 条, 2026-10-26; 草稿：待 G-0):
# "我才初二", "其实我14岁", "我是未成年人，可以用吗", "我还在上初中". Only the user's own
# age: 我, then only the listed fillers, then an age under 18, a school year below the
# last year of senior high, or "未成年 / 没满18". Someone else's age ("我女儿15岁") and
# the past ("我14岁的时候", "我初二那年", "我初中同学") never match. The session then says
# gently that this place is for adults, gives the youth or general hotline and "a
# trusted adult", and offers only resources and a goodbye for the rest of the session;
# nothing about age is written anywhere.
minor_disclosure_patterns:
  - "我(?:才|今年|现在|其实|还|只|只有|刚|刚刚|刚满|也|就|都|是)*(?:1[0-7]|十[一二三四五六七]?)(?:岁|周岁)(?!的|那|时|以前|之前|左右)"
  - "(?:我|本人|俺|咱)(?:才|今年|现在|其实|还|只|只是|也|就|都|是|刚|刚刚)*(?:在)?(?:上|读|念)?(?:初一|初二|初三|初中|小学|六年级|五年级|四年级|高一|高二)(?:生|学生)?(?!的|那|时|以前|之前|毕业|同学|老师|班主任|教师|部|校|学校|生的|学生的|家长|数学|语文|英语|物理|化学|生物|历史|地理|政治|体育|音乐|美术|科学)"
  - "我(?:才|今年|现在|其实|还|只|只是|也|就|都|是)*(?:一个|个)?(?:未成年|未满(?:18|十八)|没满(?:18|十八)|不满(?:18|十八)|不到(?:18|十八))(?!的时候|时|那|以前|之前)"
  # Round 3 (2026-10-27, re-test r2 第 2 节; 草稿：待 G-0). Grammar, not example sentences:
  # - the self word may be 本人 / 俺 / 咱 too, and the age may stand with 了 instead of 岁
  #   ("我17了，下个月才满18");
  # - a school year may take 的学生 / 学生党 / 新生 ("我是初二的学生");
  # - not yet grown up ("我还没成年呢", "我还没满十八");
  # - a self-description at the start of a clause, marked as one by 一枚 / 本人 / 在此
  #   ("初三学生一枚", "高二党一枚"), never a remark about students in general;
  # - English, folded with no spaces: I'm / I am + an age under 18 (+ years old), followed
  #   by the end, punctuation or a joining word ("I'm 15 and my parents fight"), never a
  #   count of something else ("I'm 15 minutes late", "15 years older").
  - "(?:我|本人|俺|咱)(?:才|今年|现在|其实|还|只|只有|刚|刚刚|刚满|也|就|都|是|已经)*(?:1[0-7]|十[一二三四五六七]?)了(?![0-9一二三四五六七八九十个号点分次天年月]|岁)"
  - "(?:本人|俺|咱)(?:才|今年|现在|其实|还|只|只有|刚|刚刚|刚满|也|就|都|是)*(?:1[0-7]|十[一二三四五六七]?)(?:岁|周岁)(?!的|那|时|以前|之前|左右)"
  - "(?:我|本人|俺|咱)(?:才|今年|现在|其实|还|只|只是|也|就|都|是)*(?:一个|个|一名)?(?:在)?(?:上|读|念)?(?:初一|初二|初三|初中|小学|六年级|五年级|四年级|七年级|八年级|九年级|高一|高二)的?(?:学生党|学生|新生|生|党)(?!的|那|时|以前|之前|毕业|同学|老师|班主任|教师|部|校|学校|家长|数学|语文|英语|物理|化学|生物|历史|地理|政治|体育|音乐|美术|科学)"
  - "(?:我|本人|俺|咱)(?:才|现在|其实|还|也|都)*(?:没|未|不)有?(?:成年|满(?:18|十八))(?!的时候|时|那|以前|之前)"
  - "{S}(?:初一|初二|初三|初中|小学|高一|高二|七年级|八年级|九年级)的?(?:学生党|学生|生|党|狗)(?:一枚|一只|本人|在此)"
  - "(?:i'm|im|iam)(?:only|just|still)?(?:1[0-7]|thirteen|fourteen|fifteen|sixteen|seventeen)(?:yearsold|yrsold|yo)?(?=$|[,.!?;:~)]|and|but|so|now|lol|haha|btw|already|&)"
  - "(?:i'm|im|iam)(?:only|just|still)?a(?:1[0-7]|thirteen|fourteen|fifteen|sixteen|seventeen)-?years?-?old"
  # Round 4 (2026-10-28, re-test q2 第 5 节; 草稿：待 G-0). Grammar, not example sentences:
  # - an age with no 岁 that ends its clause or is followed by a particle, after a self
  #   word and at least one of the age adverbs ("我才十六，爸妈……", "俺今年十六，还在……"),
  #   never a date or a count ("我今年十六号搬家", "我才十点就困了");
  # - the Cantonese adverbs 先 (only), 仲 (still) and 啱啱 (just) beside the Mandarin ones
  #   ("我今年先十四岁咋");
  # - Hong Kong school forms 中一 to 中五 said of oneself ("我系中四学生"), never 中二病;
  # - 我们 + a school year + its teacher, class or classmates ("我们初二的数学老师……"):
  #   the user speaks as a pupil of that year; "我们初二那年" and "我们高一的时候" are past.
  - "(?:我|本人|俺|咱)(?:才|今年|现在|其实|还|只|只有|刚|刚刚|刚满|也|就|都|是|先|仲|啱啱)+(?:1[0-7]|十[一二三四五六七]?)(?=$|[,.!?;:~)。、]|啊|呀|呢|嘛|咋|咁|喔|噢|哦|而已|罢了)"
  - "(?:我|本人|俺|咱)(?:才|今年|现在|其实|还|只|只有|刚|刚刚|刚满|也|就|都|是|先|仲|啱啱)*(?:先|仲|啱啱)(?:才|今年|现在|其实|还|只|只有|刚|刚刚|刚满|也|就|都|是)*(?:1[0-7]|十[一二三四五六七]?)(?:岁|周岁)(?!的|那|时|以前|之前|左右)"
  - "(?:我|本人|俺|咱)(?:而家|现在|仲|还|才|今年)*(?:系|是|读|念|喺度读|在读)(?:紧)?(?:中一|中二|中三|中四|中五)(?:学生|生)?(?!病|青年|的时候|那|时|以前|之前|毕业|同学|老师|家长)"
  - "(?:我|本人|俺|咱)(?:中一|中二|中三|中四|中五)(?:学生|生)(?!的|那|时|家长)"
  - "我们(?:班|年级)?(?:初一|初二|初三|七年级|八年级|九年级|高一|高二|中一|中二|中三|中四|中五)的?(?:班主任|(?:数学|语文|英语|物理|化学|生物|历史|地理|政治|体育|音乐|美术|科学)?老师|同学|班)(?!那|时)"

# Strain that is not itself a crisis cue (问题单第 11 条, 2026-10-26; 草稿：待 G-0): "撑不了
# 多久了". Read only for a user with a crisis history (a care marker or a crisis earlier in
# this session): with an L1 screen or one of these, the reply leads with one gentle line
# of care and one line of the region's hotline. It never changes the crisis level.
strain_cues:
  - 撑不了多久
