      - 真的是这样
      - 好像是这样
      - 好像是的
      - 一直是这样
      - 我就是这么想的
      - 我也这么觉得
      - 常常会
      - 经常会
      - 嗯是
      - 嗯对
      - 嗯确实
      - 是有
      - 会的
    decline_whole:
