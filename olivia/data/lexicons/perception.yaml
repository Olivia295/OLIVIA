# Asking for a hotline or a help number in any stage (问题单第 7 条, 2026-10-26; 草稿：待 G-0):
# "能给我一个心理援助热线的号码吗", "有没有不用实名的热线". Outside a crisis and the D3 question
# the reply is the region's resource card (the same verified data as `olivia resources`).
# Same placeholders as direct_request_patterns; void when negated ("不需要热线") or when a
# hotline_pushback phrase is in the message ("别给我发热线").
hotline_request_patterns:
  - "(?:给我|告诉我|发我|发给我|推荐|想要|需要|要个|要一个|求个|求一个|查一下|找个|找一个|有没有|有什么|有哪些|能不能|可不可以|可以|哪里有|哪儿有|在哪|去哪)(?:找|查|打|拨)?{C}{0,14}?(?:热线|求助电话|援助电话|咨询电话|心理援助|求助号码|援助号码|hotline|helpline|crisisline)"
  - "(?:热线|求助电话|援助电话|咨询电话|求助号码|援助号码|hotline|helpline)(?:的)?(?:号码|电话)?(?:是多少|多少|是什么|有哪些|有吗|吗|呢|\\?)"
  - "(?:心理援助|心理热线|求助热线|援助热线)(?:的)?(?:号码|电话)"
  # Round 3 (2026-10-27, re-test r2 第 4 节; 草稿：待 G-0): a request word, a word for talking or
  # support and a word for a phone line in one clause ("有没有那种不用说名字、随便聊聊的电话",
  # "能告诉我心理咨询的电话吗", "is there a crisis line I can text"); or the support word and the
  # phone word followed by a question ("我想打电话找人聊聊，有号码吗"); or a request word, or a
  # question, around 热线 / hotline itself ("香港有冇24小時嘅熱線", "can you give me a hotline
  # number", "help line number please"). A phone word alone ("我刚给我妈打了电话") is none.
  - "(?:有没有|有冇|有无|能不能|可不可以|可以|能否|给我|给个|告诉我|发我|发给我|推荐|想要|需要|要个|要一个|求个|求一个|找个|找一个|查一下|查查|哪里有|哪儿有|有什么|有哪些|想打|想找|请问|please|canyou|couldyou|give|need|want|isthere|arethere|any|share|send|what'sthe|whatisthe|whatnumber|which|recommend|tellme){C}{0,16}?(?:心理|情绪|倾诉|聊聊|聊天|说说话|说话|支援|支持|援助|求助|咨询|陪伴|自杀|危机|crisis|support|suicide|mentalhealth|emotional|talkto|talking|counsel){C}{0,10}?(?:电话|热线|号码|专线|hotline|helpline|line|number)"
  - "(?:心理|情绪|倾诉|聊聊|聊天|说说话|说话|支援|支持|援助|求助|咨询|陪伴|自杀|危机|crisis|support|suicide|mentalhealth|emotional|talkto|talking|counsel)[^.!?。！？]{0,10}?(?:电话|热线|号码|专线|hotline|helpline|line|number){C}{0,6}?(?:吗|呢|么|嘛|是多少|多少|是什么|有哪些|有吗|有冇|\\?|please)"
  - "(?:有没有|有冇|有无|能不能|可不可以|可以|能否|给我|给个|告诉我|发我|发给我|推荐|想要|需要|要个|要一个|求个|求一个|找个|找一个|查一下|查查|哪里有|哪儿有|有什么|有哪些|想打|想找|请问|please|canyou|couldyou|give|need|want|isthere|arethere|any|share|send|what'sthe|whatisthe|whatnumber|which|recommend|tellme){C}{0,12}?(?:热线|hotline|helpline|crisisline|supportline)"
  - "(?:热线|hotline|helpline|crisisline|supportline){C}{0,8}?(?:吗|呢|么|嘛|是多少|多少|是什么|有哪些|有吗|有冇|\\?|please)"

