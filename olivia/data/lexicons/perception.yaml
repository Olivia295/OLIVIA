  # The answer to the schema mirror question, read on the next turn only (model mode). The
  # first clause of the message (up to the first punctuation mark, leading fillers such as
  # 嗯 or 哦 dropped, trailing particles such as 吧 or 啊 dropped) is read the way
  # olivia/core/safety/intent_check.py reads the D3 answer: a no wins; an unsure word
  # makes it unclear; a yes needs a whole-clause `affirm_whole` or a leading `affirm_start`
