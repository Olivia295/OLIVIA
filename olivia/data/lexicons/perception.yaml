# Asking about something the user had OLIVIA remember (PRD MIYI-04, F15; 草稿：待 G-0).
# A non-negated hit sets TurnSignals.note_recall; the session passes it on only on a calm
# turn outside a crisis (no L1-L3 screen), and the recorder looks it up among the notes
# ("记住：……", memory.yaml) and never among the session summaries. Both modes: these are
# rule phrases, the model never sets them.
#
#   note_recall            the message names the notes outright ("我上次让你记住什么了",
#                          "你帮我记的那个是什么"): always answered (the note, the latest
#                          one, "nothing yet" or "memory is not available here").
#   note_recall_questions  a question about a fact the user cannot recall ("周四要见的那个人
#                          是谁来着"): answered only when a note matches it; otherwise the
#                          turn is ordinary conversation. Bare "来着" is a past-tense marker
#                          ("我昨天跟他吵架来着"), so every entry carries a question word.
#
