# Perception rule-stub lexicon (placeholder until the trained perception model, P6).
#
# Read by olivia/core/perception/lexicon.py, which rejects unknown sections, unknown
# emotion or spectrum ids, empty lists and duplicate phrases. Every phrase is folded with
# the safety normalizer (NFKC, casefold, Traditional -> Simplified, whitespace dropped)
# before matching, so write plain Simplified Chinese.
#
# Phrases are matched as substrings. Within one section, a hit fully inside a longer hit
# of the same section is dropped ("开心不起来" wins over "开心"). Any hit directly preceded
# by a `negation.prefixes` entry is void unless that prefix is the second half of an
# A-not-A question (是不是 / 有没有 / 会不会) or itself follows another negation.
#
# Labels follow docs/eval/perception-annotation-guide.md. This file must not borrow
# wording from olivia/data/lexicons/risk.yaml: crisis detection is the safety screen's
# job, and the stub copies its result rather than recomputing it.

version: 1

# emotion id (or a TAX emotion alias) -> phrases. The order of the keys is the tie-break
# priority when two emotions have the same number of hits: closer to safety risk first,
# as the guide's §2.2 rule 4 asks (panic > anxiety/fear, hopelessness > sadness and
# disappointment, shame > guilt, overwhelm > anxiety). An alias key takes the priority of
