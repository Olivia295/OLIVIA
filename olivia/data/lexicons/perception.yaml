  # The yearning a schema points to (Satir iceberg: the need under the belief), used when
  # a turn names a schema but no yearning phrase; every schema id, one yearning each.
  # 草稿：待 G-0（F13 决定：保持不变）。对照档案头部的 Schema 与第二节“核心心理营养渴求”：多数单一图式
  # 档案与本表相符（如 01_02、01_04、11_04 -> SAFETY，01_06、06_04 -> CONNECTION，04_03 -> ACCEPTANCE，
  # 02_05、04_04、10_01 -> AUTONOMY）；有几份写的是复合或别类需要（02_04 的 UNRELENTING_STANDARDS 写平稳节律，
  # 02_03、09_02 的 EMOTIONAL_INHIBITION 写重拾鲜活感受，11_03 的 VULNERABILITY_TO_HARM 写与有限性和解），
  # 多图式档案的渴望是整体描述、不能拆给某一个图式。档案不足以唯一确定改法，所以不改，分歧留给 G-0。
  # 这张表只影响隐喻与“需要”的措辞，不影响任何掩码、危机或方法选择。
  schema_yearnings:
    DEFECTIVENESS: ACCEPTANCE
    UNRELENTING_STANDARDS: ACCEPTANCE
    FEAR_OF_ABANDONMENT: CONNECTION
    MISTRUST_ABUSE: SAFETY
    EMOTIONAL_DEPRIVATION: CONNECTION
    SOCIAL_ISOLATION: CONNECTION
    DEPENDENCE_INCOMPETENCE: COMPETENCE
    VULNERABILITY_TO_HARM: SAFETY
    ENMESHMENT: AUTONOMY
    SUBJUGATION: AUTONOMY
    SELF_SACRIFICE: AUTONOMY
    APPROVAL_SEEKING: ACCEPTANCE
    NEGATIVITY_PESSIMISM: SAFETY
    EMOTIONAL_INHIBITION: CONNECTION
    PUNITIVENESS: ACCEPTANCE
    ENTITLEMENT_GRANDIOSITY: ACCEPTANCE
    INSUFFICIENT_SELF_CONTROL: COMPETENCE
    CONDITIONAL_WORTH: ACCEPTANCE
    REST_GUILT: AUTONOMY
    FAILURE: COMPETENCE
  # The answer to the schema mirror question, read on the next turn only (model mode). The
  # first clause of the message (up to the first punctuation mark, leading fillers such as
  # 嗯 or 哦 dropped, trailing particles such as 吧 or 啊 dropped) is read the way
  # olivia/core/safety/intent_check.py reads the D3 answer: a no wins; an unsure word
  # makes it unclear; a yes needs a whole-clause `affirm_whole` or a leading `affirm_start`
  # with no `decline_start` phrase anywhere in the clause. Start phrases are two characters
  # or more, so 对不起 is no yes.
  mirror_answers:
    affirm_whole:
      - 是
      - 是的
      - 是啊
      - 是呀
      - 对
      - 对的
      - 对啊
      - 对呀
