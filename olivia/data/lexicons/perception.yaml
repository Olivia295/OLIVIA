# prolonged_grief: the other half of SIT-06-04 (延长哀伤障碍与未完成丧失悲恸; PRD COLBO-06b,
# 特性一-4). 定义草稿：待 G-0. The acute cues above catch a death that has just happened;
# a loss that is long past and still not borne ("妈妈去世一年多了，我还是走不出来") has no
# fixed phrase, so the stub sets SIT-06-04 when one message has a live (non-negated) hit
# in each of the three lists: a death (loss), a long time since (duration: half a year
# or more), and still not getting through it (unresolved). Two of the three are no hit:
# "外婆去世好几年了，现在想起来更多是温暖" and "宠物走了一年了，我已经慢慢好了" name no
# unresolved grief. Like every SIT-06-04 cue it routes to m0 for the rest of the session.
# F13 (draft, G-0): it no longer sets ACUTE_BEREAVEMENT_SHOCK, whose source is the early
# phase (丧亲初期); only the acute cues above do (TurnSignals.prolonged_grief tells them
# apart), and a direct request gets followups.grief_request_prolonged instead.
# Crisis screening runs before and apart from these words: a grief message with crisis
# wording is still a crisis turn.
prolonged_grief:
  loss:
