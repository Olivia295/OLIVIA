# Introspector (decision D4, step C2; SDD §3.2, PRD 特性三 / MIYI-03). Read by
# olivia/core/perception/introspector.py, not by the rule stub. Draft pending G-0.
#
# Matching: the message is folded like every other section, clipped to the perception
# window and stripped of punctuation and symbols ("我这么害怕，说明……" reads as
# "我这么害怕说明……"), then scanned once. Within each of distortions / schemas / yearnings
# a hit fully inside a longer hit is dropped and a hit directly preceded by a
# `negation.prefixes` entry is void (same rule as the stub), so "我不是一无是处" is no hit.
#
# Keys are taxonomy ids: every cognitive_distortions, schemas and satir_yearnings id has
# an entry, and nothing else does. A phrase belongs to one id only, across all three
# sections, and no phrase of an id lies inside a phrase of another id of the same
# section. Phrases are first-person and specific on purpose: ordinary talk ("这次没考好",
# "我不太在意别人的看法") must not fire. tests/perception/test_introspector.py holds
# positives and hard negatives for every id.
