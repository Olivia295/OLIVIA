# patterns never turn a named method into a request on their own.
direct_request_patterns:
  # 有什么 / 有没有什么 …… 方法 / 办法 / 练习 / 技巧
  - "{S}(?:那|那么|请问|所以|你|还)?有(?:什么|没有什么|没有|啥|没有啥){C}{0,12}?(?:方法|办法|练习|技巧|妙招)"
  # 教我 …… 方法 / 放松 / 呼吸；"你直接教我吧" as a clause of its own
  - "{S}(?:那|你|请|能不能|可不可以|可以|能|就|直接|现在|快){0,4}教(?:教)?我{C}{0,12}?(?:方法|办法|练习|技巧|放松|呼吸|冥想|招)"
  - "{S}(?:那|你|请|就|直接|快){0,3}教(?:教)?我(?:吧|呗|啊|呀|一下|一下吧|一招)?{E}"
  # 给我 / 来 一个 …… 方法 / 练习
  - "{S}(?:那|你|请|能不能|可不可以|可以|能|就|直接|现在|快|再){0,4}(?:给我|给|来)(?:一个|个|一些|些|几个|点|一点|一组){C}{0,12}?(?:方法|办法|练习|技巧)"
  # 能不能 …… 放松 / 平静 / 缓解
  - "{S}(?:那|你)?(?:能不能|可不可以|能否|你能|你可以)(?:帮我|让我|带我|教我)?{C}{0,6}?(?:放松|平静|冷静|缓解|镇定|好受)"

# Asking how to say or do something ("我该怎么开口跟妈妈聊", "你能帮我想想怎么说吗";
# dogfood I1, 2026-10-26; 草稿：待 G-0): advice, not a practice. The PRD has no advice
# mechanism, so no direct request: the session only says it heard the question
# (utterances.yaml notices.advice_heard). Same placeholders as direct_request_patterns;
# void when 不知道 / 不晓得 / 不清楚 comes right before it ("我不知道该怎么说" tells).
advice_patterns:
  - "(?:该|要|能|可以)?怎么(?:开口|说|讲|回|回复|沟通|拒绝|表达|提|跟|和|面对|处理)"
  - "帮我想想(?:怎么|该|要)"
  - "如何(?:开口|说|讲|回复|沟通|拒绝|表达|跟|和)"

