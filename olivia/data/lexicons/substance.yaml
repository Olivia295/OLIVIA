            "断药", "停酒", "停咗", "断咗", "戒咗", "唔食", "唔饮", "冇食", "冇饮", "唔再食", "唔再饮",
            # 第七轮（2026-11-01，复测 q3 第三节；草稿：待 G-0）：不买了、偷偷停、自己减量、隔天吃
            "不买了", "不再买", "不续药", "不开药了", "不去开药", "偷偷停", "偷偷断", "偷偷减", "偷偷不吃",
            "想停", "打算停", "准备停", "要停了", "不想吃了", "不想再吃", "自己减量", "隔天吃", "隔一天吃",
            "隔两天吃", "隔天减", "掰一半", "减半", "少吃一片", "少吃半片",
            "coldturkey", "stoppedtaking", "quittaking", "quitmy", "stoppedmy"]
  # 第六轮（2026-10-29，复测 q2 第 6 节、q3 第三节；草稿：待 G-0）：按句式认“自己一下子停”，
  # 不逐句列举。正则，作用于折叠后的文字（繁转简、去空格），开头前面有否定词时不算：
  #   · “一 + 量词 + 都/也 + 不”：一口也不喝、一粒都不吃、一片也不碰；
  #   · “再也不 / 不再 / 以后都不 + 吃喝碰”：再也不吃、不再喝；
  #   · “全都 / 全部 / 统统 / 彻底 / 完全 / 直接 + 不、停、断、戒”：全都不吃、彻底断；
  #   · “（从）某天 + 起/开始 + 不、停、断、戒”：下礼拜起不喝、后天开始停。
  patterns:
    - "一(?:口|滴|颗|粒|片|点|丁点|次|瓶|杯)(?:酒|药)?(?:都|也)(?:不|没|唔|冇)(?:再)?(?:喝|吃|碰|沾|食|饮|用|服)"
    - "(?:再也|以后都|以后再也|从此|往后都)(?:不|唔)(?:吃|喝|碰|沾|食|饮|用|服)"
    - "(?:不|唔)再(?:吃|喝|碰|沾|食|饮|用|服)"
    - "(?:全都|全部|统统|通通|一律|彻底|完全|直接|一下子)(?:不|唔|停|断|戒)"
    - "(?:今天|明天|今晚|后天|下周|下礼拜|下星期|下个月|这周|本周|这礼拜|今日|听日|周[一二三四五六日天]|星期[一二三四五六日天]|礼拜[一二三四五六日天])(?:起|开始)(?:就|我)?(?:不|唔|停|断|戒)"
    # 第七轮（2026-11-01，复测 q3 第三节；草稿：待 G-0）：隔天才吃、自己在减
    - "隔(?:一|两|几|个)?天(?:才|再)?(?:吃|服|食)"
    - "自己(?:在|偷偷|慢慢|一点点)?(?:减|停|断)"
  # 在医生指导下减停的说法（没被否定时）：只看身体信号，不按“自己一下子停”提醒。
  guided: ["医生让", "医生说", "医生建议", "医生指导", "医生同意", "医生安排", "遵医嘱", "按医嘱",
