           "按医生", "照医生", "医生要我", "doctorsaid", "doctortold"]
  # 第七轮（2026-11-01，复测 q3 第三节；草稿：待 G-0）：慢慢减的说法。没有 guided 的说法（医生让、
  # 遵医嘱……）时，自己慢慢减、隔天减也算自行减停，照样提醒先问医生；有 guided 时不提醒。
  taper: ["慢慢减", "逐渐减", "一点点减", "减量", "减药", "减掉"]
  # 第七轮：漏吃、忘带（“两天没吃”“出差忘带了”），只在说到下面 classes 里具体的药名时才算停用
  # （单说“今天忘了吃药”不算）。正则，作用于折叠后的文字。
  missed:
    - "(?:没|没有|忘了?|忘记|漏|冇)(?:吃|带|服|食|拿)"
    - "(?:断|停)了(?:一|两|几|三|四|五|六|七|好几|\\d)"
  # 第七轮：说的是别人的药（“我妈的降压药”“我爸自己把药停了”）：给通用的“问医生”提醒，不列精神科药。
  # 正则，作用于折叠后的文字。
  others:
    - "(?:妈|爸|母亲|父亲|爷爷|奶奶|外公|外婆|姥姥|姥爷|公公|婆婆|岳父|岳母|老公|老婆|丈夫|妻子|孩子|儿子|女儿|哥|姐|弟|妹|朋友|室友|同事|男朋友|女朋友|对象|家里人|老人家|他|她)(?:的|吃的|在吃的|平时吃的|一直吃的|自己|偷偷|已经|最近|又|也|总是|老是|说|把|不肯|不愿意|不想)"

# 第七轮（2026-11-01，复测 q2 第 6 节 P7、q3 第三节；草稿：待 G-0）：药和酒的类别。停用提醒只点出用户说到的
# 那一类（utterances.yaml substance.withdrawal_classes 里同名的一句），不再每次列一长串；没说到具体类别
# （“我把药停了”）时用原来的 withdrawal 一句；说的是别人的药（stopping.others），或是 other_medicine 这类
# 非精神科的药（降压药、降糖药……）时用 general 一句（问开药的医生或药师）。这些药名也都算 stopping.objects。
