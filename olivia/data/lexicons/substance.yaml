# 自己一下子停（第五轮，2026-10-29；草稿：待 G-0）。见文件开头。
stopping:
  # 这句话里没有 substances 的词时，有这些也算在说停用药物（“我把药停了”）：苯二氮䓬类抗焦虑药、
  # 抗抑郁药（按类和常见药名）。它们只用来提醒别自己停，不算喝酒、用药的语境（按时吃药不是渴求）。
  objects: ["药", "抗焦虑", "抗抑郁", "苯二氮", "地西泮", "劳拉西泮", "阿普唑仑", "氯硝西泮", "艾司唑仑",
            "奥沙西泮", "佐匹克隆", "唑吡坦", "舍曲林", "帕罗西汀", "氟西汀", "西酞普兰", "氟伏沙明",
            "文拉法辛", "度洛西汀", "米氮平", "安非他酮", "阿戈美拉汀", "安定片"]
  phrases: ["直接戒", "说戒就戒", "一下子戒", "一下子停", "一下子全", "一下全", "突然停", "突然不",
            "全停", "全部停", "全都停", "都停了", "彻底戒", "马上戒", "立刻戒", "立马戒", "一口都不",
            "一滴都不", "一口不", "一滴不", "滴酒不沾", "从今天起", "从明天起", "从今晚起", "今天开始不",
            "明天开始不", "今晚开始不", "今天起不", "明天起不", "自己停", "私自停", "擅自停", "自己断",
