             "应酬", "酗", "戒断", "嗑药", "药瘾", "戒药", "复饮",
             "安眠药", "助眠药", "睡觉的药", "止痛药", "止痛片", "镇痛药", "曲马多", "可待因",
             "止咳水", "镇静药", "镇静剂", "镇定剂", "抗焦虑药", "停药",
             # 第五轮（2026-10-29）：安眠药的别的说法（含粤语）
             "助眠的药", "安眠的药", "睡眠药", "瞓觉药",
             # 第七轮（2026-11-01，复测 q2 第 6 节）：英文
             "alcohol", "booze", "quitdrinking", "stoppeddrinking", "quitbooze", "hangover",
             "sleepingpill"]
