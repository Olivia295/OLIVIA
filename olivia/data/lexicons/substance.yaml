# 草稿：待 G-0 两名注册心理师审核（第三轮修复 B2a，2026-10-27；复测 r4 物质使用；
# 第四轮 2026-10-28 复测 q3：安眠药、止痛药、镇静药的停用，更多戒断信号，“找理由喝一点”）
#
# 物质使用的线索：只给语言层用（olivia/core/language/guard.py），决定当轮回复
#   · 要不要在前面加一句戒断提醒（“想停最好在医生指导下进行，出现这些情况请尽快就医”），
#   · 用户问“喝一点行不行”“先别戒了”时，要不要先如实说一句没法判断、请医生看看、愿意陪着想别的办法，
#   · 复述时要不要把喝酒的满足感（“冰啤酒下肚”“一杯下去整个人都舒坦了”）换成“想喝的渴望很强”。
# 不参与危机筛查、不改任何档位、不触发转介卡；句子本身在 language/utterances.yaml 的 substance 下。
#
# 匹配：文字与词都先按 safety/normalize.py 折叠（全角标点变半角、繁体变简体、去空格），“含有即算”。
# 各项是组合起来用的，单个词不够（结构见下）：
#
#   语境（context）：这句话里有 substances 的词（或问“突然不喝会怎样”而没提别的饮品，或说要戒、要少喝
#     一种不是 not_alcohol 的东西：“只是想少喝一点”），或本场对话里
#     先前出现过，或 image_topic 指的物质使用话题本场出现过（出现过就一直算数）。
#   否定：前面 negation_window 个字以内有 negators 的词就算被否定；“要不要”“能不能”这种正反问不算，
#     non_negators 里的词（“要不”“忍不住”“受不了”）里的否定字也不算。
#
#   戒断信号：有语境，且这句话里有 withdrawal 的某个说法（身体信号 signs、严重信号 severe、
#     或问“突然不喝会怎样” questions），这个说法前面 negation_window 个字以内没有 negators
#     （“没有手抖”不算）。有 severe 时用严重的那句（请尽快去急诊、请人陪着）。
#
#   问“喝一点行不行”：有语境，且
#     （0）有 excuses 的说法（找理由喝一点：“度数那么低”“不算破戒”“无醇”“助眠”），前面没有被否定；或者
#     （a）有一个没被否定的 drinking 动作（“喝一点”“来一杯”“一杯”），它后面 object_window 个字以内
#          不是 not_alcohol 里的饮品（“喝茶”“喝点热牛奶”“一大杯凉白开”不算），并且这句话在问
#          （有 asking 的说法，或以问号结尾）；或者
#     （b）有 postpone 的说法（“先别戒了”“不戒了”“破个例”），或 later 与 put_off 各有一个
#          （“过段时间再戒”；单说“想再戒一次”不算）。
#
#   复述里的满足感：一句（按。！？；换行分句）不是在问，并且
#     （c）（见下）在它前面没有 quitting 的说法；或者句中没有 quitting 的说法（在戒、在减、忍住、代替……），并且
#     （a）有 substances 的词，再加一个没被否定的 desire 或 pleasure 说法（“好想……啤酒”）；或者
#     （b）有语境，有一个不是 not_alcohol 的 drinking 动作，再加一个没被否定的 pleasure 说法
#          （“一杯下去整个人都舒坦了”）。光有“想喝”不算（“想喝口热乎的东西”）；或者
#     （c）有语境，一个没被否定的 desire 说法后面紧跟一个 drinking 动作（中间至多隔“再、要、去、来”：
#          “特别想再喝一点”；“想少喝”不算），
#          或后面有 again 的说法（“好想再有一次”），或 desire 说法后面只剩语气词（“但我真的很想”）。
#
#   自己一下子停（第五轮 2026-10-29，复测 q3 第三节；草稿：待 G-0）：这句话里有 substances 的词或
#     stopping.objects 的字，又有一个没被否定的 stopping.phrases 说法（“停掉了”“一口都不碰”“说戒就戒”
#     “停咗”），而且没有 stopping.guided 的说法（“医生让我慢慢减”）：也给戒断提醒（不要自己一下子停，
#     先问医生或药师），复述不说回“直接戒”这类话（utterances.yaml substance.stopping）。
#     只说“我在戒酒”不算（那是正在做的事，不是一下子停）；有身体信号时照常按戒断信号提醒。
version: 1

# 酒，以及停用时同样可能有危险戒断反应的药：安眠药、止痛药（阿片类）、镇静药。
substances: ["酒", "啤", "二锅头", "断片", "喝醉", "醉了", "宿醉", "微醺", "喝多", "喝高", "喝大了",
             "应酬", "酗", "戒断", "嗑药", "药瘾", "戒药", "复饮",
             "安眠药", "助眠药", "睡觉的药", "止痛药", "止痛片", "镇痛药", "曲马多", "可待因",
             "止咳水", "镇静药", "镇静剂", "镇定剂", "抗焦虑药", "停药",
             # 第五轮（2026-10-29）：安眠药的别的说法（含粤语）
             "助眠的药", "安眠的药", "睡眠药", "瞓觉药"]
# metaphors.yaml 的 avoid.topics 里物质使用那一项：它在本场出现过（谱系 10、SIT-10-04 情境或转介卡、
# 或“喝了”“几杯”这类线索），也算有语境。
image_topic: substance

negators: ["不", "没", "别", "未", "无", "唔", "冇"]
negation_window: 2
non_negators: ["要不", "不如", "忍不住", "受不了", "不行", "不停", "不住", "停不下", "睡不着", "不舒服",
               "不难受", "扛不住", "熬不过", "差不多", "不知道", "说不过去", "没差", "不过分", "不算",
               "不要紧", "没关系", "没事", "特别", "分别", "区别", "差别", "告别", "离别", "未来", "无聊",
               "无论", "唔该", "唔使"]

withdrawal:
  signs: ["手抖", "手在抖", "手一直在抖", "手有点抖", "手还抖", "发抖", "哆嗦", "打颤", "打哆嗦", "发颤",
          "在抖", "抖个不停", "抖得", "直抖", "颤抖",
          "出汗", "冒汗", "冷汗", "虚汗", "一身汗", "盗汗", "心慌", "心跳快", "心跳也快", "心跳得",
          "心跳加速", "心砰砰", "心怦怦", "心悸", "心跳很快", "心跳特别快", "睡不着", "难睡着", "很难睡",
          "失眠", "恶心", "想吐", "呕吐", "吐了", "头晕", "戒断反应", "浑身难受", "坐立不安", "坐不住",
          "焦躁", "烦躁", "发冷", "发热", "忽冷忽热", "一阵冷一阵热", "骨头疼", "骨头痛", "浑身疼",
          "全身疼", "全身酸痛", "浑身酸痛", "流鼻涕", "眼泪一直流", "鼻涕眼泪", "打哈欠", "哈欠",
          "起鸡皮疙瘩", "拉肚子", "腹泻", "肚子不舒服", "肚子疼", "胃疼",
          # 第五轮（2026-10-29）：身体难受的说法、粤语
          "难受得", "难受死", "好难受", "很难受", "特别难受", "身体难受", "身上难受", "全身难受",
          "手震", "震个不停", "心跳好快", "心口跳", "瞓唔着", "唔舒服", "好辛苦", "出冷汗"]
  # 严重：看到、听到不存在的东西，抽搐或倒地，意识模糊。用急诊的说法。
  severe: ["看到墙上", "看到有东西", "看见有东西", "东西在爬", "有虫子", "人影", "听到有人", "听见有人",
           "听到声音", "听见声音", "幻觉", "幻听", "幻视", "不存在的", "抽搐", "抽筋", "抽了一下",
