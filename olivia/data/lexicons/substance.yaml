# 草稿：待 G-0 两名注册心理师审核（第三轮修复 B2a，2026-10-27；复测 r4 物质使用）
#
# 物质使用的线索：只给语言层用（olivia/core/language/guard.py），决定当轮回复
#   · 要不要在前面加一句戒断提醒（“想停最好在医生指导下进行，出现这些情况请尽快就医”），
#   · 用户问“喝一点行不行”“先别戒了”时，要不要先如实说一句没法判断、请医生看看、愿意陪着想别的办法，
#   · 复述时要不要把喝酒的满足感（“冰啤酒下肚”“一杯下去整个人都舒坦了”）换成“想喝的渴望很强”。
# 不参与危机筛查、不改任何档位、不触发转介卡；句子本身在 language/utterances.yaml 的 substance 下。
#
# 匹配：文字与词都先按 safety/normalize.py 折叠（全角标点变半角、繁体变简体、去空格），“含有即算”。
# 各项是组合起来用的，单个词不够（结构见下）：
#
#   语境（context）：这句话里有 substances 的词（或问“突然不喝会怎样”而没提别的饮品，或说要戒、要少喝
#     一种不是 not_alcohol 的东西：“只是想少喝一点”），或本场对话里
#     先前出现过，或 image_topic 指的物质使用话题本场出现过（出现过就一直算数）。
#   否定：前面 negation_window 个字以内有 negators 的词就算被否定；“要不要”“能不能”这种正反问不算。
#
#   戒断信号：有语境，且这句话里有 withdrawal 的某个说法（身体信号 signs、严重信号 severe、
#     或问“突然不喝会怎样” questions），这个说法前面 negation_window 个字以内没有 negators
#     （“没有手抖”不算）。有 severe 时用严重的那句（请尽快去急诊、请人陪着）。
#
#   问“喝一点行不行”：有语境，且
#     （a）有一个没被否定的 drinking 动作（“喝一点”“来一杯”“一杯”），它后面 object_window 个字以内
#          不是 not_alcohol 里的饮品（“喝茶”“喝点热牛奶”“一大杯凉白开”不算），并且这句话在问
#          （有 asking 的说法，或以问号结尾）；或者
#     （b）有 postpone 的说法（“先别戒了”“不戒了”“破个例”），或 later 与 put_off 各有一个
#          （“过段时间再戒”；单说“想再戒一次”不算）。
#
#   复述里的满足感：一句（按。！？；换行分句）不是在问，句中没有 quitting 的说法（在戒、在减、
#     忍住、代替……），并且
#     （a）有 substances 的词，再加一个没被否定的 desire 或 pleasure 说法（“好想……啤酒”）；或者
#     （b）有语境，有一个不是 not_alcohol 的 drinking 动作，再加一个没被否定的 pleasure 说法
#          （“一杯下去整个人都舒坦了”）。光有“想喝”不算（“想喝口热乎的东西”）。
version: 1

substances: ["酒", "啤", "二锅头", "断片", "喝醉", "醉了", "宿醉", "微醺", "喝多", "喝高", "喝大了",
             "应酬", "酗", "戒断", "嗑药", "药瘾", "戒药", "复饮"]
# metaphors.yaml 的 avoid.topics 里物质使用那一项：它在本场出现过（谱系 10、SIT-10-04 情境或转介卡、
# 或“喝了”“几杯”这类线索），也算有语境。
image_topic: substance

negators: ["不", "没", "别", "未", "无"]
negation_window: 2

withdrawal:
  signs: ["手抖", "手在抖", "手一直在抖", "手有点抖", "手还抖", "发抖", "哆嗦", "打颤", "打哆嗦",
          "出汗", "冒汗", "冷汗", "虚汗", "一身汗", "盗汗", "心慌", "心跳快", "心跳也快", "心跳得",
          "心跳加速", "心砰砰", "心怦怦", "心悸", "睡不着", "难睡着", "很难睡", "失眠", "恶心",
          "想吐", "呕吐", "头晕", "戒断反应", "浑身难受", "坐立不安"]
  severe: ["看到墙上", "看到有东西", "看见有东西", "东西在爬", "有虫子", "人影", "听到有人", "听见有人",
           "听到声音", "听见声音", "幻觉", "幻听", "幻视", "不存在的", "抽搐", "抽筋", "抽了一下",
           "抽风", "痉挛", "僵住", "意识不清", "神志不清", "迷糊", "认不出人", "昏过去", "晕倒"]
  questions: ["突然不喝", "突然停", "一下子停", "一下子不喝", "一下子全停", "一下全停", "硬停",
              "骤停", "猛地停", "直接停", "停了会", "不喝会", "不喝了会", "停下来会", "戒掉会"]

drinking: ["喝", "来一口", "来一杯", "来一罐", "来一瓶", "抿", "灌", "干了", "一口", "一杯", "两杯",
           "几杯", "一罐", "两罐", "一瓶", "几瓶", "一盅"]
object_window: 4
not_alcohol: ["茶", "水", "奶", "咖啡", "汤", "果汁", "可乐", "饮料", "蜂蜜", "白开", "粥", "豆浆", "药",
              "热乎", "气", "饭"]

asking: ["吗", "吧", "可以", "行不行", "能不能", "可不可以", "要不要", "会不会", "好不好", "有没有用",
         "没事", "没关系", "不要紧", "不过分", "不算", "总行", "对睡眠好", "帮助睡眠", "?"]
postpone: ["别戒", "不戒了", "不戒也", "先不戒", "不想戒了", "破个例", "破例", "放纵一次",
           "喝回去算了"]
# “等以后再戒”：later 里的一个说法，加上 put_off 里的一个说法（“过段时间再戒”“过完年再说”）。
later: ["以后", "之后", "过段时间", "过一阵", "过几天", "过完年", "改天", "明年", "下个月", "这阵子"]
put_off: ["再戒", "再说"]

quitting: ["戒", "停", "少喝", "不喝", "减", "降", "控制", "忍住", "压下去", "代替", "不碰", "不沾",
           "一口都不", "一滴都不", "绕路"]
desire: ["想", "馋", "渴", "怀念", "想念", "惦记", "挪不开眼", "忍不住"]
pleasure: ["舒坦", "舒服", "痛快", "爽", "过瘾", "解渴", "下肚", "下去", "忘不了", "忘不掉", "回味",
           "放松", "松下来", "暖和", "自在", "安静了", "烦恼都没了", "睡得香", "真好", "带劲", "解乏",
           "解愁"]
