# 用户明确要求“记住”的说法（决定 D1，步骤 B2）。
#
# 只在一条消息的开头匹配（去掉开头空白后），原样比较，不做繁简转换，所以繁体写法单独列出。
# 线索后面的文字原样存为一条笔记（去掉开头的分隔符与首尾空白）；除此之外用户说的任何话都不保存。
# 危机筛查为 L1 及以上、正在危机流程中、或本轮是意图确认（D3）时，一律不记，危机处理优先。
#
#   needs_separator  后面必须紧跟一个分隔符，才算请求：“记住：明天面试”是，“记住了”“记住他说的话很难”不是。
#   direct           后面可以直接接要记的内容：“帮我记一下明天给妈妈打电话”。
#   separators       可以跟在线索后面的分隔符（逐字列出）。
#
# 同一个短语只能出现一次；线索按长度从长到短匹配。
version: 1
note_request:
  needs_separator:
    - 记住
    - 記住
    - 记一下
    - 記一下
    - 记下来
    - 記下來
    - 你记住
    - 你記住
  direct:
    - 帮我记一下
    - 帮我记住
    - 帮我记下
    - 帮我记着
    - 请帮我记住
    - 请帮我记一下
    - 请记得
    - 请记住
    - 你记一下
    - 幫我記一下
    - 幫我記住
    - 幫我記下
    - 幫我記著
    - 請幫我記住
    - 請記得
    - 請記住
separators: "：:，,、；; 　"
