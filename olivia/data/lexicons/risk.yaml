             "孩子", "儿子", "女儿", "网友", "群友", "博主", "邻居", "老师", "学生", "病人", "患者",
             "客户", "领导", "老板", "队友", "舍友", "叔叔", "阿姨", "舅舅", "姑姑", "伯伯", "佢",
             "佢哋"]
  speaker_exceptions: ["其他", "其它", "吉他", "他妈的", "他娘的", "她妈的", "利他", "他乡"]
  speaker_gap: 8
  verbs: ["说", "讲", "告诉我", "问我", "写道", "提到", "提过", "念叨", "说过", "说了句", "说了一句",
          "发消息", "发信息", "留言", "发朋友圈", "发微博", "发帖", "哭着说", "跟我讲", "同我讲",
          "话我知", "话"]
  verb_exceptions: ["说完", "说的话", "说得", "小说", "说明", "说服", "听说", "说不定", "虽说", "说实话",
                    "说真的", "据说", "再说", "说起来", "说到底", "不说", "没说", "别说", "说什么",
                    "怎么说", "讲完", "讲的话", "讲座", "讲课", "演讲", "说话", "讲话", "电话", "话题",
                    "话说", "笑话", "废话", "说法", "说清", "说出"]
  fillers: ["他", "她", "它", "ta", "他们", "她们", "自己", "真的", "已经", "都", "也", "就", "又",
            "好", "很", "太", "最近", "实在", "有点", "有些", "总是", "总", "一直", "经常", "常常",
