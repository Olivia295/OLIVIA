      context: jump_places
      context_window: 24
      unless: ["吃饭", "聚餐", "聚会", "婚礼", "露营", "烧烤", "拍照", "生日", "开店", "租房", "搬家",
               "买房", "旅游", "旅行", "约会", "求婚", "看房", "钓鱼", "野餐", "看日出", "看星星", "看风景",
               "活动", "团建", "毕业照", "健身", "开会", "办公"]
      unless_window: 24
      unless_across: true
    # Pills, all at once, with a plan (我打算今晚把药都吃了) or, for the forms that cannot be a
    # day's doses (全吃, 一次吃完), a time: an overdose planned with no named lethal drug, so
    # L2 like L2_MEANS_HOARDED (安眠药 forms are Stage 1 phrases). A course of medicine, a
    # doctor's order, a chronic illness, pets and family void it.
    - id: L2_PILLS_ALL_PLANNED
      level: L2
      clause_negation: true
      heads: ["药", "药片", "药丸"]
      tails: ["@take_all_strong", "都吃了", "都吃掉", "都吞了"]
      max_gap: 4
      order: either
      exceptions: pill_exceptions
      also:
        - {phrases: plan_firm, window: 16}
      unless: ["@pill_everyday", "疗程", "按时", "医嘱", "每天", "每次", "一日", "饭后", "饭前", "睡前",
               "一粒", "一片", "两片", "复查", "吗"]
      unless_window: 16
