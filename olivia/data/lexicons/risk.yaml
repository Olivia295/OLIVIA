# 表姐打个电话", "好，我等下打给她". The crisis reply then opens with one line that affirms the
# decision (render.yaml crisis.reach_out); the card stays and the crisis does not end, so
# this changes no level and no exit. Read by lexicon.ReachOutRules on the normalized text: a
# `phrases` hit counts unless a `negators` word stands earlier in its clause (我不想给她打
# 电话, 没人可以联系), a `blocked_after` word follows it (联系不上), the message ends as a
# question, or a `vetoes` phrase (farewell, entrusting, means, death) lies anywhere in it.
