  # Plan-shaped sentences without a self-harm anchor: too ambiguous for Stage 1, but a plan
  # with a time or place still warrants L2.
  - id: L2_PLAN_NO_ANCHOR
    level: L2
    patterns: ["今晚就动手", "买好了绳子今晚", "绳子买好了今晚", "药已经备好了就今晚",
               "药我已经准备好了够多了", "药我都准备好了今晚吃", "已经站在天台上", "楼顶不想下去", "就站在楼顶", "把刀磨好了今晚",
               "东西都送人了以后用不上"]
  # Unanchored means/plan/farewell phrasings (tests/safety/known_false_positives.yaml, ideal L3).
  # Literal Stage 1 cannot separate them from everyday use, so they are held at L2; each is
  # chosen not to collide with a BENIGN case.
  - id: L2_UNANCHORED_PLAN
    level: L2
    patterns: ["偷偷留几片", "攒了快一百片", "攒药", "攒的药", "药都攒起来", "药都倒出来数好", "药我已经全部准备好",
