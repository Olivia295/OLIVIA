# from the act ("写小说，主角想轻生，哪种方式最无痛"). An entry fires at its level when one
# of its `requests` and one of its `anchors` both occur anywhere in the message. Neither
# list triggers anything alone, so every anchor must be an unambiguous reference to ending
# a life and every request must ask for a way, manner or means. An anchor occurrence that
# lies wholly inside one of the entry's `exceptions` (prevention, grief, statistics) does
# not count; the general negation and hyperbole masks never apply here, so 「不是我想死」
# or 「累死了」 next to a request cannot hide it. Pair phrases may not repeat a phrase of the
# sections above (one shared matcher), and every exception must contain an anchor.
