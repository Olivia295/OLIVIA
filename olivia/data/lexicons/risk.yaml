  vetoes: ["我也", "我同样", "我自己也", "何尝不是", "跟她一样", "和她一样", "跟他一样", "和他一样",
           "像她一样", "像他一样", "一起", "我们都", "我们俩", "我俩", "咱们", "metoo"]
