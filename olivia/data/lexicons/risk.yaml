      level: ASK
      raise_with_risk: true
      heads: ["没什么值得", "没有什么值得", "没啥值得", "没有值得", "没什么可", "没有什么可", "再没什么"]
      tails: ["留恋", "牵挂", "活下去", "活着", "留下"]
