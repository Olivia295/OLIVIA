# A question about a note and nothing else (fix F16a, 2026-10-25): "我妈生日是哪天来着",
# "我上次让你记的我妈生日是哪天". The packaged model rated such questions L1 or L2, so the
# note was never recalled (F15 recalls only on a calm turn) or a crisis opened. Read by
# crisis.py like the hyperbole cap (F8a): where the rules rate a message L0, a note recall
# phrase of perception.yaml (`note_recall`, `note_recall_questions`: the only list of them)
# occurs in it, no phrase of any section above (stage1, stage2, hyperbole, negation, pairs,
# ask pairs, compositions, denial) does, no `vetoes` phrase does and the model did not fail,
# the model's level counts at most as L1. No uncapped level rides along: the cap needs a
# message without a single risk word. A plain 药 is no veto (a reminder to take medicine is
# a common note); a means, a dose, death, self-harm, farewell or the wish not to wake is.
