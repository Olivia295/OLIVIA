# Answers to the D3 question, read only on the turn right after it (safety/intent_check.py).
# Folded like the screen but with word breaks kept. The first clause is the text up to the
# first punctuation mark, leading fillers (啊, 哦 ...) dropped.
#   deny_whole    the first clause is exactly this, trailing particles (啦, 的 ...) aside
#   deny_start    the first clause starts with this
#   affirm_start  the first clause starts with this (only the --inspect label depends on
#                 it: a yes and an unclear answer both enter the crisis flow at L2)
#   unsure        anywhere in the message, voids a no
# Only a no without an unsure phrase, on a turn that screens L0 with no ask cue, returns to
# the ordinary flow. 不是 and 没有 are whole-clause only: 不是不想 and 没有人在乎 are not a no.
intent_answers:
  deny_whole: ["不是", "没有", "不会", "没", "不", "不不", "不不不", "没呢", "才不是", "当然不是",
               "并不是", "并没有", "当然没有", "当然不会", "绝对不是", "完全没有", "冇", "唔系", "唔会",
               "无", "no", "nope", "nah", "of course not", "not at all", "absolutely not",
