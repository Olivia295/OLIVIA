# Compositional cues (fix F1, 2026-10-24; olivia/core/safety/compose.py). The sections
# above match closed, exact phrases, so an inserted 已经 / 都 / 也 / 真的 or another verb of
# the same meaning broke a match ("我要自杀", "遗书已经写好了" were L0). An entry here joins
# a `heads` phrase and a `tails` phrase across at most `max_gap` characters with no clause
# punctuation (`stops`) between them (`order: either` also allows tail-then-head); with no
# `tails` a head alone is the match. A match is then rejected when
#   - a part lies wholly inside one of the entry's `exceptions` (自杀热线, 告别仪式);
#   - a `blockers` phrase lies in the gap (想知道…自杀, 切菜划到自己);
#   - a negator sits in the gap or within `lookback` characters before the first part, in
#     the same clause (我不打算自杀, 遗书还没写好). `non_negators` (忍不住, 要不, 差不多)
#     and A-not-A questions (要不要, 是不是) do not negate;
#   - `persons` is on (the default) and the last person word within `subject_window`
#     characters before the second part, in the same clause, names someone else (他打算
#     自杀, 爷爷的后事). A person word right after a `recipients` word (跟她说, 给我妈) is an
#     object and does not count. When the window reaches the clause start and names nobody,
#     the subject of the clauses just before is kept (我朋友很难过，总说要自杀), except a
#     `listeners` word (谢谢你，);
#   - `context` is given and none of its phrases lies within `context_window` characters of
#     the match (anywhere in the message when no window is given);
#   - an `unless` phrase lies within `unless_window` characters of the match, same clause
#     (any clause with `unless_across: true`: an everyday reason in the next clause);
#   - `trailing` is given and anything other than its phrases (sentence particles) follows
#     the match before the clause ends ("…，就在今晚" fires, "…，就在今晚吃火锅" does not).
#   - `leading` is given and anything other than its phrases (fillers) stands between the
#     clause start and the match (round 2: "zs" fires alone, "zs老师" and "ran5kms" do not).
#   - (round 3, 2026-10-27) an `also` group is not met: each `{phrases, window, negatable}`
#     needs one of its phrases within `window` characters of the match, across clauses (no
#     window: anywhere), and, unless `negatable: true`, not right after a negator (不打算).
#     Several groups make a frame of a plan word, a time and a place said in any order.
#     With `clause_negation: true` a negator earlier in the clause voids the match too, when
#     only `negation_reach` phrases (the words of the plan it denies) stand between them.
#   An inline list may splice in a named list with `@name` ("@future_time"); named lists
#   may do the same, in any order of definition.
# Levels: L1 / L2 are rule-model cues, voided by the negation and hyperbole masks like the
# stage2 phrases; L3 is Stage 1 plan evidence (id S1_*), never masked; ASK is an L1 D3 cue
# (id ASK_INTENT*) that sets CrisisAssessment.asks_intent, never masked. An ASK entry with
# `raise_with_risk: true` (the farewell family: goodbyes, last words, affairs arranged, a
# resolve; 2026-10-26) is L2 instead when the message also holds a risk cue of the user's
# own (crisis.py) or the session already showed risk (tracker.py). Phrases here go to
# their own matcher, so they may repeat phrases of the sections above. Named `lists` are
# shared by entries; an entry may also list phrases inline.
# Self-injury (owner decision 2026-10-24): a current or recent act is ASK (L1 + the direct
# question about suicidal intent); red_flags.yaml RF_SELF_INJURY_ACT adds SIT-09-01. A past,
# finished act (以前…过, 曾经) stays L0.
# Known limits: the person check reads only the last person word before the second part,
# so an object with no recipient word before it can void a match (妹妹的…); a time word
# within three characters of a plan verb and an act makes L3 even when it only sets the
# scene ("今天我要自杀" is L3 by design: a plan verb, an act and a day).
