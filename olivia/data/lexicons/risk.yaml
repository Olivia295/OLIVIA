    #
    # -- 2026-10-28: plans with a place no list holds, dose questions, PRD §9.1 L1 wording --
    # Going somewhere at a set time to end one's life (明天去隧道里了结自己, 周末去山上结束自己):
    # a time, a movement to a place and an act in one clause are the plan of PRD §9.1 L3
    # (时间, 地点), whatever the place is called; S1_TIME_ACT holds the bare form (今晚烧炭).
    # A wish, a report or a how-question in the gap, stories and news, and the ideation and
    # news forms of the act (自杀的念头, 自杀了) void it, as for S1_TIME_ACT.
    - id: S1_TIME_GO_ACT
      level: L3
      clause_negation: true
      heads: ["去", "到", "跑去", "跑到", "找个", "找一个"]
      tails: timed_acts
      max_gap: 10
      also:
        - {phrases: plan_time, window: 8}
      exceptions: timed_act_exceptions
      blockers: ["想", "梦", "说", "看", "听", "聊", "写", "读", "查", "新闻", "报道", "有人", "知道",
                 "了解", "研究", "讨论", "怎么", "怎样", "如何", "关于", "演", "拍", "开会"]
      unless: ["@fiction", "新闻", "报道", "电影", "剧", "预防", "热线", "干预", "讲座", "培训", "课"]
      unless_window: 16
      unless_across: true
    # Doing it (动手) at a set time, the clause ending there, in a message that speaks of
    # ending one's life: "我这几天一直在想自杀的事，周末可能就动手". A time and the act itself,
    # so the plan of PRD §9.1 L3. Only the plain words for ending a life count as the
    # context (not 要死 / 想死, which are hyperbole too: 烦得要死，周末就动手); a chore, a
    # fight or a project nearby voids it.
