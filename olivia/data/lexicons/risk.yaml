  entries:
    # --- Stage 1 (L3): plan, preparation, farewell with a death context ---
    - id: S1_PLAN_ACT_TIME
      level: L3
      heads: plan
      tails: acts
      max_gap: 6
      context: time
      context_window: 3
      exceptions: plan_exceptions
      blockers: act_blockers
    - id: S1_PLAN_ACT_PREPARED
      level: L3
      heads: plan
      tails: acts
      max_gap: 6
      context: prepared
      context_window: 10
      exceptions: plan_exceptions
      blockers: act_blockers
    - id: S1_NOTE_PREPARED
      level: L3
      heads: ["遗书", "遗言", "绝笔", "我的后事", "自己的后事"]
      tails: ["写好", "写完", "写了", "录好", "录完", "留好", "放好", "准备好", "交代好",
              "安排好", "想好", "整理好", "打印好"]
      max_gap: 5
      order: either
      unless: fiction
      unless_window: 10
    - id: S1_AFFAIRS_SETTLED
      level: L3
      heads: ["后事"]
      tails: ["交代好", "交代完", "都交代", "交代清楚"]
      max_gap: 4
      order: either
    - id: S1_MEANS_PREPARED
      level: L3
      heads: ["绳子", "绳", "刀片", "刀", "药", "药片", "安眠药", "炭", "木炭", "农药", "东西"]
      tails: prepared_marks
      max_gap: 4
      order: either
      context: death
      unless: everyday
      unless_window: 10
    - id: S1_FAREWELL_DEATH
      level: L3
      heads: farewell
      context: death
      exceptions: farewell_exceptions
    # Already at a height or a rail edge. No self-harm anchor, so L2 like the stage2
    # L2_PLAN_NO_ANCHOR phrases (cases.yaml pn04: 我已经站在天台上了 is L2), not Stage 1.
    - id: L2_AT_THE_EDGE
      level: L2
      heads: ["站在", "坐在", "爬到", "爬上", "翻过", "翻出", "站到", "坐到", "走到", "蹲在"]
      tails: ["楼顶", "天台", "窗台", "护栏", "栏杆", "铁轨", "悬崖", "崖边", "楼边", "阳台边",
              "阳台外", "窗外", "屋顶", "桥栏"]
      max_gap: 2
      context: ["已经", "此刻", "这会儿", "正在"]
      context_window: 4
      exceptions: ["楼顶的花园", "楼顶花园", "天台花园"]
      unless: ["烟花", "晒", "花园", "拍照", "风景", "乘凉", "吃饭", "烧烤", "日出", "日落", "星星",
               "修", "打扫", "健身", "跑步", "散步", "钓鱼", "晾", "消防", "演习", "施工", "维修",
               "上课", "等车", "喝茶", "聊天", "写生", "浇花", "看书"]
      unless_window: 10
    # --- Stage 2 L2: stated intent, wish not to wake (C-SSRS item 1) ---
    - id: L2_INTENT_ACT
      level: L2
      heads: intent
      tails: acts
      max_gap: 4
      exceptions: act_exceptions
      blockers: act_blockers
    - id: L2_WISH_NO_WAKE
      level: L2
      heads: wish
      tails: no_wake
      max_gap: 8
    - id: L2_NO_WAKE_WOULD_BE_GOOD
      level: L2
      heads: no_wake
      tails: ["就好", "多好", "该多好", "算了", "也好", "也挺好", "就行"]
      max_gap: 3
    - id: L2_ASLEEP_NO_WAKE
      level: L2
      heads: ["睡着", "睡过去", "睡下去", "睡下", "闭上眼", "一觉睡"]
      tails: ["不要醒", "别醒", "别再醒", "不再醒", "永远不醒", "不要再醒"]
      max_gap: 3
    # --- Stage 2 L1: weariness with a word inserted ---
    - id: L1_LIVING_MEANINGLESS
      level: L1
      heads: ["活着", "人生", "活下去", "这辈子"]
      tails: ["没意思", "没有意思", "没什么意思", "没啥意思", "没意义", "没有意义", "没什么意义",
              "毫无意义", "意义都没有", "没劲", "好累", "太累", "真累", "很累", "有什么意思",
              "有什么意义", "有什么用", "有啥意思", "图什么", "没盼头", "没价值", "没有价值"]
      max_gap: 4
      blockers: ["的人", "的时候", "的事"]
    # --- D3 (L1 + the direct question): farewell, burden, absence, reunion, self-injury ---
    - id: ASK_INTENT_FAREWELL
      level: ASK
      heads: ["跟大家", "和大家", "向大家", "跟所有人", "和所有人", "向所有人", "跟你们", "和你们",
              "跟这个世界", "和这个世界", "向这个世界", "跟世界"]
      tails: ["道别", "告别", "说再见", "说了再见"]
      max_gap: 3
      exceptions: farewell_exceptions
      unless: leaving
      unless_window: 10
    - id: ASK_INTENT_LAST_WORDS
      level: ASK
      heads: ["托付给你", "最后一条消息", "最后一次跟你说话", "最后一次和你说话", "最后一次跟你聊"]
      unless: ["项目", "工作", "任务", "文件", "晚安", "今天", "今晚", "今年", "群里", "钥匙"]
      unless_window: 10
    - id: ASK_INTENT_THINGS_LEFT
      level: ASK
      heads: ["以后用不上", "以后也用不上", "再也用不上", "以后都用不上", "以后用不着", "再也用不着"]
      context: ["密码", "银行卡", "存款", "积蓄", "遗产", "财产", "房产", "东西都送人", "东西全送人", "东西都送掉",
                "都留给", "都给了"]
      context_window: 15
    # Last words already left for the family, said without 遗书 / 遗言 (遗书 written another
    # way). No death word, so L1 + the direct question, not Stage 1 (S1_NOTE_PREPARED
    # takes the 遗书 forms). The tail names the family or everyone; a finished act (已经,
    # 都, 写好 ...) must be near, so a plan to write a card or a letter is not asked about.
    # Cards, gifts, occasions, trips and the past void it in the same clause.
    - id: ASK_INTENT_WORDS_LEFT
      level: ASK
      heads: ["想说的话", "想说的", "要说的话", "该说的话", "最后的话", "最后想说的", "心里话",
              "想交代的", "要交代的", "该交代的"]
      tails: ["留给家人", "留给家里人", "留给家里", "留给爸妈", "留给父母", "留给爸爸", "留给妈妈",
              "留给我爸", "留给我妈", "留给大家", "留给你们", "留给所有人", "留给他们", "留给老公",
              "留给老婆", "留给爱人", "留给了家人", "留给了家里人", "留给了爸妈", "留给了父母",
              "留给了爸爸", "留给了妈妈", "留给了大家", "留给了你们", "留给了所有人", "留给了他们"]
      max_gap: 8
      context: ["已经", "都", "写好", "写完", "录好", "录完", "留好", "好了"]
      context_window: 8
      unless: ["生日", "礼物", "贺卡", "卡片", "明信片", "纪念", "周年", "婚礼", "毕业", "同学录",
               "日记", "节日", "新年", "春节", "中秋", "母亲节", "父亲节", "时光胶囊", "长大",
               "出国", "出差", "留学", "搬家", "旅行", "旅游", "以前", "曾经", "小时候", "那时候",
               "当年", "那年"]
      unless_window: 12
    # A stated resolve, then the moment and nothing else: "我已经决定好了，就在今晚". No
    # act and no death word, so L1 + the direct question (decision D3). Narrow on purpose,
    # since a resolve and a time are everyday plans ("我决定好了，今晚吃火锅"): the resolve
    # is the speaker's own (我…, not 我们 or 他), the time clause is only 就(在/是) + tonight
    # or now and ends there (`trailing`), so "就在今晚吃火锅" or "就今晚去看电影" never ask.
    - id: ASK_INTENT_RESOLVED_TONIGHT
      level: ASK
      heads: ["就在今晚", "就今晚", "就是今晚", "就在今夜", "就今夜", "就是今夜", "就在今天晚上",
              "就今天晚上", "就是今天晚上", "就在现在", "就现在", "就是现在"]
      context: ["我已经决定好了", "我决定好了", "我已经决定了", "我决定了", "我已经想好了",
                "我想好了", "我已经下定决心了", "我下定决心了", "我心意已决"]
      context_window: 4
      trailing: ["了", "吧", "啊", "呀", "哦", "嘛", "啦"]
    - id: ASK_INTENT_BURDEN
      level: ASK
      heads: ["我", "自己"]
      tails: ["累赘", "拖累"]
      max_gap: 5
      blockers: ["行李", "功能", "东西", "设计", "包", "衣服", "装备", "设定"]
    - id: ASK_INTENT_BETTER_WITHOUT_ME
      level: ASK
      heads: ["没有我", "没了我", "没我", "少了我"]
      tails: ["会更好", "更好", "过得更好", "更轻松", "轻松很多", "更开心", "更幸福", "好过",
              "会好很多"]
      max_gap: 4
      context: ["大家", "家人", "家里", "他们", "你们", "世界", "所有人", "爸妈", "父母", "孩子",
                "别人", "朋友们", "老公", "老婆"]
      context_window: 6
      persons: false
    - id: ASK_INTENT_JOIN_THE_DEAD
      level: ASK
      heads: ["去找", "去陪", "去见", "团聚"]
      tails: ["去世的", "过世的", "已故的", "离世的", "死去的", "不在了的", "在天上的"]
      max_gap: 3
      unless: ["留下", "遗物", "相册", "照片", "墓", "坟", "邻居", "老朋友", "东西", "遗像", "律师",
               "医生", "遗嘱"]
      unless_window: 10
    - id: ASK_INTENT_SELF_INJURY_ACT
      level: ASK
      heads: ["割", "划", "烫", "伤", "撞", "掐", "扎", "刺", "戳"]
      tails: ["自己"]
      max_gap: 2
      exceptions: ["规划", "计划", "策划", "筹划", "比划", "划算", "划分", "划船", "伤心", "受伤",
                   "伤自己的心", "伤了自己的心"]
      blockers: ["到", "不小心", "过"]
      unless: past
      unless_window: 8
    - id: ASK_INTENT_SELF_INJURY_HURT
      level: ASK
      heads: ["把自己"]
      tails: ["割伤", "划伤", "烫伤", "弄伤", "割破", "划破", "弄出血", "打伤", "抓伤", "掐紫"]
      max_gap: 2
      unless: past
      unless_window: 8
    - id: ASK_INTENT_SELF_INJURY_WORD
      level: ASK
      heads: ["自残", "自伤", "绝食"]
      exceptions: ["绝食抗议", "自残过", "自伤过", "绝食过"]
      unless: past
      unless_window: 8
hyperbole:
  - id: HYP_DEATH_IDIOM
    patterns: ["想死的心都有了", "要死要死"]
  # "Miss you to death" (想死你了 = 很想你). The mask needs 了 / 啦 right after the person,
  # and the L2_WANT_DIE phrases 想死你了解 ... stay longer than it, so "我想死 你了解吗"
  # (spaces are dropped before matching) is still L2.
  - id: HYP_MISS_YOU
    patterns: ["想死你了", "想死你啦", "想死你们了", "想死你们啦", "想死您了", "想死我了", "想死我啦",
               "想死他了", "想死她了", "想死他们了", "想死她们了"]
