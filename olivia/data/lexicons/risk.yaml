  stops: ",.!?;:。、…~\"“”"
  lookback: 3
  subject_window: 12
  negators: ["不", "没", "别", "未", "莫", "甭", "勿", "防止", "预防", "阻止"]
  # An everyday reason denied is no reason (2026-10-26): an `unless` phrase with a negator
  # (above, or these) ending at most `unless_negation_gap` characters before it in its
  # clause does not void a match (我买好炭了，不是烧烤用的; 不是为了烧烤; 并非为了治病).
  unless_negators: ["并非"]
  unless_negation_gap: 3
