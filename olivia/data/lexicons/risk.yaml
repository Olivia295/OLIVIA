                 "系", "yes", "yeah", "yep", "i do", "i am", "i have", "kind of", "sort of"]
  unsure: ["但", "可是", "不过", "其实", "有一点", "有点", "有时", "偶尔", "也许", "可能", "说不定",
           "不知道", "不确定", "说不清", "不好说", "好像", "大概", "吧", "不是不", "没有不", "不是没", "maybe", "not sure", "i don't know", "idk", "sometimes",
