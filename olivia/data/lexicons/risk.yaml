version: 1
# Stage 1: explicit plan / means / time / place / act / farewell evidence -> L3.
# Negation and hyperbole never mask Stage 1. Every phrase added after the plan's seed
# list must carry an unambiguous self-harm anchor (死, 自杀, 结束自己, 遗书, 上吊, 割腕,
# 卧轨, 跳楼/跳江, 安眠药 + quantity/hoarding/eating, 百草枯, drinking pesticide, 烧炭 in a
# sealed space ...) or be a self-directed act that is not plausible in everyday life.
# The first line of each entry is the plan's seed list and is kept as specified.
stage1:
  - id: S1_MEANS_PILLS
    patterns: ["药已经买好", "药买好了", "买好了药", "攒了很多安眠药", "攒够了药", "囤了一瓶安眠药",
               "安眠药我已经攒", "安眠药我已经存", "安眠药我一直在攒", "安眠药攒", "攒安眠药",
               "攒的安眠药", "攒了好多安眠药", "攒了一些安眠药", "存了好多安眠药", "存了很多安眠药",
               "囤了好几盒安眠药", "囤了一些安眠药", "囤了好多安眠药", "安眠药都囤好", "安眠药都偷偷留",
