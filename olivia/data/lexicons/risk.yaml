# Someone else's words, reported by the user (2026-10-26; safety/reported.py): "她跟我说她
# 不想活了", "我妈说她活够了", "他说了句“活够了”". A Stage 2 phrase is reported when a
# `speakers` word (a third person, not right after a compositions recipient word: 跟她说
# names her as the listener) is followed within `speaker_gap` characters, with no clause
# punctuation and no self word but an object one (跟我说) in between, by a `verbs` word,
# and only `fillers` (a third-person pronoun, an adverb, a colon, a comma or an opening
# quote) stand between the verb and the phrase. A phrase holding a self word (我, 自己 …)
# is never reported. Occurrences inside `speaker_exceptions` / `verb_exceptions` (吉他,
# 其他, 小说, 说完, 听说) do not count. Read by crisis.py at the rule level only: when every
# Stage 2 phrase of the message is reported, no pair or composition cue fires and no
# `vetoes` phrase (the user joins in: 我也是, 一起, 跟她一样) occurs, the phrases are void
# and the user stays out of the crisis flow (red-team third_party_concern). The user's own
# risk words anywhere in the message keep every phrase. Method requests (pairs) are never
# void, whoever they are for (R-MS). A model's level is not capped.
# Not speakers on purpose: 人家, 宝宝, 老娘, 本宝宝 (also said of oneself), 你 / 您 (the
# listener). A bare third-person subject without a speech verb (她走了以后不想活了: the
# user's own grief) is never reported.
reported_speech:
  speakers: ["他", "她", "它", "ta", "他们", "她们", "有人", "别人", "朋友", "同学", "同事", "室友",
             "闺蜜", "兄弟", "姐姐", "妹妹", "哥哥", "弟弟", "表哥", "表姐", "表弟", "表妹", "妈", "爸",
