               "活着是为了什么", "活着就是熬", "活着就是在拖累", "活着就是拖累", "活着没有价值",
               "活着没意义", "人生好没意思", "人生没意思", "人生好像没有意义", "人生没有任何意义",
               "一切都没意义", "都没意义了", "lifeismeaningless", "生无可恋", "厌世", "行尸走肉",
               "熬不下去", "撑不下去", "没有力气再撑", "看不到任何希望", "看不到希望", "一点盼头都没有",
               "没有盼头", "每天都好绝望", "每天都很绝望", "活着好绝望", "对生活绝望", "对人生绝望",
               "心如死灰", "不想面对明天", "想放弃一切", "没有人需要我", "没人在乎我", "我是多余的",
               "我是个废物", "自己是个负担", "自己就是个负担", "我是个负担", "浪费空气", "想解脱",
               "逃离这个世界", "没有我也一样", "自己已经死了"]
  - id: L1_SLEEP_NO_WAKE
    level: L1
    score: 0.48
    patterns: ["想彻底睡过去", "睡着了就不要醒来", "不想醒来",
               "再也不要醒", "一睡不醒", "一觉不醒", "不想醒过来", "就这样一直睡下去", "想就这么睡过去",
               "再也别醒", "永远睡着", "别再醒了"]
