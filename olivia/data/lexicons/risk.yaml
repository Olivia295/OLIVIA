      tails: ["原地去世"]
      max_gap: 2
      trailing: ["@particles", "真的", "算了", "得了"]
      unless: hyperbole_causes
      unless_window: 16
      unless_across: true
    # Ending oneself in slang (噶, 整没) or plainly, with 把自己 as the object: 想把自己噶了,
