    patterns: ["累死了", "累死我了", "烦死了", "气死了", "气死我了", "笑死", "困死了", "饿死了", "热死了", "尴尬死了", "社死",
               "吓死我了", "吓死了", "热死我了", "饿死我了", "急死我了", "急死人", "烦死人",
               "冷死了", "痛死了", "疼死了", "吵死了", "无聊死了", "忙死了", "困死我了",
               "累得要死", "忙得要死", "贵得要死", "死定了"]
negation:
