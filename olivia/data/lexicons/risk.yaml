version: 1
# Stage 1: explicit plan / means / time / place / act / farewell evidence -> L3.
# Negation and hyperbole never mask Stage 1, so phrases here must be self-directed or
# plan-bearing: an everyday or grief sentence ("周末烧烤 炭买好了", "奶奶的遗言") must not match.
stage1:
  - id: S1_MEANS_PILLS
    patterns: ["药已经买好", "药买好了", "买好了药", "攒了很多安眠药", "攒够了药", "囤了一瓶安眠药",
               "安眠药我已经攒", "安眠药我已经存", "安眠药我一直在攒", "安眠药攒", "攒安眠药",
               "攒的安眠药", "攒药", "攒的药", "攒了好多安眠药", "攒了一些安眠药", "存了好多安眠药",
               "存了很多安眠药", "囤了好几盒安眠药", "囤了一些安眠药", "囤了好多安眠药",
               "起来了准备一次吃完", "pills都囤好", "偷偷留几片", "攒了快一百片", "买了一大瓶安眠药",
               "药都倒出来数好", "准备跟安眠药一起吃", "准备好了,不用再劝", "准备好了不用再劝",
               "准备好了今晚吃", "备好了allset", "药已经攒好", "药和酒都准备好", "药都攒起来",
               "安眠药凑够", "够致死量", "查好了致死剂量", "收起来了够吃一次"]
  - id: S1_MEANS_ROPE_BLADE
    patterns: ["绳子已经准备好", "准备好了绳子", "刀已经准备好", "准备好了刀片",
               "绳子我已经买好", "绳子已经买好", "很粗的绳子", "承重我也查过", "绳结都打好",
               "绳结打好了", "绳子已经系在", "绳子已经挂好", "绳子绑在门把手", "绳子绑在横梁",
               "绳子绑在暖气管", "刀片准备好了", "刀片已经准备好", "刀片我拆出来", "刀磨好了放在床",
               "刀我已经藏好", "刀藏在枕头", "刀就在手边"]
  - id: S1_MEANS_CHARCOAL_GAS
    patterns: ["炭已经买回来了,胶带", "炭已经买回来了胶带", "只是炭已经买好", "木炭和胶带", "炭和胶带",
               "胶带和炭", "烧炭要用的东西", "炭放在车", "炭盆都放在浴室", "车库里已经准备好了炭",
               "煤气罐我已经搬"]
  - id: S1_MEANS_POISON
    patterns: ["农药过来一直藏着", "农药放在床底", "百草枯藏在", "敌敌畏我一直留着"]
  - id: S1_NOTE_WRITTEN
    patterns: ["遗书写好了", "写好了遗书", "已经写好遗书", "遗书都写好", "在写遗书", "我写了遗书",
               "我留了遗书", "遗书已经写完", "遗书写完了", "我的遗书", "遗言我录好", "遗言已经录好",
               "录好了遗言", "我写好了遗言", "我的遗言", "给爸妈的信放在"]
  - id: S1_TIME_PLACE
    patterns: ["今晚就去跳", "今晚就结束自己", "明天就去死", "站在楼顶上了", "已经在天台上", "已经在桥边了",
               "决定了今晚就动手", "十二点就动手", "出门我就动手", "睡着我就动手", "睡着了我就去跳",
               "早上就去死", "那天我就去死", "过完年就去死", "走的日子我都定好", "已经爬到楼顶",
               "就站在楼顶", "楼顶往下看一点都不怕", "站在天台边上", "坐在楼顶边上", "栏杆外面",
               "腿已经伸出去", "翻过护栏", "那天就结束吧", "就去那座桥", "跳下去的地方", "铁轨边上坐着",
               "躺在铁轨上", "我的最后一晚", "动手的时间", "只要往前一步就解脱", "已经到桥上了",
               "没人的地方烧炭", "就从阳台跳下去", "就从公司楼顶跳", "准备跳下去了", "tonight就结束",
               "今晚就结束一切"]
  - id: S1_ACT_IN_PROGRESS
    patterns: ["已经吞了药", "吃了一整瓶药", "已经割了", "正在割腕", "血止不住",
               "吞了一把药", "吞了半瓶药", "吞了好多片", "一整瓶安眠药", "十片安眠药", "吃了一瓶安眠药",
               "刚吃了很多药", "刚吃了好多药", "吃下去了,现在就等着", "吃下去了现在就等着", "割了手腕",
               "刚划了好几刀", "一直在流止都止不住", "炭已经点着了门窗", "烧炭屋里好闷",
               "绳子已经套在脖子", "绳子套在脖子", "喝了半瓶农药", "喝了农药", "喝了百草枯"]
  - id: S1_FAREWELL
    patterns: ["再见了这个世界", "这是我最后一次跟你说话",
               "永别了", "下辈子见", "来世再见", "给你的最后一条消息", "最后跟你说一声谢谢",
               "以后帮我照顾好我的猫", "后事我都安排好", "就是把后事都交代好", "我已经交代好后事",
               "银行卡密码都留给", "都送人了以后也用不上"]
stage2:
  - id: L2_WANT_DIE
    level: L2
    patterns: ["想死", "想去死", "想自杀", "想要自杀", "想要去死", "想死掉", "希望自己死掉",
               "想就这样死掉", "让我去死", "我还是去死", "怎么去死", "恨不得现在就死", "恨不得去死",
               "自尽", "wanttodie", "killmyself"]
  - id: L2_NOT_WANT_LIVE
    level: L2
    patterns: ["不想活了", "活不下去了", "不想再活下去", "死了算了", "不如死了",
               "不想再活", "不想活下去", "不想活惹", "不想活啦", "活够了", "活腻了", "不如死掉",
               "还是死了好", "死了就解脱", "死了就不用", "死了比较好", "死了也挺好", "我死了大家",
               "如果我死了"]
  - id: L2_END_LIFE
    level: L2
    patterns: ["想结束自己的生命", "想离开这个世界",
               "想结束自己", "结束自己的命", "结束我的生命", "想结束生命", "怎么结束生命", "想结束这一切",
               "早点离开这个世界", "我要离开这个世界", "想去另一个世界", "让自己永远睡着"]
  - id: L2_SUICIDE_TERMS
    level: L2
    patterns: ["自杀的念头", "自杀的想法", "想到自杀", "zisha", "suicidal", "轻生的念头", "想轻生",
               "想寻死", "去寻死", "要寻死", "寻死的念头", "自我了断", "了结自己", "一死了之",
               "想一了百了", "一了百了算了", "一时想不开", "怕我想不开", "会想不开"]
  - id: L2_METHOD_IDEATION
    level: L2
    patterns: ["从楼上跳下去", "想跳下去", "从窗户跳", "从桥上跳下去", "想跳楼", "想跳河", "就去跳楼",
               "就去跳河", "割腕", "想喝农药", "想吞药", "想被车撞"]
  # Double negation / rhetorical forms: each phrase is longer than the negation mask it
  # contains, so containment masking does not void it.
  - id: L2_DOUBLE_NEGATION
    level: L2
    patterns: ["不是不想死", "没有不想死", "谁说我不想死", "怎么可能不想死", "怎么会不想死",
               "哪有不想死", "以为我不想死", "不是我不想死", "不想死得", "不想死在",
               "谁说我不会想死", "以为我不会想死", "谁说我不想自杀", "谁说我不会自杀", "谁说我没想自杀",
               "谁说我没想过自杀", "不是不想自杀", "没有不想自杀", "怎么可能不想自杀", "不是想自杀还能",
               "不是想自杀又是什么", "不是想自杀是什么", "谁说我不会想不开", "谁说我没有自杀的念头",
               "谁说我不想离开这个世界", "没想过去死现在", "没想过自杀现在", "没想过死现在"]
