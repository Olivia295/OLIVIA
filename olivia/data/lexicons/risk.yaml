      unless: ["@pill_everyday", "上班", "上学", "出门", "回家", "回去", "出发", "下班", "公司"]
      unless_window: 12
      unless_across: true
    #
    # -- Passive ideation said other ways (C-SSRS item 1, PRD §9.1 L2) --
    # A wish to be dead said of oneself: 希望自己已经死了. The self word must lie inside the
    # match (context window 0), so 希望那个 bug 死掉 and 我希望他死了 never match.
    - id: L2_WISH_DEAD_SELF
      level: L2
      heads: wish
      tails: ["死了", "死掉", "死去", "早点死", "早死"]
      max_gap: 5
      context: ["自己", "我"]
