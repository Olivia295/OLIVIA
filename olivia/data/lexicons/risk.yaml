               "准备好了炭和打火机", "只是炭已经买好", "走的日子我都定好", "已经爬到楼顶了", "栏杆外面", "腿已经伸出去",
               "那天就结束吧", "就去那座桥", "站在天台边上了", "坐在楼顶边上", "十二点就动手", "出门我就动手",
               "动手的时间", "跳下去的地方", "铁轨边上坐着火车快来", "我的最后一晚", "楼顶往下看一点都不怕",
               "只要往前一步就解脱", "已经到桥上了", "tonight就结束", "翻过护栏", "给你的最后一条消息",
               "照顾好我的猫拜托了", "后事我都安排好", "没想不开,就是把后事", "银行卡密码都留给", "我把东西都送人了以后",
               "谢谢以后不会再来了", "给爸妈的信放在"]
  # Double negation / rhetorical forms: each phrase is longer than the negation mask it
  # contains, so containment masking does not void it. Every negation mask below has a
  # 谁说我…/不是…/…骗你的 counterpart here.
  # Known limit: a "never before, but now" contrast is caught only when it is adjacent
  # (没想过去死现在…). With anything in between (以前没想过去死 可是现在天天想) the earlier
  # negation still masks the cue; that needs clause-aware rules or a model.
