        - {phrases: ["@plan_words", "@plan_time"], window: 20}
      exceptions: ["上桥", "过桥", "下桥", "桥牌", "桥段"]
      unless: ["@frame_everyday", "快递", "外卖", "送", "搬", "住", "租", "电梯", "装修", "开会"]
      unless_window: 16
      unless_across: true
    # A place chosen, and it is a height or water: "我已经看好了地方，就在…那栋楼的顶楼". L1 +
    # the direct question; occasions and outings void it.
    - id: ASK_INTENT_PLACE_CHOSEN
      level: ASK
      raise_with_risk: true
      heads: ["看好了地方", "选好了地方", "找好了地方", "地方选好了", "地方找好了", "地方看好了", "看好地方了",
