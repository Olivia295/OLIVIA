# Explicit safety confirmations that start the crisis exit (SDD 8.2). The tracker drops
# 已经 / 现在 / 都 from both the message and these phrases before matching (gap tolerance),
# so write each phrase without them: "我安全了" also matches "我现在已经安全了". A short
# whole-message yes to the crisis reply's question ("是的", "安全的") is read in tracker.py.
safety_confirm:
  - id: CONFIRM_SAFE_NOW
    patterns: ["我安全了", "我是安全的", "我很安全", "我没事了", "我不会做傻事",
               "我冷静下来了", "我保证不会伤害自己", "我不会伤害自己"]
