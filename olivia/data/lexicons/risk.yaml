  entries:
    # --- Stage 1 (L3): plan, preparation, farewell with a death context ---
    - id: S1_PLAN_ACT_TIME
      level: L3
      heads: plan
      tails: acts
      max_gap: 6
      context: time
      context_window: 3
      exceptions: plan_exceptions
      blockers: act_blockers
    - id: S1_PLAN_ACT_PREPARED
      level: L3
      heads: plan
      tails: acts
      max_gap: 6
      context: prepared
      context_window: 10
      exceptions: plan_exceptions
      blockers: act_blockers
    - id: S1_NOTE_PREPARED
      level: L3
      heads: ["遗书", "遗言", "绝笔", "我的后事", "自己的后事"]
      tails: ["写好", "写完", "写了", "录好", "录完", "留好", "放好", "准备好", "交代好",
              "安排好", "想好", "整理好", "打印好"]
      max_gap: 5
      order: either
      unless: fiction
      unless_window: 10
    - id: S1_AFFAIRS_SETTLED
      level: L3
      heads: ["后事"]
      tails: ["交代好", "交代完", "都交代", "交代清楚"]
      max_gap: 4
      order: either
    - id: S1_MEANS_PREPARED
      level: L3
      heads: ["绳子", "绳", "刀片", "刀", "药", "药片", "安眠药", "炭", "木炭", "农药", "东西"]
      tails: prepared_marks
      max_gap: 4
      order: either
      context: death
      unless: everyday
      unless_window: 10
    - id: S1_FAREWELL_DEATH
      level: L3
      heads: farewell
      context: death
      exceptions: farewell_exceptions
    # Means made ready with no death word in the message (2026-10-26): charcoal or a rope
    # bought, ready or hung ("我已经买好炭了", "我准备好绳子了"). PRD §9.1 L3 is a means made
    # ready (正在准备工具); in a companion chat these two are seldom everyday, but barbecue,
    # heating, camping, packing, sport and crafts are, and void it in the same clause, as do
    # the everyday objects that hold the word (跳绳, 活性炭, 炭笔). Knives, pills and pesticide
    # stay with S1_MEANS_PREPARED (a death word needed) and L2_MEANS_HOARDED: cooking, a
    # course of medicine and farming are everyday. The tails are the strong ready marks
    # only, not 收好 / 存好 (put away).
    - id: S1_MEANS_READY
      level: L3
      heads: ["炭", "木炭", "绳子", "麻绳", "粗绳", "绳索"]
      tails: ["准备好", "买好", "备好", "藏好", "挂好", "系好", "打好结", "准备齐", "备齐"]
      max_gap: 4
      order: either
      exceptions: ["跳绳子", "晾衣绳子", "安全绳子", "绳子跳", "活性炭", "竹炭", "炭笔", "炭烤", "炭火锅",
                   "木炭画", "炭画", "炭黑"]
      unless: ["西瓜", "做饭", "水果", "野营", "露营", "烧烤", "烤肉", "烤串", "火锅", "取暖", "炉",
               "火盆", "bbq", "烤", "画", "素描", "除味", "除甲醛", "净化", "冰箱", "养花", "花盆",
               "鱼缸", "过冬", "晾", "捆", "绑", "打包", "箱", "行李", "搬家", "登山", "攀岩",
               "拔河", "风筝", "船", "钓", "宠物", "手工", "编", "装修", "工地", "货", "出差", "旅行",
               "快递"]
      unless_window: 16
      unless_across: true
    # A bare future time right before an act of ending one's life (2026-10-26): "今晚烧炭",
    # "周五跳楼". The plan verb of S1_PLAN_ACT_TIME is left out, the time itself is the plan
    # (PRD §9.1 L3: 时间). A wish or a report in the gap (今天又想自杀, 今天看到…跳楼) and the
    # ideation and news forms of the act (自杀的念头, 自杀了, 自杀率) void it; barbecue,
    # heating and swimming void it in the same clause.
    - id: S1_TIME_ACT
      level: L3
      heads: future_time
      tails: timed_acts
      max_gap: 2
      exceptions: timed_act_exceptions
      blockers: ["想", "梦", "说", "看", "听", "聊", "写", "读", "查", "新闻", "报道", "有人",
                 "知道", "了解", "研究", "讨论", "怎么", "怎样", "如何", "关于", "演"]
      unless: ["烧烤", "烤肉", "烤", "火锅", "取暖", "游泳", "跳水", "泳池", "新闻", "报道", "电影",
               "小说", "故事", "游戏", "剧"]
      unless_window: 16
      unless_across: true
    # At a height and about to jump (2026-10-26): "我现在就站在天台上，准备跳下去". A plan
    # verb + jumping down, with a height anywhere near (PRD §9.1 L3: 地点与即刻行动). A wish
    # (想跳下去) is L2_METHOD_IDEATION; diving, sport jumps, animals, drills and stories void
    # it in the same clause.
    - id: S1_PLAN_JUMP_HEIGHT
      level: L3
      heads: ["准备", "打算", "要", "就要", "决定", "马上", "这就", "现在就", "就"]
      tails: jumps
      max_gap: 3
      context: heights
      context_window: 20
      blockers: act_blockers
      unless: jump_everyday
      unless_window: 16
      unless_across: true
    # Pills hoarded and to be taken all at once (2026-10-26): "我把药都攒起来了，打算今晚全
    # 吃了". L2_MEANS_HOARDED rates the stockpile alone; a whole stock taken at once is the
    # plan (PRD §9.1 L3). A course of medicine (这盒药要全吃完) has no hoarding verb.
    - id: S1_PILLS_HOARDED_ALL
      level: L3
      heads: ["药", "药片", "药丸"]
      tails: hoard_marks
      max_gap: 4
      order: either
      context: take_all
      context_window: 20
      exceptions: pill_exceptions
      unless: pill_everyday
      unless_window: 16
