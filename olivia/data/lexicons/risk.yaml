      unless: ["@pill_everyday", "疗程", "按时", "医嘱", "每天", "每次", "一日", "饭后", "饭前", "睡前",
               "一粒", "一片", "两片", "复查", "吗"]
      unless_window: 16
      unless_across: true
    # Taking pills and "going" (今晚就吃药走了): the euphemism for dying after an overdose,
    # with a plan or a time, so L2. Not the past (吃了药就走了: 吃了药 is no head).
    - id: L2_PILLS_AND_GO
      level: L2
      clause_negation: true
      heads: ["吃药", "吞药", "喝药", "吃安眠药", "吞安眠药", "把药吃了", "把药吞了"]
      tails: ["走了", "走掉", "走人", "离开", "去死", "结束", "解脱", "睡过去", "一了百了"]
      max_gap: 3
