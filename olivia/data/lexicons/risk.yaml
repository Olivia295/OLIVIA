      unless: ["视频", "博主", "粉丝", "流量", "网红", "出名", "红", "直播", "账号", "作品", "歌", "热搜",
               "曝光", "关注", "涨粉", "平台", "抖音", "快手", "小红书", "b站", "up主", "店", "生意"]
      unless_window: 24
      unless_across: true
    # Going to meet one's great-grandmother (见太奶, slang for dying) with a wish or intent:
    # the question only, since the meme is mostly hyperbole (笑到差点见太奶, 热得要去见太奶);
    # those causes and a real visit (回老家见太奶) void it.
    - id: ASK_INTENT_GREAT_GRANDMA
      level: ASK
      heads: ["见太奶", "见到太奶", "找太奶", "陪太奶"]
      context: ["想", "要", "该", "准备", "打算", "可以", "快"]
      context_window: 4
      unless: ["差点", "笑", "热", "吓", "累", "饿", "冷", "困", "辣", "好吃", "梦", "游戏", "哈哈", "绝了",
               "上头", "回老家", "回家", "过年", "生日", "看望", "探望", "医院", "带孩子", "周末", "放假"]
      unless_window: 12
    # The same words as a clause of their own (见太奶, 去见太奶了).
    - id: ASK_INTENT_GREAT_GRANDMA_ALONE
      level: ASK
      heads: ["见太奶", "见到太奶", "找太奶", "陪太奶"]
      leading: ["我", "真的", "唉", "哎", "去", "要去", "想去", "该去", "可以去", "准备去", "快去", "直接"]
      trailing: ["了", "吧", "啊", "呀", "啦", "奶", "去了"]
    # === Round 3 (2026-10-27): frames that generalize, not one phrase per sentence ===
    # Black-box retesting with new sentences found rules mode at 55%: each round-2 phrase
    # caught its own sentence only. The entries below are frames of parts said in any order
    # over short clauses (`also`: a plan word, a time, a place within a window, never a
    # negated one), with the shared checks (negation before the act, someone else as the
    # subject, sport, play, stories and outings nearby).
    #
    # -- Plans: an act at a place, with a plan word or a time (PRD §9.1 L3 计划/地点/时间) --
    # A jump from a height or into water with a plan word or a time near it, across commas:
    # "我已经想好了，这周末去楼顶跳下去", "我打算明天下班后去江边那座桥上往下跳", Cantonese "我
    # 谂住今晚上天台跳落去". The jump is the match (a negator right before it voids it: 不会跳
    # 下去), the place within 16 characters, the plan or time within 24 and not negated (不打
    # 算, 没决定). Like S1_PLAN_JUMP_HEIGHT and S1_TIME_ACT, a jump from a height that is
    # planned or timed is L3. Someone else (男主, 角色, 他), sport and diving, animals,
    # stories, games, role-play, dreams and outings void it nearby.
    # 2026-10-28: a place named only by "from there" (从那里, 从那儿) counts too, so a place
    # said in an earlier clause that no list holds (公司消防通道那层…，我打算明天从那里跳下去)
    # still makes the plan.
    - id: S1_JUMP_PLANNED
      level: L3
      clause_negation: true
      heads: jump_acts
      context: ["@jump_places", "@from_there"]
      context_window: 16
      also:
        - {phrases: ["@plan_words", "@plan_time"], window: 24}
      unless: frame_everyday
      unless_window: 16
      unless_across: true
    # The same jump with a wish instead of a plan (想爬到楼顶上去，往下一跳): L2, a wish with a
    # concrete means and place but no plan, like L2_WISH_JUMP_HEIGHT across clauses.
    - id: L2_JUMP_WISHED
      level: L2
      clause_negation: true
      heads: jump_acts
      context: ["@jump_places", "@from_there"]
      context_window: 16
      also:
        - {phrases: jump_wish, window: 24}
      unless: frame_everyday
      unless_window: 16
      unless_across: true
    # A jump from upstairs, a bridge or a window (formerly L2_METHOD_IDEATION phrases): L2
    # for the speaker or no one named; someone else (电影里的男主…), sport (蹦极), animals,
    # stories and dreams void it nearby.
    - id: L2_JUMP_FROM_HEIGHT
      level: L2
      heads: ["从楼上跳下去", "从桥上跳下去", "从窗户跳"]
      unless: frame_everyday
      unless_window: 16
      unless_across: true
    # Going over an edge or into water (翻出去, 走进海里) at a height or water place, with a
    # plan, a time or a wish: these acts also climb out and wade in everyday life, so L2.
    - id: L2_OVER_EDGE
      level: L2
      clause_negation: true
      heads: over_acts
      context: jump_places
      context_window: 12
      also:
        - {phrases: ["@plan_words", "@plan_time", "@jump_wish"], window: 24}
      unless: ["@frame_everyday", "游泳", "泡", "玩水", "捡", "拿", "取", "找", "帮", "修", "救"]
      unless_window: 16
      unless_across: true
    # A plan to go to a height, then "end it" (我打算去楼顶待着，然后就结束): an end with no
    # object and nothing else done in its clause (聊完就结束 is the end of a chat) after a
    # plan and a place. No self-harm anchor, so L2 like L2_PLAN_NO_ANCHOR;
    # an end with an object (结束会议) or an outing nearby voids it.
    - id: L2_PLACE_THEN_END
      level: L2
      clause_negation: true
      heads: ["结束", "了结", "一了百了", "解脱", "了断"]
      also:
        - {phrases: ["@jump_places", "@go_heights"], window: 24}
        - {phrases: ["@plan_words", "@plan_time"], window: 24}
      leading: ["然后", "就", "我", "再", "直接", "就此", "彻底", "从此", "那就", "这样", "就这样", "一切",
                "全部", "都"]
      trailing: ["@particles", "吧", "掉", "一切", "这一切", "自己"]
      unless: ["@frame_everyday", "@everyday_end", "开会", "上课", "加班", "聊"]
      unless_window: 16
      unless_across: true
    # An act of ending one's life said first, then a plan and a time (自杀，我今晚就去): the
    # same Stage 1 plan as S1_PLAN_ACT_TIME with the act as the topic, a clause of its own
    # (`leading`, `trailing`: 上吊这个情节 and 我准备结束生命，… are no topic). Someone else, a story, news, filming or a
    # negator in the act's clause void it.
    - id: S1_ACT_THEN_PLAN
      level: L3
      clause_negation: true
      heads: timed_acts
      also:
        - {phrases: plan_words, window: 12}
        - {phrases: plan_time, window: 12}
      exceptions: timed_act_exceptions
      leading: ["那就", "就", "那", "去", "还是", "干脆"]
      trailing: ["@particles", "吧"]
      unless: ["@fiction", "新闻", "报道", "电影", "剧", "听说", "看到", "看了", "有人", "预防", "热线",
               "情节", "镜头", "写", "拍", "演", "画", "稿", "视频"]
      unless_window: 16
      unless_across: true
    # Going up to a height with a plan or a time and nothing else said there: "今晚我要去那座
    # 桥", "我打算周六晚上去学校天台", "明晚趁大家睡着去阳台". No act is named, so L1 + the
    # direct question (D3), L2 with a risk cue of the user's own. The clause must end at the
    # place (`trailing`): any purpose after it (去天台看流星, 去楼顶健身房) and an outing
    # nearby void it; water edges are left out (周末去海边 is an outing).
