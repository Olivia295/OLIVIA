      exceptions: ["死了以后", "死了之后", "死掉以后", "死掉之后", "死去以后", "死去的"]
    # Better dead (死了好过, Cantonese 死咗好过, 死了比活着好): the speaker's own, so the
    # person check voids 他死了更好; a machine, a pet or a game character voids it.
