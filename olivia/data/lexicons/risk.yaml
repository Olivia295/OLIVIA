  recipients: ["给", "对", "跟", "和", "向", "告诉", "替", "陪", "帮"]
  # The person spoken to. A clause naming nobody carries over the subject of the clause
  # before it, but never a listener ("谢谢你，准备去死了" is about the speaker).
  listeners: ["你", "您"]
  lists:
    # Intent and plan verbs. 想 is a wish, so it is in `intent` only: L3 needs a plan verb.
    intent: ["要", "想", "想要", "打算", "准备", "决定", "计划", "会去", "只想", "干脆", "不如",
