# A crisis level only the injected model gives (the student in the product) while the rules
# found no risk cue at all (CrisisAssessment.rule_clear): owner decisions 2026-10-26. The
# first one asks the direct question once instead of entering the crisis flow; the second
# (2026-10-26, chosen on the dev set interim_fresh.csv only) keeps the crisis flow when the
# student is sure: its crisis score is at or above `direct_from_score`. Owner decision
# 2026-10-28: only the score counts; a score below it asks first whatever the class (L3
# included, whose emergency numbers then lead the question's card). The pause after a
# confirmation (2026-10-27) still needs a class below L3. Read by lexicon.ModelAskRules;
# without this section every model-only alarm enters the crisis flow (fail-safe).
# 0 < direct_from_score <= 1.
model_ask:
  direct_from_score: 0.6
# Owner decision 2026-10-28: the "X得 / 到想死" figure of speech ("烦得想死", "加班加到想死",
# "激到我想死", "气得想死") asks the D3 question (L1 + ASK_INTENT_HYPERBOLE_DIE) instead of
# L2, reversing the 2026-10-22 "no mask" ruling for this frame only. A frame is a stem +
# a link + a wish. Stems are everyday irritations, tiredness, discomfort and chores (加 as
# in 加班加到, 写 as in 写论文写到); words of inner pain (痛苦, 绝望, 难受, 崩溃, 委屈, 折磨),
# being forced (逼) and verbs that make "得 / 到想死" literal (觉得, 感到, 变得, 想到, 说到, 记得,
# 难得) are not stems, so "我觉得想死" stays L2. The rules read a message as the figure alone
# only when every Stage 2 phrase lies inside a frame, no other rule cue occurs (another
# Stage 2 phrase, a negation phrase, a pair anchor, a pair cue, a composition) and no veto
# below lies anywhere in it: seriousness (真的, 不是开玩笑, 那种), a run of days, a plan, a
# time, a means, a farewell or another death or hopelessness word. Otherwise the frame is
# L2 as before, so "烦得想死 真的不想活了", "烦得想死 是真的想死那种" and "加班加到想死 不是开玩笑"
# stay L2. An injected model counts at most as L1 on the figure alone (a model failure is
# still L2), and the tracker makes it L2 at once when the session already showed risk (an
# earlier rule L1+ turn or D3 cue other than this one, or a crisis). Read by
# lexicon.HyperboleAskRules; without this section the frame is L2 (fail-safe). No veto may
# lie inside a frame. Every word is written here, not taken from an evaluation set.
hyperbole_ask:
