               "跑步", "论文", "工作", "上班", "老板", "这个班"]
      unless_window: 16
      unless_across: true
    # A short code as a clause of its own: wxs (我想死; also 我笑死, so only the question, not
    # L2) and zs (自杀). Only fillers before it and particles after it, so zs老师, zsxw and
    # 哈哈哈wxs never ask; 想zs is L2_WISH_DIE_CODED. bxs is no recognised crisis code and is
    # left out on purpose.
    - id: ASK_INTENT_CODED
      level: ASK
      heads: ["wxs", "zs"]
      leading: clause_fillers
      trailing: particles
    # "Once and for all" as a clause of its own (一了百了): L1 + the direct question, as the
    # same euphemism with a way word (ASK_INTENT_VEILED_METHOD). 想一了百了 and 一了百了算了 are
    # L2_SUICIDE_TERMS phrases. Quitting, selling, deleting or fixing a bug nearby voids it.
    - id: ASK_INTENT_ONCE_FOR_ALL
      level: ASK
      heads: ["一了百了"]
      leading: ["我", "真的", "唉", "哎", "干脆", "索性", "不如", "就", "就这样", "这样", "那就", "死了",
                "走了"]
      trailing: particles
      unless: ["辞职", "分手", "卖", "扔", "删", "拉黑", "换", "搬", "退", "解决", "处理", "搞定", "bug",
               "问题", "作业", "考试", "工作", "项目", "债", "手机", "账号", "房子", "车"]
      unless_window: 16
      unless_across: true
    # Not wanting to "huo" any more in the homophone 火 (不想火了 for 不想活了): the question
    # only, since a creator who no longer wants to be famous says the same; videos,
    # followers and fame nearby void it.
    - id: ASK_INTENT_NOT_LIVE_HOMOPHONE
      level: ASK
      heads: ["不想火了", "不想再火了", "火不下去了"]
