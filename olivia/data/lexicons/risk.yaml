# 其他, 小说, 说完, 听说) do not count. Read by crisis.py at the rule level only: when every
# Stage 2 phrase of the message is reported, no pair or composition cue fires and no
# `vetoes` phrase (the user joins in: 我也是, 一起, 跟她一样) occurs, the phrases are void
# and the user stays out of the crisis flow (red-team third_party_concern). The user's own
# risk words anywhere in the message keep every phrase. Method requests (pairs) are never
# void, whoever they are for (R-MS). A model's level is not capped.
