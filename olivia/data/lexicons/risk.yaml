  # Benign-sense masks: the cue words used in an everyday sense ("不想再活在过去",
  # "热得想跳河里游泳", "今晚就动手做蛋糕", "就站在楼顶看烟花").
  - id: NEG_BENIGN_SENSE
    patterns: ["不想再活成", "不想再活在", "想跳河里游", "今晚就动手做", "今晚就动手装修", "就站在楼顶看"]
