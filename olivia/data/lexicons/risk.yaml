    patterns: ["不想死", "没想死", "没有想死", "不是想死", "不会去死",
               "不会想死", "没想过去死", "不想要去死", "don'twanttodie", "dontwanttodie"]
  - id: NEG_NOT_SUICIDE
    patterns: ["不会自杀", "不想自杀", "没想过自杀", "绝不想自杀",
               "没想自杀", "没有想自杀", "不是想自杀", "没想过要自杀", "没有想过要自杀",
               "没有想要自杀", "没想要自杀", "不想要自杀", "notsuicidal",
               "没有自杀的念头", "没有自杀的想法", "不会有自杀的想法", "不会寻死", "不想自我了断",
               "不会想不开"]
  - id: NEG_NOT_END_LIFE
    patterns: ["不想结束自己的生命", "不想结束生命", "没有想过结束生命", "没想过结束生命",
               "不想离开这个世界"]
  # "不想再活成X那样" is about how to live, not whether to live.
  - id: NEG_LIVE_AS
    patterns: ["不想再活成"]
safety_confirm:
  - id: CONFIRM_SAFE_NOW
    patterns: ["我现在安全了", "我已经安全了", "我现在没事了", "我不会做傻事",
               "我现在很安全", "我已经冷静下来了", "我保证不会伤害自己"]
