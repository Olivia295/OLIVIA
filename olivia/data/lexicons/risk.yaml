# exceptions does not count; the negation and hyperbole masks never apply), but an entry
# has no level or score: it is L1, its id starts with ASK_INTENT, and the screen sets
# CrisisAssessment.asks_intent. The session then asks one gentle, direct question about
# suicidal intent instead of guessing; a turn that screens L2/L3 for any other reason goes
# straight to crisis (SDD §8.2). The question is gentle, so a false ask costs far less
# than a false L2, but the hard negatives in tests/safety/test_intent_ask.py (leaving a
# job, going home, meeting a friend, ending a relationship, a painless tooth extraction)
# must never ask.
#   ASK_INTENT_EUPHEMISM: leaving, going and ending-everything euphemisms + a painless,
#     fast or final manner. 离开 only next to a way word (离开的方式, 办法离开) or an
#     object that is everyone and everything (离开这一切); bare 离开 and 走 are everyday
