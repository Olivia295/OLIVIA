      raise_with_risk: true
      heads: ["给爸妈的信", "给家人的信", "给家里人的信", "给你们的信", "给大家的信", "留给家人的信",
              "留给爸妈的信", "写给爸妈的信", "写给家人的信", "留给你们的信", "给爸爸妈妈的信"]
      tails: ["写好", "写完", "留好", "放好", "放在", "留在", "都写了"]
