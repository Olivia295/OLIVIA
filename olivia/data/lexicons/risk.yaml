# 自己", "我没有想死", "我不想死，只是很累", "我已经好多了". Read by crisis.py: where the rules
# rate a message L0 and every Stage 2 phrase in it lies inside a `phrases` hit, an injected
# model's level counts at most as L1, unless
#   - a `negators` word stands right before the denial (a double negation: 不是我不想死,
#     谁说我不想死),
#   - a `contrasts` word follows the first denial (我不想死，可是…; whatever comes after),
#   - a `vetoes` phrase lies anywhere in the message: a double negation or retraction
#     (不是不, 没有不, 并非, 骗你, 假的, 要说), a hedge (可能, 暂时, 至少, 现在还), a time
#     (今晚, 明天, 以后), a means or place (药, 绳, 刀, 炭, 楼顶, 跳), a farewell or
#     preparation (再见, 遗书, 后事, 准备, 攒, 打算, 解脱, 离开, 消失),
#   - a composition matched at all, or the model failed.
