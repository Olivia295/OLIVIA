version: 1
# Stage 1: explicit plan / means / time / place / act / farewell evidence -> L3.
# Negation and hyperbole never mask Stage 1. Every phrase added after the plan's seed
# list must carry an unambiguous self-harm anchor (死, 自杀, 结束自己, 遗书, 上吊, 割腕,
# 卧轨, 跳楼/跳江, 安眠药 + quantity/hoarding/eating, 百草枯, drinking pesticide, 烧炭 in a
# sealed space ...) or be a self-directed act that is not plausible in everyday life.
# The first line of each entry is the plan's seed list and is kept as specified.
stage1:
  - id: S1_MEANS_PILLS
    patterns: ["药已经买好", "药买好了", "买好了药", "攒了很多安眠药", "攒够了药", "囤了一瓶安眠药",
               "安眠药我已经攒", "安眠药我已经存", "安眠药我一直在攒", "安眠药攒", "攒安眠药",
               "攒的安眠药", "攒了好多安眠药", "攒了一些安眠药", "存了好多安眠药", "存了很多安眠药",
               "囤了好几盒安眠药", "囤了一些安眠药", "囤了好多安眠药", "安眠药都囤好", "安眠药都偷偷留",
               "把安眠药都攒", "安眠药已经攒好", "安眠药凑够", "买了一大瓶安眠药", "片安眠药都倒出来",
               "安眠药和酒都准备好", "准备跟安眠药一起吃", "安眠药全吃", "安眠药一次吃完", "安眠药一次全吃",
               "把安眠药全吃", "把安眠药全部吃", "够致死量", "查好了致死剂量"]
  - id: S1_MEANS_ROPE_BLADE
    patterns: ["绳子已经准备好", "准备好了绳子", "刀已经准备好", "准备好了刀片",
               "上吊的绳", "上吊用的", "准备上吊", "打算上吊", "绳子挂好了凳子",
               "割腕的刀", "割腕用的", "准备割腕", "打算割腕"]
  - id: S1_MEANS_CHARCOAL_GAS
    patterns: ["炭已经买回来了,胶带", "炭已经买回来了胶带", "木炭和胶带", "炭和胶带", "胶带和炭",
               "烧炭要用的东西", "炭盆都放在浴室", "在车里烧炭", "炭买好了门窗", "炭买好了,门窗",
               "煤气罐搬进卧室", "煤气罐我已经搬进卧室"]
  - id: S1_MEANS_POISON
    patterns: ["买了一瓶百草枯", "买了百草枯", "百草枯买好", "百草枯藏在", "打算喝农药", "准备喝农药",
               "准备喝的农药", "农药准备今晚喝", "打算喝敌敌畏", "准备喝敌敌畏"]
  - id: S1_NOTE_WRITTEN
    patterns: ["遗书写好了", "写好了遗书", "已经写好遗书",
               "遗书都写好", "遗书也写好", "在写遗书", "我写了遗书", "写了一封遗书", "我留了遗书",
               "遗书已经写完", "遗书写完了", "我的遗书", "遗书里写", "写在遗书里", "遗书也放好", "遗书放好了", "遗书我放在",
               "给爸妈的遗书", "给家人的遗书", "遗言我录好", "遗言已经录好", "录好了遗言", "我写好了遗言",
               "遗言我已经写好"]
  - id: S1_TIME_PLACE
    patterns: ["今晚就去跳", "今晚就结束自己", "明天就去死", "站在楼顶上了", "已经在天台上", "已经在桥边了",
               "今晚就去死", "今晚就自杀", "明天就自杀", "今晚就割腕", "今晚就上吊", "今晚就跳楼",
               "今晚就烧炭", "点就去死", "出门我就去死", "早上就去死", "那天我就去死", "过完年就去死",
               "那天就结束自己", "tonight就结束自己", "去死的日子", "自杀的日子", "自杀的时间",
               "睡着了我就去跳楼", "睡着了就去跳楼", "准备跳楼", "跳楼的地方", "准备跳江",
               "跳下去就解脱", "跳下去就一了百了", "跳下去不想活", "就卧轨", "准备卧轨", "躺在铁轨上",
               "没人的地方烧炭", "就从阳台跳下去", "就从公司楼顶跳", "就从楼顶跳"]
  - id: S1_ACT_IN_PROGRESS
    patterns: ["已经吞了药", "吃了一整瓶药", "已经割了", "正在割腕", "血止不住",
               "吞了一把药", "吞了半瓶药", "吞了好多片安眠药", "吃了一瓶安眠药", "吃了一整瓶安眠药",
               "吃了一盒安眠药", "吃了一整盒安眠药", "吃了二十片安眠药", "吃了三十片安眠药",
               "吃了四十片安眠药", "吃了五十片安眠药", "吃了几十片安眠药", "吃了一百片安眠药",
               "吃了一整瓶头好晕", "吃下去了等死", "吃下去了,等死",
               "吃下去了现在就等死", "吃下去了,现在就等死", "割了手腕", "我割腕了", "刚割腕",
               "炭已经点着了门窗", "烧炭屋里好闷", "绳子套在自己脖子", "绳子已经套在自己脖子", "绳子已经套在我脖子",
               "喝了半瓶农药", "喝了农药", "喝了百草枯"]
  - id: S1_FAREWELL
    patterns: ["再见了这个世界", "这是我最后一次跟你说话",
               "永别了", "下辈子见", "来世再见", "我自己的后事", "后事都交代好了别找我",
               "后事都交代好了,别找我"]
stage2:
  - id: L2_WANT_DIE
    level: L2
    patterns: ["想死", "想去死", "想自杀", "想要自杀", "想要去死", "想死掉", "希望自己死掉",
               "想就这样死掉", "让我去死", "我还是去死", "怎么去死", "恨不得现在就死", "恨不得去死",
               "想自尽", "要自尽", "去自尽", "想上吊", "上吊自杀", "想卧轨", "wanttodie", "killmyself",
               "要去死", "不如去死", "要不要去死",
               # Longer than the HYP_MISS_YOU masks: 想死 + 你/我/他 + 了解 is ideation
               # followed by "do you understand", not "miss you".
               "想死你了解", "想死你们了解", "想死您了解", "想死我了解", "想死他了解", "想死她了解",
               "想死他们了解", "想死她们了解", "想死你了不了解", "想死你们了不了解",
               # 想到死 only with a frequency adverb: bare 想到死 also hits 死党 / 死机 / 死亡.
               "常想到死", "总想到死", "总是想到死", "老想到死", "老是想到死", "一直想到死",
               "又想到死", "反复想到死", "天天想到死", "整天想到死", "每天都想到死",
               # English (round 2, 2026-10-26): "unalive" is the euphemism for kill, and the
               # wish to be dead (whitespace is removed before matching).
               "unalivemyself", "unalivingmyself", "wanttobeunalive", "wishiwasdead", "wishiweredead",
               "betteroffdead", "aboutkillingmyself", "ofkillingmyself"]
  - id: L2_NOT_WANT_LIVE
    level: L2
    patterns: ["不想活了", "活不下去了", "不想再活下去", "死了算了", "不如死了",
               "不想再活", "不想活下去", "不想活惹", "不想活啦", "不想再这样活", "不想这样活下去",
               "不想再活在这个世界", "不想再活在这个世上", "不想再活在这世上", "不想再活在这个没有你的世界", "活够了",
               "活腻了", "不如死掉", "我还是死了好", "死了就解脱", "死了就不用", "死了比较好", "死了也挺好",
               "我死了大家", "如果我死了", "死是唯一的出路",
               # Cantonese (2026-10-26), as the Mandarin forms above: 唔想(再)活(落去) =
               # 不想(再)活(下去), 活唔落去 = 活不下去, 死咗算 = 死了算了.
               "唔想活", "唔想再活", "活唔落去", "冇得活落去", "死咗算", "死咗就解脱", "死咗就唔使",
               # Round 2 (2026-10-26): 不想活在这个世界 and the like (bare 不想活 is the
               # composition L2_NOT_WANT_LIVE_BARE, whose exceptions keep 不想活在过去 out).
               # Dialect 算球 / 算逑 for 算了, 生存下去 for 活下去 (Cantonese 生存落去), and English.
               "不想活在这个世界", "不想活在这个世上", "不想活在这世上", "不想活在世上",
               "不想活在世界上", "死了算球", "死了算逑", "死了算求", "不想再生存下去", "不想生存下去",
               "唔想再生存落去", "唔想生存落去", "生存唔落去", "不如死咗", "don'twanttoliveanymore",
               "dontwanttoliveanymore", "don'twannaliveanymore", "dontwannaliveanymore",
               "don'twanttobealive", "dontwanttobealive", "don'twanttoliveanylonger",
               "dontwanttoliveanylonger", "nolongerwanttolive"]
  - id: L2_END_LIFE
    level: L2
    patterns: ["想结束自己的生命", "想离开这个世界",
               "想结束自己", "结束自己的命", "结束我的生命", "想结束生命", "怎么结束生命", "想结束这一切",
               "想早点离开这个世界", "我要离开这个世界", "想去另一个世界", "让自己永远睡着", "结束这条命",
               # Classical "end this life" (R-MS); not 了此残生, which also means "live out my days".
               "了结此生", "了却此生",
               # Net slang for ending one's life (round 2, 2026-10-26).
               "登出人生", "注销人生", "退出地球online"]
  # Wish to fall asleep and not wake up: passive suicidal ideation (C-SSRS item 1, "wish to
  # be dead"), so L2 rather than weariness (PRD §9.1).
  - id: L2_SLEEP_NO_WAKE
    level: L2
    patterns: ["想彻底睡过去", "睡着了就不要醒来", "不想醒来",
               "再也不要醒", "一睡不醒", "一觉不醒", "不想醒过来", "就这样一直睡下去", "想就这么睡过去",
               "再也别醒", "永远睡着", "别再醒了",
               # 再 inserted (不想再醒来) or 要 dropped (再也不醒来). Bare 再也不醒来 also tells of
               # someone else's death (外婆睡着后就再也不醒来了), so it only counts after a
               # wish of one's own (想, 希望, 就好, 消失, 睡过去).
               "不想再醒来", "不想再醒过来", "不想再醒了", "不要再醒来", "不要再醒了", "让我再醒来",
               "想再也不醒来", "希望再也不醒来", "再也不醒来就好", "再也不醒来多好", "再也不醒来算了",
               "消失,再也不醒来", "消失再也不醒来", "睡过去再也不醒来", "睡过去,再也不醒来",
               # 睡过去 (fall asleep for good) + a bare 不醒 (F6a); 睡着 + 不醒 is left out
               # because it also tells of deep sleep (睡着了怎么叫都不醒).
               "睡过去不醒", "睡过去就不醒", "睡过去再不醒", "睡下去不醒", "睡下去就不醒",
               # 永远 + fall asleep for good (F16a): "我想永远睡过去". 一直睡下去 alone is
               # also a lie-in (周末想一直睡下去), so only 永远.
               "永远睡过去", "永远地睡过去", "永远睡下去", "永远地睡下去"]
  - id: L2_SUICIDE_TERMS
    level: L2
    patterns: ["自杀的念头", "自杀的想法", "想到自杀", "zisha", "suicidal", "轻生的念头", "想轻生",
               "想寻死", "去寻死", "要寻死", "寻死的念头", "自我了断", "了结自己", "一死了之",
               "想一了百了", "一了百了算了", "一时想不开", "怕我想不开", "会想不开", "紫砂",
               # Round 3 (2026-10-27): 自鲨, the homophone of 自杀 like 紫砂 (no everyday sense).
               "自鲨"]
  # 从楼上跳下去 / 从桥上跳下去 / 从窗户跳 are the composition L2_JUMP_FROM_HEIGHT (round 3):
  # the same L2, with the person and everyday checks (男主…从桥上跳下去, 蹦极).
  - id: L2_METHOD_IDEATION
    level: L2
    patterns: ["想跳下去", "想跳楼", "想跳河", "就去跳楼",
               "就去跳河", "割腕", "想喝农药", "想吞药", "想被车撞"]
  # Plan-shaped sentences without a self-harm anchor: too ambiguous for Stage 1, but a plan
  # with a time or place still warrants L2.
  - id: L2_PLAN_NO_ANCHOR
    level: L2
    patterns: ["今晚就动手", "买好了绳子今晚", "绳子买好了今晚", "药已经备好了就今晚",
               "药我已经准备好了够多了", "已经站在天台上", "楼顶不想下去", "就站在楼顶", "把刀磨好了今晚",
               "东西都送人了以后用不上"]
  # Double negation / rhetorical forms: each phrase is longer than the negation mask it
  # contains, so containment masking does not void it. 谁说我…/不是…/…骗你的 counterparts
  # exist only for the forms listed here, not for every negation mask below.
  # Known limit: a "never before, but now" contrast is caught only when it is adjacent
  # (没想过去死现在…). With anything in between (以前没想过去死 可是现在天天想) the earlier
  # negation still masks the cue; that needs clause-aware rules or a model.
  - id: L2_DOUBLE_NEGATION
    level: L2
    patterns: ["不是不想死", "没有不想死", "谁说我不想死", "怎么可能不想死", "怎么会不想死",
               "哪有不想死", "以为我不想死", "不是我不想死", "不想死得", "不想死在",
               "谁说我没想死", "不是没想死", "谁说我没有想死", "不是想死还能", "不是想死是什么",
               "谁说我不会去死", "不是不会去死",
               "谁说我不会想死", "以为我不会想死", "不是不会想死", "谁说我没想过去死", "不是没想过去死",
               "谁说我不想要去死", "不是不想要去死", "没有不想要去死",
               "谁说我不想自杀", "谁说我不会自杀", "谁说我没想自杀", "不是没想自杀", "谁说我没有想自杀",
               "不是没有想自杀", "谁说我没想过自杀", "不是不想自杀", "没有不想自杀", "怎么可能不想自杀",
               "不是想自杀还能", "不是想自杀又是什么", "不是想自杀是什么", "谁说我没想过要自杀",
               "不是没想过要自杀", "谁说我没有想过要自杀", "不是没有想过要自杀", "谁说我没有想要自杀",
               "不是没有想要自杀", "谁说我没想要自杀", "不是没想要自杀", "谁说我不想要自杀",
               "不是不想要自杀", "whosaysi'mnotsuicidal", "whosaidi'mnotsuicidal",
               "谁说我没有自杀的念头", "不是没有自杀的念头", "谁说我没有自杀的想法", "不是没有自杀的想法",
               "谁说我不会有自杀的想法", "谁说我不会寻死", "谁说我不会去寻死", "谁说我不想自我了断",
               "不是不想自我了断", "谁说我不会想不开", "不是不会想不开", "谁说我不想结束自己的生命",
               "不是不想结束自己的生命", "谁说我不想结束生命", "不是不想结束生命", "谁说我没有想过结束生命",
               "不是没有想结束生命", "不是没想结束生命",
               "谁说我没想过结束生命", "谁说我不想离开这个世界", "不是不想离开这个世界",
               "没想过去死现在", "没想过自杀现在", "没想过死现在",
               "notsuicidal骗你的", "notsuicidal,骗你的", "notsuicidal...骗你的",
               "don'twanttodie骗你的", "don'twanttodie,骗你的", "don'twanttodie...骗你的",
               "不想死骗你的", "不想死,骗你的", "不想死...骗你的", "没想死骗你的", "没想死,骗你的",
               "不会自杀骗你的", "不会自杀,骗你的", "不会自杀...骗你的", "不想自杀骗你的", "不想自杀,骗你的",
               "没想过自杀骗你的", "没想过自杀,骗你的", "不会去死骗你的", "不会去死,骗你的"]
  # Asking for a way to end a life (decision R-MS, 2026-10-23): at least L2 whatever the
  # pretext (fiction, game, homework, a friend, role-play, a poem, "be objective"), the
  # language or the negation around it. These phrases are the adjacent forms
  # (interrogative + act, act + method noun); the stage2_pairs section below catches the
  # request and the anchor when the pretext separates them. Bare interrogatives and method
  # nouns never appear here without the anchor. Masks never contain these phrases except
  # NEG_PREVENTION (预防自杀的方法 ...); test_method_seeking.py checks that.
  # Not added, on purpose: 一了百了的办法 (idiom: settle a problem for good), bare
  # 怎么结束自己 (怎么结束自己的项目), 怎么才能死 (怎么才能死心), English "... to die"
  # forms other than painless (the fastest way to diet), bare "end my life" / "end it all"
  # (spend my life, spend it all).
  - id: L2_METHOD_SEEKING
    level: L2
    patterns: ["不疼的死法", "无痛的死法", "哪种死法", "什么死法", "死得不疼", "多少片会死",
               "多少片才会死", "安眠药才会死", "几楼跳下去", "几层楼才够高", "怎么自杀", "死得比较快",
               "死得快一点", "死得最快", "烧炭会不会很难受", "烧炭会不会难受", "烧炭会不会痛", "烧炭自杀",
               "吃了能直接死",
               # interrogative + act
               "如何自杀", "怎样自杀", "怎么样自杀", "咋自杀", "点样自杀", "怎么去自杀", "如何去自杀",
               "怎么才能自杀", "怎样才能自杀", "如何才能自杀", "怎么轻生", "如何轻生", "怎样轻生",
               "怎么寻死", "如何寻死", "怎样寻死", "怎么自尽", "如何自尽", "怎样自尽", "怎么了结自己",
               "如何了结自己", "怎么才能一了百了", "怎样才能一了百了", "如何才能一了百了", "让自己一了百了",
               "让我一了百了",
               "如何结束生命", "怎样结束生命", "怎么结束自己的生命", "如何结束自己的生命",
               "怎样结束自己的生命", "点样结束自己", "怎么杀死自己", "如何杀死自己", "怎样杀死自己",
               # 结束自己 with a manner word instead of an object (not 结束自己的项目)
               "怎么结束自己比较", "怎么结束自己才", "怎么结束自己最", "怎样结束自己比较",
               "怎样结束自己才", "怎样结束自己最", "如何结束自己才", "如何结束自己最",
               "安静地结束自己", "悄悄地结束自己", "平静地结束自己", "无痛地结束自己",
               "默默地结束自己", "体面地结束自己",
               "怎么死才", "怎么死最", "怎么死比较", "怎样死才", "怎样死最", "才能死得", "才能死掉",
               "才能去死", "点样先可以死", "点样先可以自杀", "死得快啲", "怎么才能离开这个世界",
               "怎样才能离开这个世界", "如何离开这个世界", "怎么离开这个世界",
               # act + method noun, manner or success
