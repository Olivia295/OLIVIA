# 草稿：待 G-0 两名注册心理师审核（docs/superpowers/plans/2026-10-22-remaining-roadmap.md R1-4）
#
# 叙事外化命名（PRD 特性四“运用叙事疗法将人与问题解耦命名”，步骤 C3）：本会话里内省器识别到
# “内在批评者”一类的模式（图式 DEFECTIVENESS / PUNITIVENESS / UNRELENTING_STANDARDS / FAILURE，
# 或认知扭曲 SHOULD_STATEMENTS / ALL_OR_NOTHING 在 >= 2 个平稳轮次出现）时，在 S_clarify 用一个
# 温和的问题提议给那个声音起个名字，给出 2–3 个现成的名字，并说明不起也没关系。
# 出现条件与图式镜像（schema_mirror.yaml）相同：只在模型模式（olivia chat --model）、唤醒度 < 0.80、
# 每次会话至多一次；危机、避风港、L1 筛查、红线（转介）、纯倾听锁、直接询问（决定 D3）的轮次从不出现；
# 静默树洞型（SILENT_ANCHOR）从不出现；不与图式镜像同一轮（两者都该出现时先问镜像）。
#
# 用户下一轮的回答：说出编号（“2”“第二个”）或名字（“小喇叭吧”）即接受；明确不要（“不用了”“不是”）
# 即拒绝；其他都当作没有回答，对话照常进行。名字只从下面的模板里选，从不使用用户自己写的文字，
# 所以只保存名字的编号（如 NITPICKER），不保存任何原文。
#
# names     名字编号 -> text（显示的名字）与 match（回答里出现即视为选了它，至少两个，不能互相包含）。
# offers    提议问句：每条是一整段（替换 S_clarify 的 invite 段），≤ 80 字，含一个问句，不带槽位；
#           names 是这条问句依次给出的 2–3 个名字，问句里必须按顺序写成“1「名字」”“2「名字」”……
# declines  只对这个问题的“不要”（首个分句以它开头即拒绝），补充镜像与跟进问题共用的是/否词表。
# accepted  接受后的那一轮：替换 S_explore 的 image 段或 S_clarify 的 need 段，只用 {name} 一个槽位。
# declined  拒绝后的那一轮：同上，不带槽位。
# callbacks 接受之后，同一模式再次出现时偶尔用名字指代它（每 3 轮至多一次，危机、避风港、卡片里从不出现），
#           替换段落同 accepted，只用 {name} 一个槽位。
#
# 所有句子 ≤ 80 字，不出现图式名称、诊断词或临床术语，不说“应该/必须”，经 WILLOW 过滤后原样不变
# 并通过输出网关（tests/perception/test_externalize.py 校验）。
version: 1

names:
  NITPICKER:
    text: 挑刺先生
    match: [挑刺先生, 挑刺]
  STRICT_VOICE:
    text: 那个严格的声音
    match: [那个严格的声音, 严格的声音]
  LITTLE_HORN:
    text: 小喇叭
    match: [小喇叭, 喇叭]
  STRICT_INSPECTOR:
    text: 那个追求完美的严苛督察员
    match: [那个追求完美的严苛督察员, 追求完美的严苛督察员, 严苛督察员, 督察员]

offers:
  - names: [NITPICKER, STRICT_VOICE, LITTLE_HORN]
    line: "心里那个总在挑你错处的声音，要不要给它起个名字？比如1「挑刺先生」、2「那个严格的声音」、3「小喇叭」。不想起也完全没关系。"
  - names: [STRICT_INSPECTOR, NITPICKER, LITTLE_HORN]
    line: "有时候把那个声音当成“另一个它”，会轻松一点。想给它起个名字吗？1「那个追求完美的严苛督察员」、2「挑刺先生」、3「小喇叭」，不起也很好。"

declines:
  - 不用
  - 不要
  - 不了
  - 不必
  - 不需要
  - 不想起
  - 不起了
  - 不用起
  - 先不起
  - 不起名
  - 算了

accepted:
  - "好，那我们就叫它「{name}」。下次它再出来说话时，我们可以一起认出它：那是它的声音，不是全部的你。"
  - "嗯，那就叫它「{name}」吧。它说的话你可以听见，但不用全都照单全收，你和它，本来就是两回事。"

declined:
  - "好的，那就不给它起名字，我们照你自己习惯的说法来聊。谢谢你直接告诉我，这样我也能更贴近你一点。"
  - "没关系，名字不起也很好。你觉得怎么说舒服，我们就怎么说，你自己的感觉比任何名字都重要。"

callbacks:
  - "听起来，「{name}」好像又出来说话了。它的声音很响，可它说的那些，并不等于全部的你。"
  - "我好像又听见了「{name}」的声音。它习惯盯着不够好的地方，而你，比它看到的要多得多。"
  - "这一刻，「{name}」似乎又在旁边念叨了。我们可以先认出它，不急着照它说的去做。"
