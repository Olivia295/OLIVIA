# 草稿：待 G-0 两名注册心理师审核（docs/superpowers/plans/2026-10-22-remaining-roadmap.md R1-4）
#
# 卡片外框文案：A 级跟练卡、B/C 科普卡、专科转介卡（REFERRAL）与危机卡（S_crisis）的标签和固定句。
# 卡片正文分别来自 cards/grade_a.yaml、cards/grade_bc_info.yaml 与签名热线数据 hotlines.yaml，
# 这里只放把它们串起来的话。
#   - 转介卡只写“去哪里、找谁”（精神科、心理门诊、专业心理咨询等），绝不写病名或诊断（PRD §9.3）。
#   - 危机卡号码只来自 ResourceCard，这里不写任何号码；“{minutes}”是唯一槽位。
#   - 转介与危机文案享有 WILLOW-01/04 安全用语豁免（willow.yaml exemptions），但仍过诊断词门禁。
version: 1

card:
  duration: "约 {minutes} 分钟"
  safety_label: "安全提示："
  stealth_label: "在工位上："
  # 草稿：待 G-0（F3）。工作时间（当地时间周一至周五 9:00–18:00）之外，卡片末尾不再说“在工位上”，
  # 改用这一句。
  home_line: "在家或安静的地方：找一个不被打扰的角落，坐着、靠着都可以，按自己的节奏来。"

# B/C 科普卡（roadmap next-phase A4）：ask_intro 用于用户点名询问某种疗法时，lens_intro 用于
# S_clarify 主动给出的 B 级“理解视角”。B 级只是一个看问题的角度，不布置任何任务；C 级保留临床
# 用语，并明确建议找专业人员当面了解（PRD §8.1）。
info:
  what_label: "它是什么："
  how_label: "大致如何起作用："
  who_label: "通常由谁进行："
  ask_intro: "你问到的这种方法，可以先简单了解一下："
  lens_intro: "有一种心理学的理解，也许能多给你一个看它的角度，放在这里，看看就好："
  b_closing: "这只是一个理解的角度，不需要你去做什么。如果想深入了解，可以找受过这类训练的心理咨询师聊聊。"
  c_closing: "这类方法要在专业人员的陪伴下进行，不适合自己尝试。如果想知道它是否适合你，可以去医院的心理门诊或精神科，或找受过相应训练的心理咨询师当面聊聊。"
  # 草稿：待 G-0（F3）。用户问到一种可以自己做的小练习（A 级）时的结尾。
  a_closing: "这里有它的一个小练习版本。想试试的话，跟我说「带我做一下」再加上它的名字就好；不想试也完全没关系。"

# 转介去处按用户保存的地区分三套：destinations 用于中国大陆（CN），destinations_hk_mo_tw 用于
# 香港、澳门、台湾，destinations_elsewhere 用于其他地区和没有保存地区的用户（不提任何只在大陆
# 才有的机构名称）。三套的键都必须与 taxonomy 的 clinical_red_flags 一一对应。
referral:
  intro: "有些难处，值得有专业的人和你一起面对。如果你愿意，可以考虑去这些地方看看："
  # 草稿：待 G-0（F5b）。同一张转介卡紧接着下一轮又要出现时，改用这里的一句简短开头（依次轮换），
  # 去处照样逐条列出，只省掉结尾那段话；不写病名、诊断与号码。
  again:
    - "刚才提到的专业帮助，依然在这里："
    - "这些地方，随时都可以去看看："
    - "想找专业的人一起面对的话，还是这些地方："
  destinations:
    SIT-02-04: "医院的精神科门诊，请医生帮你一起看看情绪和作息的起伏"
    SIT-02-06: "妇幼保健院的产后心理门诊，或医院的精神科"
    SIT-06-01: "医院的精神科或心理门诊，可以说明想找擅长处理创伤经历的医生"
    SIT-06-05: "医院的精神科门诊"
    SIT-08-04: "综合医院的营养科，同时到精神科就诊"
    SIT-09-01: "医院的精神科或心理门诊，也请一位信任的家人或朋友一起陪着你"
    SIT-10-04: "医院的成瘾医学科或精神科；想停或减少时，医生可以陪你一步步来"
  destinations_hk_mo_tw:
    SIT-02-04: "医院的精神科专科门诊，也可以先请家庭医生帮你转介"
    SIT-02-06: "为你做产检或产后检查的医护人员，或医院的精神科专科门诊"
    SIT-06-01: "医院的精神科专科门诊或临床心理服务，可以说明想找擅长处理创伤经历的专业人员"
    SIT-06-05: "医院的精神科专科门诊，也可以先请家庭医生帮你转介"
    SIT-08-04: "家庭医生或医院的营养师，同时到精神科专科门诊就诊"
    SIT-09-01: "医院的精神科专科门诊或临床心理服务，也请一位信任的家人或朋友一起陪着你"
    SIT-10-04: "医院的精神科专科门诊或戒瘾治疗服务；想停或减少时，医生可以陪你一步步来"
  destinations_elsewhere:
    SIT-02-04: "当地的精神科或心理科，或者你的家庭医生"
    SIT-02-06: "为你做产检或产后检查的医护人员，或当地的精神科、心理科"
    SIT-06-01: "当地的精神科或心理科，或者你的家庭医生，可以说明想找擅长处理创伤经历的专业人员"
    SIT-06-05: "当地的精神科或心理科，或者你的家庭医生"
    SIT-08-04: "你的家庭医生或营养师，同时到当地的精神科或心理科就诊"
    SIT-09-01: "当地的精神科或心理科，或者你的家庭医生，也请一位信任的家人或朋友一起陪着你"
    SIT-10-04: "当地的精神科、心理科或成瘾治疗服务，或者你的家庭医生；想停或减少时，医生可以陪你一步步来"
  closing: "去就医不代表你有多糟糕，只是多了一个懂行的人陪你。去之前，也可以先打心理援助热线聊一聊。"
  # 草稿：待 G-0（F13，计划 D-3）。taxonomy 为 SIT-10-04 登记的唯一专属动作 WITHDRAWAL_RISK_WARNING
  # （戒断风险警示）不做成“做不做由你”的可选卡片，而是写进这张强制出现的转介卡：完整转介卡在去处之后、
  # 结尾之前多这一段，内容按 taxonomy 的三步改写（骤停有危险、不要自己停药换药、请人陪着去医院评估）。
  # 不写病名、诊断与号码。F16b：每条警示是一个段落列表，每段单独成段，不超过 80 字（原来一段 87 字，
  # 拆成两段，意思不变）。
  # 草稿：待 G-0（试用问题 13，2026-10-26）：原第二段“请不要在没有医生指导时自己骤然停用、换药或猛地戒掉”，
  # 正在戒酒、戒药的人会读成“别戒”。改为先肯定想停的心意、说清这不是要人继续用，再说突然停的危险
  # 和“在医生指导下进行”。去处里的“在医生指导之前，请不要自己突然停用”同样改写。不给剂量或方案，不诊断。
  warnings:
    SIT-10-04:
      - "还想提醒一句：想戒掉或少用一些，这份决心很珍贵，这句提醒不是要你继续用下去。"
      - "只是酒精和一些药物如果突然停下来，身体可能出现很危险的反应。所以想停、减少或换药时，最好在医生指导下进行，请一位家人或朋友陪着去医院先评估。"

crisis:
  emergency_heading:
    L2: "紧急情况可以拨打："
    L3: "如果危险就在眼前，请立即拨打："
  lines_heading: "可以联系的求助热线："
  hours_label: "服务时间："
  stale_mark: "（信息可能已过期）"
  contact_people: "也请马上叫一位身边信任的人过来陪着你。"
  unknown_region_l3: "也可以直接前往最近的医院急诊，或拨打你所在地的紧急电话。"
  minimal: "我在这里陪着你。请拨打下面的电话："
  # 草稿：待 G-0（F5b）。危机中用户说了“我没事”“我已经好多了”这类话、但还不算明确确认安全时，
  # 每次危机至多说一次：告诉用户怎样直接说出自己是安全的。不写号码。
  confirm_hint: "如果你现在是安全的，可以直接告诉我「我现在是安全的」。"
  # 草稿：待 G-0（S5，2026-10-26）。危机中用户说会去联系某个人（“我可以给表姐打个电话”“好，我等下打给她”）
  # 时，危机回复最前面的一句：先肯定这个决定。不退出危机，热线卡照常在后面；不写号码、不提问、不用槽位。
  reach_out:
    - "愿意去联系身边的人，这个决定很好。打过去的时候，可以直接告诉对方你现在不太好。"
    - "想到可以找信任的人，真好。不用想好怎么说，先让对方知道你需要陪伴就够了。"
    - "这一步很重要：让身边信任的人知道，你就不用一个人扛着。"
  # 草稿：待 G-0（S5）。危机流程中（或直接询问还没有得到回答时）用户输入 /exit 或结束输入：
  # 告别时的一句，后面由程序附上该地区热线（与危机卡相同的号码）和安全计划里的求助人。不问心情分，不用槽位。
  farewell:
    - "好，我们先聊到这里。离开之前，想再把这些电话留给你，难受的时候随时可以拨打。"
    - "谢谢你今天和我说了这么多。走之前，下面这些电话请留着，任何时候都可以打。"
  # 以下各项均为草稿：待 G-0（2026-10-26 安全回应第二轮，问题单第 5、6、7、11 条）。都不用槽位、不写号码：
  # 号码只来自 ResourceCard（与 olivia resources 同一份签名数据），由程序附在后面。
  #
  # 第 5 条：首访确认已满 18 岁后，用户在聊天中说自己未成年（“我才初二”“其实我14岁”）。
  # minor 是第一次的说明，接 minor_trusted_adult 一段，后面附该地区面向青少年或通用的热线（中国大陆为 12355 和 12356）；
  # minor_again 是本次会话之后每一轮（危机流程照常优先）：不再陪聊、不给练习，只给资源与告别。
  minor:
    - "谢谢你愿意告诉我。这里的陪伴是为年满十八岁的成年人设计的，所以接下来我没办法像平时那样陪你聊天、做练习了，这不是你做错了什么。"
  minor_trusted_adult: "你的感受很重要。可以找一位信任的大人聊一聊，比如家人、老师或学校的心理老师；也可以拨打下面的电话。"
  minor_again:
    - "我还在这里，只是这里是为成年人准备的，没办法再陪你聊下去了。想找人说说的话，可以找一位信任的大人，或者拨打下面的电话。想结束的时候，输入 /exit 就好。"
    - "谢谢你还愿意和我说话。这里只为成年人设计，所以我能做的是把这些电话留给你，也请找一位信任的大人陪陪你。输入 /exit 可以结束这次聊天。"
  # 第 6 条：用户转述别人的风险（“班上一个学生说不想活了”“我朋友说他想死”），用户本人不进危机流程。
  # third_party 是开头一句（认真回应、不问用户“你现在安全吗”）；之后是热线（标题用 third_party_lines_heading）；
  # 转述内容有具体计划、时间或手段时，最前面是紧急电话（标题用 third_party_emergency_heading）；
  # 然后一句来自 third_party_support（怎么陪对方，不做临床指导），对方要求保密时改用 third_party_secret；
  # 本次会话第一次时再加一句 third_party_self_care（也照顾好自己）。
  third_party:
    - "谢谢你这样认真地为对方担心。这件事很重要，不需要你一个人扛着。下面这些电话可以转给对方，你自己也可以先打过去，问问专业的人可以怎么帮对方。"
    - "听得出来你很在乎对方。对方说出这样的话，值得被认真对待。你可以把下面的电话转给对方，也可以自己先打过去，请专业的人一起想办法。"
  third_party_emergency_heading: "如果对方现在就有危险，请马上拨打当地的紧急电话，并尽量让人陪在对方身边："
  third_party_lines_heading: "可以转给对方，也可以你自己先打过去咨询的求助热线："
  third_party_support:
    - "陪着对方的时候，不用急着劝或讲道理，先认真听对方说完；也可以告诉对方，你很在乎，愿意陪着一起去找能帮忙的人。"
    - "和对方说话时，可以平静地说出你的担心，不评判、不争辩；比起说服，让对方知道有人在、愿意陪着去求助，更重要。"
  third_party_self_care:
    - "也别忘了照顾好自己：陪伴一个正在难受的人很耗心力，你也可以找信任的人，或者打这些电话说说你的感受。"
  third_party_secret:
    - "对方让你保密，说明对方很信任你。可以温和地告诉对方：因为太在乎你，这件事我需要请一位可信的大人或专业的人一起帮忙。为了对方的安全，这不算背叛。"
  # 第 7 条：用户主动要求求助电话或热线（任何阶段；危机流程与直接询问里本来就有热线卡）。
  # hotline_request 是开头一句，后面附该地区的全部资源（同 olivia resources）；
  # 用户问到实名或在国外拨打时，各附一句如实的说明，不编造号码。
  hotline_request:
    - "好的，这是你所在地区可以联系的求助电话。想打的时候随时都可以打，也可以在终端里输入 olivia resources 再看一遍。"
    - "当然可以。下面是你所在地区的求助电话，和 olivia resources 里的是同一份。"
  hotline_anonymous:
    - "这类心理援助热线一般不要求你报出真实姓名，说多少由你决定；如果担心，可以在电话接通时先问一句。"
  hotline_abroad:
    - "这些号码是按你设置的地区给出的。人在国外时，国内的短号码不一定能直接拨通；可以运行 olivia region 改成你现在所在的地区，看当地的热线。"
  # 第 11 条：有过危机的用户（关怀标记或本次会话出现过危机）之后说了 L1 的话（“撑不了多久了”）：
  # 回复前面加一句温和的关心，下一行由 care_hotline 开头、程序附上该地区热线的名字与号码。不进危机流程。
  care_watch:
    - "听到你这样说，我有点担心你，想先告诉你：我一直在这里。"
    - "你说的这句话，我放在心上了。不管怎样，你都不用一个人扛着。"
  care_hotline: "需要的时候，这些电话一直都在："
  emergency_purposes:
    police: "报警"
    ambulance: "医疗急救"
    fire_ambulance: "消防与急救"
    police_fire_ambulance: "报警、消防与急救"
    generic_gsm_emergency: "通用紧急求助"
