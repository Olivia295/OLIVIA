# 草稿：待 G-0 两名注册心理师审核（docs/superpowers/plans/2026-10-22-remaining-roadmap.md R1-4）
#
# 卡片外框文案：A 级跟练卡、B/C 科普卡、专科转介卡（REFERRAL）与危机卡（S_crisis）的标签和固定句。
# 卡片正文分别来自 cards/grade_a.yaml、cards/grade_bc_info.yaml 与签名热线数据 hotlines.yaml，
# 这里只放把它们串起来的话。
#   - 转介卡只写“去哪里、找谁”（精神科、心理门诊、专业心理咨询等），绝不写病名或诊断（PRD §9.3）。
#   - 危机卡号码只来自 ResourceCard，这里不写任何号码；“{minutes}”是唯一槽位。
#   - 转介与危机文案享有 WILLOW-01/04 安全用语豁免（willow.yaml exemptions），但仍过诊断词门禁。
version: 1

card:
  duration: "约 {minutes} 分钟"
  safety_label: "安全提示："
  stealth_label: "在工位上："
  # 草稿：待 G-0（F3）。工作时间（当地时间周一至周五 9:00–18:00）之外，卡片末尾不再说“在工位上”，
  # 改用这一句。
  home_line: "在家或安静的地方：找一个不被打扰的角落，坐着、靠着都可以，按自己的节奏来。"

# B/C 科普卡（roadmap next-phase A4）：ask_intro 用于用户点名询问某种疗法时，lens_intro 用于
# S_clarify 主动给出的 B 级“理解视角”。B 级只是一个看问题的角度，不布置任何任务；C 级保留临床
# 用语，并明确建议找专业人员当面了解（PRD §8.1）。
info:
  what_label: "它是什么："
  how_label: "大致如何起作用："
  who_label: "通常由谁进行："
  ask_intro: "你问到的这种方法，可以先简单了解一下："
  lens_intro: "有一种心理学的理解，也许能多给你一个看它的角度，放在这里，看看就好："
  b_closing: "这只是一个理解的角度，不需要你去做什么。如果想深入了解，可以找受过这类训练的心理咨询师聊聊。"
  c_closing: "这类方法要在专业人员的陪伴下进行，不适合自己尝试。如果想知道它是否适合你，可以去医院的心理门诊或精神科，或找受过相应训练的心理咨询师当面聊聊。"
  # 草稿：待 G-0（F3）。用户问到一种可以自己做的小练习（A 级）时的结尾。
  a_closing: "这里有它的一个小练习版本。想试试的话，跟我说「带我做一下」再加上它的名字就好；不想试也完全没关系。"

# 转介去处按用户保存的地区分三套：destinations 用于中国大陆（CN），destinations_hk_mo_tw 用于
# 香港、澳门、台湾，destinations_elsewhere 用于其他地区和没有保存地区的用户（不提任何只在大陆
# 才有的机构名称）。三套的键都必须与 taxonomy 的 clinical_red_flags 一一对应。
referral:
  intro: "有些难处，值得有专业的人和你一起面对。如果你愿意，可以考虑去这些地方看看："
  # 草稿：待 G-0（F5b）。同一张转介卡紧接着下一轮又要出现时，改用这里的一句简短开头（依次轮换），
  # 去处照样逐条列出，只省掉结尾那段话；不写病名、诊断与号码。
  again:
    - "刚才提到的专业帮助，依然在这里："
    - "这些地方，随时都可以去看看："
    - "想找专业的人一起面对的话，还是这些地方："
  destinations:
    SIT-02-04: "医院的精神科门诊，请医生帮你一起看看情绪和作息的起伏"
    SIT-02-06: "妇幼保健院的产后心理门诊，或医院的精神科"
    SIT-06-01: "医院的精神科或心理门诊，可以说明想找擅长处理创伤经历的医生"
    SIT-06-05: "医院的精神科门诊"
    SIT-08-04: "综合医院的营养科，同时到精神科就诊"
    SIT-09-01: "医院的精神科或心理门诊，也请一位信任的家人或朋友一起陪着你"
    SIT-10-04: "医院的成瘾医学科或精神科；想停或减少时，医生可以陪你一步步来"
  destinations_hk_mo_tw:
    SIT-02-04: "医院的精神科专科门诊，也可以先请家庭医生帮你转介"
    SIT-02-06: "为你做产检或产后检查的医护人员，或医院的精神科专科门诊"
    SIT-06-01: "医院的精神科专科门诊或临床心理服务，可以说明想找擅长处理创伤经历的专业人员"
    SIT-06-05: "医院的精神科专科门诊，也可以先请家庭医生帮你转介"
    SIT-08-04: "家庭医生或医院的营养师，同时到精神科专科门诊就诊"
    SIT-09-01: "医院的精神科专科门诊或临床心理服务，也请一位信任的家人或朋友一起陪着你"
    SIT-10-04: "医院的精神科专科门诊或戒瘾治疗服务；想停或减少时，医生可以陪你一步步来"
  destinations_elsewhere:
    SIT-02-04: "当地的精神科或心理科，或者你的家庭医生"
    SIT-02-06: "为你做产检或产后检查的医护人员，或当地的精神科、心理科"
    SIT-06-01: "当地的精神科或心理科，或者你的家庭医生，可以说明想找擅长处理创伤经历的专业人员"
    SIT-06-05: "当地的精神科或心理科，或者你的家庭医生"
    SIT-08-04: "你的家庭医生或营养师，同时到当地的精神科或心理科就诊"
    SIT-09-01: "当地的精神科或心理科，或者你的家庭医生，也请一位信任的家人或朋友一起陪着你"
    SIT-10-04: "当地的精神科、心理科或成瘾治疗服务，或者你的家庭医生；想停或减少时，医生可以陪你一步步来"
  closing: "去就医不代表你有多糟糕，只是多了一个懂行的人陪你。去之前，也可以先打心理援助热线聊一聊。"
  # 草稿：待 G-0（F13，计划 D-3）。taxonomy 为 SIT-10-04 登记的唯一专属动作 WITHDRAWAL_RISK_WARNING
  # （戒断风险警示）不做成“做不做由你”的可选卡片，而是写进这张强制出现的转介卡：完整转介卡在去处之后、
  # 结尾之前多这一段，内容按 taxonomy 的三步改写（骤停有危险、不要自己停药换药、请人陪着去医院评估）。
  # 不写病名、诊断与号码。F16b：每条警示是一个段落列表，每段单独成段，不超过 80 字（原来一段 87 字，
  # 拆成两段，意思不变）。
  # 草稿：待 G-0（试用问题 13，2026-10-26）：原第二段“请不要在没有医生指导时自己骤然停用、换药或猛地戒掉”，
  # 正在戒酒、戒药的人会读成“别戒”。改为先肯定想停的心意、说清这不是要人继续用，再说突然停的危险
  # 和“在医生指导下进行”。去处里的“在医生指导之前，请不要自己突然停用”同样改写。不给剂量或方案，不诊断。
  warnings:
    SIT-10-04:
      - "还想提醒一句：想戒掉或少用一些，这份决心很珍贵，这句提醒不是要你继续用下去。"
      - "只是酒精和一些药物如果突然停下来，身体可能出现很危险的反应。所以想停、减少或换药时，最好在医生指导下进行，请一位家人或朋友陪着去医院先评估。"

crisis:
  emergency_heading:
    L2: "紧急情况可以拨打："
    L3: "如果危险就在眼前，请立即拨打："
  lines_heading: "可以联系的求助热线："
  hours_label: "服务时间："
  stale_mark: "（信息可能已过期）"
  contact_people: "也请马上叫一位身边信任的人过来陪着你。"
  unknown_region_l3: "也可以直接前往最近的医院急诊，或拨打你所在地的紧急电话。"
  minimal: "我在这里陪着你。请拨打下面的电话："
  # 草稿：待 G-0（F5b）。危机中用户说了“我没事”“我已经好多了”这类话、但还不算明确确认安全时，
  # 每次危机至多说一次：告诉用户怎样直接说出自己是安全的。不写号码。
  confirm_hint: "如果你现在是安全的，可以直接告诉我「我现在是安全的」。"
  # 草稿：待 G-0（S5，2026-10-26）。危机中用户说会去联系某个人（“我可以给表姐打个电话”“好，我等下打给她”）
  # 时，危机回复最前面的一句：先肯定这个决定。不退出危机，热线卡照常在后面；不写号码、不提问、不用槽位。
  reach_out:
    - "愿意去联系身边的人，这个决定很好。打过去的时候，可以直接告诉对方你现在不太好。"
    - "想到可以找信任的人，真好。不用想好怎么说，先让对方知道你需要陪伴就够了。"
    - "这一步很重要：让身边信任的人知道，你就不用一个人扛着。"
  # 草稿：待 G-0（第三轮修复，2026-10-27）。危机流程中或卡片等反馈时，用户说了新内容（没有风险线索），
  # 回复先回应一句，再接热线或 /done 提示，不再吞掉用户的话。都不用槽位、不写号码：
  #   heard           接在对用户原话的简短复述之后（“你今天看到一只很胖的猫，谢谢你说给我听。”）；
  #   question_heard  用户问了别的事（“你喜欢猫吗”）；
  #   brief_heard     很短的一句（“好吧”“嗯”）；
  #   help_seeking    用户说想去医院、挂号、找学校心理中心或心理老师：先肯定，再说一般挂什么科，不写病名；
  #   check_denied    卡片等反馈时，用户对安全询问明确回答“不是”之后的一句。
  heard:
    - "谢谢你说给我听。"
    - "这些我都听到了。"
    - "我都听着。"
  question_heard:
    - "你问的这个，我听到了，我们可以慢慢聊。"
    - "谢谢你问我，我在这里，陪你慢慢说。"
  brief_heard:
    - "嗯，我在这里。"
    - "好，我一直都在。"
  help_seeking:
    - "想去找专业的人看看，这一步很好。去医院一般可以挂精神科或心理科，学校、单位的心理中心也可以；去了说说最近的情绪和睡眠就好。"
    - "愿意去找医生或心理老师聊聊，真的很好。医院的精神科、心理科（有的叫心理门诊）都可以挂，见面时照实说说最近的感受就够了。"
  # 草稿：待 G-0（第四轮修复，2026-10-28）。想去学校、大学的心理中心或找心理老师、辅导员时（含英文提问），
  # 不说医院挂什么科，说学校的心理中心一般怎么去。不写号码、不用槽位、不写病名。
  help_seeking_school:
    - "想去学校的心理中心看看，这一步很好。学校的心理中心一般可以先预约，也有的接待当天直接去的同学，具体以学校的通知为准；也可以先问问辅导员或心理老师。去了说说最近的情绪和睡眠就好。"
  check_denied:
    - "好，谢谢你告诉我，我放心一些了。"
    - "嗯，知道了，谢谢你愿意回答我。"
  # 草稿：待 G-0（第三轮修复，2026-10-27）。聊天中输入 /help、/帮助 或 /? 时显示的可用命令（不当成心事复述）。
  # 危机流程中照常给危机卡，这段放在最前面。不写号码、不用槽位。
  chat_help: |-
    在聊天里可以用这些命令：
    · /done：做完了刚才的小练习
    · /not-now：先把练习收进锦囊，以后再用
    · /unhelpful：这个练习对你没有帮助
    · /exit：结束这次聊天
    也可以直接说出来，比如「能给我一个心理援助热线的号码吗」「换个话题吧」。在终端里运行 olivia resources，随时可以查看求助电话。
  # 草稿：待 G-0（S5）。危机流程中（或直接询问还没有得到回答时）用户输入 /exit 或结束输入：
  # 告别时的一句，后面由程序附上该地区热线（与危机卡相同的号码）和安全计划里的求助人。不问心情分，不用槽位。
  farewell:
    - "好，我们先聊到这里。离开之前，想再把这些电话留给你，难受的时候随时可以拨打。"
    - "谢谢你今天和我说了这么多。走之前，下面这些电话请留着，任何时候都可以打。"
  # 以下各项均为草稿：待 G-0（2026-10-26 安全回应第二轮，问题单第 5、6、7、11 条）。都不用槽位、不写号码：
  # 号码只来自 ResourceCard（与 olivia resources 同一份签名数据），由程序附在后面。
  #
  # 第 5 条：首访确认已满 18 岁后，用户在聊天中说自己未成年（“我才初二”“其实我14岁”）。
  # minor 是第一次的说明，接 minor_trusted_adult 一段，后面附该地区面向青少年或通用的热线（中国大陆为 12355 和 12356）；
  # minor_again 是本次会话之后每一轮（危机流程照常优先）：不再陪聊、不给练习，只给资源与告别。
  minor:
    - "谢谢你愿意告诉我。这里的陪伴是为年满十八岁的成年人设计的，所以接下来我没办法像平时那样陪你聊天、做练习了，这不是你做错了什么。"
  minor_trusted_adult: "你的感受很重要。可以找一位信任的大人聊一聊，比如家人、老师或学校的心理老师；也可以拨打下面的电话。"
  minor_again:
    - "我还在这里，只是这里是为成年人准备的，没办法再陪你聊下去了。想找人说说的话，可以找一位信任的大人，或者拨打下面的电话。想结束的时候，输入 /exit 就好。"
    - "谢谢你还愿意和我说话。这里只为成年人设计，所以我能做的是把这些电话留给你，也请找一位信任的大人陪陪你。输入 /exit 可以结束这次聊天。"
  # 草稿：待 G-0（第四轮修复，2026-10-28；PRD 裁定 22“阻止再次进入”）。第一次说明之后温和地请用户确认：
  # 确认（“是的”）后，这台电脑上记下“未满 18 岁”（和首访选未满 18 岁时一样，不记年龄、不记原话），以后打开
  # OLIVIA 也只给求助电话；不确认就只在这一次聊天里这样处理。minor_confirm 是问句；
  # minor_recorded / minor_session_only 是回答之后的一句。都不写号码、不用槽位。
  # 草稿：待 G-0（第六轮修复，2026-10-29，复测 q4 F5；PRD 裁定 22“只留不含个人数据的拒绝记录”）：确认后，这次聊天
  # 不写小结，聊天结束时这台电脑上之前存下的设置、聊天记录、锦囊和安全计划都会删掉，只留那一条记录；
  # 不确认时这次聊天也不写小结。
  minor_confirm: "想跟你确认一下：你现在还不满十八岁，对吗？如果是，回复「是的」，我会在这台电脑上只记下“未满十八岁”（不记年龄，也不记你说过的话），这次聊天结束时，这里之前存下的设置和聊天记录也会一起删掉；以后打开这里只会给你求助电话。"
  minor_recorded: "好，已经记下了，这次聊天不会留下记录，结束时这里之前存下的内容也会删掉。谢谢你如实告诉我。"
  minor_session_only: "好，那这台电脑上不会记下来，这次聊天也不会留下记录，只是这一次我还是只能把电话留给你。"
  # 第 6 条：用户转述别人的风险（“班上一个学生说不想活了”“我朋友说他想死”），用户本人不进危机流程。
  # third_party 是开头一句（认真回应、不问用户“你现在安全吗”）；之后是热线（标题用 third_party_lines_heading）；
  # 转述内容有具体计划、时间或手段时，最前面是紧急电话（标题用 third_party_emergency_heading）；
  # 然后一句来自 third_party_support（怎么陪对方，不做临床指导），对方要求保密时改用 third_party_secret；
  # 本次会话第一次时再加一句 third_party_self_care（也照顾好自己）。
  third_party:
    - "谢谢你这样认真地为对方担心。这件事很重要，不需要你一个人扛着。下面这些电话可以转给对方，你自己也可以先打过去，问问专业的人可以怎么帮对方。"
    - "听得出来你很在乎对方。对方说出这样的话，值得被认真对待。你可以把下面的电话转给对方，也可以自己先打过去，请专业的人一起想办法。"
  third_party_emergency_heading: "如果对方现在就有危险，请马上拨打当地的紧急电话，并尽量让人陪在对方身边："
  third_party_lines_heading: "可以转给对方，也可以你自己先打过去咨询的求助热线："
  third_party_support:
    - "陪着对方的时候，不用急着劝或讲道理，先认真听对方说完；也可以告诉对方，你很在乎，愿意陪着一起去找能帮忙的人。"
    - "和对方说话时，可以平静地说出你的担心，不评判、不争辩；比起说服，让对方知道有人在、愿意陪着去求助，更重要。"
  third_party_self_care:
    - "也别忘了照顾好自己：陪伴一个正在难受的人很耗心力，你也可以找信任的人，或者打这些电话说说你的感受。"
  third_party_secret:
    - "对方让你保密，说明对方很信任你。可以温和地告诉对方：因为太在乎你，这件事我需要请一位可信的大人或专业的人一起帮忙。为了对方的安全，这不算背叛。"
  # 草稿：待 G-0（第三轮修复，2026-10-27）。转述卡之后的几轮里，用户的追问继续得到具体做法，不退回普通复述：
  # third_party_unreachable 用于“我联系不上他”这一类（按紧急情况处理，后面附紧急电话与热线）；
  # third_party_urgent_steps 用于转述里有时间、手段或计划之后的“我该怎么办”。不写号码、不用槽位。
  third_party_unreachable:
    - "联系不上对方、又担心对方现在就有危险时，请不要等：马上拨打下面的紧急电话，告诉接线员对方是谁、可能在哪里、你为什么担心；同时请离对方近的人（家人、室友、同事或老师）立刻去看看。"
  third_party_urgent_steps:
    - "对方说到了很近的时间或具体的方法，请把它当作紧急情况：担心对方现在就有危险时，先拨打下面的紧急电话，说清对方是谁、在哪里、你为什么担心；能联系上对方的话，尽量让人陪在对方身边。"
    - "这种情况不用你一个人判断：担心对方现在就有危险，就直接拨打下面的紧急电话；然后尽量请一位可信的人赶到对方身边陪着，也可以打下面的热线，问问专业的人接下来怎么做。"
  # 草稿：待 G-0（第四轮修复，2026-10-28）。转述卡之后几轮里的两种追问，各给具体做法，不写号码、不用槽位：
  # third_party_how_to_ask 用于“该怎么开口 / 该跟她说点什么”：怎样直接、温和地问（直接问不会让对方更想做）；
  # third_party_says_fine 用于“要是他说没事呢 / 他说他没事”：可以继续关心、留意哪些变化、可以再问。
  third_party_how_to_ask:
    - "可以找一个安静、不被打扰的时候，平静地说出你听到的和你的担心，再直接问一句：“你是不是有想结束自己生命的念头？”直接问并不会让对方更想这样做，反而让对方知道这件事可以说出来。然后先听，不急着劝或讲道理；如果对方说有，陪着对方一起拨打下面的电话。"
    - "开口可以很简单：“你那天说的话我一直放在心上，我很担心你。你是不是想过结束自己的生命？”把这个问题直接问出来是可以的，也是专业人员推荐的做法。对方愿意说，就认真听；对方说有，就陪着一起联系下面的热线或身边可信的大人。"
  # 草稿：待 G-0（第五轮修复，2026-10-29）。转述卡之后几轮里的两种追问，各给具体做法，不写号码、不用槽位：
  # third_party_far 用于“他在外地 / 我过不去”：人不在对方身边时能做的事（当地紧急电话、联系对方身边的人、保持联系）；
  # third_party_stranger 用于“我又不认识他 / 只是网上认识”：不认识对方也能做的事（平台举报、紧急时报警）。
  third_party_far:
    - "人不在对方身边，也有能做的事：担心对方现在就有危险时，请拨打下面的紧急电话，说清对方是谁、在哪个城市、具体地址或大概位置、你为什么担心；同时联系对方身边的人（家人、室友、同事、老师或宿管），请他们马上过去看看、陪着对方；你这边尽量保持和对方的联系，电话、消息都可以。"
    - "离得远的时候，可以请离对方近的人代你去：先想想谁能最快到对方身边（家人、室友、同事、楼管或辅导员），请他们现在就去看看；如果担心对方此刻就有危险，直接拨打下面的紧急电话，报出对方的位置。你自己能做的，是一直保持联系，让对方知道你在。"
  third_party_stranger:
    - "就算不认识对方，也能帮上忙：如果是在网上看到的，可以用平台的举报功能，选“自杀或自伤”一类，多数平台有专人处理；如果内容里有具体的时间、地点或方法，担心对方现在就有危险，可以拨打下面的紧急电话报警，把截图、链接或对方的账号一并提供。"
    - "不认识对方也没关系，你愿意管这件事已经很重要。可以做的有：在对方发言的平台上举报，请平台介入；能联系到对方认识的人（比如共同的群主、同学、同事）的话，请他们留意；看起来很紧急时，直接拨打下面的紧急电话，说清你看到了什么、在哪里看到的。"
  third_party_says_fine:
    - "对方说没事，也可以温和地告诉对方：你还是会关心、随时都在。之后留意对方有没有把东西送人、说告别的话、突然异常平静这类变化；你仍然担心的时候，可以再问一次，也可以先打下面的热线，问问专业的人怎么看。"
    - "听到“没事”，不代表你的担心是多余的。可以告诉对方你会一直在，想聊的时候随时找你；如果对方之后又说起类似的话，或者你还是放心不下，下面的电话可以帮你一起判断。"
  # 第 7 条：用户主动要求求助电话或热线（任何阶段；危机流程与直接询问里本来就有热线卡）。
  # hotline_request 是开头一句，后面附该地区的全部资源（同 olivia resources）；
  # 用户问到实名或在国外拨打时，各附一句如实的说明，不编造号码。
  hotline_request:
    - "好的，这是你所在地区可以联系的求助电话。想打的时候随时都可以打，也可以在终端里输入 olivia resources 再看一遍。"
    - "当然可以。下面是你所在地区的求助电话，和 olivia resources 里的是同一份。"
  hotline_anonymous:
    - "这类心理援助热线一般不要求你报出真实姓名，说多少由你决定；如果担心，可以在电话接通时先问一句。"
  hotline_abroad:
    - "这些号码是按你设置的地区给出的。人在国外时，国内的短号码不一定能直接拨通；可以运行 olivia region 改成你现在所在的地区，看当地的热线，也可以上 findahelpline.com 查。"
  # 草稿：待 G-0（第三轮修复，2026-10-27）。热线的常见追问，各一句固定、如实的回答（号码仍只来自 ResourceCard）：
  # 收费、服务时间、语言、号码是否可靠、还有没有别的号码；用户说自己在别的地方时，other_region 用于已支持的
  # 其他地区（附那个地区的电话），elsewhere 用于这里没有核对过号码的地方（附通用资源，绝不拿设置地区的号码冒充）。
  hotline_fee:
    - "这些热线一般不另收咨询费，通话费按你的电话套餐算，各地可能不同；拿不准的话，接通后可以先问一句。"
  hotline_hours:
    - "每条热线的服务时间写在号码下面，没写的以接通后的说明为准；夜里打不通、又担心自己的安全时，请直接拨打当地的紧急电话。"
  hotline_language:
    - "接线员一般用当地的主要语言；能不能讲普通话、粤语或英语，各条热线不一样，接通后可以先问一句。"
  hotline_real:
    - "这些号码来自 OLIVIA 自带、经过签名校验的热线资料，每条都对照过官方来源，和 olivia resources 里的是同一份；标着「信息可能已过期」的，请再以官方渠道为准。"
  hotline_more:
    - "下面就是这里为这个地区核对过的全部号码，我不会给出没有核对过的号码。想看别的地区，可以在终端运行 olivia resources 加地区代码，比如 olivia resources HK。"
  hotline_other_region:
    - "好的，下面是你提到的那个地区的求助电话，和 olivia resources 里的是同一份。想以后都按那里给电话，可以运行 olivia region 改一下。"
  hotline_elsewhere:
    - "这里还没有核对过你所在那个地方的热线，所以不会拿别处的号码来冒充。可以上 findahelpline.com 按国家查当地的求助热线；紧急情况请先拨打当地的紧急电话。想看已支持地区的号码，可以运行 olivia resources 加地区代码。"
  # 草稿：待 G-0（第四轮修复，2026-10-28）。地区是“其他”或说自己在还没核对过热线的国家时，在通用资源之后
  # 加一行：当地的紧急电话请以当地公布的为准，再列 local_emergency 里那个国家的官方报警 / 急救号码。
  # local_emergency 只收各国官方公布的报警、消防与急救号码（不收任何心理热线），每条注明来源。
  hotline_local_emergency_intro: "当地的紧急电话请以当地公布的为准，常见的是："
  # 草稿：待 G-0（第四轮修复，2026-10-28）。热线追问“几点有人接”时，在 hotline_hours 之前先列热线资料里
  # 每条热线的服务时间（程序附上“名称 号码：时段”，时段原样取自签名的热线资料）。
  hotline_hours_from_data: "热线资料里写的服务时间是："
  # 草稿：待 G-0（第五轮修复，2026-10-29，复测 q2 第 5 节）。都不写号码、不用槽位；号码只来自签名的热线资料。
  # hotline_unreachable：说打不通、占线、没人接时，放在资源卡前面：换个时段或换一条热线，担心安全就拨当地紧急电话，
  #   也找身边的人陪着。
  # hotline_emergency：问报警或急救电话时放在资源卡前面（卡上紧急电话排在最前）。
  # hotline_number_known：问“某个号码是干嘛的”时，后面由程序附上“号码：热线资料里的名称（地区）”，再附资源卡；
  # hotline_number_unknown：资料里没有这个号码时的一句，不猜它是做什么的。
  # hotline_place_hint：用英文说了一个这里不认识的地方（“hotline in Brazil”）时，资源卡后面的一句。
  # unknown_command：以“/”开头、但不是聊天命令的输入（“/热线”这类要资源的直接给资源），后面附 chat_help。
  hotline_unreachable:
    - "打不通的时候，可以过一会儿换个时段再打，或者试试下面另一条热线；如果担心自己现在的安全，请直接拨打当地的紧急电话，也可以先找身边信任的人陪着你。"
  hotline_emergency:
    - "好的，紧急电话排在下面最前面。遇到危险或身体出了急事，请直接拨打。"
  hotline_number_known: "这个号码在热线资料里是："
  hotline_number_unknown:
    - "这个号码不在这里核对过的热线资料里，我没法确认它是做什么的，也不想乱猜。下面是你所在地区核对过的求助电话。"
  hotline_place_hint:
    - "上面是按你设置的地区给出的号码。你说的那个地方这里可能还没有核对过的热线：想看别的地区，可以在终端运行 olivia resources 加地区代码，也可以上 findahelpline.com 按国家查。"
  unknown_command: "这个命令我不认识。"
