# 草稿：待 G-0 两名注册心理师审核（docs/superpowers/plans/2026-10-22-remaining-roadmap.md R1-4）
#
# 图式镜像（决定 D4，步骤 C2；PRD 特性三 / MIYI-03，SDD §3.2）：本会话里内省器识别到某个图式时，
# 在 S_clarify 用一个温和的问题把它背后那句“心里的声音”照见出来，由用户自己确认或否认。
# 只在模型模式（olivia chat --model）出现，且唤醒度 < 0.80、每次会话至多一次；危机、避风港、
# 有红线（转介）或 L1 筛查的轮次从不出现。规则模式从不出现（裁定 25）。
#
# 键：taxonomy.yaml schemas.id，20 个图式各有一组。每条是一整段（替换 S_clarify 的 invite 段），
# ≤ 80 字，含一个问句，不带槽位，不出现图式名称、诊断词或临床术语，不说“应该/必须”，
# 经 WILLOW 过滤后原样不变并通过输出网关（tests/perception/test_introspector.py 校验）。
version: 1

by_schema:
