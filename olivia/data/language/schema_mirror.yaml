    - "听你说下来，心里好像有个声音一直在说“我不够好”，是这样吗？我也可能理解得不对，你随时可以纠正我。"
    - "我想轻轻问一句：你心里是不是常常会冒出一个念头，“我不够好”？如果不是这样，也完全没关系。"
