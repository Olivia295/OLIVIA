  - {term: "病理性的", replacement: "格外沉重的"}
  - {term: "接受治疗", replacement: "好好照料自己"}
  - {term: "需要治疗", replacement: "需要被好好照料"}
  - {term: "去治疗一下", replacement: "去照料一下自己"}
  - {term: "你的症状", replacement: "你的这些感受"}
  - {term: "这些症状", replacement: "这些感受"}
  - {term: "这种症状", replacement: "这种感受"}
  - {term: "出现症状", replacement: "出现这些感受"}
  - {term: "发病", replacement: "难受起来"}
  - {term: "犯病", replacement: "难受起来"}
  - {term: "惊恐发作", replacement: "一阵强烈的心慌"}
