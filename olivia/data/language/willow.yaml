# 各过滤器豁免的内容类型：CRISIS = S_crisis 危机响应文案；REFERRAL = Grade C / 红线专科转介卡；
# GRADE_C_INFO = Grade C 方法的心理教育说明。
#   - didactic_rewrites：PRD WILLOW-01 允许危机与转介文案保留“必须确保安全”“请务必联系身边人”；
#     Grade C 说明同属安全用语（“必须在专业人员陪同下进行”），一并豁免。
#   - depathologize：PRD WILLOW-04 保留转介卡临床术语；危机文案按 SDD §5.3“无损完整呈现”同样不改写。
#   - diagnosis_terms：无豁免。转介卡与说明只写专科名称（如“精神科”），不对用户下诊断。
#   - word_window：SDD §5.3 第 4 条，危机卡与 Grade C 转介卡豁免字数阻尼（WILLOW-03）。
#   - metaphor_weaving：危机与转介信息以清晰为唯一准则，不织入隐喻。
exemptions:
  didactic_rewrites: [CRISIS, REFERRAL, GRADE_C_INFO]
  depathologize: [CRISIS, REFERRAL, GRADE_C_INFO]
  diagnosis_terms: []
  word_window: [CRISIS, REFERRAL]
  metaphor_weaving: [CRISIS, REFERRAL, GRADE_C_INFO]
