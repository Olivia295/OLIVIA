# WILLOW-04：去病理化温和替换。term 都带语境，避免裸词“治疗/症状/疾病/障碍/创伤”——
# 它们出现在方法名中（protected_terms），测试保证每个 term 都不会改动任何受保护词。
depathologize:
  - {term: "患者", replacement: "朋友"}
  - {term: "病人", replacement: "朋友"}
  - {term: "病号", replacement: "正在休养的人"}
  - {term: "病态的", replacement: "卡住的"}
