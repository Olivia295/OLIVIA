# 草稿：待 G-0 两名注册心理师审核（docs/superpowers/plans/2026-10-22-remaining-roadmap.md R1-4）
#
# W.I.L.L.O.W. 言语重塑词表（PRD §7.4 WILLOW-01/04、§9.3；SDD §5.1–5.3）。
# 所有条目都是字面子串，不是正则。约定的匹配语义（tests/language/test_willow_data.py 中有参考实现）：
#   - 从左到右扫描，同一位置取最长匹配，替换后不重叠、不回扫（替换结果不再参与匹配）；
#   - 运行顺序：diagnosis_terms 门禁 → depathologize → didactic_rewrites；
#   - protected_terms 中的子串在替换前整体遮蔽，任何替换都不能改动它们（测试同时保证即便不遮蔽也不会改动）。
version: 1

# WILLOW-01：说教/命令语气 → 温和邀请。
# 标注“守卫”的条目把“应该/必须”的推测或否定用法先行接住，避免被后面的短模式误改。
didactic_rewrites:
  # 守卫：推测语气的“你应该……”（“你应该很累吧”）不是命令
  - {pattern: "你应该已经", rewrite: "你可能已经"}
  - {pattern: "你应该是", rewrite: "你可能是"}
  - {pattern: "你应该很", rewrite: "你可能很"}
  - {pattern: "你应该挺", rewrite: "你可能挺"}
  - {pattern: "你应该会", rewrite: "你可能会"}
  # 命令语气
  - {pattern: "你应该学会", rewrite: "或许可以慢慢学着"}
  - {pattern: "你应该要", rewrite: "或许可以试着"}
  - {pattern: "你就应该", rewrite: "或许可以"}
  - {pattern: "你应该", rewrite: "或许可以试试"}
  - {pattern: "你应当", rewrite: "或许可以试试"}
  - {pattern: "你不应该", rewrite: "或许不必"}
  - {pattern: "你不该", rewrite: "或许不必"}
  # 守卫：否定的“必须”
  - {pattern: "不是必须的", rewrite: "并不强求"}
  - {pattern: "不是必须要", rewrite: "不一定要"}
  - {pattern: "不是必须", rewrite: "不一定要"}
  - {pattern: "并非必须", rewrite: "不一定要"}
  - {pattern: "是必须的", rewrite: "很重要"}
  - {pattern: "你必须要", rewrite: "如果愿意，你可以"}
  - {pattern: "你必须", rewrite: "如果愿意，你可以"}
  - {pattern: "我们必须", rewrite: "我们可以"}
  - {pattern: "必须要", rewrite: "可以试着"}
  - {pattern: "必须得", rewrite: "可以试着"}
  - {pattern: "必须", rewrite: "可以试着"}
  - {pattern: "你一定要", rewrite: "如果可以，不妨"}
  - {pattern: "你一定得", rewrite: "如果可以，不妨"}
  - {pattern: "你得先", rewrite: "或许可以先"}
  - {pattern: "千万不要", rewrite: "可以试着不"}
  - {pattern: "千万别", rewrite: "可以试着不"}
  - {pattern: "不要再", rewrite: "可以试着不再"}
  - {pattern: "不许", rewrite: "先不急着"}
  - {pattern: "请务必", rewrite: "如果可以，请"}
  - {pattern: "务必要", rewrite: "尽量"}
  - {pattern: "务必", rewrite: "尽量"}
  - {pattern: "赶紧", rewrite: "可以慢慢"}
  - {pattern: "你最好还是", rewrite: "或许可以"}
  - {pattern: "你最好先", rewrite: "或许可以先"}
  - {pattern: "你早该", rewrite: "现在也来得及"}
  - {pattern: "你怎么还", rewrite: "你还"}
  - {pattern: "你只需要", rewrite: "可以先试着"}
  - {pattern: "你需要学会", rewrite: "或许可以慢慢学着"}
  - {pattern: "你要学会", rewrite: "或许可以慢慢学着"}
  - {pattern: "你要明白", rewrite: "也许可以留意到"}
  - {pattern: "你要知道", rewrite: "想和你说"}
  - {pattern: "你要记住", rewrite: "希望你记得"}
  - {pattern: "你要做的是", rewrite: "可以试试的是"}
  - {pattern: "正确的做法是", rewrite: "一个可以试试的方式是"}
  - {pattern: "我建议你", rewrite: "也许可以试试"}
  - {pattern: "我劝你", rewrite: "如果愿意，可以"}
  - {pattern: "让我告诉你", rewrite: "想和你分享"}
  - {pattern: "听我的，", rewrite: "我有个小想法，"}
  # 劝诫式安慰 → 允许感受
  - {pattern: "你要坚强点", rewrite: "累了也可以歇一歇"}
  - {pattern: "你要坚强", rewrite: "你不用一直坚强"}
  - {pattern: "要坚强", rewrite: "不用一直坚强"}
  - {pattern: "坚强一点", rewrite: "累了也可以歇一歇"}
  - {pattern: "坚强点", rewrite: "累了也可以歇一歇"}
  - {pattern: "你要振作起来", rewrite: "慢慢缓过来就好"}
  - {pattern: "振作起来", rewrite: "慢慢缓过来就好"}
  - {pattern: "想开一点", rewrite: "给自己一点时间"}
  - {pattern: "想开点", rewrite: "给自己一点时间"}
  - {pattern: "别想太多了", rewrite: "想得多也没关系"}
  - {pattern: "别想太多", rewrite: "想得多也没关系"}
  - {pattern: "别难过", rewrite: "难过也没关系"}
  - {pattern: "别哭了", rewrite: "想哭就哭吧"}
  - {pattern: "别哭", rewrite: "想哭就哭吧"}
  - {pattern: "不要哭", rewrite: "想哭就哭吧"}
  # 公文排比（SDD §5.1 V_didactic）；只收带逗号的序数用法，裸“首先/其次”留给生成侧避免
  - {pattern: "首先要做的是", rewrite: "可以先试着"}
  - {pattern: "首先你要", rewrite: "你可以先"}
  - {pattern: "首先我们", rewrite: "我们可以先"}
  - {pattern: "首先要", rewrite: "可以先"}
  - {pattern: "首先，", rewrite: "如果愿意，可以先"}
  - {pattern: "其次，", rewrite: "之后，也可以"}
  - {pattern: "再次，", rewrite: "再往后，也可以"}
  - {pattern: "总而言之，", rewrite: "回头看看，"}
  - {pattern: "综上所述，", rewrite: "回头看看，"}
  - {pattern: "总的来说，", rewrite: "回头看看，"}
  - {pattern: "总之，", rewrite: "回头看看，"}
  - {pattern: "毫无疑问，", rewrite: "我隐约觉得，"}
  - {pattern: "显而易见，", rewrite: "也许，"}

