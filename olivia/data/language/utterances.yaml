# 草稿：待 G-0 两名注册心理师审核（质量修复 F3：不是陈述句的消息，以及用药、诊断问题）
#
# acks：用户这句话不是在讲自己的事（提问、请求、打招呼、道谢、“记住：……”、暂时道别、一个字的回应、
# 没有中文的消息），就不做复述（不会出现“你感到谢谢”），{mirror} 槽位改用这里的一句简短回应。
# 每句以“你”开头、不含“我”、不超过 20 字，要能接在“听起来，”“我听见的是：”“从你的话里，
# 我感觉到”后面读通。同一句话总是选同一条（按文字定，不消耗随机数）。
#
# boundaries：陪伴者回答不了、也不该回答的问题，回复开头先说一句实话，然后照常回应。
#   medication  问药量、加药减药停药：请问开药的医生或药剂师。cues 与 needs_any 各至少命中一个。
#   diagnosis   问“我是不是……症”：说明没法下诊断，可以找精神科或心理科评估。cues 是提问的说法，
#               needs_any 是病名或“病”一类的词，两者各至少命中一个。
# 两句都不写任何药名、剂量、病名或数字，也不说“必须”。
#
# reassurance（草稿：待 G-0，F5b）：危机中这些说法（“我没事”“我已经好多了”）不算明确确认安全
# （有意保守，确认只认危机词表里的说法）；出现时，危机回复里每次危机至多提示一次怎样直接说
# “我现在是安全的”（render.yaml crisis.confirm_hint）。这里只决定是否提示，不影响危机的进出。
version: 1

acks:
  QUESTION:
    - 你心里有个问题想问
    - 你想把一些事弄明白
    - 你在认真地想这件事
  REQUEST:
    - 你说出了自己想要的
    - 你把想要的说了出来
  GREETING:
    - 你来这里坐一坐
    - 你来打了个招呼
  THANKS:
    - 你想说一声谢谢
    - 你心里有一份谢意
  NOTE:
    - 你想让这件事被记住
  # 草稿：待 G-0（F5b）。只是暂时道别（“今天就到这里吧”“我去睡了”），不复述成感受。
  CLOSING:
    - 你想先在这里停一停
    - 你准备先歇一歇了
  BRIEF:
    - 你还在这里
    - 你还想在这里待一会儿
    - 你先简单回了一句
  FOREIGN:
    - 你换了一种语言来说
    - 你说出了此刻的心里话
  # 草稿：待 G-0（试用问题 I3，2026-10-26）。说的是陪伴者这边刚才做了什么（“上次你一直问我安不安全”）：
  # 复述会把“你”换成“对方”、像在说别人，所以只简短承认。
  COMPANION:
    - 你说起了这边之前的回应
    - 你把对这边的感受说了出来
  # 草稿：待 G-0（试用问题 I3）。只说了想换个话题（“说点别的”）。
  TOPIC:
    - 你想换个话题
    - 你想聊点别的
  # 草稿：待 G-0（试用问题 I3）。粤语等方言的口语写法（“份工搵钱少”）：没法稳妥地转述，原样照抄更怪。
  # 第四轮（2026-10-28，复测 q3）：粤语用户每轮都是同一句。句池加大，同一场对话里先用没用过的。
  DIALECT:
    - 你用最顺口的话说了出来
    - 你把心里话照着平时的说法讲了
    - 你把碰到的事讲了出来
    - 你把压在心里的事说了出来
    - 你说起了此刻的处境
    - 你把这些一点点讲给这边听
    - 你把此刻的心情摊开来说了
  # 草稿：待 G-0（F10）。用户说「我好多了」「换个话题吧」离开静默陪伴的那一轮，不复述这句出口话。
  HAVEN_EXIT:
    - 你准备好往下聊了
    - 你想从安静里走出来一点了

boundaries:
  medication:
    cues: [剂量, 药量, 加量, 减量, 加倍, 减半, 停药, 断药, 减药, 加药, 换药, 吃多少, 吃几片, 吃几粒, 一次吃, 多吃, 少吃, 能不能停, 可不可以停, 能停, 能不能吃, 可以吃, 能一起吃]
    needs_any: [药, 片, 粒, 毫克, mg, 剂, 褪黑素, 安眠, 胶囊]
    line: "药怎么吃、要不要加量、减量或停药，我没法替你判断，最稳妥的是问开药的医生或药剂师。"
  diagnosis:
    cues: [是不是, 算不算, 会不会是, 是否, 帮我判断, 帮我诊断, 给我诊断, 你判断, 得了, 有没有]
    needs_any: [症, 障碍, 抑郁, 双相, 躁郁, 精神病, 心理疾病, 精神疾病, 心理问题, 有病, 人格, adhd, ptsd, ocd]
    line: "我没法下诊断。如果想弄清楚，可以找精神科或心理科做一次评估。"

reassurance: [没事, 没关系, 好多了, 好些了, 好一点了, 好点了, 还好, 不用担心, 别担心, 放心, 缓过来了, 平静下来了, 冷静下来了]

# notices（草稿：待 G-0；试用问题 I1、I2，2026-10-26）：与人格无关的几句实话，会话把其中一句放在回复
# 前面（cardiac_care 放在末尾）。每句不带槽位、不含数字、不提问、不超过 80 字，不说病名（加载时校验）。
#   advice_heard         用户问“该怎么说 / 怎么开口”（求建议，不是要练习）：承认对方在问怎么做；PRD 没有
#                        给沟通建议的机制，所以不给现成说法，只陪着先理一理。阶段一不含任何方法或指令。
#   hotline_heard        不在危机中时说“别老给我发热线电话”：说听到了，并照实说明热线只在担心安全时出现。
#   masked_practice      有心脏或呼吸方面情况（首访或聊天中说过）的用户点名憋气、4-7-8、冷水敷脸等被屏蔽的
#                        练习：只说“你提到过心脏或呼吸方面需要小心”，不复述诊断，说明这类做法可能不合适。
#   masked_practice_why  紧接着问“为什么不行”：多解释一句，并建议问自己的医生。
#   cardiac_care         有心脏或呼吸方面情况的用户说“胸口发紧”“心跳很快”时，回复末尾的一句（每次会话一次）。
notices:
  advice_heard:
    - "你在问具体可以怎么说、怎么做，这是个很实在的问题。我没法替你给出标准答案，但可以陪你先把最想让对方知道的那一点理一理。"
    - "你想知道这话该怎么开口。先不急着找现成的说法，我们可以一起看看，你最在意让对方明白的是什么。"
  hotline_heard:
    - "好，我听到了：你不想总看到热线电话。只有在我担心你的安全时，它们才会出现；现在我们就接着聊你想聊的。"
    - "明白，热线电话让你有点烦。它们只在我担心你安全的时候才出现，别的时候不会硬塞给你。我们接着聊。"
  masked_practice:
    - "你提到过心脏或呼吸方面需要小心。憋气、冷水这类会让心跳和呼吸一下子变化很大的做法，可能不太适合你，这次先不用它。"
    - "因为你说过心脏或呼吸方面要格外小心，憋气或者冷水刺激这类做法可能不太合适，我们先不用它，换个更温和的方式。"
  masked_practice_why:
    - "憋气和冷水刺激会让心跳、血压在很短时间里变化很大，对心脏或呼吸需要格外小心的人，可能带来不适。哪些做法适合你，最稳妥的是问问你的医生。"
    - "这类做法靠一下子屏住呼吸或冷水刺激让身体快速反应，对心脏和呼吸都是不小的负担。你提到过这方面要小心，所以先不冒这个险；具体能做什么，可以问问你的医生。"
  cardiac_care:
    - "如果胸口发紧、心跳很快一直不缓解，或者越来越重，请尽快就医或拨打急救电话。"
    - "要是胸闷、心慌持续不退或者加重，请不要硬扛，尽快就医或拨打急救电话。"

# guarded（草稿：待 G-0；第三轮修复 B2a，2026-10-27；第四轮 2026-10-28 复测 q3）：与具体说法无关的复述防线。
# 用户原话含风险构件时不复述原话（不论规则或模型给几级）：第一、二阶段说法与 recall_cap.vetoes（取自
# lexicons/risk.yaml，只读，不复制）、组合的头尾两部分同在（不再要求语境词），或下面 components 里任意两类同在。
# 规则筛查 ≥ L1、或任一读法 ≥ L2 的一轮也不复述；只有模型给 L1、原话又没有任何风险构件的普通倾诉照常承接（第四轮）。
#   acks              {mirror} 不复述原话，改用这里的一句（不引用户的任何原文）。规则同上面的 acks；
#                     同一场对话里先用还没用过的一句（所有 acks 句池都这样选）。
#   affirmations      这一轮不用含这些字眼的模板变体（“你的感受是有来由的”“这份需要再自然不过了”“这对你很重要”
#                     这类对感受、需要的肯定句），也不点出“需要”那一段；每个人格的每一段都至少留一条不含它们的变体
#                     （加载时校验）。物质使用的几种轮次（谈到喝酒或用药、戒断信号、问“喝一点行不行”、复述满足感）
#                     与自责（self_blame）的一轮同样不用。
#   extra_risk_words  危机词表还没收的谐音隐语与自伤说法；单独出现就不复述，不参与任何危机判断。
#   components        风险构件（第四轮）：means 手段与地点、preparation 准备、time 时间、ending 终局、
#                     lasting 长久与一生、wish 盼望；同一条消息里出现 min_kinds 类以上就不复述。
#                     soft_ending（休息、晚安）只有和 lasting 同在时才算终局（“永远的那种”“很长很长的那种晚安”）；
#                     everyday 里的词（计划、心跳、跳舞）里面的字不算构件。只用于“不复述”，不参与任何危机判断。
#   self_blame        自责、自我贬低（“我真是个废物”）：不复述（念出来像是陪伴者在骂人），{mirror} 改用 acks。
#   addressed_acks    陈述里的“你”指的是陪伴者（“我知道你不会同意”）：复述会把“你”换成“对方”、像在说别人，改用这里的一句。
guarded:
  acks:
    - 你把此刻想说的说了出来
    - 你愿意把这些讲出来
    - 你说出了此刻心里的话
    - 你把压在心里的话说了出来
    - 你没有把这些一个人憋着
    - 你让这边知道了此刻的处境
    - 你把心里的分量说了出来
  affirmations: [有来由, 再自然不过, 很自然的事, 不奇怪, 很正常, 是真实的, 很真实, 没有任何问题, 过分, 不需要任何理由,
                 需要感到抱歉, 很好理解, 很合理, 不是什么奢求, 对你来说, 对你很重要, 一直很在乎, 一直都很在乎, 说明你在乎]
  extra_risk_words: [自鲨, 噶了, 嘎了, 想划, 又划, 划自己, 划手, 割自己, 想割, 自残]
  components:
    min_kinds: 2
    means: [药, 药片, 安眠药, 安定, 农药, 百草枯, 老鼠药, 刀, 刀片, 绳, 炭, 煤气, 天台, 楼顶, 顶楼, 高楼, 窗台,
            桥, 河边, 江边, 海边, 湖边, 河里, 江里, 海里, 水库, 铁轨, 车撞, 撞车, 被车, 割, 划, 伤口, 手腕, 血, 吞]
    preparation: [准备好, 准备了, 都准备, 买好, 备好, 攒, 囤, 存了, 存够, 藏好, 藏在, 抽屉里, 放好了, 挂好, 写好,
                  安排好, 交代, 托付, 还完, 还清, 送人, 定好, 选好, 处理好, 收拾好]
    time: [今晚, 今天晚上, 今夜, 明天, 明晚, 明早, 后天, 周一, 周二, 周三, 周四, 周五, 周六, 周日, 星期, 这周, 下周,
           月底, 下个月, 发工资, 工资发了, 发完工资, 睡着, 等家里人, 等爸妈, 等他们, 等室友, 天亮前, 半夜, 凌晨,
           马上, 现在就, 已经在, 就等, 考完, 过完年, 趁]
    ending: [结束, 句号, 退场, 散场, 谢幕, 落幕, 下车, 不存在, 消失, 了结, 一了百了, 解脱, 长眠, 睡过去, 不再醒,
             不醒, 关机, 告别, 永别, 终点, 尽头, 再见, 不在了, 离开]
    lasting: [永远, 永久, 长久, 很长很长, 很久很久, 一生, 这一生, 这辈子, 一辈子, 下辈子, 提前, 彻底, 再也, 不再,
              不用再, 这个世界, 这世界, 人间, 世上, 世间, 最后]
    wish: [好想, 真想, 要是能, 但愿, 巴不得, 恨不得, 希望, 就好了, 也无所谓, 也挺好, 也没关系, 算了]
    soft_ending: [休息, 晚安, 睡下去, 睡一觉, 长睡, 歇着, 走掉, 下线, 退出]
    everyday: [计划, 规划, 策划, 划算, 划船, 划水, 比划, 心跳, 跳舞, 跳绳, 跳槽, 跳过, 收割, 割舍, 割草, 血压, 血糖,
               心血, 热血, 献血, 血型, 吞吞吐吐, 狼吞虎咽, 中药, 药店, 药房, 火药, 桥牌]
  self_blame:
    cues: [废物, 我真没用, 我好没用, 我太没用, 自己没用, 这么没用, 一无是处, 窝囊, 失败者, 我是垃圾,
           个垃圾, 我真蠢, 我好蠢, 我太蠢, 我真笨, 我好笨, 我太笨, 恨我自己, 恨自己, 讨厌自己, 讨厌我自己,
           看不起自己, 我活该, 都怪我, 都是我的错, 什么都做不好, 什么都做不到, 连这点事都, 拖后腿, 我不配, 配不上]
    acks:
      - 你此刻对自己很严厉
      - 你在重重地责怪自己
      - 你把很多错都揽到了自己身上
      - 你对自己下了很重的评语
  addressed_acks:
    - 你直接把心里的话说了出来
    - 你把想说的话直接说给了这边
    - 你把心里的想法摆了出来

# substance（草稿：待 G-0；第三轮修复 B2a，复测 r4；第四轮 2026-10-28 复测 q3）：物质使用。线索在 lexicons/substance.yaml。
#   craving            复述时不说回喝酒、用药的满足感（“冰啤酒下肚”“吃下去整个人轻飘飘的”），{mirror} 改用这里的一句，
#                      点出想要的渴望很强（酒和药都适用，不说“喝”）。规则同上面的 acks。
#   withdrawal         戒断信号（手抖、出汗、心慌、睡不着、发冷发热、骨头疼，或问“突然不喝会出问题吗”）出现的那一轮，
#                      放在回复前面；危机中、先问安全的一轮放在危机卡后面（第四轮）。与 render.yaml 转介卡的戒断警示（#125）
#                      同口径——酒和安眠药、止痛药、镇静药突然停都可能有危险，想停在医生指导下进行，不给剂量。
#   withdrawal_severe  抽搐或倒地、看到或听到不存在的东西、意识模糊：急诊的说法（马上去急诊或打急救电话，请人陪着）。
#   ask_to_drink       问“喝一小杯没事吧”“要不要先吃半片顶一顶”、找理由喝一点（“度数那么低，不算破戒吧”）、
#                      “先别戒了”：不默许，明确说不赞成现在碰，不说教、不给量，愿意陪着想别的办法。不提“这些反应”
#                      （用户没说症状时无从指代；有戒断信号时戒断提醒会跟在后面）。
# 每句不带槽位、不含数字或剂量、不超过 80 字（加载时校验）；两句戒断提醒都要指向医生或医院。
# 第五轮（2026-10-29）：withdrawal 也用于“自己一下子停”（见 lexicons/substance.yaml stopping），并补上抗焦虑药、
# 抗抑郁药；措辞保守——不要自己一下子停，先问医生或药师，身体很不舒服时就医或打急救电话，不给剂量。ask_to_drink
# 加一句身体难受时先问医生或药师（复测 q3 W13）。
substance:
  craving:
    - 你心里想要的那股劲很强
    - 你此刻的渴望很强
    - 你心里那份想要的念头很强
  # 第五轮（2026-10-29，复测 q3 第三节）：自己一下子停（“从今晚起一口都不碰”“药我自己停掉了”）时复述用这里的
  # 一句，不把“直接戒”说回去，听起来像赞同；戒断提醒照常放在前面。规则同 craving。
  stopping:
    - 你说到了把它停下来这件事
    - 你提到了停下它的事
  withdrawal: "酒和安眠药、镇静或抗焦虑药、抗抑郁药、止痛药，自己一下子停下来可能有危险。请先问医生或药师怎么停；身体很不舒服时请尽快就医或打急救电话。"
  withdrawal_severe: "抽搐、倒地，看到或听到不存在的东西，意识模糊，都可能是停用后很危险的反应。请马上去医院急诊或打急救电话，并请身边的人陪着你。"
  ask_to_drink: "说实话，我不赞成现在碰它，哪怕只是一点：一点常常会变成更多。身体难受的话，请先问医生或药师，别靠它硬扛；我陪你想想别的办法。"
