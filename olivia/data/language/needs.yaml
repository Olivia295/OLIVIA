# 草稿：待 G-0 两名注册心理师审核（docs/superpowers/plans/2026-10-22-remaining-roadmap.md R1-4）
#
# {need} 槽位（gentle_holding.yaml）的需要短语：每个萨提亚渴望（taxonomy.yaml satir_yearnings.id）
# 一组 2–6 字的短语，引擎按种子随机取一句。
# 短语会放进“你很需要{need}”“对{need}的渴望”“感受过一点点{need}”等句子，
# 所以都是名词性短语，不含人称代词“我/你”，不含临床词汇。
version: 1

by_yearning:
  SAFETY:
    - "安全感"
    - "安稳"
    - "心里有底"
    - "确定感"
  ACCEPTANCE:
    - "被接纳"
    - "被包容"
    - "被允许"
    - "做自己的空间"
  AUTONOMY:
    - "自己做主"
    - "喘息的空间"
    - "掌控感"
    - "被尊重的边界"
  COMPETENCE:
    - "被肯定"
    - "价值感"
    - "胜任感"
    - "被认可"
  CONNECTION:
    - "被看见"
    - "被理解"
    - "陪伴"
    - "真实的联结"
