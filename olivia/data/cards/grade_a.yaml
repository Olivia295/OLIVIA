# 草稿：待 G-0 两名注册心理师审核（docs/superpowers/plans/2026-10-22-remaining-roadmap.md R1-4）
#
# display_title（草稿：待 G-0，质量修复 F3）：用户看到的名字，是一个小练习，不是一种治疗；
# 括号里注明它源自哪种方法。title 保持与 taxonomy 的 name_zh 一致，只用于校验。
#
# Grade A 微练习跟练卡片（温和包裹型人格 GENTLE_HOLDING 版本）。
# 每张卡的 steps 与 taxonomy.yaml 中对应条目的 core_action_steps 一一对应、顺序一致，
# 只做口语化展开，不引入任何新技术；duration_minutes 与 taxonomy 保持一致。
# method/*.md 中的做法不是已批准内容，未从中导入任何步骤。

version: 1
persona: gentle_holding

cards:
  # ---------------------------------------------------------------------------
  # 32 种 A 级父方法（action_type 默认为 MICRO_EXERCISE）
  # ---------------------------------------------------------------------------
  - id: "01"
    title: "传统认知行为疗法"
    display_title: "念头检验小练习（源自传统认知行为疗法）"
    duration_minutes: 3
    intro: "有个念头让你不好受吗？我们花 3 分钟，一起把它放到桌面上看一看。"
    steps:
      - "停一下，留意胸口或胃里的那股感觉，问问自己：刚才脑子里闪过的那句话是什么？把它原样写下来。"
      - "看看这句话：有哪些实实在在的事实支持它？又有哪些事实并不支持它？两边各想一两条就好。"
      - "把两边的事实放在一起，试着写一句更贴近事实、对自己也公平的新说法，慢慢读给自己听。"
    closing: "做完了。愿意的话，给此刻的难受打个分：0 是平静，10 是最难受。"
    stealth_note: "在便签或备忘录里写写就好，看起来就像在记工作。"
    safety_note: "如果你最近常听到或看到别人察觉不到的东西，先跳过这个练习。"

  - id: "02"
    title: "理性情绪行为疗法"
    display_title: "松一松“一定要”（源自理性情绪行为疗法）"
    duration_minutes: 3
    intro: "心里是不是有一句“一定要做到”在压着你？我们花 3 分钟，把它轻轻松一松。"
    steps:
      - "想想刚才让你受挫的那件事，再找找心里那句“一定要”“非得这样”的要求，把它说出来。"
      - "看看这个要求：事情真的非这样不可吗？它又给你此刻添了哪些难受和紧绷？"
      - "把“我一定要做到”换成：“我希望做到，但就算没做到，也不代表我彻底失败。”慢慢对自己说一遍。"
    closing: "辛苦了。现在心里的难受有几分？0 是平静，10 是最难受。"
    stealth_note: "整个过程都可以在心里默默进行，旁人看不出来。"
    safety_note: "如果你这阵子精力特别旺、睡很少也不累，或常听到别人听不到的声音，先跳过这个练习。"

  - id: "03"
    title: "行为激活疗法"
    display_title: "做一件小事（源自行为激活疗法）"
    duration_minutes: 4
    intro: "提不起劲的时候，我们不求多，只找一件 2 分钟就能做完的小事。"
    steps:
      - "找一件 2 分钟内就能做完、做完会有点成就感的小事，比如擦一擦桌面，或者去接一杯温水。"
      - "给它定一个开始的信号，比如“数到 3 就起身”。有点不想动也没关系，带着这份不想，直接开始。"
      - "做完后，给“我做到了”的感觉打个 0–10 分，再留意心里有没有一点点轻松或暖意。"
    closing: "你动起来了。愿意的话，给此刻的难受打个分：0 是平静，10 是最难受。"
    stealth_note: "选工位上就能做的小事，比如理一理桌面，没人会留意。"
    safety_note: "如果你这阵子精力特别旺、停不下来，或正在严格控制吃东西，先跳过这个练习。"

  - id: "06"
    title: "失眠认知行为疗法"
    display_title: "睡前放下担心（源自失眠认知行为疗法）"
    duration_minutes: 3
    intro: "夜里睡不好真的很磨人。我们花 3 分钟，一起给今晚定几个小约定。"
    steps:
      - "和自己约好：今晚躺在床上，如果醒着超过 20 分钟，就轻轻起身离开床，等有困意了再回来。"
      - "再约好：睡前半小时放下手机和屏幕，把灯光调暗，让身体慢慢知道，快要睡了。"
      - "白天找个时间，把心里的担心都写进一个“担忧本”，写完合上，睡前就不用再翻来覆去地想。"
    closing: "约定好了。此刻心里的难受有几分？0 是平静，10 是最难受。"
    stealth_note: "约定在心里定下就好，白天写担忧本也像在记事。"
    safety_note: "如果你这阵子精力特别旺、睡得很少也不觉得累，先跳过这个练习。"

  - id: "07"
    title: "问题解决疗法"
    display_title: "拆解一个难题（源自问题解决疗法）"
    duration_minutes: 4
    intro: "事情乱成一团的时候，我们花 4 分钟，理出一个能下手的小头绪。"
    steps:
      - "把心里那句乱糟糟的抱怨，改写成一句具体的问题，比如“周五前这份报告还差两部分”。"
      - "先不评判好坏，随手写下 3 个很小、做得到的应对办法。"
      - "从里面挑一个阻力最小的，定下接下来 1 小时内要做的第一步。"
    closing: "有头绪了。愿意的话，给此刻的难受打个分：0 是平静，10 是最难受。"
    stealth_note: "写在便签或待办清单里，看起来就像在排工作。"
    safety_note: "如果你此刻心跳很快、呼吸很急、脑子转不动，先跳过这个练习，等身体稳一点再来。"

  - id: "08"
    title: "情绪障碍跨诊断统一方案"
    display_title: "情绪觉察小练习（源自统一方案）"
    duration_minutes: 3
    intro: "情绪来的时候，身体往往最先知道。我们花 3 分钟，一起听听它在说什么。"
    steps:
      - "留意此刻的身体：心跳是快是慢？呼吸是浅是深？哪里的肌肉绷紧了？只是看见，不用改变。"
      - "再问问自己：这份情绪正推着我想躲开什么？比如不想回消息，或者不想面对某件事。"
      - "试着做一个和这股冲动相反的小举动，比如回一句简短的消息，或者朝那件事迈出一小步。"
    closing: "做完了。现在心里的难受有几分？0 是平静，10 是最难受。"
    stealth_note: "觉察和发问都在心里进行，坐在工位上就能做。"
    safety_note: "如果你此刻感觉自己飘着、不真实，像和身体隔了一层，先跳过这个练习。"

  - id: "10"
    title: "习惯逆转训练与权变管理"
    display_title: "替代动作小练习（源自习惯逆转训练）"
    duration_minutes: 3
    intro: "手又不自觉地动起来了吗？我们花 3 分钟，练练怎么温和地接住它。"
    steps:
      - "留意习惯动作出现前的那一下：手指发痒、想伸手拿手机、想去碰头发……先认出这个小冲动。"
      - "一认出来，就换一个和它对着干的动作：紧紧握住拳头，或者双手平贴在大腿上，保持 1 分钟。"
      - "拦住了，就对自己说一句肯定的话，比如“刚才那一下，我接住了”。"
    closing: "你接住了它。愿意的话，给此刻的难受打个分：0 是平静，10 是最难受。"
    stealth_note: "握拳或双手贴腿都放在桌下做，旁人不会察觉。"
    safety_note: "如果你最近常听到或看到别人察觉不到的东西，先跳过这个练习。"

  - id: "11"
    title: "接纳承诺疗法"
    display_title: "和念头拉开距离（源自接纳承诺疗法）"
    duration_minutes: 3
    intro: "有个念头一直缠着你吗？我们花 3 分钟，试着和它隔开一点距离。"
    steps:
      - "找到那个让你难受的念头，在它前面加上一句：“我注意到，我正在产生……的念头。”慢慢说一遍。"
      - "留意胸口或胃部的紧绷，吸气时想象给它腾出一点空间，让它待着，不用推开。"
      - "问问自己：“即使难受，此刻什么对我真正重要？”然后朝那个方向走出一小步。"
    closing: "做完了。此刻心里的难受有几分？0 是平静，10 是最难受。"
    stealth_note: "默念和呼吸都在心里完成，看起来只是在安静思考。"
    safety_note: "如果你最近常听到或看到别人察觉不到的东西，先跳过这个练习。"

  - id: "12"
    title: "辩证行为疗法"
    display_title: "先停一停（源自辩证行为疗法）"
    duration_minutes: 3
    intro: "情绪冲上来的时候，先给自己按一个暂停键。我们一起花 3 分钟。"
    steps:
      - "停住手上的动作，退后一步，看看此刻发生了什么、身体有什么感觉，再想想下一步怎么走更明智。"
      - "开始慢慢地呼吸，让每一次呼气都明显比吸气长一些，一次接一次。"
      - "找一样此刻能安抚你的感官小东西：手里一杯温水、一首喜欢的歌、一件柔软的衣服，让自己沉浸一会儿。"
    closing: "你停下来了。愿意的话，给此刻的难受打个分：0 是平静，10 是最难受。"
    stealth_note: "停住和慢呼吸都不出声，坐在工位上就能完成。"

  - id: "13"
    title: "彻底开放辩证行为疗法"
    display_title: "松开一点小练习（源自彻底开放辩证行为疗法）"
    duration_minutes: 3
    intro: "一直绷着、想做到最好，会很累。我们花 3 分钟，让自己稍微松开一点。"
    steps:
      - "留意身体是不是在防御：耸着肩、皱着眉？试着让嘴角微微上扬，肩膀慢慢往下沉。"
      - "轻轻问自己：“这件事上，有什么是我不知道的，或者我可能弄错的？”不急着回答，只是好奇。"
      - "试着向外发一个友善的小信号，比如对同事点个头、笑一笑，或者回一句“谢谢你”。"
    closing: "松开了一点点。此刻的难受有几分？0 是平静，10 是最难受。"
    stealth_note: "微笑和沉肩都很自然，点头致意也只是日常礼貌。"
    safety_note: "如果你正在严格控制吃东西，或此刻有伤害自己的冲动，先放下这个练习，找身边信任的人陪陪你。"

  - id: "14"
    title: "正念认知疗法"
    display_title: "正念小练习（源自正念认知疗法）"
    duration_minutes: 3
    intro: "我们花 3 分钟，给自己一个呼吸的小空间，一分钟一分钟地来。"
    steps:
      - "第一分钟：留意此刻身体的感受、心里的情绪和冒出来的念头，允许它们都在这里。"
      - "第二分钟：把注意力收回到腹部，感受每一次呼吸时肚子的起伏。"
      - "第三分钟：让觉察慢慢扩大，感受整个身体的轮廓，再到你所在的这个空间。"
    closing: "三分钟到了。愿意的话，给此刻的难受打个分：0 是平静，10 是最难受。"
    stealth_note: "眼睛半睁着看向桌面就好，像在短暂休息。"
    safety_note: "如果过去的可怕画面正反复闯进脑海，或你常听到别人听不到的声音，先跳过这个练习。"

  - id: "15"
    title: "正念减压疗法"
    display_title: "身体扫描小练习（源自正念减压疗法）"
    duration_minutes: 4
    intro: "压力大的时候，我们花 4 分钟，把注意力从脑袋里请回到身体上。"
    steps:
      - "感受双脚踩在地面上的重量，再感受臀部和椅面接触的地方，身体正被稳稳托着。"
      - "从下往上，快速扫一遍容易紧绷的地方：下巴、肩膀、手心。只是留意，不评判。"
      - "跟着一次长长的呼吸，在呼气时想象那些紧绷随着这口气慢慢散开。"
    closing: "做完了。此刻心里的难受有几分？0 是平静，10 是最难受。"
    stealth_note: "坐着不动就能做，旁人只会以为你在休息。"
    safety_note: "如果过去的可怕画面正反复闯进脑海，先跳过这个练习。"

  - id: "16"
    title: "元认知疗法"
    display_title: "给担心定个时间（源自元认知疗法）"
    duration_minutes: 3
    intro: "担心停不下来的时候，我们花 3 分钟，试着站到旁边看看它。"
    steps:
      - "把那些担心的念头，当成脑海里飘过的云，看着它们来，也看着它们走。"
      - "不和它争辩，不分析，也不用硬压下去，让它自己飘着就好。"
      - "和这个担心约个时间：“我在每天留给担心的那段时间再处理你。”然后把注意力放回当下。"
    closing: "放下一会儿了。愿意的话，给此刻的难受打个分：0 是平静，10 是最难受。"
    stealth_note: "全程在心里进行，看起来只是在望着屏幕出神。"
    safety_note: "如果你最近常听到或看到别人察觉不到的东西，先跳过这个练习。"

  - id: "17"
    title: "慈悲聚焦疗法"
    display_title: "温柔对待自己（源自慈悲聚焦疗法）"
    duration_minutes: 3
    intro: "对自己太严厉的时候，我们花 3 分钟，换一种温和的方式陪陪自己。"
    steps:
      - "把右手轻轻放在左边心口，感受手心的温度，和胸口一起一伏的感觉。"
      - "跟着平缓的节奏呼吸，吸气时吸进包容，呼气时把对自己的苛责慢慢呼出去。"
      - "在心里对自己说一句理解的话，比如：“这真的很难，你已经很努力了。”"
    closing: "谢谢你陪着自己。此刻的难受有几分？0 是平静，10 是最难受。"
    stealth_note: "手搭在胸前像在休息，话都在心里说。"
    safety_note: "如果你此刻正狠狠责怪自己、觉得自己一无是处，先跳过这个练习。"

  - id: "18"
    title: "正念自我关怀疗法"
    display_title: "自我关怀三句话（源自正念自我关怀疗法）"
    duration_minutes: 3
    intro: "我们花 3 分钟，用三句话，像对待好朋友那样对待自己。"
    steps:
      - "停一停，在心里对自己说：“这是一个艰难、痛苦的时刻。”"
      - "接着说：“痛苦和挣扎是人人都会经历的，我并不奇怪，也不是一个人。”"
      - "最后说：“愿此刻的我，能像对待好朋友一样，温柔地对待自己。”"
    closing: "说完了。愿意的话，给此刻的难受打个分：0 是平静，10 是最难受。"
    stealth_note: "三句话都在心里默念，没人听得见。"
    safety_note: "如果你此刻正狠狠责怪自己、觉得自己一无是处，先跳过这个练习。"

  - id: "28"
    title: "生理性叹息与自主神经躯体调节法"
    display_title: "叹气式呼吸（源自生理性叹息）"
    duration_minutes: 2
    intro: "我们花 2 分钟，用一种特别的呼吸，帮身体慢慢降下来。"
    steps:
      - "用鼻子连着吸两次气：先深深吸一大口，再快速补吸一小口，让肺部完全充满。"
      - "微微张开嘴，非常缓慢、悠长地把气全部呼出去，呼到底。"
      - "这样重复 2 到 3 次，同时让视线慢慢环顾四周，确认此刻你是安全的。"
    closing: "做完了。此刻心里的难受有几分？0 是平静，10 是最难受。"
    stealth_note: "呼气时放轻声音，看起来就像轻轻叹了口气。"
    safety_note: "如果你有心肺方面的不适，或此刻呼吸急得停不下来，先跳过这个练习。"

  - id: "29"
    title: "渐进性肌肉放松与自律训练法"
    display_title: "肌肉放松小练习（源自渐进性肌肉放松）"
    duration_minutes: 4
    intro: "身体绷了很久吧？我们花 4 分钟，先收紧再放开，让身体记起松下来的感觉。"
    steps:
      - "用力握紧双拳，同时耸起肩膀，保持 5 到 7 秒，清楚地感受这份紧绷。"
      - "一下子完全放开，用 15 秒细细感受肌肉松下来、往下沉、微微发热的感觉。"
      - "在心里慢慢默念：“我的双肩沉重下沉，周身宁静安详。”"
    closing: "松下来了。愿意的话，给此刻的难受打个分：0 是平静，10 是最难受。"
    safety_note: "如果你有心肺方面的不适，先跳过这个练习。"

  - id: "30"
    title: "心理急救与自我安全自检模型"
    display_title: "安全自检小练习（源自心理急救）"
    duration_minutes: 3
    intro: "刚经历了一些事吧。我们花 3 分钟，先确认你此刻是安全的，再照顾好身体。"
    steps:
      - "慢慢环顾四周，看看你所在的地方：此刻这里安全吗？身边暂时没有会马上伤到你的东西吧？"
      - "问问身体需要什么：要不要喝口水、吃点东西、加件衣服，或者先离开让你紧绷的环境一会儿。"
      - "想一位你信任的亲友，或者一个能求助的电话号码，把它找出来，放在手边备用。"
    closing: "你照顾好了自己。此刻的难受有几分？0 是平静，10 是最难受。"
    stealth_note: "环顾和盘点都在心里做，号码存在手机里就好。"
    safety_note: "如果你此刻有伤害自己或不想活下去的念头，先放下练习，联系身边的人或心理援助热线。"

  - id: "42"
    title: "意义疗法"
    display_title: "找找意义小练习（源自意义疗法）"
    duration_minutes: 3
    intro: "很难熬的时候，我们花 3 分钟，看看自己在这里还能选择什么。"
    steps:
      - "把心里的问题换个方向：不问“生活对我做了什么”，而是问“此刻这个处境，需要我拿出怎样的态度”。"
      - "在这段艰难里找一找：哪怕最小的一点，值得你守护的人、事或东西是什么？"
      - "想一想：此刻有什么态度，是完全由你自己决定的？轻轻把它选定下来。"
    closing: "做完了。愿意的话，给此刻的难受打个分：0 是平静，10 是最难受。"
    stealth_note: "这几个问题都在心里想，看起来只是在出神。"
    safety_note: "如果你刚失去重要的人，或此刻有伤害自己的念头，先放下这个练习，找身边信任的人陪陪你。"

  - id: "44"
    title: "聚焦取向心理治疗"
    display_title: "感受身体的信号（源自聚焦取向）"
    duration_minutes: 4
    intro: "有些感受说不清，但身体知道。我们花 4 分钟，慢慢听一听。"
    steps:
      - "把注意力慢慢移到胸口和肚子，感受你对这件事的整体感觉，它可能有点模糊。"
      - "为这份模糊的感觉找一个词、一个画面，或者一个姿势，像给它起个小名字。"
      - "拿这个词回去和身体对一对：合适吗？然后等一等，留意身体里有没有一点点松动、舒了口气的感觉。"
    closing: "谢谢你听了身体。此刻的难受有几分？0 是平静，10 是最难受。"
    stealth_note: "全程安静地感受，看起来只是在闭目养神。"
    safety_note: "如果你此刻感觉自己飘着、不真实，或常听到别人听不到的声音，先跳过这个练习。"

  - id: "46"
    title: "动机式访谈与自我决策平衡"
    display_title: "利弊清单小练习（源自动机式访谈）"
    duration_minutes: 3
    intro: "想改变又有点犹豫，很正常。我们花 3 分钟，把两边都摊开看看。"
    steps:
      - "想一个你想改变的习惯或状态，列一列：保持现在这样，眼下有什么好处？长远会付出什么代价？"
      - "再列一列：如果做出改变，可能得到什么你在乎的东西？又会遇到哪些阻力？"
      - "两边放在一起看一会儿，写下一句真正从你心里来的话：“我想要……”"
    closing: "写好了。愿意的话，给此刻的难受打个分：0 是平静，10 是最难受。"
    stealth_note: "列在便签上，看起来就像在做工作比较。"
    safety_note: "如果你这阵子精力特别旺、睡很少也不累，先跳过这个练习。"

  - id: "55"
    title: "焦点解决短程治疗"
    display_title: "想象事情好转之后（源自焦点解决）"
    duration_minutes: 3
    intro: "我们花 3 分钟，先不盯着问题，去找找那些已经在起作用的小东西。"
    steps:
      - "想象一下：如果今晚这个困扰被解决了，明天醒来，你最先注意到的一点小不同会是什么？"
      - "回想一下：过去什么时候，类似的困扰稍微轻一点？那时候你做了什么？"
      - "把那个曾经管用的小做法挑出一样，今天就再做一次。"
    closing: "找到了一点。此刻心里的难受有几分？0 是平静，10 是最难受。"
    stealth_note: "想象和回想都在心里进行，没人看得出来。"
    safety_note: "如果过去的可怕画面正反复闯进脑海，先跳过这个练习。"

  - id: "57"
    title: "积极心理治疗与幸福感疗法"
    display_title: "三件好事（源自积极心理学）"
    duration_minutes: 3
    intro: "我们花 3 分钟，一起找找过去一天里那些小小的好事。"
    steps:
      - "写下过去 24 小时里发生的 3 件小而具体的好事，比如一杯好喝的热茶，或一句暖心的话。"
      - "再看看每件好事背后：有没有你自己的一点付出，或者别人给你的一点善意？"
      - "停留一会儿，慢慢回味这些好事，感受心里升起的那份充实和感激。"
    closing: "回味好了。愿意的话，给此刻的难受打个分：0 是平静，10 是最难受。"
    stealth_note: "三件好事记在便签上，像在随手记事。"
    safety_note: "如果你此刻有伤害自己的念头，或正狠狠责怪自己，先放下这个练习，找身边信任的人陪陪你。"

  - id: "61"
    title: "森田疗法"
    display_title: "带着感受做事（源自森田疗法）"
    duration_minutes: 3
    intro: "不安还在，也可以先做点什么。我们花 3 分钟，试试带着它往前走。"
    steps:
      - "对冒出来的不安、杂念和情绪，不抗拒，也不辩解，让它们像水一样自己流过去。"
      - "想一想：此时此刻，你原本打算做的那件生活或工作上的事是什么？"
      - "带着还没散去的不舒服，现在就动手做起手头的那件事。"
    closing: "你已经在做了。此刻的难受有几分？0 是平静，10 是最难受。"
    stealth_note: "这本来就是在做手头的事，旁人只会看到你在忙。"
    safety_note: "如果你此刻心跳很快、呼吸很急、脑子转不动，先跳过这个练习，等身体稳一点再来。"

  - id: "62"
    title: "内观疗法"
    display_title: "回看一段关系（源自内观疗法）"
    duration_minutes: 4
    intro: "我们花 4 分钟，安静地回看一段对你重要的关系。"
    steps:
      - "选一位对你重要的人，回想最近他（她）为你做过的、实实在在的照顾和帮助。"
      - "再想想，你为对方做过哪些回馈和支持。"
      - "平静地看一看，你给对方添过哪些麻烦和困扰，只是如实看见，不用责怪自己。"
    closing: "回看完了。愿意的话，给此刻的难受打个分：0 是平静，10 是最难受。"
    stealth_note: "回想都在心里进行，看起来只是在安静思考。"
    safety_note: "如果你正狠狠责怪自己，或身边有人正在伤害、威胁你，先跳过这个练习，先顾好自己的安全。"

  - id: "65"
    title: "表达性书写疗法"
    display_title: "写下来小练习（源自表达性书写）"
    duration_minutes: 5
    intro: "有些话憋在心里太久了。我们花 5 分钟，让它们落到纸上。"
    steps:
      - "定一个 5 分钟的计时，然后放开写，写下此刻最触动你的感受，想到什么就写什么。"
      - "不用管语法和字句，直接写出最深的那份害怕、难过或生气，叫出它的名字。"
      - "写完后深呼吸一次，再自己决定：把这些文字留下来，还是安全地撕掉。"
    closing: "写完了。此刻心里的难受有几分？0 是平静，10 是最难受。"
    safety_note: "如果过去的可怕画面正反复闯进脑海，先跳过这个练习。"

  - id: "66"
    title: "意象预演疗法与梦魇改写技术"
    display_title: "改写一个梦（源自意象预演）"
    duration_minutes: 4
    intro: "那个反复出现的画面或梦，结局是可以改写的。我们花 4 分钟试试。"
    steps:
      - "轻轻想起那个让你困扰的画面，只看个大概轮廓，同时感受身体坐在椅子上的稳当和安全。"
      - "自己构思一个新的结局，让它充满安全感、掌控感或好的意义，把它写下来。"
      - "闭上眼睛，在脑海里把这个新结局生动地演一遍，一共演 3 次。"
    closing: "新结局在你手里了。此刻的难受有几分？0 是平静，10 是最难受。"
    stealth_note: "预演时低头看着桌面也可以，像在思考问题。"
    safety_note: "如果过去的可怕画面正反复闯进脑海，或你常听到别人听不到的声音，先跳过这个练习。"

  - id: "69"
    title: "单次结构化心理微干预与成长型思维赋能"
    display_title: "一次小小的改写（源自单次心理微干预）"
    duration_minutes: 3
    intro: "觉得“我就是这样了”的时候，我们花 3 分钟，看看改变的可能。"
    steps:
      - "想一想：大脑应对挑战的回路就像肌肉，越练越有力。"
      - "把心里那句“我做不到”，改写成“我暂时还没掌握应对这件事的方法”，读给自己听。"
      - "设计一个很小的行动实验，在接下来 24 小时内试一试，看看自己能不能长进一点点。"
    closing: "实验定好了。愿意的话，给此刻的难受打个分：0 是平静，10 是最难受。"
    stealth_note: "改写和设计都可以写在便签上，像在做计划。"
    safety_note: "如果你此刻有伤害自己或不想活下去的念头，先放下练习，联系身边的人或心理援助热线。"

  - id: "70"
    title: "生物反馈与心率变异性共振呼吸神经调节疗法"
    display_title: "慢节奏共振呼吸（源自心率变异性呼吸训练）"
    duration_minutes: 3
    intro: "我们花 3 分钟，用慢慢的呼吸，让身体回到平稳的节奏。"
    steps:
      - "坐直，让脊柱自然放松，让呼吸沉到腹部，平稳地一起一伏。"
      - "吸气数 4 秒，呼气数 6 秒，这样一分钟大约呼吸 6 次。"
      - "想象气息像潮水一样，缓缓流过心口，带着全身一起平稳地起伏。"
    closing: "做完了。此刻心里的难受有几分？0 是平静，10 是最难受。"
    stealth_note: "腹式呼吸不出声，旁人看来你只是在安静坐着。"
    safety_note: "如果你有心肺方面的不适，先跳过这个练习。"

  - id: "72"
    title: "意义重构哀伤疗法"
    display_title: "给思念找个位置（源自意义重构哀伤疗法）"
    duration_minutes: 4
    intro: "失去的人或事，依然以某种方式留在你身上。我们花 4 分钟，去找找它。"
    steps:
      - "想一想，你失去的那个人或那件事，在你身上留下了哪些独特而美好的品质和印记？"
      - "在心里或纸上，给它写几句简短而温和的话，说说那些还没来得及实现的心愿。"
      - "想一个属于你们的小仪式，把这份爱和记忆带进日常生活，让它成为向着光走的力量。"
    closing: "谢谢你愿意想起。此刻的难受有几分？0 是平静，10 是最难受。"
    stealth_note: "寄语可以只在心里说，不必写下来。"
    safety_note: "如果这份失去刚刚发生，你还在很剧烈的难过里，先不用做这个练习，让自己被好好陪着。"

  - id: "74"
    title: "亲子互动去威胁肯定疗法"
    display_title: "肯定的话怎么说（源自亲子互动疗法）"
    duration_minutes: 3
    intro: "我们花 3 分钟，练习三种让关系更温暖的说话方式。"
    steps:
      - "赞美：对一个重要的人或你自己，具体说出一个做得好的地方，比如“谢谢你今天提醒我吃饭”。"
      - "重述：用温和的语气，把对方说的话和感受原样复述一遍，比如“你是说你今天很累”。"
      - "描述：只客观地说出你看到的互动细节，不加评价，不指责，也不提要求。"
    closing: "练好了。愿意的话，给此刻的难受打个分：0 是平静，10 是最难受。"
    stealth_note: "可以在心里先练，或在聊天框里打好草稿。"
    safety_note: "如果身边有人正在伤害或威胁你，先跳过这个练习，先顾好自己的安全。"

  - id: "75"
    title: "情绪调节疗法"
    display_title: "观察情绪小练习（源自情绪调节疗法）"
    duration_minutes: 3
    intro: "有时候让人更难受的，是对情绪的责怪。我们花 3 分钟，换个方式和它相处。"
    steps:
      - "留意你对这份情绪本身的评判，比如“我不该这么焦虑，这太软弱了”，把这句话认出来。"
      - "带着一点好奇，给自己留一点空间，看着情绪像波浪一样升起来，又慢慢落下去。"
      - "不用和情绪打仗，把注意力转向此刻对你重要的那件事，去做它。"
    closing: "做完了。此刻心里的难受有几分？0 是平静，10 是最难受。"
    stealth_note: "观察都在心里进行，坐在工位上就能做。"
    safety_note: "如果你此刻感觉自己飘着、不真实，像和身体隔了一层，先跳过这个练习。"

  # ---------------------------------------------------------------------------
  # action_registry 中 action_type 为 STABILIZATION 的子动作与独立动作
  # ---------------------------------------------------------------------------
  - id: "12:tipp_breathing"
    title: "DBT TIPP 慢节奏呼吸稳定法"
    display_title: "慢节奏呼吸（源自辩证行为疗法）"
    duration_minutes: 2
    intro: "我们花 2 分钟，一起慢慢呼吸，让呼气长过吸气。"
    steps:
      - "坐直身体，让双肩自然往下沉，轻轻垂下来。"
      - "用鼻子平缓地吸气，数 4 秒。"
      - "嘴唇微微张开，像吹灭蜡烛那样，非常缓慢地呼气 6 到 8 秒。这样重复 3 到 5 轮。"
    closing: "呼吸慢下来了。此刻的难受有几分？0 是平静，10 是最难受。"
    stealth_note: "呼气时放轻放慢，旁人看来你只是在安静坐着。"

  - id: "29:pmr_release"
    title: "渐进肌肉紧绷释放"
    display_title: "肌肉紧绷再放松"
    duration_minutes: 4
    intro: "我们花 4 分钟，试试先收紧、再一下子放开，感受身体松下来。"
    steps:
      - "用力握紧双拳，同时耸起肩膀，保持 5 到 7 秒，清楚地感受这份紧绷。"
      - "一下子完全放开，用 15 秒细细感受肌肉松下来、往下沉、微微发热的感觉。"
    closing: "松下来了。愿意的话，给此刻的难受打个分：0 是平静，10 是最难受。"
    safety_note: "如果你有心肺方面的不适，先跳过这个练习。"

  - id: "30:grounding"
    title: "5-4-3-2-1 感官外感受着陆法"
    display_title: "5-4-3-2-1 感官着陆"
    duration_minutes: 2
    intro: "我们花 2 分钟，用眼睛、手、耳朵、鼻子和舌尖，把自己带回此时此地。"
    steps:
      - "慢慢看看四周，在心里默念出 5 样你能看到的东西。"
      - "摸一摸身边 4 种不同的质感，比如桌面、衣袖、椅背、指尖。"
      - "留意 3 种细微的声音，闻出 2 种气味，再感受舌尖上的 1 种味道。"
    closing: "你回到这里了。此刻的难受有几分？0 是平静，10 是最难受。"
    stealth_note: "在座位上默默地看、轻轻地摸，不用出声。"

  - id: "SAFE_PLACE_CONTAINER"
    title: "安全岛与情绪保险箱意象锚定"
    display_title: "安全岛想象"
    duration_minutes: 3
    intro: "有些东西此刻还不必去碰。我们花 3 分钟，先给它找个安放的地方。"
    steps:
      - "在心里想象一个让你觉得绝对安全、安静、什么都伤不到你的地方，比如海边的小木屋，或安静的森林。"
      - "在这个地方放一个保险箱，配上一把牢固的密码锁。"
      - "把此刻消化不了的困扰和刺痛的记忆打成一个包裹，放进箱子锁好，约定只在有专业人员陪着时再打开。"
    closing: "箱子锁好了。愿意的话，给此刻的难受打个分：0 是平静，10 是最难受。"
    stealth_note: "全程在脑海里想象，看着屏幕也能做。"

  - id: "ENVIRONMENT_STIMULUS_REDUCTION"
    title: "环境高刺激隔离与感官减载"
    display_title: "给感官减减负"
    duration_minutes: 2
    intro: "周围太吵太亮的时候，我们花 2 分钟，先帮你把环境调安静一点。"
    steps:
      - "戴上降噪耳机或耳塞，暂时隔开周围嘈杂的说话声和尖锐的声响。"
      - "关掉刺眼的顶灯，拉上窗帘，或者挪到光线柔和、暗一点的地方。"
      - "把手机调成勿扰模式，先暂停所有争论，也先不做任何重大决定。"
    closing: "四周安静些了。此刻的难受有几分？0 是平静，10 是最难受。"
    stealth_note: "戴上耳机、调暗屏幕，看起来就像在专心工作。"

  - id: "ENVIRONMENT_PHYSICAL_ANCHOR"
    title: "本体感觉与物理接触实体锚定"
    display_title: "踩稳地面小练习"
    duration_minutes: 1
    intro: "我们花 1 分钟，借身体的感觉，把自己稳稳地带回来。"
    steps:
      - "双脚平放在地上，用力往下踩，感受地板稳稳地托住你，把力量推回来。"
      - "双手交叉抱住双臂，或者紧紧扣住双手，保持 5 秒，感受身体的边界。"
      - "把手掌轻轻放在胸口，感受每一次呼吸时胸膛的起伏。"
    closing: "你在这里。愿意的话，给此刻的难受打个分：0 是平静，10 是最难受。"
    stealth_note: "踩地和扣手都可以在桌下做，旁人不会注意到。"

