    how_it_helps: "在咨询中一起放慢节奏，带着好奇去探讨彼此的心思，帮助这种理解能力在压力下也更稳定。"
    who_offers_it: "通常由受过心智化训练的心理咨询师或治疗师，以个体或团体形式进行。"
    try_alone: false

