    how_it_helps: "在真实、安全的咨访关系中，留意并支持更真诚、更有勇气的表达，让这些变化慢慢延伸到生活里。"
    who_offers_it: "通常由受过行为取向训练的心理咨询师或治疗师进行。"
    try_alone: false

  - id: "33"
