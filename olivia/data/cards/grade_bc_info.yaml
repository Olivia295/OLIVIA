# 草稿：待 G-0 两名注册心理师审核（docs/superpowers/plans/2026-10-22-remaining-roadmap.md R1-4）
#
# Grade B（科普与概念重塑）与 Grade C（专业转介提示）疗法的机制科普卡。
# 只解释“这是什么、大致如何起作用、通常由谁进行”，不含任何练习、步骤或自助指导。
# Grade B 仅在 S_clarify 阶段作为认知照见视角或微科普呈现，不作为指令动作；
# Grade C 仅在用户询问时提供机制科普，并提示由受过训练的专业人员进行。
# 字段：id / title（= taxonomy name_zh）/ grade / what_it_is（≤80 字）/ how_it_helps（≤80 字）
#       / who_offers_it（≤60 字）/ try_alone（全部为 false）。

entries:
  # ---------------------------------------------------------------- Grade B (26)
  - id: "09"
    title: "认知行为分析系统心理治疗"
    grade: "B"
    what_it_is: "一种针对长期低落情绪的谈话方法，会一起回看具体的人际情境，看看想法和做法如何影响了结果。"
    how_it_helps: "把“想要的结果”和“实际发生的”放在一起对照，帮人看清行为与后果的联系，慢慢找回在人际互动中的掌控感。"
    who_offers_it: "通常由受过该方法专门训练的心理咨询师或治疗师进行。"
    try_alone: false

  - id: "19"
    title: "图式疗法"
    grade: "B"
    what_it_is: "认为早年未被满足的需要，会形成一些深层的“人生模式”，在今天的关系和情绪里反复出现。"
    how_it_helps: "帮人认出这些反复出现的模式从哪里来，在安全的关系里体验被理解，逐步发展出更照顾自己的方式。"
    who_offers_it: "通常由受过图式疗法训练的心理咨询师或治疗师，在较长的疗程中进行。"
    try_alone: false

