        notes: "《院前医疗急救管理办法》：全国院前医疗急救呼叫号码为 120，急救中心 24 小时受理。"
    lines:
      - id: cn_12356
        name_zh: 全国统一心理援助热线
        number: "12356"
        kind: crisis_hotline
        levels: [L2, L3]
        hours: "每日不少于18小时（国家要求）；各地实际时段不同，部分省份24小时"
        scope: national
        adcode: null
        minors_only: false
        source_url: https://www.nhc.gov.cn/yzygj/c100068/202412/49a1a65386cd4be582d4702fd0926ee8.shtml
        verified_on: "2026-11-25"
        notes: >-
          国卫医政函〔2024〕259号设定 12356，要求每条热线每日不少于18小时服务；
          国家卫健委 2025-12-26 发布会称各地已于 2025-05-01 前全部开通
          （https://www.nhc.gov.cn/xcs/c100122/202512/9731f93a7e0d451284a0da462527cbd2.shtml）。
          部分省份夜间不接听（如湖北 8:00-次日2:00），L3 必须同时给出 110/120。
          国卫医政函〔2024〕259号要求各地把卫生健康行政部门主管的现有心理援助热线号码调整为 12356，
          并设过渡期保证原号码与 12356 均可接通（如湖北 2025-03-20 至 06-19）；没有找到过渡期结束后
          官方确认仍可单独拨打的省级旧号码，故未单独收录（见 hotline-sources.md）。
      - id: cn_12355
        name_zh: 12355青少年服务台
        number: "12355"
        kind: youth_line
        levels: [L2]
        hours: unknown
        scope: national
        adcode: null
        minors_only: true
        source_url: https://www.gqt.org.cn/xxgk/tngz_gfxwj/gfxwj/202406/t20240619_796325.htm
        verified_on: "2026-11-25"
        notes: >-
          共青团主办的全国统一青少年服务号码，以法律、心理为核心服务；各地接听时段与分线不同。
          中青发〔2020〕7号：直接面向青少年，以未成年人和学生为重点，可拓展到青年就业等，并废止 2006 年意见
          （https://www.gqt.org.cn/xxgk/tngz_gfxwj/gfxwj/202210/t20221013_790065.htm）。
          官方服务对象不限于未成年人（福建省政府网：青少年、家长、老师都可拨打）；minors_only: true 是
          OLIVIA 的产品取舍：只给未成年用户看，成年用户在大陆看 12356。
          2025 年仍在运行的官方佐证：https://www.fujian.gov.cn/xwdt/mszx/202505/t20250521_6916533.htm
