        notes: "《院前医疗急救管理办法》：全国院前医疗急救呼叫号码为 120，急救中心 24 小时受理。"
    lines:
      - id: cn_12356
        name_zh: 全国统一心理援助热线
        number: "12356"
        kind: crisis_hotline
        levels: [L2, L3]
        hours: "每日不少于18小时（国家要求）；各地实际时段不同，部分省份24小时"
        scope: national
        adcode: null
        minors_only: false
        source_url: https://www.nhc.gov.cn/yzygj/c100068/202412/49a1a65386cd4be582d4702fd0926ee8.shtml
        verified_on: "2026-10-22"
        notes: >-
          国卫医政函〔2024〕259号设定 12356，要求每条热线每日不少于18小时服务；
          国家卫健委 2025-12-26 发布会称各地已于 2025-05-01 前全部开通
          （https://www.nhc.gov.cn/xcs/c100122/202512/9731f93a7e0d451284a0da462527cbd2.shtml）。
          部分省份夜间不接听（如湖北 8:00-次日2:00），L3 必须同时给出 110/120。
          各省原有心理热线号码均已并入 12356，未单独收录。
      - id: cn_12355
        name_zh: 12355青少年服务台
        number: "12355"
        kind: youth_line
        levels: [L2]
        hours: unknown
        scope: national
        adcode: null
        minors_only: true
        source_url: https://www.gqt.org.cn/documents/zqf/200611/t20061128_1539.htm
        verified_on: "2026-10-22"
        notes: >-
          共青团中央建设的全国统一青少年服务号码，提供心理与法律咨询；各地接听时段与分线不同。
          2025 年仍在运行的官方佐证：https://www.fujian.gov.cn/xwdt/mszx/202505/t20250521_6916533.htm
