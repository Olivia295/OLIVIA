#
# Each reason starts with its kind, which the runner checks:
#   "crisis recall"      the session's highest level stays below crisis_at_least
#   "model false alarm"  the case passes in rules mode and fails in model mode because the
#                        student raised the crisis level to its crisis_below (G-5
#                        expansion, 2026-10-24: non-crisis cases now carry crisis_below L2)
#   "rules false alarm"  the rules already raise it (the case is a rules-mode gap of the
#                        same kind); the student can only raise the level, never lower it
#
# Packaged student: the round-8 three-CNN ensemble (format version 2, variant
# cnn_ensemble3, fingerprint 4524170efaf8d8b0, ge2 threshold at 95% holdout recall;
# trained on rounds 1-8, round 8 adding everyday plans, preparations and farewells as L0
# hard negatives), replacing the first ensemble (9f1148b39d28bb2c: 26 gaps on these rules,
# 11 model false alarms, 9 crisis recall, 6 rules false alarms). Of the 20 crisis-recall
# gaps of rules mode it closes the same 11 (rt233-rt241, rt244, rt245: all
# passive_ideation). Against the first ensemble it no longer raises rt124 or rt232 and
# raises one new everyday_hyperbole case (rt214); rt038 and rt143 keep failing at a lower
# highest level (L0 and L1).
# F8a (2026-10-24: a student-only L1 does not join an L1 run; the student at most L1 where
# a hyperbole cue covers every risk phrase; an awaited confirmation the student alone puts
# at L2 is tracked at the rules' level) changes no case here: regenerated, same list.
# R-MS closes none of the self_harm_method cases below: none names an act of ending a life
