# Labelled sentences for the rule-based perception stub.
#
# Every sentence and label here was written for this suite, by hand, following
# docs/eval/perception-annotation-guide.md (emotion: §2, arousal anchors: §3,
# dominant spectrum: §9). Labels are what the guide says the message is, not what the
# stub happens to output.
#
# Both halves were written before the lexicon existed. `tuned` cases may be consulted
# while editing olivia/data/lexicons/perception.yaml; `heldout` cases must not be, so
# their accuracy is reported separately as the honest estimate.
#
# Fields:
#   arousal_band  TAX arousal.bands name: low | moderate | elevated | acute
#   emotion       TAX emotion id
#   spectrum      dominant TAX distress spectrum "01".."11", or "none" (guide §9)
#   signals       optional; omitted keys mean "no signal":
#                 battery (0.0-1.0), direct_request, lock_on, lock_off (bool),
#                 command ("/done" | "/not-now" | "/unhelpful")

version: 1
cases:
  # ---------------------------------------------------------------- heldout ----
  - split: heldout
    text: "最近每天晚上躺下就开始担心明天的汇报，心里一直悬着"
