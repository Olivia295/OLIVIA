# Compositional crisis cues (fix F1, 2026-10-24): synthetic user messages, no real people.
# The rules screen used to match closed exact phrases only, so one inserted word (已经, 都,
# 也, 真的) or a different verb dropped a plain crisis statement to L0. The `compositions`
# section of risk.yaml now joins two phrase lists across a short gap (no clause punctuation
# in between), with negation, third-person, context and exception checks.
#
# Each case: {id, kind, text, level, stage, ask, flag?}. `level` and `stage` are asserted
# exactly, `ask` is CrisisAssessment.asks_intent (decision D3) and `flag`, when present, is
# whether the red-flag detector reports SIT-09-01 (self-injury). Never lower an expectation
# to make a case pass. Phrases stay minimal: generic means words, no method detail.
#
# kinds (positives):
#   intent_act       intent verb x act of ending one's life -> L2
#   intent_time      plan verb x act + a time or preparation word nearby -> L3 (Stage 1)
#   prep_note        note / last words / own affairs + prepared or finished -> L3
#   prep_means       a generic means + prepared, with a death context anywhere -> L3
#   means_hoarded    pills hoarded (攒够, 囤好 ...) with no death word -> L2 (F16a)
#   farewell_ctx     farewell or arrangements + a death or ending context -> L3
#   farewell_ask     the same farewell or arrangements alone -> L1 + D3 question
#   place            already standing or sitting at a height or a rail edge -> L2 (no
#                    self-harm anchor, as cases.yaml pn04)
#   no_wake          wish not to wake up (C-SSRS item 1, passive ideation) -> L2
#   burden_ask       being a burden, the world better without me, joining someone who
#                    died -> L1 + D3 question
#   weary            living / life + meaningless or tiring, with a word in between -> L1
#   self_injury      current or recent self-injury -> L1 + D3 question + SIT-09-01
#   resolve_ask      a resolve of my own, then only "就(在) tonight / now" -> L1 + D3 (F5a)
# kinds (negatives): hyperbole, benign_object, third_person, negation, past, fiction,
#   prep_benign, farewell_benign, place_benign, sleep_benign, burden_benign, weary_benign,
#   injury_benign, method_benign, resolve_benign

