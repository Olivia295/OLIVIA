# 需求追溯表：PRD / SDD 里每个需求编号对应的测试或检查脚本。
#
# 用途：让“每条需求有没有被验证”可以机器检查，而不是靠人记。
# 格式：每个编号一项。
#   status   covered（行为被断言）| partial（只断言了一部分，reason 写缺什么）
#            | exempt（此处无法测试，reason 写原因，如裁定号或外部门禁）
#   summary  一句中文，写这条要求是什么
#   tests    path::name 或 path::Class::name 的列表（文件须定义该名字）
#   checks   scripts/ 下、由 scripts/check.sh 或 .github/workflows/ci.yml 运行的脚本
#   reason   partial / exempt 必填
#
# 新增需求编号时必须在此登记；scripts/trace_requirements.py 在 CI 中检查，
# 文档里出现而这里没有的编号、这里有而文档不再出现的编号，都会让检查失败。

