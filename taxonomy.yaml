  rumination: "anxiety"
  procrastination: "overwhelm"
  self_criticism: "shame"
  insomnia: "anxiety"
  emptiness: "numbness"
  irritability: "anger"

# ------------------------------------------------------------------------------
# 4. 认知扭曲枚举体系 (Cognitive Distortions - 8 Core Beck & Burns + Aliases)
# ------------------------------------------------------------------------------
cognitive_distortions:
  - id: "ALL_OR_NOTHING"
    name: "非黑即白思维 / 全或无"
    description: "将事物二元对立，非完美即彻底失败。"
  - id: "CATASTROPHIZING"
    name: "灾难化思维 / 放大风险"
    description: "无依据地预期最坏结局，放大微小负面信号。"
  - id: "OVERGENERALIZATION"
    name: "过度概括"
    description: "将单次挫败视为恒定不可逆的绝对规律。"
  - id: "MIND_READING"
    name: "猜心术 / 妄测他人看法"
    description: "笃信他人对自己有负面评判，不进行现实检验。"
  - id: "FORTUNE_TELLING"
    name: "算命式预言"
    description: "武断认定未来必然走向失败与灾难。"
  - id: "MENTAL_FILTER"
    name: "心理过滤 / 消极选择性注意"
    description: "只盯住局部瑕疵，忽略客观存在的积极事实。"
  - id: "EMOTIONAL_REASONING"
    name: "情绪化推理"
    description: "因为我感觉很糟，所以客观现实一定很坏。"
  - id: "SHOULD_STATEMENTS"
    name: "应该句式 / 强加法则"
    description: "对自己或他人使用无弹性的强制命令句式。"
  - id: "PERSONALIZATION"
    name: "个人化 / 妄自归咎"
    description: "将外部客观事件或他人的负面反应错误归因于自己，背负无端自责。"

distortion_aliases:
  DISQUALIFYING_POSITIVE: "MENTAL_FILTER"
  JUMPING_TO_CONCLUSIONS: "MIND_READING"
  MAGNIFICATION: "CATASTROPHIZING"
  LABELING: "ALL_OR_NOTHING"

