# 9.1 临床子动作与微干预登记表 (Action Registry: Sub-actions & Standalone Practices)
# ------------------------------------------------------------------------------
action_registry:
  - id: "12:tipp_breathing"
    aliases:
      - "DBT_TIPP_MODIFIED_BREATHING"
    name_zh: "DBT TIPP 慢节奏呼吸稳定法"
    name_en: "DBT TIPP Paced Breathing"
    parent_method_id: "12"
    action_type: "STABILIZATION"
    duration_minutes: 2
    stealth_workplace_compatible: true
    clinical_rationale: "通过延长呼气时间（呼气长度为吸气 1.5-2 倍）强力刺激副交感迷走神经，迅速平抑前额叶认知过载。"
    core_action_steps:
      - "保持身体坐直，双肩自然下沉微垂"
      - "用鼻子平缓吸气持续 4 秒"
      - "微张嘴唇像吹灭蜡烛一样极其缓慢呼气持续 6-8 秒，重复 3-5 个循环"

  - id: "12:tipp_cold_water"
    aliases:
      - "DBT_TIPP_COLD_WATER"
    name_zh: "DBT TIPP 哺乳动物潜水反射（冷水浸面）"
    name_en: "DBT TIPP Cold Water / Mammalian Dive Reflex"
    parent_method_id: "12"
    action_type: "STABILIZATION"
    duration_minutes: 1
    stealth_workplace_compatible: false
    clinical_rationale: "利用冷水刺激三叉神经和眼眶周围迷走神经引发潜水反射，迅速骤降过高心率。"
    core_action_steps:
      - "在盆中盛放微凉冷水（10-15°C）"
      - "深吸一口气，将面部上 1/3（尤其是眼周与额头）浸没入水中屏息 15-30 秒"
      - "抬头用干毛巾擦拭，感知心跳瞬时放缓"
    contraindications:
      - "RED_FLAG_ANOREXIA"
      - "RED_FLAG_BPD_NSSI"
      - "CARDIORESPIRATORY_INSTABILITY"

  - id: "30:grounding"
    aliases:
      - "GROUNDING_54321"
    name_zh: "5-4-3-2-1 感官外感受着陆法"
    name_en: "5-4-3-2-1 Sensory Grounding"
    parent_method_id: "30"
    action_type: "STABILIZATION"
    duration_minutes: 2
    stealth_workplace_compatible: true
    clinical_rationale: "将认知注意从内部惊恐风暴或解离状态强行锚定到当前物理空间，重建神经生理在场感。"
    core_action_steps:
      - "环视周围，在心中默念并确认 5 件能看到的物品"
      - "触摸身旁 4 种不同质感材质（桌面、衣袖、椅背、指尖）"
      - "辨别并确认 3 种细微声音，识别 2 种气味，体会舌尖 1 种味道"

  - id: "SAFE_PLACE_CONTAINER"
    aliases:
      - "SAFE_PLACE_IMAGERY"
    name_zh: "安全岛与情绪保险箱意象锚定"
    name_en: "Safe Place & Emotional Container Imagery"
    parent_method_id: null
    action_type: "STABILIZATION"
    duration_minutes: 3
    stealth_workplace_compatible: true
    clinical_rationale: "为无法即刻处理的高侵入性创伤或压力线索建立心智边界容器，保障当下人身安全感。"
    core_action_steps:
      - "在心底构想一个绝对安全、宁静、坚不可摧的庇护空间（如海边木屋或安静森林）"
      - "在空间内设立一个带有牢固密码锁的情绪保险箱"
      - "将当下无法消化的困扰与刺痛记忆具象化打包放入箱内锁好，约定只有在专业督导下才开启"

  - id: "CIRCADIAN_RHYTHM_STABILIZATION"
    aliases: []
    name_zh: "生物节律与昼夜作息稳态锚定"
    name_en: "Circadian Rhythm & Social Rhythm Stabilization"
    parent_method_id: null
    action_type: "PSYCHOEDUCATION"
    duration_minutes: 2
    stealth_workplace_compatible: true
    clinical_rationale: "稳定双相与重度情绪脆弱人群的光照、进食与起居节律，防范昼夜节律紊乱诱发躁狂或抑郁风暴。"
    core_action_steps:
      - "固定每日早晨起床与开窗接触自然光线的时刻（正负不超过 30 分钟）"
      - "固定三餐进食时间，入睡前 2 小时调暗室内所有顶灯与屏幕亮度"
      - "记录未来 24 小时的睡眠-苏醒基线锚点"

  - id: "ENVIRONMENT_STIMULUS_REDUCTION"
    aliases: []
    name_zh: "环境高刺激隔离与感官减载"
    name_en: "Environmental Stimulus Reduction & Sensory De-escalation"
    parent_method_id: null
    action_type: "STABILIZATION"
    duration_minutes: 2
    stealth_workplace_compatible: true
    clinical_rationale: "双相转躁或高激惹期交感神经超敏，通过快速降低声光刺激抑制神经系统过度激越。"
    core_action_steps:
      - "佩戴降噪耳机或耳塞，暂时切断周围繁杂交谈与尖锐声响"
      - "关闭刺眼强光顶灯，拉上遮光窗帘或移至光线柔和昏暗区域"
      - "将手机置于勿扰模式，暂停一切社交争辩与重大决策讨论"

  - id: "ENVIRONMENT_PHYSICAL_ANCHOR"
    aliases:
      - "SOMATIC_GROUNDING_TOUCH"
    name_zh: "本体感觉与物理接触实体锚定"
    name_en: "Proprioceptive Physical Body Anchor"
    parent_method_id: null
    action_type: "STABILIZATION"
    duration_minutes: 1
    stealth_workplace_compatible: true
    clinical_rationale: "解离与现实解体期本体感觉迟钝，通过肌肉压力与重力感知将意识拉回肉身。"
    core_action_steps:
      - "将双脚平放地面，用力向下踩踏感受地板的坚实支撑与反作用力"
      - "双手用力交叉环抱双臂或紧扣双手持续 5 秒，感受肢体边界"
      - "用手掌轻抚胸口，感受每一次呼吸时胸膛起伏的起伏触感"

  - id: "EMOTIONAL_HOLDING_PRESENCE"
    aliases:
      - "UNCONDITIONAL_PRESENCE"
      - "GENTLE_PRESENCE"
      - "DE_BLAME_EMOTIONAL_CONTAINMENT"
    name_zh: "无评判去自责温暖在场守候"
    name_en: "Non-Judgmental Emotional Holding & Validating Presence"
    parent_method_id: null
    action_type: "COMPANIONSHIP"
    duration_minutes: 3
    stealth_workplace_compatible: true
    clinical_rationale: "在产后情绪波动、厌食低能量或自伤冲动期，阻断说教与追问，提供绝对安全接纳容器。"
    core_action_steps:
      - "完全冻结提问、分析、建议与行动要求"
      - "输出温和去自责确证：“这不是你的错，更不代表你软弱或失败”"
      - "静默在场守护，配合温和留白，确认此时此刻陪伴一直在线"

  - id: "WITHDRAWAL_RISK_WARNING"
    aliases: []
    name_zh: "成瘾物质急性戒断风险安全警示"
    name_en: "Substance Acute Withdrawal Risk Warning"
    parent_method_id: null
    action_type: "PSYCHOEDUCATION"
    duration_minutes: 1
    stealth_workplace_compatible: true
    clinical_rationale: "明确告知酒精与精神活性物质骤停伴随癫痫与谵妄等生命危险，防范自行断药毒副反应。"
    core_action_steps:
      - "严肃提示中枢神经依赖药物与酒精自行骤断具有极高生理危险"
      - "严禁未经医嘱自行停药、换药或暴饮暴戒"
      - "敦促在亲友陪同下前往正规综合医院或成瘾医学专科门诊评估戒断综合征"

  - id: "REFERRAL_CARD_PRESENTATION"
    aliases: []
    name_zh: "国家精神心理专科就医转介卡呈现"
    name_en: "Specialized Clinical Referral Card Presentation"
    parent_method_id: null
    action_type: "REFERRAL"
    duration_minutes: 1
    stealth_workplace_compatible: true
    clinical_rationale: "在触达 7 处临床红线时，向用户呈现不可篡改的专科医疗就诊指引与危机求助通道。"
    core_action_steps:
      - "呈现国家三甲精神心理专科医院或综合医院心理科就诊建议卡"
      - "呈现属地 24 小时心理援助热线与当地紧急急救/治安电话"
      - "温和建议将当下身心状态同步给身边可信赖的现实亲友"

