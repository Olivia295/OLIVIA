    description: "在无现场专业心理师监护下严禁开展的高反应闪回诱发技术"
    banned_method_ids:
      - "04"
      - "05"
      - "21"
      - "22"
      - "23"
      - "26"
      - "27"
      - "65"
      - "66"
  SELF_DETOX_GUIDANCE:
    name: "自行停药/断酒戒断指导"
    description: "涉及神经生理毒副反应与戒断综合征致命危险的非医疗指导"
    banned_method_ids:
      - "10"

# ------------------------------------------------------------------------------
# 9.3 子动作与父方法继承规则 (Sub-action & Parent Method Inheritance Rules)
# ------------------------------------------------------------------------------
inheritance_rules:
  contraindication_isolation:
    rule: "父级禁忌独立性原则 (Parent Contraindication Isolation)"
    description: "父方法的 contraindications 仅作用于父方法自身的 core_action_steps（即以父方法整体形式输出时），子动作严格依据自身在 action_registry 中声明的 contraindications 进行独立过滤与阻断。"
  parent_ban_penetration:
    rule: "父级禁用向下穿透与显式白名单豁免 (Parent Ban Penetration with Explicit Whitelist Exemption)"
    description: "当红线规则或临床黑名单禁用父方法 ID（如禁用 '12'）时，其下属所有子动作默认一并级联禁用；唯一的例外是：若红线病种的 allowed_actions 白名单中显式指定了该子动作（如 BPD 红线显式允许 DBT_TIPP_MODIFIED_BREATHING / 12:tipp_breathing），则该子动作破例获得豁免放行。"

# ------------------------------------------------------------------------------
# 9.4 动作候选池求解与红线优先公理 (Action Candidate Resolution & Red Flag Priority Axiom)
# ------------------------------------------------------------------------------
resolution_priority:
  formula: "A_available = (C_candidates ∩ A_allowed) \\ B_banned \\ X_contraindicated"
  description: "当前会话可用动作集合严格由候选池、红线允许白名单、禁用集与禁忌症四重掩码交差集运算求解。"
  rules:
    red_flag_closure:
      rule: "红线封闭集公理 (Red Flag Allowed Actions as Closed Boundary)"
      description: "对命中临床红线的用户而言，RedFlag.allowed_actions 构成了其实际允许交互的绝对封闭上限范围，banned_methods 仅作为第二道深度防御保险。未列入 allowed_actions 的动作（包括 S_explore 稳定化白名单中的常规方法）对红线用户一律不可见。"
    alias_canonicalization:
      rule: "别名标准归约前置原则 (Alias Canonicalization Pre-processing)"
      description: "参与集合运算前，所有动作标识符（包括来自 allowed_actions、banned_methods、explore_stabilization_whitelist 及候选池的 ID 或别名）必须先经 action_registry 的别名映射表统一规约为标准 ID。例如 DBT_TIPP_MODIFIED_BREATHING 规约为 12:tipp_breathing，GROUNDING_54321 规约为 30:grounding，确保交差集运算准确匹配。"
    empty_set_fallback:
      rule: "空集保底降级与转介联动态 (Empty Set Graceful Fallback & Referral Binding)"
      description: "若四重交差集求解结果为空集（A_available = ∅，如双相红线用户在 S_explore 高唤醒时），系统确定性降级为 EMOTIONAL_HOLDING_PRESENCE（纯陪伴基线 m0）；若当前命中临床红线，则并行追加呈现 REFERRAL_CARD_PRESENTATION（专科医疗就诊指引卡）。严禁报错、抛出异常或盲目回退至常规方法。"
    action_type_dispatch:
      rule: "动作类型多通道分发协议 (Action Type Multi-Channel Dispatch Protocol)"
      description: "求解得到的动作按 action_type 分流处理：当输出为 32 种 A 级父方法整方法骨架时，默认按 MICRO_EXERCISE 处理；登记于 action_registry 的子动作则严格依据其声明的 action_type（STABILIZATION / COMPANIONSHIP / PSYCHOEDUCATION / REFERRAL）分流处理。MICRO_EXERCISE 与 STABILIZATION 装配为微练习跟练骨架；COMPANIONSHIP（纯陪伴 m0）渲染温和在场守护语料；PSYCHOEDUCATION 渲染生活作息稳态科普卡；REFERRAL 移交危机与属地卡片模块渲染专科就诊指引，严禁将转介卡或科普当成微练习指令下发。"
    non_red_flag_default:
      rule: "无红线默认全集 (Non-Red Flag Universal Set)"
      description: "若用户未触发任何临床红线，A_allowed 默认退化为全集 Ω，系统仅受状态机准入白名单 (C_candidates)、通用黑名单 (B_banned) 与自身禁忌症 (X_contraindicated) 约束。"

# ------------------------------------------------------------------------------
# 10. 临床转诊红旗与能力绝对边界 (7 Mandatory Clinical Referral Red Flags)
# ------------------------------------------------------------------------------
clinical_red_flags:
  mandatory_referral_disorders:
    - code: "SIT-02-04"
      name_zh: "双相情感障碍与环性心境波动"
      file: "02_04_Bipolar_Cyclothymia.md"
      policy: "仅提供情绪接纳与睡眠作息节律稳定陪伴，严禁任何可能激发转躁的高刺激激活技术，强制提示精神科专业诊疗。"
      allowed_actions:
        - "CIRCADIAN_RHYTHM_STABILIZATION"
        - "ENVIRONMENT_STIMULUS_REDUCTION"
        - "REFERRAL_CARD_PRESENTATION"
      banned_methods:
        - "03"
        - "RADICAL_COGNITIVE_DEBATE"
    - code: "SIT-02-06"
      name_zh: "围产期与产后抑郁/焦虑困扰"
      file: "02_06_Perinatal_Depression.md"
      policy: "涉及母婴安全与产后激素骤变，触发温和守护流程，阻断深度探查，强制提示妇幼保健院产后心理专科。"
      allowed_actions:
        - "EMOTIONAL_HOLDING_PRESENCE"
        - "CIRCADIAN_RHYTHM_STABILIZATION"
        - "REFERRAL_CARD_PRESENTATION"
      banned_methods:
        - "DEEP_SCHEMA_EXCAVATION"
        - "HIGH_COGNITIVE_LOAD"
    - code: "SIT-06-01"
      name_zh: "急性应激障碍与创伤后应激障碍 (PTSD)"
      file: "06_01_ASD_PTSD.md"
      policy: "严禁非专业监护下的创伤暴露与细节回溯，仅提供感官着陆与安全容器守候，引导创伤专科就诊。"
      allowed_actions:
        - "GROUNDING_54321"
        - "SAFE_PLACE_CONTAINER"
        - "REFERRAL_CARD_PRESENTATION"
      banned_methods:
        - "04"
        - "05"
        - "26"
        - "27"
        - "65"
        - "66"
    - code: "SIT-06-05"
      name_zh: "解离状态与人格解体-现实解体障碍"
      file: "06_05_Dissociation_DPDR.md"
      policy: "解离发生时前额叶情绪刹车死锁，严禁进行抽象反思或认知辨析，仅允许轻柔感官着陆，强力提示精神专科。"
      allowed_actions:
        - "GROUNDING_54321"
        - "ENVIRONMENT_PHYSICAL_ANCHOR"
        - "REFERRAL_CARD_PRESENTATION"
      banned_methods:
        - "ABSTRACT_EXISTENTIAL_INQUIRY"
        - "01"
    - code: "SIT-08-04"
      name_zh: "神经性厌食与过度限制性进食控制"
      file: "08_04_Anorexia_Restrictive_Eating.md"
      policy: "精神障碍中全因死亡率最高病种；严禁讨论体重与节食控制技巧，严禁冷水浸面 TIPP（防诱发心律失常），出现显著营养不良与躯体虚弱立即提示综合医院内科与精神科。"
      allowed_actions:
        - "EMOTIONAL_HOLDING_PRESENCE"
        - "REFERRAL_CARD_PRESENTATION"
      banned_methods:
        - "12:tipp_cold_water"
        - "13"
        - "DIET_WEIGHT_MANAGEMENT"
    - code: "SIT-09-01"
      name_zh: "边缘型情绪失调伴非自杀性自伤倾向 (BPD with NSSI)"
      file: "09_01_BPD_Emotion_Dysregulation.md"
      policy: "伴随高频冲动性自伤自毁风险；提供无评判安全在场与 DBT TIPP 安全改良变体（仅节奏呼吸与渐进肌肉紧绷释放，显式禁用冷水刺激），绝不探查创伤细节，引导建立三方现实监护网。"
      allowed_actions:
        - "EMOTIONAL_HOLDING_PRESENCE"
        - "DBT_TIPP_MODIFIED_BREATHING"
        - "REFERRAL_CARD_PRESENTATION"
      banned_methods:
        - "12:tipp_cold_water"
        - "TRAUMA_DETAIL_EXPLORATION"
    - code: "SIT-10-04"
      name_zh: "酒精与成瘾物质依赖 (自我药疗)"
      file: "10_04_Substance_Use_Self_Medication.md"
      policy: "涉及中枢神经化学依赖与躯体戒断综合征致命风险，严禁任何自行戒断指导，强制转介成瘾医学科。"
      allowed_actions:
        - "WITHDRAWAL_RISK_WARNING"
        - "REFERRAL_CARD_PRESENTATION"
      banned_methods:
        - "SELF_DETOX_GUIDANCE"
        - "10"

# ------------------------------------------------------------------------------
# 11. 四级危机分级与响应规程 (4-Level Crisis Classification: L0 - L3)
# ------------------------------------------------------------------------------
crisis_hierarchy:
  L0:
    name: "安全状态 (Safe / Subclinical)"
    interval_type: "HALF_OPEN"
    score_range: [0.0, 0.20]  # [0.0, 0.20)
    description: "无自伤自杀意念，常规日常困扰与情绪波动。"
    action: "正常流转状态机，提供倾听、共情与 A 级自主微方法。"
  L1:
    name: "隐晦厌世 / 存在性疲倦 (Implicit Weariness)"
    interval_type: "HALF_OPEN"
    score_range: [0.20, 0.50]  # [0.20, 0.50)
    trigger_criteria: "提到‘活着好累’、‘毫无意义’、‘想彻底睡过去’等倦怠表述，但无自残自杀意念；排除中文口癖 (如‘累死了’、‘想死的心都有了’)。"
    action: "严格不弹求助卡 (避免误报伤害用户信任)；状态机停留在 S_explore；提供深度情感包裹与安全基地守候；温和探询身心感受。"
  L2:
    name: "明确被动轻生念头 (Explicit Passive Ideation)"
    interval_type: "HALF_OPEN"
    score_range: [0.50, 0.80]  # [0.50, 0.80)
    trigger_criteria: "明确表达想死、想结束生命，但尚未制定具体时间、地点、方式手段或准备工具。"
    action: "立即暂停所有方法干预；输出温和安全守护卡；由 GEO 解析器呈现属地心理援助热线与支持网络；温柔探询当下安全边界与身边支持。"
  L3:
    name: "急性自杀危机 (Imminent Crisis with Plan or Means)"
    interval_type: "CLOSED"
    score_range: [0.80, 1.00]  # [0.80, 1.00]
    trigger_criteria: "具备明确计划、正在准备工具、正在告别或有即刻自残行动迹象。"
    action: "即刻触发最高安全熔断；跳过所有分析与生成；强制由 GEO 解析器呈现属地心理热线及属地紧急急救与治安求助指令 (如 110/120、911、999 等)；敦促立即联系身边可信赖亲友。"

  arbitration_rule:
    principle: "SAFETY_FIRST_MAXIMUM"
    description: "多任务模型四分类等级 L_cls 与连续置信度等级 L_score 冲突时取高 (max(L_cls, L_score))。但定性为 L3 必须硬依赖计划/工具/时限 (PLAN_MEANS_TIME) 证据；若得分 >= 0.80 但无证据，安全降级为高危 L2。"

  exit_rule:
    principle: "SAFETY_CONFIRM_AND_CONSECUTIVE_SAFE_STREAK"
    description: "用户明确确认安全 (SafetyConfirmEvent)，且后续连续保持安全轮次 (L2需连续2轮安全，L3需连续3轮安全)，双重条件达成后方可平稳离开 S_crisis 恢复常规探索。"
    safe_streak_required:
      L2: 2
      L3: 3

# ------------------------------------------------------------------------------
# 12. 权威紧急求助热线标准基线 (Official Crisis Hotlines Baseline)
# ------------------------------------------------------------------------------
emergency_hotlines:
  national_mental_health:
    code: "12356"
    name: "全国统一心理援助热线 (国家卫生健康委)"
    service_hours: "官方承诺每日服务不少于 18 小时，各地实际服务时段依属地配置不同"
  emergency_services:
    police: "110"
    ambulance: "120"
  youth_protection:
    code: "12355"
    name: "全国青少年心理咨询与法律援助热线 (共青团中央)"
    purpose: "专供未成年人 (18岁以下) 友好转介与权益保护"
  regional_resources_note: >
    属地化城市热线 (如北京、上海、广州等) 及港澳台、海外热线统一收录于
    olivia/data/resources/hotlines/ 目录树中，经 Ed25519 签名打包为 hotlines.bundle 离线分发。
    解析服务执行 Rule R8：“非大陆地区（HK/MO/TW 及海外）严格禁止呈现 12356/110/120/12355 大陆号码”，
    且 L3 级别必须绑定所在属地的紧急急救/治安电话 (如北美 911、英国 999、澳洲 000、欧盟 112、香港 999、台湾 110/119)。

# ------------------------------------------------------------------------------
# 13. 兼容与扩展配置 (Compatibility & Framework Bindings)
# ------------------------------------------------------------------------------
risk:
  levels: [L0, L1, L2, L3]
  model_thresholds: { L1: 0.20, L2: 0.50, L3: 0.80 }
  lexicon_scores: { L0: 0.0, L1: 0.40, L2: 0.70, L3: 0.90, HYPERBOLE: 0.10 }
  ewma_lambda: 0.5
  ewma_escalate: 0.45
  ewma_streak: 3
  l1_clear_streak: 3
  crisis_exit_safe_turns: { L2: 2, L3: 3 }

distress_categories:
  - ANXIETY_PANIC
  - MOOD_DEPRESSION
  - RUMINATION_OCD
  - SELF_WORTH
  - BURNOUT_PROCRASTINATION
  - TRAUMA_STRESS
  - ATTACHMENT_RELATIONSHIP
  - SLEEP_SOMATIC_EATING
  - EMOTION_DYSREGULATION
  - ADDICTION_IMPULSE
  - EXISTENTIAL_MEANING

distress_category_mapping:
  "01": "ANXIETY_PANIC"
  "02": "MOOD_DEPRESSION"
  "03": "RUMINATION_OCD"
  "04": "SELF_WORTH"
  "05": "BURNOUT_PROCRASTINATION"
  "06": "TRAUMA_STRESS"
  "07": "ATTACHMENT_RELATIONSHIP"
  "08": "SLEEP_SOMATIC_EATING"
  "09": "EMOTION_DYSREGULATION"
  "10": "ADDICTION_IMPULSE"
  "11": "EXISTENTIAL_MEANING"

thompson_sampling_index:
  dimension: "d"
  standard_key: "spectrum_id"  # 两位数字编号 "01" 至 "11"
  description: "Thompson 采样状态维护使用两位数字谱系编号 '01' 至 '11' 作为困扰维度 d 的标准键，与 distress_category_mapping 保持无损互转。"

late_night:
  start: "00:00"
  end: "05:00"
