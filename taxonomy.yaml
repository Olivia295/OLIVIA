# 8.1 临床禁忌症统一枚举体系 (Standardized Clinical Contraindications: 13 Enums)
# ------------------------------------------------------------------------------
contraindication_enums:
  - id: "CRISIS_ACTIVE_RISK"
    name: "急性自伤自杀危机风险"
    detection_source: "CRISIS_DETECTOR"
    description: "处于 L2 明确被动轻生或 L3 急性高危期，强制中断认知干预与自主微练习，优先安全调度与心理热线承接。"
  - id: "RED_FLAG_PSYCHOSIS"
    name: "精神病性症状与现实检验力丧失"
    detection_source: "RED_FLAG_DETECTOR / USER_PROFILE_DISCLOSURE"
    description: "存在活动性幻觉、妄想或现实解构，严禁进行可能加重思维松散的深度重构或自由联想。"
  - id: "RED_FLAG_MANIA"
    name: "双相情感障碍躁狂/轻躁狂期"
    detection_source: "RED_FLAG_DETECTOR (SIT-02-04) / USER_PROFILE_DISCLOSURE"
    description: "处于双相转躁或高激惹期，严禁行为激活 (BA) 与高刺激任务推进，优先作息生物节律稳态。"
  - id: "RED_FLAG_PTSD_FLASHBACK"
    name: "创伤后应激急性闪回与再创伤风险"
    detection_source: "RED_FLAG_DETECTOR (SIT-06-01) / USER_PROFILE_DISCLOSURE"
    description: "处于侵入性闪回或高反应惊恐期，严禁无督导的暴露练习、梦魇预演 (IRT) 或创伤叙事书写。"
  - id: "RED_FLAG_DISSOCIATION"
    name: "急性严重解离与人格解体"
    detection_source: "RED_FLAG_DETECTOR (SIT-06-05) / PERCEPTION_AROUSAL"
    description: "前额叶情绪刹车死锁或背侧迷走冻结，严禁抽象反思，仅放行轻柔感官外感受着陆。"
  - id: "RED_FLAG_ANOREXIA"
    name: "神经性厌食与重度限制性进食"
    detection_source: "RED_FLAG_DETECTOR (SIT-08-04) / USER_PROFILE_DISCLOSURE"
    description: "全因死亡率最高病种，严禁自主过度控制训练 (RO-DBT)，严禁冷水浸面 TIPP，优先医疗转介。"
  - id: "RED_FLAG_BPD_NSSI"
    name: "边缘型情绪失调伴活动性自伤冲动"
    detection_source: "RED_FLAG_DETECTOR (SIT-09-01) / USER_PROFILE_DISCLOSURE"
    description: "伴随高频冲动性自伤自毁风险，禁用冷水刺激，仅提供节奏呼吸与安全在场承接。"
  - id: "RED_FLAG_SUBSTANCE_WITHDRAWAL"
    name: "成瘾物质急性戒断风险"
    detection_source: "RED_FLAG_DETECTOR (SIT-10-04) / USER_PROFILE_DISCLOSURE"
    description: "涉及中枢神经生理依赖与震颤谵妄等致命风险，严禁自行断药/断酒，强制转介成瘾医学科。"
  - id: "ACUTE_AROUSAL_OVERLOAD"
    name: "急性交感神经过载与惊恐风暴"
    detection_source: "PERCEPTION_AROUSAL (Arousal >= 0.85)"
    description: "生理过度唤醒或过度通气，前额叶认知加工功能死锁，阻断复杂认知辨析，仅放行呼吸/躯体稳定化。"
  - id: "TOXIC_SHAME_SPIRAL"
    name: "毒性羞耻螺旋与严苛自我攻击"
    detection_source: "PERCEPTION_SCHEMA (DEFECTIVENESS + 强烈自责)"
    description: "深陷缺陷与自贬螺旋，严禁强推自省三问 (内观添麻烦第3问) 或积极心理强行赋能，改用自我关怀或纯倾听。"
  - id: "ACUTE_BEREAVEMENT_SHOCK"
    name: "急性丧亲与丧失剧烈震荡期"
    detection_source: "DISTRESS_TRACKER (SIT-06-04 丧亲初期)"
    description: "处于丧失初期剧烈悲恸期，遵从 COLBO-06 纯陪伴守护基线 (m0)，严禁主动推送哀伤重构练习。"
  - id: "CARDIORESPIRATORY_INSTABILITY"
    name: "严重心血管/呼吸系统不稳定性"
    detection_source: "USER_PROFILE_DISCLOSURE (用户自述病史)"
    description: "严重哮喘、严重心律失常或心脏起搏器不稳定，需避免剧烈屏气呼吸或冷水迷走神经刺激。"
  - id: "INTERPERSONAL_SAFETY_HAZARD"
    name: "活动性家庭暴力或人身安全险境"
    detection_source: "CRISIS_DETECTOR / USER_PROFILE_DISCLOSURE"
    description: "处于暴力或虐待现实威胁中，严禁进行单方面人际去威胁肯定或包容练习，优先人身安全救助。"

# 9. 75 种临床干预方法的三级安全分类 (Clinical Methods Safety Tiers: 32 / 26 / 17)
# ------------------------------------------------------------------------------
method_safety_tiers:
  grade_A:
    definition: "可由用户在无督导下进行自主微练习 (Self-Help Micro-Practices)"
    action_type: "AUTONOMOUS_PRACTICE"
    count: 32
    methods:
      - id: "01"
        name_zh: "传统认知行为疗法"
        name_en: "Cognitive Behavioral Therapy, CBT"
        file: "01_CBT_Cognitive_Behavioral_Therapy.md"
        evidence_level: "Level I"
        duration_minutes: 3
        stealth_workplace_compatible: true
        clinical_rationale: "识别并检验负性自动化思维，重建现实平衡认知。"
        core_action_steps:
          - "捕捉当下引发负性情绪的自动化想法 (NAT)"
          - "列举支持与反对该想法的客观事实依据"
          - "形成兼顾事实的替代性理性认知陈述"
        contraindications:
          - "RED_FLAG_PSYCHOSIS"
      - id: "02"
        name_zh: "理性情绪行为疗法"
        name_en: "Rational Emotive Behavior Therapy, REBT"
        file: "02_REBT_Rational_Emotive_Behavior_Therapy.md"
        evidence_level: "Level I"
        duration_minutes: 3
        stealth_workplace_compatible: true
        clinical_rationale: "辨析绝对化要求等非理性信念，建立弹性愿望信念。"
        core_action_steps:
          - "锁定诱发挫败事件 (A) 与核心非理性信念 (B，如‘必须/应该’)"
          - "辨析绝对化要求的逻辑荒谬性与有害后果 (C)"
          - "将‘我必须做到’重塑为‘我希望做到，但即便没做到也不代表我彻底失败’ (D)"
        contraindications:
          - "RED_FLAG_MANIA"
          - "RED_FLAG_PSYCHOSIS"
      - id: "03"
        name_zh: "行为激活疗法"
        name_en: "Behavioral Activation, BA"
        file: "03_BA_Behavioral_Activation.md"
        evidence_level: "Level II"
        duration_minutes: 4
        stealth_workplace_compatible: true
        clinical_rationale: "打破回避与抑郁恶性循环，通过微小奖赏行为激活多巴胺回路。"
        core_action_steps:
          - "拆解一项 2 分钟内可完成且具胜任感的微小行动 (如擦拭工位/接一杯温水)"
          - "设定即刻执行触发点，带着阻抗直接启动行动"
          - "行动后记录 0-10 分胜任感与微小积极感受"
        contraindications:
          - "RED_FLAG_MANIA"
          - "RED_FLAG_ANOREXIA"
      - id: "06"
        name_zh: "失眠认知行为疗法"
        name_en: "Cognitive Behavioral Therapy for Insomnia, CBT-I"
        file: "06_CBT_I_Insomnia_Cognitive_Behavioral_Therapy.md"
        evidence_level: "Level I"
        duration_minutes: 3
        stealth_workplace_compatible: true
        clinical_rationale: "重塑床与睡眠的强刺激控制联结，消除睡前焦虑与代偿性补觉。"
        core_action_steps:
          - "建立刺激控制规则：在床上清醒超过 20 分钟即温和离开床面"
          - "睡前半小时执行无屏幕刺激隔离与昏暗光线过渡"
          - "实行日间‘担忧倾泻本’，切断睡前反刍回路"
        contraindications:
          - "RED_FLAG_MANIA"
      - id: "07"
        name_zh: "问题解决疗法"
        name_en: "Problem-Solving Therapy, PST"
        file: "07_PST_Problem_Solving_Therapy.md"
        evidence_level: "Level II"
        duration_minutes: 4
        stealth_workplace_compatible: true
        clinical_rationale: "将弥散失控感转化为结构化聚焦问题，提升自我效能感。"
        core_action_steps:
          - "将模糊情绪化抱怨改写为 1 句具体可界定的现实问题"
          - "列出 3 个不受评判的微小可行应对方案"
          - "选定阻力最小方案并锁定未来 1 小时内的第一步"
        contraindications:
          - "ACUTE_AROUSAL_OVERLOAD"
      - id: "08"
        name_zh: "情绪障碍跨诊断统一方案"
        name_en: "Unified Protocol for Transdiagnostic Treatment of Emotional Disorders, UP"
        file: "08_UP_Unified_Protocol_Transdiagnostic.md"
        evidence_level: "Level II"
        duration_minutes: 3
        stealth_workplace_compatible: true
        clinical_rationale: "觉察负性情绪躯体反应，耐受不适并纠正情绪驱动行为。"
        core_action_steps:
          - "觉察当前情绪引发的心跳、呼吸与肌肉线索"
          - "识别下意识的情绪驱动回避行为 (EDB)"
          - "反向实践：采取与冲动相反的微小开放举动"
        contraindications:
          - "RED_FLAG_DISSOCIATION"
      - id: "10"
        name_zh: "习惯逆转训练与权变管理"
        name_en: "Habit Reversal Training & Contingency Management, HRT / CM"
        file: "10_HRT_Habit_Reversal_and_Contingency_Management.md"
        evidence_level: "Level II"
        duration_minutes: 3
        stealth_workplace_compatible: true
        clinical_rationale: "增强冲动前驱躯体感知，以物理竞争反应阻断强迫性习惯循环。"
        core_action_steps:
          - "捕捉无意识习惯动作（咬指甲/刷手机/拔发）触发前的躯体微冲动"
          - "立刻启动持续 1 分钟的物理竞争动作（如紧攥拳头或双手平贴大腿）"
          - "成功阻断后给自己一次积极确认"
        contraindications:
          - "RED_FLAG_PSYCHOSIS"
      - id: "11"
        name_zh: "接纳承诺疗法"
        name_en: "Acceptance and Commitment Therapy, ACT"
        file: "11_ACT_Acceptance_and_Commitment_Therapy.md"
        evidence_level: "Level I"
        duration_minutes: 3
        stealth_workplace_compatible: true
        clinical_rationale: "通过认知解离与接纳打破思维纠缠，投身价值承诺行动。"
        core_action_steps:
          - "认知解离：在负性想法前加上‘我注意到我正在产生……的念头’"
          - "躯体接纳：为胸口或胃部的不适张力呼吸腾出容许空间"
          - "价值锚定：问自己‘即使难受，当下什么对我真正重要’并走出一小步"
        contraindications:
          - "RED_FLAG_PSYCHOSIS"
      - id: "12"
        name_zh: "辩证行为疗法"
        name_en: "Dialectical Behavior Therapy, DBT"
        file: "12_DBT_Dialectical_Behavior_Therapy.md"
        evidence_level: "Level II"
        duration_minutes: 3
        stealth_workplace_compatible: true
        clinical_rationale: "痛苦耐受与情绪调节，通过生理重置与技巧化止损缓解危机。"
        sub_actions:
          - "12:tipp_breathing"
          - "12:tipp_cold_water"
        core_action_steps:
          - "使用 STOP 技巧：停住行动、退后一步、客观观察、明智前行"
          - "启动呼气显著长于吸气的节奏呼吸重置交感神经"
          - "寻找当前可投入的感官自我安抚线索"
        contraindications: []
      - id: "13"
        name_zh: "彻底开放辩证行为疗法"
        name_en: "Radically Open Dialectical Behavior Therapy, RO-DBT"
        file: "13_RO_DBT_Radically_Open_DBT.md"
        evidence_level: "Level III"
        duration_minutes: 3
        stealth_workplace_compatible: true
        clinical_rationale: "针对过度控制与完美紧绷人格，培育社交联结与自我探问。"
        core_action_steps:
          - "觉察身体防御姿势，做一次半微笑与肩膀下沉敞开"
          - "启动边缘探问：‘这件事上有什么是我不知道或可能犯错的？’"
          - "尝试向外界发送一个友善接纳的微小社交信号"
        contraindications:
          - "RED_FLAG_ANOREXIA"
          - "RED_FLAG_BPD_NSSI"
      - id: "14"
        name_zh: "正念认知疗法"
        name_en: "Mindfulness-Based Cognitive Therapy, MBCT"
        file: "14_MBCT_Mindfulness_Based_Cognitive_Therapy.md"
        evidence_level: "Level I"
        duration_minutes: 3
        stealth_workplace_compatible: true
        clinical_rationale: "三分钟呼吸空间技术，阻断抑郁反刍自动导航模式。"
        core_action_steps:
          - "第一分钟：觉知当下身心感受与念头，允许其存在"
          - "第二分钟：将全部注意力收敛于腹部呼吸的起伏接触感"
          - "第三分钟：将注意觉知扩展至整个身体轮廓与所处空间"
        contraindications:
          - "RED_FLAG_PTSD_FLASHBACK"
          - "RED_FLAG_PSYCHOSIS"
      - id: "15"
        name_zh: "正念减压疗法"
        name_en: "Mindfulness-Based Stress Reduction, MBSR"
        file: "15_MBSR_Mindfulness_Based_Stress_Reduction.md"
        evidence_level: "Level I"
        duration_minutes: 4
        stealth_workplace_compatible: true
        clinical_rationale: "微型身体扫描与感官锚定，脱离应对压力的战斗或逃跑循环。"
        core_action_steps:
          - "将注意力引导至双脚踩在地面或臀部接触椅面的重力实感"
          - "由下至上快速扫描紧绷区域（下颌、肩膀、手心），不作评判"
          - "跟随一次长呼吸，在呼气时观想紧绷随浊气消散"
        contraindications:
          - "RED_FLAG_PTSD_FLASHBACK"
      - id: "16"
        name_zh: "元认知疗法"
        name_en: "Metacognitive Therapy, MCT"
        file: "16_MCT_Metacognitive_Therapy.md"
        evidence_level: "Level I"
        duration_minutes: 3
        stealth_workplace_compatible: true
        clinical_rationale: "超然注意阻断认知注意综合征 (CAS)，修正对担忧与反刍的信念。"
        core_action_steps:
          - "超然注意 (Detached Mindfulness)：把担忧念头当成脑海中漂浮的云朵"
          - "停止与担忧思维辩论、分析或强行压抑"
          - "启动担忧推迟：将该议题移入设定的日常担忧时段处理"
        contraindications:
          - "RED_FLAG_PSYCHOSIS"
      - id: "17"
        name_zh: "慈悲聚焦疗法"
        name_en: "Compassion-Focused Therapy, CFT"
        file: "17_CFT_Compassion_Focused_Therapy.md"
        evidence_level: "Level II"
        duration_minutes: 3
        stealth_workplace_compatible: true
        clinical_rationale: "激活副交感舒缓抚慰系统，化解自我批评与内部威胁感。"
        core_action_steps:
          - "右手温和轻覆于左侧心口，感受体温的传导与起伏"
          - "配合平缓节律呼吸，吸入包容，呼出苛责"
          - "对内向自己传递一句完全理解脆弱的慈悲回应"
        contraindications:
          - "TOXIC_SHAME_SPIRAL"
      - id: "18"
        name_zh: "正念自我关怀疗法"
        name_en: "Mindful Self-Compassion, MSC"
        file: "18_MSC_Mindful_Self_Compassion.md"
        evidence_level: "Level II"
        duration_minutes: 3
        stealth_workplace_compatible: true
        clinical_rationale: "通过正念、共通人性与自我友善三核心化解耻感与孤立感。"
        core_action_steps:
          - "正念觉察：“这是一个艰难痛苦的时刻”"
          - "共通人性：“痛苦挣扎是人生中共通的经历，我并非异常或孤独一人”"
          - "自我友善：“愿在此刻我能像对待挚友一样对自己温柔以待”"
        contraindications:
          - "TOXIC_SHAME_SPIRAL"
      - id: "28"
        name_zh: "生理性叹息与自主神经躯体调节法"
        name_en: "Physiological Sigh & Autonomic Somatic Regulation"
        file: "28_Polyvagal_and_Autonomic_Somatic_Regulation.md"
        evidence_level: "Level III"
        duration_minutes: 2
        stealth_workplace_compatible: true
        clinical_rationale: "利用双吸一长呼生理性叹息重胀肺泡并快速刺激迷走神经降唤醒。"
        core_action_steps:
          - "两次连续深鼻吸气（一次大吸气加一次快速补吸至肺部完全充盈）"
          - "通过微张的嘴部极其缓慢、悠长、彻底地呼尽所有气体"
          - "连续重复 2-3 次，配合视线缓慢环视周围确认现实安全"
        contraindications:
          - "CARDIORESPIRATORY_INSTABILITY"
          - "ACUTE_AROUSAL_OVERLOAD"
      - id: "29"
        name_zh: "渐进性肌肉放松与自律训练法"
        name_en: "Progressive Muscle Relaxation & Autogenic Training, PMR / AT"
        file: "29_PMR_and_Autogenic_Training.md"
        evidence_level: "Level II"
        duration_minutes: 4
        stealth_workplace_compatible: false
        clinical_rationale: "利用肌纤维先主动收紧后骤然释放的神经反馈诱导深层躯体松弛。"
        core_action_steps:
          - "全力收紧双拳并耸肩持续 5-7 秒，清晰体验躯体紧绷张力"
          - "突然彻底卸力释放，全神贯注体验 15 秒肌肉松弛下沉发热感"
          - "默念自律导语：“我的双肩沉重下沉，周身宁静安详”"
        contraindications:
          - "CARDIORESPIRATORY_INSTABILITY"
      - id: "30"
        name_zh: "心理急救与自我安全自检模型"
        name_en: "Psychological First Aid & Self-Care Assessment, PFA"
        file: "30_PFA_Psychological_First_Aid_and_Crisis_Intervention.md"
        evidence_level: "Level III"
        duration_minutes: 3
        stealth_workplace_compatible: true
        clinical_rationale: "危机后首要保障生理安全感与尊严，盘点即时需求并建立现实锚点。"
        sub_actions:
          - "30:grounding"
        core_action_steps:
          - "环视确认所处物理空间当下安全无急性现实威胁"
          - "盘点即时身心基线：是否需要喝水、进食、添衣或暂离高压环境"
          - "定位 1 位可信任亲友或社会支持号码备用"
        contraindications:
          - "CRISIS_ACTIVE_RISK"
      - id: "42"
        name_zh: "意义疗法"
        name_en: "Logotherapy"
        file: "42_Logotherapy_Viktor_Frankl.md"
        evidence_level: "Level III"
        duration_minutes: 3
        stealth_workplace_compatible: true
        clinical_rationale: "在受苦中追寻内在意义与态度自由，化解存在性虚无。"
        core_action_steps:
          - "扭转追问：从“生活对我做了什么”转为“当下情境需要我展现何种态度”"
          - "寻找微光：在这段艰难经历中，哪怕最小的一点值得守护的人事物是什么"
          - "确立当下能完全由自主选择的态度自由"
        contraindications:
          - "ACUTE_BEREAVEMENT_SHOCK"
          - "CRISIS_ACTIVE_RISK"
      - id: "44"
        name_zh: "聚焦取向心理治疗"
        name_en: "Focusing-Oriented Psychotherapy, FOT"
        file: "44_Focusing_Oriented_Psychotherapy.md"
        evidence_level: "Level III"
        duration_minutes: 4
        stealth_workplace_compatible: true
        clinical_rationale: "倾听边缘躯体感应 (Felt Sense)，引导身心体验的自然转变。"
        core_action_steps:
          - "清理内在空间：将注意力移入胸腔与腹部，感知对这件事的整体躯体感受"
          - "寻找把手词 (Handle)：为该模糊感受匹配一个词汇、意象或姿态"
          - "核对检验并等待身体产生的轻微释怀与微小松动感 (Felt Shift)"
        contraindications:
          - "RED_FLAG_DISSOCIATION"
          - "RED_FLAG_PSYCHOSIS"
      - id: "46"
        name_zh: "动机式访谈与自我决策平衡"
        name_en: "Motivational Interviewing & Self-Decisional Balance, MI"
        file: "46_MI_Motivational_Interviewing.md"
        evidence_level: "Level III"
        duration_minutes: 3
        stealth_workplace_compatible: true
        clinical_rationale: "探索矛盾心态，通过自我决策平衡激发内部改变动机。"
        core_action_steps:
          - "列举维持当前习惯/状态的即时好处与潜在代价"
          - "列举做出改变可能带来的核心价值获益与面临的阻力"
          - "基于两方权衡，提炼出一句发自内心的自主改变渴望"
        contraindications:
          - "RED_FLAG_MANIA"
      - id: "55"
        name_zh: "焦点解决短程治疗"
        name_en: "Solution-Focused Brief Therapy, SFBT"
        file: "55_SFBT_Solution_Focused_Brief_Therapy.md"
        evidence_level: "Level III"
        duration_minutes: 3
        stealth_workplace_compatible: true
        clinical_rationale: "聚焦例外情境与微小成功，唤醒用户固有的应对资源与解决力。"
        core_action_steps:
          - "奇迹微信号想象：若今夜问题被解决，明天醒来最初的微小不同是什么"
          - "寻找例外经验：过去什么时候类似困扰曾稍微轻一点，当时做了什么"
          - "将那个曾经起效的微小举措立刻复制到今天"
        contraindications:
          - "RED_FLAG_PTSD_FLASHBACK"
      - id: "57"
        name_zh: "积极心理治疗与幸福感疗法"
        name_en: "Positive Psychotherapy & Well-Being Therapy, PPT / WBT"
        file: "57_PPT_Positive_Psychotherapy_and_Well_Being_Therapy.md"
        evidence_level: "Level II"
        duration_minutes: 3
        stealth_workplace_compatible: true
        clinical_rationale: "盘点积极体验与品格优势，构建抵御逆境的心理缓冲资本。"
        core_action_steps:
          - "记录过去 24 小时内发生的 3 件微小具体好事"
          - "回溯每件好事背后自己的微小付出或外界的善意互动"
          - "沉浸回味当下由衷升起的充盈与感恩感受"
        contraindications:
          - "CRISIS_ACTIVE_RISK"
          - "TOXIC_SHAME_SPIRAL"
      - id: "61"
        name_zh: "森田疗法"
        name_en: "Morita Therapy"
        file: "61_Morita_Therapy.md"
        evidence_level: "Level III"
        duration_minutes: 3
        stealth_workplace_compatible: true
        clinical_rationale: "顺应自然接纳情绪波动，为所当为投身当下现实生活任务。"
        core_action_steps:
          - "顺应自然：对升起的不安、杂念或情绪不抗拒、不辩解，任其流淌"
          - "聚焦目标：明确此时此刻自己原本计划进行的生活/工作事项"
          - "为所当为：带着未消除的不适感，立刻着手推进手头现实事务"
        contraindications:
          - "ACUTE_AROUSAL_OVERLOAD"
      - id: "62"
        name_zh: "内观疗法"
        name_en: "Naikan Therapy"
        file: "62_Naikan_Therapy.md"
        evidence_level: "Level III"
        duration_minutes: 4
        stealth_workplace_compatible: true
        clinical_rationale: "检视具体人际互动，打破自我中心偏见，培育深层感激。"
        core_action_steps:
          - "选定一位重要关系人，回顾其最近为自己提供的实质照料与帮助"
          - "检视自己为其所做的回馈与支持"
          - "客观审视自己给对方增添的麻烦与困扰，培育现实检验力"
        contraindications:
          - "TOXIC_SHAME_SPIRAL"
          - "INTERPERSONAL_SAFETY_HAZARD"
      - id: "65"
        name_zh: "表达性书写疗法"
        name_en: "Expressive Writing Paradigm"
        file: "65_Expressive_Writing_Pennebaker.md"
        evidence_level: "Level III"
        duration_minutes: 5
        stealth_workplace_compatible: false
        clinical_rationale: "将压抑创伤体验转化为连贯叙事，促进前额叶情绪整合与宣泄。"
        core_action_steps:
          - "设定 5 分钟定时，无拘无束倾泻书写当下最触动的情绪体验"
          - "不修改语法，直接外化命名最深层的恐惧、悲伤或愤怒"
          - "书写结束后做一次深呼吸，自主选择保留或安全撕碎文字"
        contraindications:
          - "RED_FLAG_PTSD_FLASHBACK"
      - id: "66"
        name_zh: "意象预演疗法与梦魇改写技术"
        name_en: "Imagery Rehearsal Therapy, IRT"
        file: "66_IRT_Imagery_Rehearsal_Therapy_for_Nightmares.md"
        evidence_level: "Level III"
        duration_minutes: 4
        stealth_workplace_compatible: true
        clinical_rationale: "在清醒状态下改写创伤性意象或噩梦结局，重获心理控制感。"
        core_action_steps:
          - "温和唤起困扰意象的轮廓，注意保持身体安全着陆感"
          - "自主构思并书写一个充满安全感、掌控感或积极意涵的新结局"
          - "闭目在脑海中生动预演改写后的新意象 3 次"
        contraindications:
          - "RED_FLAG_PTSD_FLASHBACK"
          - "RED_FLAG_PSYCHOSIS"
      - id: "69"
        name_zh: "单次结构化心理微干预与成长型思维赋能"
        name_en: "Single-Session Interventions, SSI"
        file: "69_SSI_Single_Session_and_Growth_Mindset_Intervention.md"
        evidence_level: "Level II"
        duration_minutes: 3
        stealth_workplace_compatible: true
        clinical_rationale: "传递神经可塑性循证知识，瓦解特质固定论，赋予即刻改变希望。"
        core_action_steps:
          - "认识到神经可塑性：大脑应对挑战的神经回路如同肌肉，越练越强韧"
          - "将‘我做不到’改写为‘我暂时还没有掌握应对该情境的方法’"
          - "设计一个未来 24 小时内检验成长可能性的极简行动实验"
        contraindications:
          - "CRISIS_ACTIVE_RISK"
      - id: "70"
        name_zh: "生物反馈与心率变异性共振呼吸神经调节疗法"
        name_en: "Biofeedback & HRV Coherence Training"
        file: "70_Biofeedback_and_HRV_Neuroregulation_Therapy.md"
        evidence_level: "Level II"
        duration_minutes: 3
        stealth_workplace_compatible: true
        clinical_rationale: "通过每分钟 6 次共振频率呼吸恢复自主神经稳态，增加心率变异性。"
        core_action_steps:
          - "保持脊柱直立自然放松，采用平稳腹式呼吸"
          - "吸气持续 4 秒，呼气持续 6 秒（每分钟约 6 次呼吸循环）"
          - "观想气体如同潮汐穿透心脏区域，带动周身平稳共振"
        contraindications:
          - "CARDIORESPIRATORY_INSTABILITY"
      - id: "72"
        name_zh: "意义重构哀伤疗法"
        name_en: "Meaning Reconstruction in Bereavement"
        file: "72_Meaning_Reconstruction_Grief_Therapy.md"
        evidence_level: "Level III"
        duration_minutes: 4
        stealth_workplace_compatible: true
        clinical_rationale: "与逝者或丧失客体建立持续性内在纽带，在生活中重塑意义。"
        core_action_steps:
          - "辨识所丧失的人事物在自己身上留下的独特积极品质与精神印记"
          - "在心底或纸上向其传递一封温和未竟之愿的简短寄语"
          - "确立将这份爱与记忆转化为现实生活向光力量的仪式化方式"
        contraindications:
          - "ACUTE_BEREAVEMENT_SHOCK"
      - id: "74"
        name_zh: "亲子互动去威胁肯定疗法"
        name_en: "Parent-Child Interaction Affirmation Skills, PCIT"
        file: "74_PCIT_Parent_Child_Interaction_Therapy.md"
        evidence_level: "Level III"
        duration_minutes: 3
        stealth_workplace_compatible: true
