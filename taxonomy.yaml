# ------------------------------------------------------------------------------
# 1. 生理唤醒度归一化定义 (Physiological Arousal Scale: [0.0, 1.0])
# ------------------------------------------------------------------------------
arousal:
  range: [0.0, 1.0]           # [正式键 Canonical] 归一化连续唤醒度闭区间
  scale: [0.0, 1.0]           # [兼容键 Deprecated in v3.3 - 迭代1兼容保留] 旧版命名别名，同 range
  bands:
    low: [0.0, 0.35]          # [0.0, 0.35) 迟钝、麻木、耗竭、能量极低
    moderate: [0.35, 0.65]    # [0.35, 0.65) 平静至轻度警觉，适宜开展认知重构与内省
    elevated: [0.65, 0.80]    # [0.65, 0.80) 紧张、担忧、情绪波动，需结合躯体稳定化
    acute: [0.80, 1.00]       # [0.80, 1.00] 急性高唤醒、惊恐、暴怒、交感神经过载，前额叶功能受阻
  thresholds:
    somatic_priority: 0.80     # [正式键 Canonical] >= 0.80 优先推荐自下而上 (Bottom-Up) 躯体/呼吸稳定化
    cognitive_block: 0.85      # [正式键 Canonical] >= 0.85 禁止推行高认知负荷深度重构方法 (如责任饼图)
    exploration_allow: 0.60    # [正式键 Canonical] 只有 <= 0.60 且在 Grade A 方法池中，才允许 Thompson 采样探索方差
    block_high_load: 0.80      # [兼容键 Deprecated in v3.3 - 迭代1兼容保留] 早期代码别名，同 somatic_priority / 限制高负荷卡片
    somatic_only: 0.90         # [兼容键 Deprecated in v3.3 - 迭代1兼容保留] 早期实验性参数 (文档未出现，保留防止旧代码 KeyError)
    explore_eligible_max: 0.60 # [兼容键 Deprecated in v3.3 - 迭代1兼容保留] 早期代码别名，同 exploration_allow
  suds_mapping:
    description: "临床主观困扰量表 (SUDS 0-10) 与系统归一化唤醒度 ([0.0, 1.0]) 严格线性对齐 (Normalized = SUDS / 10)"
    scale_factor: 0.10
    examples:
      "2-4/10": [0.20, 0.40]
      "6-8/10": [0.60, 0.80]
      "8-10/10": [0.80, 1.00]

# ------------------------------------------------------------------------------
# 2. 心力电量区间与交互策略 (Heart/Social Battery Bands: [0.0, 1.0])
# ------------------------------------------------------------------------------
battery:
  range: [0.0, 1.0]          # [正式键 Canonical]
  # --- 顶层阈值键 [兼容键 Deprecated in v3.3 - 迭代1兼容保留] 请优先使用 battery.thresholds 下的标准键 ---
  haven_enter: 0.20          # [兼容键] <= 0.20 触发 S_haven 避风港
  haven_exit: 0.35           # [兼容键] >= 0.35 允许退出 S_haven 恢复双向探索
  empower_min: 0.40          # [兼容键] >= 0.40 且处于 S_clarify 时才允许推进至 S_empower
  bands:
    critical_low: [0.0, 0.20]  # [0.0, 0.20) 触发 S_haven 避风港庇护态，单向低载陪伴，禁止高认知介入与提问
    low: [0.20, 0.40]          # [0.20, 0.40) 降载倾听态，低字数回复、单字承接，减少追问
    medium: [0.40, 0.70]       # [0.40, 0.70) 探索接纳态 (S_explore)，标准双向共情交互
    full: [0.70, 1.00]         # [0.70, 1.00] 赋能转化态 (S_empower)，可进行结构化微练习与反思
  thresholds:
    # --- [正式键 Canonical] 标准阈值定义 ---
    haven_enter: 0.20          # [正式键 Canonical] <= 0.20 触发 S_haven
    haven_exit: 0.35           # [正式键 Canonical] >= 0.35 允许退出 S_haven 恢复常规双向探索
    empower_min: 0.40          # [正式键 Canonical] >= 0.40 且处于 S_clarify 时才允许推进至 S_empower 进行微练习

# ------------------------------------------------------------------------------
# 2.1 C.O.L.B.O. 双翼干预架构 (Bilateral Intervention Architecture / Wings)
# ------------------------------------------------------------------------------
colbo:
  bilateral_strategy:
    description: "C.O.L.B.O. 循证微干预双翼协同架构 (Bilateral Strategy: Left/Right Wings)"
    left_wing:
      name: "左翼 (Left Wing / Somatic & Compassion)"
      focus: "自下而上 (Bottom-up) 躯体稳定化、生理性叹息、感官着陆、Neff 自我关怀与情绪容纳"
      activation_condition: "Arousal >= 0.80 或情绪剧烈过载"
      target_systems: "脑干、杏仁核与副交感/迷走神经调节，优先重建神经生理安全感"
    right_wing:
      name: "右翼 (Right Wing / Cognitive & Action)"
      focus: "自上而下 (Top-down) 认知重构 (CBT/MCT)、好友视角转换、行为激活 (BA 2分钟微破冰) 与现实问题解决"
      activation_condition: "Arousal < 0.80 且 Battery >= 0.40"
      target_systems: "前额叶皮层执行功能、理性检验与动机激活"
    bilateral_synergy:
      name: "双翼协同 (Bilateral Synergy)"
      focus: "当高唤醒伴随深层内耗时，先由左翼稳定化平抑交感神经过载，待唤醒度降至安全区间后，无缝桥接右翼认知重构与微行为破冰"
  explore_stabilization_whitelist:
    description: "S_explore 状态下高唤醒 (Arousal >= 0.80) 豁免放行的自下而上稳定化微干预 ID 白名单"
    method_ids:
      - "28"              # 生理性叹息 (Physiological Sigh)
      - "29"              # 渐进式肌肉放松 (PMR)
      - "30:grounding"    # 5-4-3-2-1 感官着陆 (Sensory Grounding)
      - "12:tipp_breathing" # DBT TIPP 节奏呼吸 (Paced Breathing)

