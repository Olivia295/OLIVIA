  - id: "ACCEPTANCE"
    name: "被无条件接纳与包容"
    description: "允许自己以本来的样子存在，不需通过过度证明换取许可。"
  - id: "AUTONOMY"
    name: "自主权、掌控感与呼吸空间"
    description: "渴望由自己做主，拥有设立人际边界与停下喘息的合法权利。"
  - id: "COMPETENCE"
    name: "胜任感、自我价值与效能感"
    description: "确认生命具备内在胜任力与价值，并非完全依附于外在考核。"
  - id: "CONNECTION"
    name: "真实深层的人际联结与被看见"
    description: "渴望卸下面具后依然被温柔注视、深深理解与接纳。"

