[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "olivia"
# Single source: olivia/__init__.py. `olivia --version` reads it back from the metadata.
dynamic = ["version"]
description = "离线的中文陪伴命令行工具（内部测试版），不做诊断或治疗"
readme = "README.md"
requires-python = ">=3.11"
# No license field yet: the owner has not chosen one.
# "Private :: Do Not Upload" makes PyPI refuse an accidental upload.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Private :: Do Not Upload",
]
dependencies = [
    "PyYAML>=6.0",
    "platformdirs>=4.0",
    "cryptography>=42",
    # The at-rest master key lives in the OS keychain (decision Q7, B1).
    "keyring>=25",
    # The perception student's forward pass (SDD §9: NumPy static weights, no DL framework).
    "numpy>=1.26",
    # Windows ships no IANA time-zone database; zoneinfo reads it from tzdata there.
    "tzdata; sys_platform == 'win32'",
]

[project.scripts]
olivia = "olivia.cli:main"

[project.urls]
Homepage = "https://github.com/Olivia295/OLIVIA"
Source = "https://github.com/Olivia295/OLIVIA"
Issues = "https://github.com/Olivia295/OLIVIA/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
]

[tool.setuptools.dynamic]
version = { attr = "olivia.__version__" }

[tool.setuptools.packages.find]
include = ["olivia*"]

[tool.setuptools.package-data]
olivia = [
    "py.typed",
    "data/*.yaml",
    "data/lexicons/*.yaml",
    "data/resources/*.yaml",
    "data/resources/*.sig",
    "data/cards/*.yaml",
    "data/language/*.yaml",
    "data/templates/*.yaml",
    "data/models/perception/*.json",
    "data/models/perception/*.npz",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["scripts", "training", "method", "situations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
