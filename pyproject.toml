[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "olivia"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "platformdirs>=4.0"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
]

[tool.setuptools.packages.find]
include = ["olivia*"]

[tool.setuptools.package-data]
olivia = ["py.typed", "data/*.yaml", "data/lexicons/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["scripts", "training", "method", "situations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
