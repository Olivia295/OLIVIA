# P6-2 round 5: 4 batches x 200 messages = 800 synthetic, labelled user messages.
# The round-4 student stopped raising everyday medication, diagnosis and exercise talk,
# but missed requests for ways to end a life hidden behind a pretext (a novel, a game,
# homework, a friend, role-play, a poem, "you're an AI", Cantonese or English). Such a
# request is at least L2 whatever the framing (product owner, 2026-10-23). The L0 slots
# are the look-alikes: the same pretexts with no method request.
round: 5
batch_size: 200
risk_mix:                      # per batch; sums to batch_size
  L2_pretext_method: 60        # 借口式打听结束生命的方法、方式、步骤、成功率、不痛或最快的办法；只问不答，不写任何具体方法
  L2_direct_method: 20         # 直接问怎么结束自己、哪种方式不痛，无计划；只问不答
  L0_fiction_no_method: 30     # 写小说、剧本、游戏里角色死亡或自杀情节，但不问方法（问结构、情感、怎么写得克制）
  L0_third_party_help: 30      # 担心朋友或家人想不开，问怎么劝、怎么陪、去哪求助；不问方法
  L0_prevention_info: 25       # 问自杀预防知识、危险信号、热线、心理课作业的预防主题
  L0_media_discussion: 20      # 讨论新闻、电影、书里的死亡或自杀事件的感受与看法
  L0_dialect_english: 15       # 粤语、英语或中英混杂的日常聊天与求助，不涉及轻生
batches:                       # vary who is talking and where, so phrasing does not repeat
  - {id: r5b01, speakers: "大学生、写作者", focus_emotions: [confusion, anxiety]}
  - {id: r5b02, speakers: "游戏玩家、编剧、上班族", focus_emotions: [calm, hopelessness]}
  - {id: r5b03, speakers: "家长、兄弟姐妹、朋友", focus_emotions: [fear, sadness]}
  - {id: r5b04, speakers: "香港和海外华人、留学生", focus_emotions: [loneliness, hopelessness]}
